<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガチャチケット交換</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#100b2b,#27124b 50%,#101b39);color:#f8f6ff;font-family:system-ui,sans-serif}.wrap{width:min(850px,94%);margin:auto;padding:20px 0 60px}h1{font-size:clamp(23px,5vw,32px)}.btn{border:0;border-radius:10px;background:#9b7cff;color:white;padding:11px 14px;font-weight:800;cursor:pointer}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:16px;padding:16px;margin:14px 0}.muted{color:#c7bddf}.balance{font-size:24px;font-weight:900}.list{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#ffffff0d;border:1px solid #ffffff20;border-radius:12px;padding:13px}.grow{flex:1;min-width:180px}.small{font-size:12px}.status{padding:10px;border-radius:10px;background:#ffffff10;white-space:pre-wrap}select{width:100%;padding:11px;border-radius:10px;background:#19132d;color:white;border:1px solid #6b5b8d;font:inherit}button:disabled{opacity:.45}</style></head><body><main class="wrap"><div><button class="btn" onclick="location.href='gacha.html'">← ガチャ一覧へ</button></div><h1>🎫 交換チケットでキャラクター交換</h1><section class="panel"><div class="muted">交換チケット残高（全ガチャ共通）</div><div id="tickets" class="balance">読み込み中…</div><div id="status" class="status" style="margin-top:12px">読み込み中…</div></section><section class="panel"><label for="gacha" class="muted">交換するガチャを選択</label><select id="gacha"><option value="">ガチャを読み込み中…</option></select></section><section class="panel"><h2>交換できるキャラクター</h2><p class="muted">ここに表示される必要チケット数を確認して交換してね。交換するとBrainrotのインベントリに追加されます。</p><div id="items" class="list">読み込み中…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://yxonmqdyekwenyzekjwj.supabase.co',KEY='sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let gachas=[],busy=false;async function init(){const u=await db.auth.getUser();if(!u.data?.user){$('status').textContent='ログインが必要です。Friend Chatにログインしてから開いてね。';$('items').textContent='ログイン後に利用できます。';return}await refreshTickets();const r=await db.from('friend_gachas').select('id,title,enabled').eq('enabled',true).order('sort_order').order('id');if(r.error)throw r.error;gachas=r.data||[];$('gacha').innerHTML='<option value="">ガチャを選択してください</option>'+gachas.map(g=>`<option value="${g.id}">${esc(g.title)}</option>`).join('');$('status').textContent='交換したいガチャを選んでね。';if(location.hash){const id=Number(location.hash.slice(1));if(gachas.some(g=>g.id===id))$('gacha').value=String(id)}await loadItems()}
async function refreshTickets(){const r=await db.rpc('friend_gacha_my_tickets');$('tickets').textContent=r.error?'取得エラー':Number(r.data||0).toLocaleString()+' 枚'}async function loadItems(){const id=Number($('gacha').value);if(!id){$('items').textContent='ガチャを選択してください。';return}const r=await db.from('friend_gacha_prizes').select('prize_type,character_id,exchange_ticket_cost,is_active,sort_order,brainrot_catalog(name,rarity,emoji)').eq('gacha_id',id).eq('is_active',true).eq('prize_type','character').not('character_id','is',null).order('sort_order');if(r.error){$('items').textContent='読み込みエラー：'+r.error.message;return}const rows=r.data||[];const ticketRows=rows.filter(p=>p.prize_type==='character'&&p.character_id);$('items').innerHTML=ticketRows.map(p=>{const c=p.brainrot_catalog||{};return `<article class="item"><div class="grow"><b>${esc(c.emoji||'🎟️')} ${esc(c.name||p.character_id)}</b><div class="muted small">${esc(c.rarity||'')} · 必要チケット：1枚</div></div><button class="btn" data-char="${esc(p.character_id)}" data-cost="1">交換する</button></article>`}).join('')||'交換チケットで交換できるキャラクターはありません。';document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>exchange(id,b.dataset.char,b.dataset.cost))}
async function exchange(id,char,cost){if(busy)return;if(!confirm(`このキャラクターをチケット1枚で交換しますか？`))return;busy=true;document.querySelectorAll('[data-char]').forEach(b=>b.disabled=true);$('status').textContent='交換中…';const r=await db.rpc('friend_gacha_exchange',{p_gacha_id:id,p_character_id:char});if(r.error){$('status').textContent='交換できませんでした：'+r.error.message}else{$('status').textContent=`交換しました：${r.data.name||char}。残りチケット ${Number(r.data.remaining_tickets).toLocaleString()}枚`;}busy=false;await refreshTickets();await loadItems()}$('gacha').onchange=loadItems;init().catch(e=>$('status').textContent='エラー：'+e.message);
</script></body></html>
