<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チケット交換</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#100b2b,#27124b 50%,#101b39);color:#f8f6ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(960px,94%);margin:auto;padding:20px 0 60px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:clamp(23px,5vw,34px);margin:10px 0;flex:1}.btn{border:0;border-radius:12px;background:#9b7cff;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}.muted{color:#c7bddf}.balance{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:1px solid #ffffff25;background:#ffffff0d;border-radius:16px;padding:14px;min-width:0}.item img{width:100%;height:125px;object-fit:contain}.item .emoji{font-size:48px;text-align:center;display:block;height:125px}.item h3{margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #6b5b8d;background:#19132d;color:white}.field label{font-size:13px;color:#d7ccef}.status{padding:10px;border-radius:10px;background:#ffffff10;white-space:pre-wrap}.danger{background:#b93e68}.small{font-size:12px}.bar{height:8px;background:#ffffff20;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#b49aff}a{color:#d5c6ff}button{font:inherit}.charline{display:flex;align-items:center;gap:10px}.charline img{width:46px;height:46px;object-fit:contain}.charline .grow{flex:1;min-width:0}@media(max-width:480px){.panel{padding:14px}.btn{padding:11px 12px}} </style></head><body><main class="wrap"><div class="top"><button class="btn" onclick="location.href='gacha.html'">← ガチャへ</button><h1>🎟️ チケット交換</h1></div><section class="panel"><div class="muted">所持チケット</div><div id="tickets" class="balance">読み込み中…</div><p class="muted">チケットを使ってブレロのキャラクターを受け取れます。交換対象は管理者がガチャ景品として登録したキャラクターです。</p><div id="message" class="status"></div></section><section class="panel"><h2>交換できるキャラクター</h2><div id="items" class="grid">読み込み中…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function requireLogin(){const {data,error}=await db.auth.getUser();if(error||!data.user){alert('フレンドチャットにログインしてください');location.href='index.html';return null}return data.user}async function isAdmin(){const {data,error}=await db.rpc('is_friendchat_admin');return !error&&data===true}</script><script>async function init(){const u=await requireLogin();if(!u)return;await load();}async function load(){const [t,p]=await Promise.all([db.rpc('friend_gacha_my_tickets'),db.from('friend_gacha_prizes').select('character_id,exchange_ticket_cost,is_active,brainrot_catalog(name,emoji,image_url,rarity)').eq('is_active',true).order('sort_order')]);$('tickets').textContent=t.error?'取得エラー':`${Number(t.data||0).toLocaleString()} 枚`;$('items').innerHTML=p.error?'読み込みエラー: '+p.error.message:(p.data||[]).map(x=>{const c=x.brainrot_catalog||{};return `<article class="item">${c.image_url?`<img src="${esc(c.image_url)}">`:`<span class="emoji">${esc(c.emoji||'🎁')}</span>`}<h3>${esc(c.name||x.character_id)}</h3><div class="muted">${esc(c.rarity||'')}</div><p>必要チケット：${Number(x.exchange_ticket_cost).toLocaleString()}枚</p><button class="btn" onclick="exchange('${esc(x.character_id)}','${esc(c.name||x.character_id)}',${Number(x.exchange_ticket_cost)})">交換する</button></article>`}).join('')||'交換できるキャラクターはありません。';}window.exchange=async(id,name,cost)=>{if(!confirm(`${name}をチケット${cost}枚で交換しますか？`))return;$('message').textContent='交換処理中…';const {data,error}=await db.rpc('friend_gacha_exchange',{p_character_id:id});$('message').textContent=error?'交換できませんでした: '+error.message:`🎉 ${data.name}を交換しました！残りチケット：${data.remaining_tickets}枚`;await load()};init();</script></body></html>
