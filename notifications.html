<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      background: rgba(255,255,255,0.7);
    }

    .header {
      position: relative;
      background: white;
      padding: 18px 170px 18px 60px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .back-button {
      position: absolute;
      left: 12px;
      top: 12px;
      padding: 9px 12px;
      background: #f5f5f5;
      color: #555;
      text-decoration: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
    }

    #clearAllButton {
      position: absolute;
      right: 12px;
      top: 10px;
      border: none;
      background: #fff0f0;
      color: #d9534f;
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #clearAllButton:active {
      transform: scale(0.96);
    }

    #clearAllButton:disabled {
      background: #eee;
      color: #aaa;
      cursor: default;
    }

    /* =========================
       プッシュ通知設定
    ========================= */

    .push-settings {
      margin: 14px;
      padding: 15px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .push-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .push-description {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    #pushToggleButton {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #8f7cff;
      color: white;
    }

    #pushToggleButton.off {
      background: #eee;
      color: #555;
    }

    #pushToggleButton:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .notifications {
      padding: 14px;
    }

    .notification {
      display: block;
      text-decoration: none;
      color: #333;
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.12s, background 0.12s;
    }

    .notification:active {
      transform: scale(0.98);
      background: #f8f8ff;
    }

    .notification.unread {
      background: #f3f0ff;
      border-left: 5px solid #8f7cff;
    }

    .notification-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .notification-message {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .notification-time {
      margin-top: 7px;
      font-size: 11px;
      color: #999;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 60px 20px;
    }

    @media (max-width: 430px) {
      .header {
        padding-left: 58px;
        padding-right: 120px;
      }

      .header h1 {
        font-size: 18px;
      }

      #clearAllButton {
        font-size: 11px;
        padding: 8px 9px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <a
        href="home.html"
        class="back-button"
      >
        🏠 ホーム
      </a>

      <h1>🔔 通知</h1>

      <button
        id="clearAllButton"
        type="button"
      >
        🗑️ すべて削除
      </button>

    </header>

    <!-- =========================
         プッシュ通知設定
    ========================== -->

    <section class="push-settings">

      <div class="push-title">
        📱 プッシュ通知
      </div>

      <div class="push-description">
        Friend Chatを閉じているときにも、新しい通知を受け取れます。
      </div>

      <button
        id="pushToggleButton"
        type="button"
      >
        🔔 通知を確認中...
      </button>

    </section>

    <section
      class="notifications"
      id="notifications"
    >
      <div class="empty">
        通知を読み込み中...
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const notificationsElement =
      document.getElementById(
        "notifications"
      );

    const clearAllButton =
      document.getElementById(
        "clearAllButton"
      );

    const pushToggleButton =
      document.getElementById(
        "pushToggleButton"
      );

    let currentUsername = "";
    let pushRegistration = null;

    /*
      公開鍵なのでHTMLに入れてOK。
      VAPID_PRIVATE_KEYは絶対にHTML/GitHubへ入れない。
    */
 "const VAPID_PUBLIC_KEY = "BDIZYgf0Gvv0PasFdIR_sHsF8HMQahMA-apv_ax8k4ToaIrRzQPcAVGD4RNkBNx4HNkeq-MP9n44y_adXt48eQ0";


    // =========================
    // Base64 → Uint8Array
    // =========================

    function urlBase64ToUint8Array(
      base64String
    ) {

      const padding =
        "=".repeat(
          (4 - (base64String.length % 4)) % 4
        );

      const base64 =
        (base64String + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");

      const rawData =
        window.atob(base64);

      return Uint8Array.from(
        [...rawData].map(
          function(char) {
            return char.charCodeAt(0);
          }
        )
      );
    }


    // =========================
    // Service Worker取得
    // =========================

    async function getPushRegistration() {

      if (!("serviceWorker" in navigator)) {
        throw new Error(
          "この端末はService Workerに対応していません。"
        );
      }

      pushRegistration =
        await navigator.serviceWorker.register(
          "./service-worker.js",
          {
            updateViaCache: "none"
          }
        );

      await pushRegistration.update();

      await navigator.serviceWorker.ready;

      return pushRegistration;
    }


    // =========================
    // 通知状態を表示
    // =========================

    async function updatePushButton() {

      pushToggleButton.disabled = false;

      if (!("Notification" in window)) {

        pushToggleButton.textContent =
          "🔔 この端末は通知に未対応";

        pushToggleButton.disabled = true;
        pushToggleButton.classList.add("off");

        return;
      }

      if (
        !("serviceWorker" in navigator) ||
        !("PushManager" in window)
      ) {

        pushToggleButton.textContent =
          "🔔 プッシュ通知に未対応";

        pushToggleButton.disabled = true;
        pushToggleButton.classList.add("off");

        return;
      }

      try {

        const registration =
          await getPushRegistration();

        const subscription =
          await registration.pushManager
            .getSubscription();

        if (
          Notification.permission === "granted" &&
          subscription
        ) {

          pushToggleButton.textContent =
            "🔔 通知はオンです";

          pushToggleButton.classList.add(
            "off"
          );

          return;
        }

        if (
          Notification.permission === "denied"
        ) {

          pushToggleButton.textContent =
            "🔒 通知がブロックされています";

          pushToggleButton.classList.add(
            "off"
          );

          return;
        }

      } catch (error) {

        console.warn(
          "通知状態確認エラー:",
          error
        );

      }

      pushToggleButton.textContent =
        "🔔 通知をオンにする";

      pushToggleButton.classList.remove(
        "off"
      );
    }


    // =========================
    // 通知ON
    // =========================

    async function enablePushNotifications() {

      try {

        pushToggleButton.disabled =
          true;

        pushToggleButton.textContent =
          "通知を設定中...";


        if (!currentUsername) {

          throw new Error(
            "ログイン中のユーザーを取得できません。"
          );

        }


        if (!("Notification" in window)) {

          throw new Error(
            "この端末は通知に対応していません。"
          );

        }


        if (!("PushManager" in window)) {

          throw new Error(
            "この端末はプッシュ通知に対応していません。"
          );

        }


        let permission =
          Notification.permission;


        if (permission !== "granted") {

          permission =
            await Notification.requestPermission();

        }


        if (permission !== "granted") {

          if (permission === "denied") {

            alert(
              "通知がブロックされています。\n\n" +
              "iPhoneの設定からFriend Chatの通知を許可してください。"
            );

          } else {

            alert(
              "通知を許可するとプッシュ通知を受け取れます。"
            );

          }

          return;
        }


        const registration =
          await getPushRegistration();


        let subscription =
          await registration.pushManager
            .getSubscription();


        if (!subscription) {

          subscription =
            await registration.pushManager
              .subscribe({

                userVisibleOnly: true,

                applicationServerKey:
                  urlBase64ToUint8Array(
                    VAPID_PUBLIC_KEY
                  )

              });

        }


        const json =
          subscription.toJSON();


        const endpoint =
          json.endpoint;

        const p256dh =
          json.keys &&
          json.keys.p256dh;

        const auth =
          json.keys &&
          json.keys.auth;


        if (
          !endpoint ||
          !p256dh ||
          !auth
        ) {

          throw new Error(
            "プッシュ通知情報を取得できませんでした。"
          );

        }


        const {
          error
        } =
          await supabaseClient
            .from(
              "push_subscriptions"
            )
            .upsert(

              {
                user_id:
                  currentUsername,

                endpoint:
                  endpoint,

                p256dh:
                  p256dh,

                auth:
                  auth
              },

              {
                onConflict:
                  "endpoint"
              }

            );


        if (error) {
          throw error;
        }


        alert(
          "🔔 通知をオンにしました！"
        );

      } catch (error) {

        console.error(
          "プッシュ通知ONエラー:",
          error
        );

        alert(
          "通知の設定に失敗しました。\n\n" +
          (
            error &&
            error.message
              ? error.message
              : "もう一度試してください。"
          )
        );

      } finally {

        await updatePushButton();

      }
    }


    // =========================
    // 通知OFF
    // =========================

    async function disablePushNotifications() {

      try {

        pushToggleButton.disabled =
          true;

        pushToggleButton.textContent =
          "通知をオフにしています...";


        const registration =
          await getPushRegistration();


        const subscription =
          await registration.pushManager
            .getSubscription();


        if (subscription) {

          const endpoint =
            subscription.endpoint;


          // まずSupabaseから削除
          const {
            error
          } =
            await supabaseClient
              .from(
                "push_subscriptions"
              )
              .delete()
              .eq(
                "user_id",
                currentUsername
              )
              .eq(
                "endpoint",
                endpoint
              );


          if (error) {
            throw error;
          }


          // ブラウザ側の購読も解除
          await subscription.unsubscribe();

        }


        alert(
          "🔕 通知をオフにしました。"
        );

      } catch (error) {

        console.error(
          "プッシュ通知OFFエラー:",
          error
        );

        alert(
          "通知をオフにできませんでした。\n\n" +
          (
            error &&
            error.message
              ? error.message
              : "もう一度試してください。"
          )
        );

      } finally {

        await updatePushButton();

      }
    }


    // =========================
    // ON/OFFボタン
    // =========================

    pushToggleButton.addEventListener(
      "click",
      async function() {

        if (
          "Notification" in window &&
          Notification.permission === "granted"
        ) {

          try {

            const registration =
              await getPushRegistration();

            const subscription =
              await registration.pushManager
                .getSubscription();

            if (subscription) {

              await disablePushNotifications();

              return;

            }

          } catch (error) {

            console.warn(
              "通知状態取得エラー:",
              error
            );

          }
        }

        await enablePushNotifications();

      }
    );


    // =========================
    // 通知を既読にする
    // =========================

    async function markAsRead(
      notificationId
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("notifications")
          .update({
            is_read: true
          })
          .eq(
            "id",
            notificationId
          )
          .eq(
            "user_id",
            currentUsername
          );

      if (error) {

        console.error(
          "既読処理エラー:",
          error
        );

      }

    }


    // =========================
    // 通知を開く
    // =========================

    async function openNotification(
      notification
    ) {

      if (
        !notification.is_read
      ) {

        await markAsRead(
          notification.id
        );

      }

      if (
        notification.link &&
        notification.link !== "#"
      ) {

        window.location.href =
          notification.link;

        return;

      }

    }


    // =========================
    // すべての通知を削除
    // =========================

    async function clearAllNotifications() {

      if (!currentUsername) {

        alert(
          "ユーザー情報を取得できていません。"
        );

        return;

      }


      const confirmed =
        window.confirm(
          "すべての通知を削除しますか？"
        );


      if (!confirmed) {
        return;
      }


      clearAllButton.disabled =
        true;


      const {
        error
      } =
        await supabaseClient
          .from("notifications")
          .delete()
          .eq(
            "user_id",
            currentUsername
          );


      if (error) {

        console.error(
          "通知削除エラー:",
          error
        );

        alert(
          "通知を削除できませんでした。\n\n" +
          error.message
        );

        clearAllButton.disabled =
          false;

        return;

      }


      notificationsElement.innerHTML =
        '<div class="empty">まだ通知はありません 🔔</div>';


      clearAllButton.disabled =
        false;

    }


    // =========================
    // 通知読み込み
    // =========================

    async function loadNotifications() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data.session
      ) {

        alert(
          "ログインしてください。"
        );

        window.location.href =
          "index.html";

        return;

      }


      currentUsername =
        data.session.user
          .user_metadata?.username || "";


      if (!currentUsername) {

        notificationsElement.innerHTML =
          '<div class="empty">ユーザーIDを取得できませんでした。</div>';

        return;

      }


      await updatePushButton();


      const {
        data: notifications,
        error: notificationError
      } =
        await supabaseClient
          .from("notifications")
          .select("*")
          .eq(
            "user_id",
            currentUsername
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (notificationError) {

        console.error(
          notificationError
        );

        notificationsElement.innerHTML =
          '<div class="empty">通知を読み込めませんでした。</div>';

        return;

      }


      notificationsElement.innerHTML =
        "";


      if (
        !notifications ||
        notifications.length === 0
      ) {

        notificationsElement.innerHTML =
          '<div class="empty">まだ通知はありません 🔔</div>';

        return;

      }


      for (
        const notification of notifications
      ) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "notification";


        if (
          !notification.is_read
        ) {

          item.classList.add(
            "unread"
          );

        }


        item.addEventListener(
          "click",
          function() {

            openNotification(
              notification
            );

          }
        );


        const title =
          document.createElement(
            "div"
          );

        title.className =
          "notification-title";

        title.textContent =
          notification.title ||
          "通知";


        const message =
          document.createElement(
            "div"
          );

        message.className =
          "notification-message";

        message.textContent =
          notification.message ||
          "";


        const time =
          document.createElement(
            "div"
          );

        time.className =
          "notification-time";

        time.textContent =
          formatTime(
            notification.created_at
          );


        item.appendChild(
          title
        );

        item.appendChild(
          message
        );

        item.appendChild(
          time
        );


        notificationsElement.appendChild(
          item
        );

      }

    }


    // =========================
    // 時刻
    // =========================

    function formatTime(
      value
    ) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleString(
        "ja-JP",
        {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    // =========================
    // すべて削除ボタン
    // =========================

    clearAllButton.addEventListener(
      "click",
      clearAllNotifications
    );


    // =========================
    // 起動
    // =========================

    loadNotifications();

  </script>

</body>
</html>
