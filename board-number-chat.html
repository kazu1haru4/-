<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const boardParams=new URLSearchParams(location.search);
const boardId=boardParams.get("board")||boardParams.get("id");
const $=id=>document.getElementById(id);
let username="",room=null,members=[],profiles={},items={},isOwner=false,isBoardAdmin=false,isMuted=false,replyTarget=null,giftTargetUsername="";
let boardRealtimeChannel=null,boardTypingChannel=null,boardTypingReady=false,typingTimer=null,typingHideTimer=null;
let boardSearchMessages=[];
const mediaPlusButton=$("mediaPlusButton"),mediaMenu=$("mediaMenu"),mediaPhotoButton=$("mediaPhotoButton"),mediaVideoButton=$("mediaVideoButton"),mediaVoiceButton=$("mediaVoiceButton"),videoInput=$("videoInput"),mediaStatus=$("mediaStatus");
let voiceRecorder=null,voiceStream=null,voiceChunks=[];
function formatMediaDuration(seconds){if(!Number.isFinite(seconds)||seconds<0)return "";const s=Math.round(seconds),m=Math.floor(s/60),r=s%60;return "⏱️ "+m+":"+String(r).padStart(2,"0")}
function addMediaDuration(media,label){const set=()=>{const t=formatMediaDuration(media.duration);if(t)label.textContent=t};if(Number.isFinite(media.duration)&&media.duration>0)set();else media.addEventListener("loadedmetadata",set,{once:true})}
function makeBoardMedia(url,kind){
  const box=document.createElement("div");box.className="media-box";
  const media=document.createElement(kind==="video"?"video":"audio");
  media.className=kind==="video"?"media-video":"media-audio";
  media.controls=true;media.preload="metadata";if(kind==="video")media.playsInline=true;
  media.src=url;box.appendChild(media);
  const label=document.createElement("div");label.className="media-duration";addMediaDuration(media,label);box.appendChild(label);
  return box;
}
function closeMediaMenu(){mediaMenu.style.display="none"}
function showMediaStatus(text){mediaStatus.textContent=text||"";mediaStatus.style.display=text?"block":"none"}
async function sendBoardMedia(file,kind){
  if(isMuted){alert("現在、発言禁止中です");return}
  if(!file)return;
  const ok=kind==="video"?file.type.startsWith("video/"):file.type.startsWith("audio/");
  if(!ok){alert("対応していないファイルです");return}
  sendBoardTypingState(false);clearTimeout(typingTimer);
  showMediaStatus(kind==="video"?"🎥 動画を送信中…":"🎙️ ボイスメッセージを送信中…");
  try{
    const ext=(file.name.split(".").pop()||(kind==="video"?"mp4":"webm")).toLowerCase();
    const path=username+"/"+boardId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
    const upload=await supabaseClient.storage.from("chat-images").upload(path,file,{upsert:false});
    if(upload.error)throw upload.error;
    const mediaPath=(kind==="video"?"video:":"audio:")+path;
    const {error}=await supabaseClient.from("board_room_messages").insert({board_id:Number(boardId),sender_id:username,content:"",image_url:mediaPath});
    if(error)throw error;
    await loadMessages();
  }catch(error){console.error("メディア送信エラー:",error);alert("メディアの送信に失敗しました\n\n"+(error?.message||"原因不明のエラー"))}
  finally{showMediaStatus("")}
}
async function toggleBoardVoiceRecording(){
  if(voiceRecorder&&voiceRecorder.state==="recording"){voiceRecorder.stop();return}
  if(isMuted){alert("現在、発言禁止中です");return}
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const types=["audio/mp4","audio/mp4;codecs=mp4a.40.2","audio/webm;codecs=opus","audio/webm"];
    const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
    voiceRecorder=new MediaRecorder(voiceStream,mime?{mimeType:mime}:undefined);
    voiceChunks=[];
    voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};
    voiceRecorder.onstop=async()=>{
      const blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||"audio/webm"});
      voiceRecorder=null;voiceChunks=[];voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;
      mediaVoiceButton.textContent="🎙️ ボイスメッセージ";
      const ext=(blob.type||"audio/webm").includes("mp4")?"m4a":"webm";
      await sendBoardMedia(new File([blob],"voice."+ext,{type:blob.type||"audio/webm"}),"audio");
    };
    voiceRecorder.window.addEventListener("pagehide",()=>{try{if(voiceRecorder&&voiceRecorder.state==="recording")voiceRecorder.stop()}catch(e){}voiceStream?.getTracks().forEach(t=>t.stop())});
start();
    mediaVoiceButton.textContent="⏹️ 録音を停止";
    mediaMenu.style.display="block";
  }catch(error){console.error(error);voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;alert("マイクを使用できませんでした\n\n"+(error?.message||error))}
}

const ADMIN_USERNAMES=new Set(["kazu1haru100","kazu1haru4sub"]);
const NAME_DECORATION_MAP={nd_sakura:"name-decoration-sakura",nd_star:"name-decoration-star",nd_diamond:"name-decoration-diamond",nd_heart:"name-decoration-heart",nd_rainbow:"name-decoration-rainbow",nd_flame:"name-decoration-flame",nd_sea:"name-decoration-sea",nd_space:"name-decoration-space",nd_neon:"name-decoration-neon",name_sakura:"name-decoration-sakura",admin_name:"name-decoration-admin"};
function getNameClass(itemKey){return NAME_DECORATION_MAP[itemKey]||""}
const themeMap={pink:["#ff82b2","#fff0f7"],purple:["#8f7cff","#f0edff"],blue:["#5c9eff","#eef5ff"],green:["#48c78e","#eef9f3"],orange:["#ff9b52","#fff4e8"],cyan:["#36c9d8","#eafcff"]};
const theme=themeMap[localStorage.getItem("friendChatTheme")||"purple"]||themeMap.purple;
document.documentElement.style.setProperty("--theme",theme[0]);
function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
async function loadProfiles(usernames){
 usernames=[...new Set(usernames.filter(Boolean))]; if(!usernames.length)return;
 const {data,error}=await supabaseClient.from("profiles").select("user_id,name,avatar_url,equipped_item_key,equipped_name_decoration_key").in("user_id",usernames);
 if(error){console.error(error);return} (data||[]).forEach(p=>profiles[p.user_id]=p);
 const keys=[...new Set((data||[]).map(p=>p.equipped_item_key).filter(Boolean))];
 if(keys.length){const r=await supabaseClient.from("coin_items").select("item_key,icon,frame_color").in("item_key",keys);if(!r.error)(r.data||[]).forEach(i=>items[i.item_key]=i)}
}
function makeAvatar(username,member=false){
 const p=profiles[username],item=items[p?.equipped_item_key],div=document.createElement("div");
 div.className=member?"member-avatar":"avatar";div.style.background=item?.frame_color||"#8f7cff";
 if(p?.avatar_url){const img=document.createElement("img");img.src=p.avatar_url;img.alt="プロフィール画像";div.appendChild(img)}else div.textContent="👤";
 return div;
}
async function loadRoom(){
 const {data,error}=await supabaseClient.from("board_rooms").select("id,name,join_code,created_by").eq("id",boardId).maybeSingle();
 if(error||!data){alert("掲示板が見つかりません");location.href="board-number.html";return false}
 room=data; $("roomInfo").textContent=data.name+"　🔢 "+data.join_code; isOwner=data.created_by===username;
 if(ADMIN_USERNAMES.has(username)) $("roomInfo").textContent += "　🛡️ 管理者閲覧";
 const canManage=isOwner||ADMIN_USERNAMES.has(username);
 $("editBoardButton").style.display=canManage?"inline-block":"none";
 $("deleteBoardButton").style.display=canManage?"inline-block":"none";
 $("leaveBoardButton").style.display=isOwner?"none":"inline-block";
 return true;
}
async function renameBoard(){
 const isGlobalAdmin=ADMIN_USERNAMES.has(username);
 if(!isOwner&&!isGlobalAdmin){alert("掲示板名を変更できるのは制作者または管理者です");return}
 const nextName=prompt(isGlobalAdmin?"🛡️ 管理者として掲示板名を変更します":"掲示板名を変更します",room?.name||"");
 if(nextName===null)return; const name=nextName.trim();
 if(!name){alert("掲示板名を入力してください");return} if(name.length>40){alert("掲示板名は40文字以内にしてください");return}
 const {error}=await supabaseClient.rpc("admin_rename_board",{target_board_id:Number(boardId),new_name:name});
 if(error){console.error(error);alert("掲示板名を変更できませんでした\n\n"+error.message);return}
 room.name=name;$("roomInfo").textContent=name+"　🔢 "+room.join_code;alert("✅ 掲示板名を変更しました");
}
async function deleteBoard(){
 const isGlobalAdmin=ADMIN_USERNAMES.has(username);
 if(!isOwner&&!isGlobalAdmin){alert("掲示板を削除できるのは制作者または管理者です");return}
 if(!confirm(isGlobalAdmin?"🛡️ 管理者としてこの掲示板を削除しますか？\n\nメッセージ、返信、リアクション、既読、メンバー情報なども削除されます。\nこの操作は元に戻せません。":"この掲示板を削除しますか？\n\nメッセージ、返信、リアクション、既読、メンバー情報なども削除されます。\nこの操作は元に戻せません。"))return;
 const {error}=await supabaseClient.rpc("admin_delete_board",{target_board_id:Number(boardId)});
 if(error){console.error(error);alert("掲示板の削除に失敗しました\n\n"+error.message);return}
 alert("✅ 掲示板を削除しました");location.href="board-number.html";
}
$("editBoardButton").onclick=renameBoard;$("deleteBoardButton").onclick=deleteBoard;
async function leaveBoard(){
 if(!room||!username)return;
 if(isOwner){alert("掲示板の管理者はこの掲示板から抜けられません。先に管理者の引き継ぎが必要です。");return}

  .on("broadcast",{event:"typing"},payload=>{
   const data=payload?.payload||{};
   if(!data.username||data.username===username)return;

   else{
    clearTimeout(typingHideTimer);
    $("typingIndicator").classList.remove("show");
    $("typingIndicator").textContent="";
   }
  })
  .subscribe(status=>{
   boardTypingReady=status==="SUBSCRIBED";
   if(status!=="SUBSCRIBED")console.warn("掲示板入力中Realtime接続状態:",status);
  });

 channel
 .on("postgres_changes",{event:"*",schema:"public",table:"board_room_messages",filter:"board_id=eq."+boardId},()=>loadMessages())
 .on("postgres_changes",{event:"*",schema:"public",table:"board_room_reactions"},()=>loadMessages())

 .subscribe()
}

async function start(){
 if(!boardId){alert("掲示板IDがありません");return}
 const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="index.html";return}
 username=session.user.user_metadata?.username||"";if(!username){location.href="index.html";return}
 if(typeof checkFriendChatBan==="function"){if(await checkFriendChatBan())return}
 if(!(await loadRoom()))return;await loadMembers();
 const isGlobalAdmin=ADMIN_USERNAMES.has(username);
 const joined=isGlobalAdmin||isOwner||members.some(m=>String(m.user_id).toLowerCase()===String(username).toLowerCase());
 if(!joined){alert("この掲示板には参加していません。まず参加番号から参加してください。");location.href="board-number.html";return}
 await Promise.all([updatePresence(),refreshMute(),loadMessages()]);setupRealtime();setInterval(updatePresence,30000);setInterval(refreshMute,30000)
}
window.addEventListener("pagehide",()=>{
 clearTimeout(typingTimer);clearTimeout(typingHideTimer);
 sendBoardTypingState(false);
 if(boardRealtimeChannel){supabaseClient.removeChannel(boardRealtimeChannel);boardRealtimeChannel=null}
 if(boardTypingChannel){supabaseClient.removeChannel(boardTypingChannel);boardTypingChannel=null;boardTypingReady=false}
});
start();
</script>
