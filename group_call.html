<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friend Chat グループ通話</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff3fb,#eef5ff);color:#333}.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:520px;background:#fff;border-radius:28px;padding:26px 20px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12)}.title{font-size:22px;font-weight:800}.status{min-height:24px;color:#777;font-size:14px;margin-top:6px;line-height:1.5}.timer{margin-top:6px;color:#8f7cff;font-weight:800}.participants-title{margin-top:22px;font-size:13px;font-weight:800;color:#777}.participants{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:12px;min-height:86px}.person{width:70px;position:relative}.avatar{width:58px;height:58px;margin:0 auto 5px;border-radius:50%;overflow:hidden;background:#eee8ff;display:flex;align-items:center;justify-content:center;font-size:25px;border:3px solid #8f7cff}.avatar img{width:100%;height:100%;object-fit:cover}.person-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mute-badge{position:absolute;right:4px;top:42px;width:20px;height:20px;border-radius:50%;background:#555;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}.actions{display:flex;justify-content:center;gap:16px;margin-top:24px}button{border:0;border-radius:50%;width:64px;height:64px;font-size:25px;box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer}.mute{background:#555;color:#fff}.end{background:#ff3b30;color:#fff}.hidden{display:none!important}.note{margin-top:15px;color:#999;font-size:12px;line-height:1.6}.notify-box{margin:14px auto 0;padding:10px 12px;border-radius:12px;background:#f6f3ff;color:#6658bd;font-size:12px;display:none}.notify-box.show{display:block}
</style></head><body><div class="page"><main class="card"><div id="title" class="title">📞 グループ通話</div><div id="status" class="status">接続しています...</div><div id="timer" class="timer"></div><div id="notifyBox" class="notify-box"></div><div class="participants-title">通話中のメンバー <span id="count">0</span>人</div><div id="participants" class="participants"></div><div class="actions"><button id="mute" class="mute hidden" type="button">🎙️</button><button id="end" class="end hidden" type="button">📵</button></div><div class="note">Friend Chat グループ音声通話</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script><script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co",SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),groupId=params.get("id")||params.get("group")||"";let currentUsername="",groupName="",groupChannel=null,groupChannelReady=false,heartbeatTimer=null,pruneTimer=null,timer=null,callStartedAt=0,ended=false,muted=false,skyContext=null,skyRoom=null,skyMember=null,localStream=null,skyJoined=false;const participants=new Map,remoteAudios=new Map;let profiles={};
function setStatus(t){$("status").textContent=t}function showNotify(t){$("notifyBox").textContent="🔔 "+t;$("notifyBox").classList.add("show");setTimeout(()=>$("notifyBox").classList.remove("show"),4500)}function notify(title,body){showNotify(body);try{if(document.visibilityState==="hidden"&&"Notification"in window&&Notification.permission==="granted")new Notification(title,{body})}catch(e){}}async function requestNotificationPermission(){if("Notification"in window&&Notification.permission==="default")try{await Notification.requestPermission()}catch(e){}}
function profileOf(u){return profiles[u]||{user_id:u,name:u,avatar_url:""}}function render(){const list=[...participants.values()].sort((a,b)=>a.username===currentUsername?-1:b.username===currentUsername?1:(a.name||a.username).localeCompare(b.name||b.username,"ja"));$("count").textContent=list.length;$("participants").innerHTML="";for(const p of list){const item=document.createElement("div");item.className="person";const av=document.createElement("div");av.className="avatar";if(p.avatar_url){const img=document.createElement("img");img.src=p.avatar_url;img.alt="プロフィール画像";img.onerror=()=>av.innerHTML="👤";av.appendChild(img)}else av.textContent="👤";item.appendChild(av);if(p.muted){const b=document.createElement("div");b.className="mute-badge";b.textContent="🔇";item.appendChild(b)}const n=document.createElement("div");n.className="person-name";n.textContent=p.name||p.username;item.appendChild(n);$("participants").appendChild(item)}}function upsert(d,announce=false){if(!d?.username)return;const p=profileOf(d.username),old=participants.get(d.username);participants.set(d.username,{username:d.username,name:d.name||p.name||d.username,avatar_url:d.avatar_url||p.avatar_url||"",muted:!!d.muted,lastSeen:Date.now()});render();if(announce&&!old&&d.username!==currentUsername)notify("Friend Chat",`${d.name||d.username}さんがグループ通話に参加しました`);if(old&&old.muted!==!!d.muted&&d.username!==currentUsername)notify("Friend Chat",`${d.name||d.username}さんが${d.muted?"ミュート":"ミュート解除"}しました`)}function remove(u,announce=true){const old=participants.get(u);if(!old)return;participants.delete(u);render();if(announce&&u!==currentUsername)notify("Friend Chat",`${old.name||u}さんがグループ通話を退出しました`)}
async function sendState(type){if(!groupChannel||!groupChannelReady)return;const p=profileOf(currentUsername);try{await groupChannel.send({type:"broadcast",event:"call-state",payload:{type,username:currentUsername,name:p.name||currentUsername,avatar_url:p.avatar_url||"",muted}})}catch(e){console.warn(e)}}function setupState(){groupChannel=db.channel("group-call-state-"+encodeURIComponent(String(groupId))).on("broadcast",{event:"call-state"},async x=>{const d=x?.payload||{};if(!d.username||d.username===currentUsername)return;if(d.type==="leave"){remove(d.username);return}upsert(d,d.type==="join");if(d.type==="join")await sendState("state")}).subscribe(async st=>{groupChannelReady=st==="SUBSCRIBED";if(groupChannelReady)await sendState("join")});heartbeatTimer=setInterval(()=>sendState("heartbeat"),5000);pruneTimer=setInterval(()=>{const n=Date.now();for(const[u,p]of participants)if(n-p.lastSeen>16000)participants.delete(u);render()},3000)}
async function getToken(){const{data,error}=await db.functions.invoke("skyway-token",{body:{username:currentUsername,group_id:String(groupId)}});if(error)throw new Error("SkyWayトークン取得エラー: "+(error.message||""));if(!data?.ok||!data.token)throw new Error(data?.error||"SkyWayトークンを取得できませんでした");return data.token}async function subscribeAudio(pub){if(!pub||pub.publisher.id===skyMember?.id||pub.contentType!=="audio")return;try{const{stream}=await skyMember.subscribe(pub.id);let a=remoteAudios.get(pub.id);if(!a){a=document.createElement("audio");a.autoplay=true;a.playsInline=true;a.setAttribute("playsinline","");document.body.appendChild(a);remoteAudios.set(pub.id,a)}stream.attach(a);await a.play().catch(()=>{})}catch(e){console.error("音声購読エラー",e)}}
async function joinSkyway(){const sdk=window.skyway_room;if(!sdk)throw new Error("SkyWay SDKを読み込めませんでした");const{SkyWayContext,SkyWayRoom,SkyWayStreamFactory}=sdk;const token=await getToken();setStatus("🔄 SkyWayに接続中...");skyContext=await SkyWayContext.Create(token);skyRoom=await SkyWayRoom.FindOrCreate(skyContext,{type:"p2p",name:"friend-chat-group-call-"+groupId});skyMember=await skyRoom.join({name:currentUsername});const audio=await SkyWayStreamFactory.createMicrophoneAudioStream({echoCancellation:true,noiseSuppression:true,autoGainControl:true});if(!audio)throw new Error("マイクを開始できませんでした");localStream=audio;await skyMember.publish(audio,{type:"sfu"});skyJoined=true;$("mute").classList.remove("hidden");$("end").classList.remove("hidden");setStatus("🟢 通話中");callStartedAt=Date.now();timer=setInterval(()=>{const s=Math.floor((Date.now()-callStartedAt)/1000);$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);skyRoom.publications.forEach(subscribeAudio);skyRoom.onStreamPublished.add(e=>subscribeAudio(e.publication));skyRoom.onStreamUnpublished.add(e=>{const a=remoteAudios.get(e.publication?.id);if(a){a.remove();remoteAudios.delete(e.publication.id)}})}
async function finish(){if(ended)return;ended=true;clearInterval(timer);clearInterval(heartbeatTimer);clearInterval(pruneTimer);await sendState("leave");try{if(skyMember)await skyMember.leave()}catch(e){}try{if(skyRoom)await skyRoom.dispose()}catch(e){}try{if(localStream?.track)localStream.track.stop()}catch(e){}for(const a of remoteAudios.values())a.remove();remoteAudios.clear();if(groupChannel)try{await db.removeChannel(groupChannel)}catch(e){}location.replace("group_chat.html?id="+encodeURIComponent(groupId))}function toggleMute(){if(!localStream)return;muted=!muted;try{if(localStream.track)localStream.track.enabled=!muted;else localStream.getAudioTracks?.().forEach(t=>t.enabled=!muted);$("mute").textContent=muted?"🔇":"🎙️";sendState("mute")}catch(e){console.error(e)}}
async function init(){if(!groupId)return setStatus("グループIDがありません");const{data:{session}}=await db.auth.getSession();if(!session)return location.href="index.html";currentUsername=session.user.user_metadata?.username||"";if(!currentUsername)return setStatus("ログイン情報を取得できません");const{data:member,error:me}=await db.from("group_members").select("user_id").eq("group_id",Number(groupId)).eq("user_id",currentUsername).maybeSingle();if(me)return setStatus("⚠️ グループ確認に失敗しました");if(!member){alert("このグループのメンバーではありません");return location.replace("groups.html")}const[{data:group},{data:members}]=await Promise.all([db.from("groups").select("id,name").eq("id",Number(groupId)).maybeSingle(),db.from("group_members").select("user_id").eq("group_id",Number(groupId))]);groupName=group?.name||"グループ";$("title").textContent="📞 "+groupName+" 通話";const ids=(members||[]).map(x=>x.user_id);if(ids.length){const{data:ps}=await db.from("profiles").select("user_id,name,avatar_url").in("user_id",ids);(ps||[]).forEach(p=>profiles[p.user_id]=p)}upsert({username:currentUsername,...profileOf(currentUsername)});setupState();await requestNotificationPermission();try{await joinSkyway()}catch(e){console.error(e);setStatus("⚠️ 接続失敗: "+(e?.message||String(e)));showNotify(e?.message||String(e));$("end").classList.remove("hidden")}}
$("mute").addEventListener("click",toggleMute);$("end").addEventListener("click",finish);window.addEventListener("pagehide",()=>{clearInterval(timer);clearInterval(heartbeatTimer);clearInterval(pruneTimer);try{localStream?.track?.stop()}catch(e){}if(skyMember)skyMember.leave().catch(()=>{});if(skyRoom)skyRoom.dispose().catch(()=>{});if(groupChannel)db.removeChannel(groupChannel).catch(()=>{})});init();
</script></body></html>
