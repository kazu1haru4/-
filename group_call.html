<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friend Chat グループ通話</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff3fb,#eef5ff);color:#333}
.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:520px;background:#fff;border-radius:28px;padding:24px 18px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{border:0;background:#f1efff;color:#5e50c9;border-radius:12px;padding:9px 12px;font-weight:800}.title{flex:1;text-align:center;font-size:20px;font-weight:800}.status{text-align:center;color:#777;font-size:14px;min-height:24px}.timer{text-align:center;color:#8f7cff;font-weight:800;margin-top:5px}
.participants{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.person{background:#f7f5ff;border-radius:18px;padding:12px 6px;text-align:center;min-height:108px}.person img,.person .avatar{width:54px;height:54px;border-radius:50%;margin:auto;object-fit:cover;background:#eee8ff;display:flex;align-items:center;justify-content:center;font-size:25px}.person-name{font-size:12px;font-weight:800;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-state{font-size:11px;color:#777;margin-top:3px}.person-state.muted{color:#d9534f;font-weight:800}
.actions{display:flex;justify-content:center;gap:14px;margin-top:18px}.actions button{border:0;border-radius:50%;width:64px;height:64px;font-size:25px;box-shadow:0 4px 12px rgba(0,0,0,.12)}.mute{background:#555;color:#fff}.end{background:#ff3b30;color:#fff}
.notice{display:none;margin-top:12px;background:#f7f5ff;border-radius:12px;padding:9px;text-align:center;color:#666;font-size:12px}.notice.show{display:block}.debug{margin-top:14px;font-size:11px;color:#888;text-align:left;white-space:pre-wrap;word-break:break-word;display:none}
</style>
</head>
<body>
<div class="page"><main class="card">
<div class="top"><button id="back" class="back" type="button">← 戻る</button><div class="title">📞 グループ通話</div><div style="width:58px"></div></div>
<div id="status" class="status">接続しています...</div><div id="timer" class="timer"></div>
<div id="participants" class="participants"></div>
<div id="notice" class="notice"></div>
<div class="actions"><button id="mute" class="mute" type="button">🎙️</button><button id="end" class="end" type="button">📵</button></div>
<div id="debug" class="debug"></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search);
const groupId=params.get("id")||"";
const $=id=>document.getElementById(id);
const statusEl=$("status"),timerEl=$("timer"),participantsEl=$("participants"),noticeEl=$("notice"),debugEl=$("debug");
let currentUsername="",groupName="",muted=false,ended=false,startedAt=Date.now(),timer=null;
let skyContext=null,skyRoom=null,skyMember=null,localStream=null,callChannel=null,stateChannel=null;
const participants=new Map();

function showNotice(text){noticeEl.textContent=text;noticeEl.classList.add("show");clearTimeout(showNotice.timer);showNotice.timer=setTimeout(()=>noticeEl.classList.remove("show"),2500)}
function debug(e){console.warn(e);debugEl.textContent=String(e?.stack||e?.message||e);debugEl.style.display="block"}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{const s=Math.floor((Date.now()-startedAt)/1000);timerEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000)}
function stopTimer(){clearInterval(timer);timer=null}
function stateChannelName(){return "group-call-state-"+encodeURIComponent(groupId)}
function renderParticipants(){
 participantsEl.innerHTML="";
 const list=[...participants.values()].sort((a,b)=>String(a.username).localeCompare(String(b.username)));
 if(!list.length){participantsEl.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999;padding:20px">通話参加者を読み込み中...</div>';return}
 list.forEach(p=>{
  const el=document.createElement("div");el.className="person";
  const av=p.avatar_url?Object.assign(document.createElement("img"),{src:p.avatar_url,alt:""}):Object.assign(document.createElement("div"),{className:"avatar",textContent:"👤"});
  el.appendChild(av);
  const n=document.createElement("div");n.className="person-name";n.textContent=p.name||p.username;el.appendChild(n);
  const s=document.createElement("div");s.className="person-state"+(p.muted?" muted":"");s.textContent=p.muted?"🔇 ミュート":"🟢 通話中";el.appendChild(s);
  participantsEl.appendChild(el);
 });
}
async function loadProfile(username){
 const {data}=await db.from("profiles").select("user_id,name,avatar_url").eq("user_id",username).maybeSingle();
 return {username,name:data?.name||username,avatar_url:data?.avatar_url||""};
}
async function announce(payload){if(!stateChannel)return;try{await stateChannel.send({type:"broadcast",event:"call-state",payload})}catch(e){console.warn(e)}}
async function setMe(){
 const p=await loadProfile(currentUsername);participants.set(currentUsername,{...p,muted});renderParticipants();
 await announce({type:"join",username:currentUsername,muted:false});
}
async function getGroupToken(){
 const {data,error}=await db.functions.invoke("skyway-group-token",{body:{groupId}});
 if(error)throw error;
 if(!data?.ok||!data.token)throw new Error(data?.error||"グループ通話トークンを取得できませんでした");
 return data.token;
}
async function join(){
 if(!groupId)throw new Error("グループIDがありません");
 const {data:{session}}=await db.auth.getSession();
 if(!session)throw new Error("ログインしてください");
 currentUsername=session.user.user_metadata?.username||"";
 if(!currentUsername)throw new Error("ログイン情報を取得できません");
 const {data:member,error:memberError}=await db.from("group_members").select("user_id").eq("group_id",Number(groupId)).eq("user_id",currentUsername).maybeSingle();
 if(memberError)throw memberError;
 if(!member)throw new Error("このグループのメンバーではありません");
 const {data:group}=await db.from("groups").select("name").eq("id",Number(groupId)).maybeSingle();
 groupName=group?.name||"グループ";
 document.title="📞 "+groupName+" 通話";
 statusEl.textContent="🔄 通話サーバーに接続中...";
 stateChannel=db.channel(stateChannelName()).on("broadcast",{event:"call-state"},async event=>{
  const p=event?.payload||{};
  if(!p.username||p.username===currentUsername)return;
  if(p.type==="join"||p.type==="heartbeat"){
   if(!participants.has(p.username))participants.set(p.username,await loadProfile(p.username));
   const x=participants.get(p.username);participants.set(p.username,{...x,muted:!!p.muted});renderParticipants();
   if(p.type==="join")showNotice("📞 "+p.username+" さんが通話に参加しました");
  }else if(p.type==="mute"){
   const x=participants.get(p.username)||await loadProfile(p.username);participants.set(p.username,{...x,muted:!!p.muted});renderParticipants();
  }else if(p.type==="leave"){
   participants.delete(p.username);renderParticipants();showNotice("👋 "+p.username+" さんが通話を退出しました");
  }
 }).subscribe(async st=>{if(st==="SUBSCRIBED")await setMe()});
 const token=await getGroupToken();
 const {SkyWayContext,SkyWayRoom,SkyWayStreamFactory}=window.skyway_room||{};
 if(!SkyWayContext||!SkyWayRoom||!SkyWayStreamFactory)throw new Error("SkyWay SDKを読み込めませんでした");
 skyContext=await SkyWayContext.Create(token);
 skyRoom=await SkyWayRoom.FindOrCreate(skyContext,{type:"sfu",name:"friend-chat-group-call-"+groupId});
 skyMember=await skyRoom.join({name:currentUsername});
 localStream=await SkyWayStreamFactory.createMicrophoneAudioStream({echoCancellation:true,noiseSuppression:true,autoGainControl:true});
 await skyMember.publish(localStream,{type:"sfu"});
 const subscribeAudio=async publication=>{
  if(!publication||publication.publisher.id===skyMember.id||publication.contentType!=="audio")return;
  try{
   const {stream}=await skyMember.subscribe(publication.id);
   const audio=document.createElement("audio");audio.autoplay=true;audio.playsInline=true;audio.dataset.publication=publication.id;document.body.appendChild(audio);stream.attach(audio);await audio.play().catch(()=>{});
  }catch(e){debug(e)}
 };
 skyRoom.publications.forEach(subscribeAudio);
 skyRoom.onStreamPublished.add(e=>subscribeAudio(e.publication));
 skyRoom.onStreamUnpublished.add(e=>document.querySelector(`audio[data-publication="${e.publication.id}"]`)?.remove());
 statusEl.textContent="🟢 通話中";startTimer();
}
async function toggleMute(){
 if(!localStream)return;muted=!muted;
 try{if(localStream.track)localStream.track.enabled=!muted;else localStream.getAudioTracks?.().forEach(t=>t.enabled=!muted)}catch(e){muted=!muted;debug(e);return}
 $("mute").textContent=muted?"🔇":"🎙️";statusEl.textContent=muted?"🔇 ミュート中":"🟢 通話中";await announce({type:"mute",username:currentUsername,muted});
}
async function finish(){
 if(ended)return;ended=true;stopTimer();
 try{await announce({type:"leave",username:currentUsername})}catch(e){}
 try{if(skyMember)await skyMember.leave()}catch(e){}
 try{if(skyRoom)await skyRoom.dispose()}catch(e){}
 try{if(localStream){if(localStream.track)localStream.track.stop();else localStream.getTracks?.().forEach(t=>t.stop())}}catch(e){}
 if(callChannel)try{await db.removeChannel(callChannel)}catch(e){}
 if(stateChannel)try{await db.removeChannel(stateChannel)}catch(e){}
 document.querySelectorAll("audio[data-publication]").forEach(a=>a.remove());
 location.replace("group_chat.html?id="+encodeURIComponent(groupId));
}
$("mute").addEventListener("click",toggleMute);$("end").addEventListener("click",finish);$("back").addEventListener("click",finish);
window.addEventListener("pagehide",()=>{if(!ended){try{announce({type:"leave",username:currentUsername})}catch(e){};try{if(localStream){if(localStream.track)localStream.track.stop();else localStream.getTracks?.().forEach(t=>t.stop())}}catch(e){};try{if(skyMember)skyMember.leave()}catch(e){};try{if(skyRoom)skyRoom.dispose()}catch(e){}}});
join().catch(e=>{statusEl.textContent="⚠️ 接続失敗: "+(e?.message||String(e));debug(e)});
</script>
</body>
</html>
