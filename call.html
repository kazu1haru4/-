<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friend Chat 通話</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff3fb,#eef5ff);color:#333}
.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.avatar{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;overflow:hidden;background:#eee8ff;display:flex;align-items:center;justify-content:center;font-size:40px}.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:22px;font-weight:800;margin-bottom:8px}.status{min-height:24px;color:#777;font-size:14px}.timer{margin-top:8px;color:#8f7cff;font-weight:800}
.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}button{border:0;border-radius:50%;width:64px;height:64px;font-size:25px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.answer{background:#34c759;color:#fff}.reject,.end{background:#ff3b30;color:#fff}.mute{background:#555;color:#fff}.hidden{display:none!important}.note{margin-top:18px;color:#999;font-size:12px;line-height:1.6}
#debug{display:none;margin-top:18px;text-align:left;background:#f7f7fb;border:1px solid #ddd;border-radius:16px;padding:12px;font-size:12px;line-height:1.5}
#debug.show{display:block}.debug-title{font-weight:800;margin-bottom:7px}.debug-row{padding:3px 0}.debug-detail{margin-top:8px;padding:8px;background:#fff;border-radius:10px;color:#555;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="page"><main class="card">
<div id="avatar" class="avatar">👤</div><div id="name" class="name">通話</div>
<div id="status" class="status">接続しています...</div><div id="timer" class="timer"></div>
<div class="actions">
<button id="answer" class="answer hidden" type="button">📞</button>
<button id="mute" class="mute hidden" type="button">🎙️</button>
<button id="end" class="end hidden" type="button">📵</button>
<button id="reject" class="reject hidden" type="button">📵</button>
</div>
<div id="debug">
  <div class="debug-title">🔧 通話接続チェック</div>
  <div id="debugRows"></div>
  <div id="debugDetail" class="debug-detail">詳細なし</div>
</div>
<div class="note">Friend Chat 音声通話</div>
</main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const friendId=params.get("user")||"",incoming=params.get("incoming")==="1",incomingCallId=params.get("call")||"";
const avatar=$("avatar"),nameEl=$("name"),statusEl=$("status"),timerEl=$("timer");
const answerButton=$("answer"),muteButton=$("mute"),endButton=$("end"),rejectButton=$("reject");
const debugBox=$("debug"),debugRows=$("debugRows"),debugDetail=$("debugDetail");
let currentUsername="",friendName="",friendAvatarUrl="",channel=null,inboxChannel=null,ringTimer=null,timer=null,callStartedAt=0,callId="",muted=false,ended=false;
let localStream=null,skyContext=null,skyRoom=null,skyMember=null,skyAudioPublication=null,skyConnected=false,skyJoined=false;

const debugState={
 "① SkyWay SDK":"⏳",
 "② Token取得":"⏳",
 "③ RTC接続":"⏳",
 "④ Room":"⏳",
 "⑤ 参加":"⏳",
 "⑥ マイク":"⏳",
 "⑦ 音声送信":"⏳"
};
function debugRender(){
 debugBox.classList.add("show");
 debugRows.innerHTML="";
 Object.entries(debugState).forEach(([k,v])=>{
  const d=document.createElement("div");d.className="debug-row";d.textContent=k+"　"+v;debugRows.appendChild(d);
 });
}
function debugSet(key,value,detail){
 debugState[key]=value;
 if(detail!==undefined)debugDetail.textContent=String(detail?.stack||detail?.message||detail);
 debugRender();
}
function debugError(detail){debugDetail.textContent=String(detail?.stack||detail?.message||detail||"不明なエラー");debugRender()}
debugRender();

function channelName(){return "friend-call-"+[currentUsername,friendId].sort().map(encodeURIComponent).join("-")}
function inboxChannelName(){return "friend-call-inbox-"+encodeURIComponent(friendId)}
function renderPerson(){nameEl.textContent=friendName||friendId||"通話";avatar.innerHTML="";if(friendAvatarUrl){const img=document.createElement("img");img.src=friendAvatarUrl;img.alt="プロフィール画像";img.onerror=()=>{avatar.textContent="👤"};avatar.appendChild(img)}else avatar.textContent="👤"}
function sendSignal(payload){if(!channel)return Promise.resolve();return channel.send({type:"broadcast",event:"call",payload:{...payload,from:currentUsername}})}

async function createCallNotification(){
 if(!friendId||!currentUsername||!callId)return;
 try{const {error}=await db.from("notifications").insert({user_id:friendId,type:"call",title:"📞 "+currentUsername+"さんから通話着信",message:"音声通話の着信があります。",link:"call.html?user="+encodeURIComponent(currentUsername)+"&incoming=1&call="+encodeURIComponent(callId),is_read:false});if(error)console.warn(error)}catch(e){console.warn(e)}
}
async function sendCallPush(){
 if(!friendId||!currentUsername||friendId===currentUsername)return;
 try{const {data,error}=await db.functions.invoke("send-push",{body:{username:friendId,title:"📞 "+currentUsername+"さんから通話着信",message:"音声通話の着信があります。",url:"call.html?user="+encodeURIComponent(currentUsername)+"&incoming=1&call="+encodeURIComponent(callId)}});if(error)console.warn(error);else if(data&&!data.ok)console.warn(data)}catch(e){console.warn(e)}
}
async function sendIncomingRing(){
 try{
  if(!inboxChannel){
   inboxChannel=db.channel(inboxChannelName());
   await new Promise((resolve,reject)=>{
    let done=false;
    const timeout=setTimeout(()=>{if(!done){done=true;reject(new Error("着信チャンネル接続がタイムアウトしました"))}},10000);
    inboxChannel.subscribe(st=>{if(st==="SUBSCRIBED"&&!done){done=true;clearTimeout(timeout);resolve()}});
   });
  }
  await inboxChannel.send({type:"broadcast",event:"incoming-call",payload:{type:"ring",callId,from:currentUsername,to:friendId}});
 }catch(e){console.error(e)}
}
function startRingRetry(){if(ringTimer)clearInterval(ringTimer);let count=0;const send=async()=>{if(ended||!callId||count>=15){clearInterval(ringTimer);ringTimer=null;return}count++;await sendIncomingRing()};send();ringTimer=setInterval(send,1000)}
function stopRingRetry(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}
function startTimer(){clearInterval(timer);callStartedAt=Date.now();timer=setInterval(()=>{const s=Math.floor((Date.now()-callStartedAt)/1000);timerEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000)}
function stopTimer(){clearInterval(timer);timer=null;timerEl.textContent=""}

async function getSkywayToken(){
 debugSet("② Token取得","🔄");
 try{
  const {data,error}=await db.functions.invoke("skyway-token",{body:{username:currentUsername}});
  if(error)throw error;
  if(!data?.ok||!data.token)throw new Error(data?.error||"トークンがありません");
  debugSet("② Token取得","✅");
  return data.token;
 }catch(e){debugSet("② Token取得","❌",e);throw e}
}

async function withTimeout(promise,ms,label){
 let timerId;
 const timeout=new Promise((_,reject)=>{
  timerId=setTimeout(()=>reject(new Error(label+" がタイムアウトしました（"+ms/1000+"秒）")),ms);
 });
 try{return await Promise.race([promise,timeout])}
 finally{clearTimeout(timerId)}
}

async function ensureSkyway(){
 if(skyJoined)return skyConnected;
 try{
  if(!window.skyway_room){
   debugSet("① SkyWay SDK","❌","window.skyway_room がありません");
   throw new Error("SkyWay SDKを読み込めませんでした");
  }
  debugSet("① SkyWay SDK","✅");
  if(!callId)throw new Error("通話IDがありません");

  statusEl.textContent="🔄 通話サーバーに接続中...";
  const {SkyWayContext,SkyWayRoom,SkyWayStreamFactory}=window.skyway_room;

  const token=await getSkywayToken();

  debugSet("③ RTC接続","🔄");
  skyContext=await withTimeout(
    SkyWayContext.Create(token),
    20000,
    "SkyWay RTC接続"
  );
  debugSet("③ RTC接続","✅");

  debugSet("④ Room","🔄");
  skyRoom=await withTimeout(
    SkyWayRoom.FindOrCreate(skyContext,{type:"p2p",name:"friend-chat-call-"+callId}),
    20000,
    "SkyWay Room作成"
  );
  debugSet("④ Room","✅");

  debugSet("⑤ 参加","🔄");
  skyMember=await withTimeout(
    skyRoom.join({name:currentUsername}),
    20000,
    "SkyWay Room参加"
  );
  debugSet("⑤ 参加","✅");

  debugSet("⑥ マイク","🔄");
  const audioStream=await SkyWayStreamFactory.createMicrophoneAudioStream({
   echoCancellation:true,
   noiseSuppression:true,
   autoGainControl:true
  });
  if(!audioStream)throw new Error("SkyWayのマイクストリームを作成できませんでした");
  localStream=audioStream;
  debugSet("⑥ マイク","✅");

  debugSet("⑦ 音声送信","🔄");
  skyAudioPublication=await withTimeout(
    skyMember.publish(audioStream,{type:"p2p"}),
    20000,
    "音声送信"
  );
  debugSet("⑦ 音声送信","✅");
  skyJoined=true;

  const subscribeAudio=async publication=>{
   if(!publication||publication.publisher.id===skyMember.id||publication.contentType!=="audio")return;
   try{
    const {stream}=await skyMember.subscribe(publication.id);
    let audio=document.getElementById("skywayRemoteAudio");
    if(!audio){audio=document.createElement("audio");audio.id="skywayRemoteAudio";audio.autoplay=true;audio.playsInline=true;document.body.appendChild(audio)}
    stream.attach(audio);
    audio.autoplay=true;
    audio.playsInline=true;
    await audio.play().catch(()=>{});
    if(!skyConnected){
     skyConnected=true;
     statusEl.textContent="🟢 通話中";
     muteButton.classList.remove("hidden");
     endButton.classList.remove("hidden");
     answerButton.classList.add("hidden");
     rejectButton.classList.add("hidden");
     stopRingRetry();
     startTimer();
    }
   }catch(e){console.error(e);debugError(e);statusEl.textContent="⚠️ 相手の音声接続に失敗しました"}
  };

  skyRoom.publications.forEach(p=>subscribeAudio(p));
  skyRoom.onStreamPublished.add(e=>subscribeAudio(e.publication));
  skyRoom.onStreamUnpublished.add(()=>{document.getElementById("skywayRemoteAudio")?.remove()});

  if(!skyConnected)statusEl.textContent=incoming?"🔄 相手の音声を待っています...":"📞 呼び出しています...";
  return true;
 }catch(e){
  debugError(e);
  throw e;
 }
}

async function caller(){
 callId=currentUsername+"-"+Date.now()+"-"+Math.random().toString(36).slice(2);
 statusEl.textContent="📞 呼び出しています...";
 await createCallNotification();await sendCallPush();startRingRetry();
 try{await ensureSkyway()}
 catch(e){
  console.error("SkyWay発信エラー",e);
  statusEl.textContent="⚠️ 接続失敗: "+(e?.message||String(e));
  stopRingRetry();
  try{if(skyMember)await skyMember.leave()}catch(_){}
  try{if(skyRoom)await skyRoom.dispose()}catch(_){}
  skyMember=null;skyRoom=null;skyContext=null;skyAudioPublication=null;skyJoined=false;skyConnected=false;
  return;
 }
 await sendSignal({type:"ring",callId});
}

async function answer(){
 answerButton.classList.add("hidden");
 rejectButton.classList.add("hidden");
 try{
  const ok=await ensureSkyway();
  if(!ok)throw new Error("通話接続を開始できませんでした");
  if(!skyConnected)statusEl.textContent="🔄 接続中...";
 }catch(e){
  console.error("SkyWay応答エラー",e);
  statusEl.textContent="⚠️ 接続失敗: "+(e?.message||String(e));
  answerButton.classList.remove("hidden");
  rejectButton.classList.remove("hidden");
 }
}

async function handleSignal(data){
 if(!data||data.from===currentUsername)return;
 if(data.type==="end"&&data.callId===callId){await finish(false);return}
 if(data.type==="reject"&&data.callId===callId){statusEl.textContent="相手が通話を拒否しました";setTimeout(()=>finish(false),1000);return}
 if(data.type==="busy"&&data.callId===callId){statusEl.textContent="相手は現在通話中です";setTimeout(()=>finish(false),1000)}
}

async function finish(send=true){
 if(ended)return;
 ended=true;stopRingRetry();stopTimer();
 if(send&&callId){try{await sendSignal({type:"end",callId})}catch(e){}}
 try{if(skyMember)await skyMember.leave()}catch(e){}
 try{if(skyRoom)await skyRoom.dispose()}catch(e){}
 skyMember=null;skyRoom=null;skyContext=null;skyAudioPublication=null;skyJoined=false;skyConnected=false;
 if(localStream){
  try{
   if(localStream.track)localStream.track.stop();
   else if(typeof localStream.getTracks==="function")localStream.getTracks().forEach(t=>t.stop());
  }catch(e){}
  localStream=null;
 }
 document.getElementById("skywayRemoteAudio")?.remove();
 if(channel){try{await db.removeChannel(channel)}catch(e){}channel=null}
 if(inboxChannel){try{await db.removeChannel(inboxChannel)}catch(e){}inboxChannel=null}
 const returnUrl="chat.html?user="+encodeURIComponent(friendId);
 setTimeout(()=>{location.replace(returnUrl)},80);
}

function toggleMute(){
 if(!localStream)return;
 muted=!muted;
 try{
  if(localStream.track)localStream.track.enabled=!muted;
  else if(typeof localStream.getAudioTracks==="function")localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
 }catch(e){console.error("ミュート切替エラー:",e);muted=!muted;return}
 muteButton.textContent=muted?"🔇":"🎙️";
 statusEl.textContent=muted?"🔇 ミュート中":"🟢 通話中";
}

async function init(){
 debugRender();
 if(!friendId){statusEl.textContent="相手が指定されていません";endButton.classList.remove("hidden");endButton.textContent="🏠";return}

 const {data,error}=await db.auth.getSession();
 if(error||!data.session){alert("ログインしてください。");location.href="index.html";return}

 currentUsername=data.session.user.user_metadata?.username||"";
 if(!currentUsername){statusEl.textContent="ログイン情報を取得できません";return}

 const {data:profile,error:profileError}=await db.from("profiles").select("user_id,name,avatar_url").eq("user_id",friendId).maybeSingle();
 if(profileError)console.warn(profileError);
 friendName=profile?.name||friendId;
 friendAvatarUrl=profile?.avatar_url||"";
 renderPerson();

 channel=db.channel(channelName())
  .on("broadcast",{event:"call"},async payload=>{await handleSignal(payload?.payload||{})})
  .subscribe(async st=>{
   if(st!=="SUBSCRIBED")return;

   if(incoming){
    if(!incomingCallId){
     statusEl.textContent="通話情報が見つかりません";
     endButton.classList.remove("hidden");
     return;
    }
    callId=incomingCallId;
    statusEl.textContent="📲 着信があります";
    answerButton.classList.remove("hidden");
    rejectButton.classList.remove("hidden");
    endButton.classList.add("hidden");
   }else{
    await caller();
   }
  });
}

answerButton.addEventListener("click",answer);
rejectButton.addEventListener("click",async()=>{if(callId)await sendSignal({type:"reject",callId});await finish(false)});
muteButton.addEventListener("click",toggleMute);
endButton.addEventListener("click",()=>finish(true));

window.addEventListener("pagehide",()=>{
 stopRingRetry();
 if(localStream){
  try{
   if(localStream.track)localStream.track.stop();
   else if(typeof localStream.getTracks==="function")localStream.getTracks().forEach(t=>t.stop());
  }catch(e){}
 }
 if(skyMember)skyMember.leave().catch(()=>{});
 if(skyRoom)skyRoom.dispose().catch(()=>{});
 if(channel)db.removeChannel(channel);
 if(inboxChannel)db.removeChannel(inboxChannel);
});

init();
</script>
</body>
</html>
