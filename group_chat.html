/* =========================
   オンライン
========================= */

function isOnline(lastSeen){

if(!lastSeen) return false;

const time =
new Date(lastSeen).getTime();

if(Number.isNaN(time)){
return false;
}

return Date.now() - time <= 60000;
}

function formatLastOnline(lastSeen){

if(!lastSeen){
return "最終オンライン：不明";
}

const time =
new Date(lastSeen).getTime();

if(Number.isNaN(time)){
return "最終オンライン：不明";
}

const diff =
Date.now() - time;

if(diff < 0){
return "最終オンライン：たった今";
}

const seconds =
Math.floor(diff / 1000);

if(seconds < 60){
return "最終オンライン：たった今";
}

const minutes =
Math.floor(seconds / 60);

if(minutes < 60){
return "最終オンライン：" +
minutes +
"分前";
}

const hours =
Math.floor(minutes / 60);

if(hours < 24){
return "最終オンライン：" +
hours +
"時間前";
}

const days =
Math.floor(hours / 24);

if(days < 30){
return "最終オンライン：" +
days +
"日前";
}

const date =
new Date(lastSeen);

return "最終オンライン：" +
date.getFullYear() +
"/" +
String(date.getMonth()+1).padStart(2,"0") +
"/" +
String(date.getDate()).padStart(2,"0");
}

/* =========================
   自分のオンライン状態
========================= */

async function updateMyPresence(){

if(!currentUsername) return;

const {error} =
await supabaseClient
.from("user_presence")
.upsert(
{
user_id:currentUsername,
last_seen:new Date().toISOString()
},
{
onConflict:"user_id"
}
);

if(error){
console.error(
"オンライン状態更新エラー:",
error
);
}

}

/* =========================
   プロフィール
========================= */

async function getProfile(username){

if(!username) return null;

if(
Object.prototype.hasOwnProperty.call(
profileCache,
username
)
){
return profileCache[username];
}

const {data} =
await supabaseClient
.from("profiles")
.select(
"user_id,name,avatar_url"
)
.eq(
"user_id",
username
)
.maybeSingle();

profileCache[username] =
data || null;

return data || null;
}

function createAvatar(profile){

const avatar =
document.createElement("div");

avatar.className =
"message-avatar";

if(profile?.avatar_url){

const img =
document.createElement("img");

img.src =
profile.avatar_url;

img.alt =
"プロフィール画像";

avatar.appendChild(img);

}else{

avatar.textContent =
"👤";
}

return avatar;
}

/* =========================

========================= */

function updateCurrentMute(){

const now =
Date.now();

const active =
groupMutesCache.find(
mute =>
mute.user_id ===
currentUsername &&
new Date(
mute.muted_until
).getTime() > now
);

active || null;

/* =========================
   発言禁止中か
========================= */

function isCurrentUserMuted(){

if(!currentMute){
return false;
}

const until =
new Date(
currentMute.muted_until
).getTime();

if(Number.isNaN(until)){
return false;
}

if(until <= Date.now()){

currentMute = null;

updateMuteUI();

return false;
}

return true;
}

/* =========================
   残り時間
========================= */

function formatMuteRemaining(
mutedUntil
){

const until =
new Date(
mutedUntil
).getTime();

if(Number.isNaN(until)){
return "";
}

let diff =
until - Date.now();

if(diff <= 0){
return "";
}

const minutes =
Math.ceil(
diff / 60000
);

if(minutes < 60){

return minutes +
"分";
}

const hours =
Math.floor(
minutes / 60
);

const remainMinutes =
minutes % 60;

if(hours < 24){

if(remainMinutes > 0){

return hours +
"時間" +
remainMinutes +
"分";

}

return hours +
"時間";
}

const days =
Math.floor(
hours / 24
);

const remainHours =
hours % 24;

if(remainHours > 0){

return days +
"日" +
remainHours +
"時間";
}

return days +
"日";
}

await supabaseClient

);

read.group_message_id

currentUsername
);

unreadMessages.map(
message => ({

message.id,
user_id:
currentUsername
})
);

await supabaseClient
.from("group_message_reads")
.upsert(
rows,
{
onConflict:
"group_message_id,user_id",
ignoreDuplicates:true
}
);

);

"mention-id";

"@" +
member.user_id;

info.appendChild(name);
info.appendChild(id);

button.appendChild(info);

button.addEventListener(
"click",
event => {

event.preventDefault();
event.stopPropagation();

const currentValue =
messageInput.value;

const currentCursor =
messageInput.selectionStart ||
currentValue.length;

const before =
currentValue.slice(
0,
currentCursor
);

const after =
currentValue.slice(
currentCursor
);

const mentionMatch =
before.match(
/@[A-Za-z0-9_]*$/
);

if(!mentionMatch){
return;
}

const start =
before.length -
mentionMatch[0].length;

messageInput.value =
before.slice(0,start) +
"@" +
member.user_id +
" " +
after;

const newCursor =
start +
member.user_id.length +
2;

messageInput.setSelectionRange(
newCursor,
newCursor
);

mentionList.classList.remove(
"show"
);

messageInput.focus();

}
);

mentionList.appendChild(
button
);

}

mentionList.classList.add(
"show"
);

}

   画像選択
========================= */

"click",
() => {

if(isCurrentUserMuted()){

alert(

);

}

imageInput.click();

);

imageInput.addEventListener(
"change",
async () => {

imageInput.files?.[0];

}

}

){

);

}

imageButton.disabled = true;

try{

file.name.split(".").pop()
?.toLowerCase() || "jpg";

const fileName =
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;

const path =
"group-" +
groupId +
"/" +
fileName;

const {error:uploadError} =
await supabaseClient.storage
.from("chat-images")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(uploadError){

console.error(
"画像アップロードエラー:",
uploadError
);

alert(
"画像のアップロードに失敗しました。\n\n" +
uploadError.message
);

return;
}

const {error:insertError} =
await supabaseClient
.from("group_messages")
.insert({
group_id:
Number(groupId),
sender_id:
currentUsername,
content:"",
image_url:
path
});

if(insertError){

console.error(
"画像メッセージ登録エラー:",
insertError
);

await supabaseClient.storage
.from("chat-images")
.remove([path]);

alert(
"画像を送信できませんでした。\n\n" +
insertError.message
);

return;
}

await loadMessages();

scrollToBottom(true);

}catch(error){

console.error(
"画像送信エラー:",
error
);

alert(
"画像の送信に失敗しました。\n\n" +
error.message
);

}finally{

imageInput.value = "";

if(!isCurrentUserMuted()){

sendButton.disabled = false;
imageButton.disabled = false;

}

}

}
);

/* =========================
   メッセージ送信
========================= */

async function sendMessage(){

if(isCurrentUserMuted()){

alert(
"🔇 現在発言禁止中のため、送信できません。"
);

return;
}

const text =
messageInput.value.trim();

if(!text){
return;
}

if(!currentUsername){

alert(
"ユーザー情報を取得できていません。"
);

return;
}

sendButton.disabled = true;

try{

/* 返信 */

if(replyingToMessage){

const target =
replyingToMessage;

const {error} =
await supabaseClient
.from("group_replies")
.insert({
group_message_id:
target.id,
sender_id:
currentUsername,
content:
text
});

if(error){

console.error(
"返信送信エラー:",
error
);

alert(
"返信を送信できませんでした。\n\n" +
error.message
);

return;
}

messageInput.value = "";

replyingToMessage = null;

replyArea.style.display =
"none";

messageInput.placeholder =
"メッセージを入力...";

mentionList.classList.remove(
"show"
);

await loadMessages();

scrollToBottom(true);

/* 通知は返信成功後に別処理 */

createReplyNotification(
target
);

return;
}

/* 通常メッセージ */

const {error} =
await supabaseClient
.from("group_messages")
.insert({
group_id:
Number(groupId),
sender_id:
currentUsername,
content:
text,
image_url:null
});

if(error){

console.error(
"メッセージ送信エラー:",
error
);

alert(
"メッセージを送信できませんでした。\n\n" +
error.message
);

return;
}

messageInput.value = "";

mentionList.classList.remove(
"show"
);

await loadMessages();

scrollToBottom(true);

}catch(error){

console.error(
"送信エラー:",
error
);

alert(
"送信に失敗しました。\n\n" +
error.message
);

}finally{

if(!isCurrentUserMuted()){

sendButton.disabled =
false;

}

}

}

message
){

if(

currentUsername

const {error} =
await supabaseClient
.from("notifications")
.insert({

type:
"group_reply",
title:
"グループチャット",
message:
"@" +
currentUsername +
" さんがあなたのメッセージに返信しました。",
link:
"group_chat.html?id=" +
groupId,
is_read:false
});

if(error){

console.error(
"返信通知エラー:",
error
);

}

}

/* =========================
   メンション通知
========================= */

async function createMentionNotifications(
text
){

if(!text){
return;
}

const matches =
text.match(
/@([A-Za-z0-9_]+)/g
);

if(!matches?.length){
return;
}

const usernames =
[
...new Set(
matches.map(
value =>
value.substring(1)
)
)
];

for(
const username of usernames
){

if(
username ===
currentUsername
){
continue;
}

if(
!groupMembersCache.some(
member =>
member.user_id ===
username
)
){
continue;
}

const {error} =
await supabaseClient
.from("notifications")
.insert({
user_id:
username,
type:
"group_mention",
title:
"メンションされました",
message:
"@" +
currentUsername +
" さんがグループであなたをメンションしました。",
link:
"group_chat.html?id=" +
groupId,
is_read:false
});

if(error){

console.error(
"メンション通知エラー:",
error
);

}

}

}

sendMessage
);

async function loadMembers(){

memberList.innerHTML =
'<div class="member-loading">読み込み中...</div>';

await getGroupMembers();

if(!members?.length){

memberList.innerHTML =
'<div class="member-empty">メンバーがいません。</div>';

return;
}

memberList.innerHTML = "";

const userIds =
members.map(
member =>
member.user_id
);

let presenceData = [];

const {data:presence,error} =
await supabaseClient
.from("user_presence")
.select(
"user_id,last_seen"
)
.in(
"user_id",
userIds
);

if(!error){

presenceData =
presence || [];

}

for(
const member of members
){

const profile =
await getProfile(
member.user_id
);

const presenceRow =
presenceData.find(
item =>
item.user_id ===
member.user_id
);

const row =
document.createElement("div");

row.className =
"member-item";

const icon =
document.createElement("div");

icon.className =
"member-icon";

if(profile?.avatar_url){

const img =
document.createElement("img");

img.src =
profile.avatar_url;

img.alt =
"";

icon.appendChild(img);

}else{

icon.textContent =
"👤";

}

row.appendChild(icon);

const info =
document.createElement("div");

info.className =
"member-info";

const name =
document.createElement("div");

name.className =
"member-name";

name.textContent =
profile?.name ||
member.user_id;

info.appendChild(name);

const id =
document.createElement("div");

id.className =
"member-id";

id.textContent =
"@" +
member.user_id;

info.appendChild(id);

const online =
document.createElement("div");

online.className =
"member-status " +
(
isOnline(
presenceRow?.last_seen
)
? "online"
: "offline"
);

online.textContent =
isOnline(
presenceRow?.last_seen
)
? "🟢 オンライン"
: "⚪ オフライン";

info.appendChild(online);

const lastOnline =
document.createElement("div");

lastOnline.className =
"last-online";

lastOnline.textContent =
isOnline(
presenceRow?.last_seen
)
? "最終オンライン：今"
: formatLastOnline(
presenceRow?.last_seen
);

info.appendChild(lastOnline);

/* 役割 */

const roleBadge =
document.createElement("div");

roleBadge.className =
"role-badge";

if(
member.user_id ===
groupOwnerId
){

roleBadge.classList.add(
"role-owner"
);

roleBadge.textContent =
"👑 管理者";

}else if(
member.role ===
"admin"
){

roleBadge.classList.add(
"role-admin"
);

roleBadge.textContent =
"🛡️ 副管理者";

}else{

roleBadge.classList.add(
"role-member"
);

roleBadge.textContent =
"👤 メンバー";

}

info.appendChild(
roleBadge
);

/* 発言禁止表示 */

const mute =
groupMutesCache.find(
item =>
item.user_id ===
member.user_id &&
new Date(
item.muted_until
).getTime() >
Date.now()
);

if(mute){

const muteStatus =
document.createElement("div");

muteStatus.className =
"member-mute-status";

muteStatus.textContent =
"🔇 発言禁止：あと " +
formatMuteRemaining(
mute.muted_until
);

info.appendChild(
muteStatus
);

}

/* =========================
   管理者専用操作
========================= */

if(
currentUsername ===
groupOwnerId &&
member.user_id !==
groupOwnerId
){

const roleControl =
document.createElement("select");

roleControl.className =
"role-control";

const memberOption =
document.createElement("option");

memberOption.value =
"member";

memberOption.textContent =
"👤 メンバー";

const adminOption =
document.createElement("option");

adminOption.value =
"admin";

adminOption.textContent =
"🛡️ 副管理者";

roleControl.appendChild(
memberOption
);

roleControl.appendChild(
adminOption
);

roleControl.value =
member.role ===
"admin"
? "admin"
: "member";

roleControl.addEventListener(
"change",
async () => {

await setDeputyAdmin(
member.user_id,
roleControl.value ===
"admin"
);

}
);

info.appendChild(
roleControl
);

/* 発言禁止 */

const muteControl =
document.createElement("select");

muteControl.className =
"mute-control";

const noMuteOption =
document.createElement("option");

noMuteOption.value =
"";

noMuteOption.textContent =
"🔊 発言禁止なし";

muteControl.appendChild(
noMuteOption
);

const muteOptions = [
["10","🔇 10分"],
["30","🔇 30分"],
["60","🔇 1時間"],
["180","🔇 3時間"],
["1440","🔇 1日"],
["10080","🔇 7日"]
];

for(
const [value,label]
of muteOptions
){

const option =
document.createElement("option");

option.value =
value;

option.textContent =
label;

muteControl.appendChild(
option
);

}

muteControl.addEventListener(
"change",
async () => {

const minutes =
Number(
muteControl.value
);

if(!minutes){
return;
}

muteControl.value = "";

await setMute(
member.user_id,
minutes
);

}
);

info.appendChild(
muteControl
);

if(mute){

const clearButton =
document.createElement("button");

clearButton.type =
"button";

clearButton.className =
"mute-clear-button";

clearButton.textContent =
"🔊 発言禁止を解除";

clearButton.addEventListener(
"click",
async () => {

await clearMute(
member.user_id
);

}
);

info.appendChild(
clearButton
);

}

}

row.appendChild(info);

memberList.appendChild(row);

}

}

/* =========================
   リアルタイム
========================= */

let realtimeChannel = null;

function setupRealtime(){

if(realtimeChannel){

supabaseClient.removeChannel(
realtimeChannel
);

realtimeChannel = null;

}

realtimeChannel =
supabaseClient
.channel(
"group-chat-" +
groupId
)

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"group_messages",
filter:
"group_id=eq." +
Number(groupId)
},
async payload => {

await loadMessages();

scrollToBottom(true);

}
)

.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"group_messages",
filter:
"group_id=eq." +
Number(groupId)
},
async payload => {

await loadMessages();

}
)

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"group_message_reads"
},
async payload => {

const row =
payload.new;

if(
String(row.group_message_id)
){

await loadMessages();

}

}
)

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"group_mutes",
filter:
"group_id=eq." +
Number(groupId)
},
async payload => {

await loadGroupMutes();

await loadMembers();

}
)

.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"group_mutes",
filter:
"group_id=eq." +
Number(groupId)
},
async payload => {

await loadGroupMutes();

await loadMembers();

}
)

.on(
"postgres_changes",
{
event:"DELETE",
schema:"public",
table:"group_mutes",
filter:
"group_id=eq." +
Number(groupId)
},
async payload => {

await loadGroupMutes();

await loadMembers();

}
)

.subscribe(
status => {

console.log(
"Realtime status:",
status
);

}
);

}

/* =========================
   開始
========================= */

async function start(){

if(!groupId){

document.body.innerHTML =
'<div style="padding:30px;text-align:center">グループIDがありません。</div>';

return;
}

const {
data:sessionData
} =
await supabaseClient.auth.getSession();

const session =
sessionData?.session;

if(!session){

window.location.href =
"index.html";

return;
}

currentUsername =
session.user
.user_metadata
?.username ||
"";

if(!currentUsername){

alert(
"ユーザー情報を取得できませんでした。"
);

window.location.href =
"index.html";

return;
}

await updateMyPresence();

await loadGroup();

await getGroupMembers();

await loadGroupMutes();

restartMuteTimer();

await loadMessages();

setupRealtime();

presenceTimer =
setInterval(
async () => {

await updateMyPresence();

},
30000
);

}

window.addEventListener(
"pagehide",
() => {

if(presenceTimer){

clearInterval(
presenceTimer
);

presenceTimer =
null;

}

if(muteTimer){

clearInterval(
muteTimer
);

muteTimer =
null;

}

if(realtimeChannel){

supabaseClient.removeChannel(
realtimeChannel
);

realtimeChannel =
null;

}

}
);

start();

</script>
