<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* =========================================================
   グループPush通知設定
   ========================================================= */
const PUSH_FUNCTION_NAME="send-push";

async function sendGroupPushNotification(userId,title,message){
  if(!userId||userId===currentUsername)return;
  try{
    const {data,error}=await supabaseClient.functions.invoke(PUSH_FUNCTION_NAME,{
      body:{
        username:userId,
        title:title,
        message:message,
        url:"group_chat.html?id="+encodeURIComponent(groupId)
      }
    });
    if(error)console.warn("グループPush通知エラー:",error);
    else if(data&&!data.ok)console.warn("グループPush通知失敗:",data);
  }catch(error){
    console.warn("グループPush通知呼び出しエラー:",error);
  }
}

async function createGroupMessageNotifications(messageText,messageId){
  try{
    const recipients=(groupMembersCache||[])
      .map(member=>member.user_id)
      .filter(username=>username&&username!==currentUsername);

    if(!recipients.length)return;

    const rows=recipients.map(username=>({
      user_id:username,
      type:"group_chat",
      title:"👥 グループに新しいメッセージ",
      message:currentUsername+"さん: "+messageText,
      link:"group_chat.html?id="+encodeURIComponent(groupId),
      is_read:false
    }));

    const {error}=await supabaseClient
      .from("notifications")
      .insert(rows);

    if(error){
      console.error("グループ通知レコード作成エラー:",error);
    }

    /* Pushは各メンバーへ送信 */
    await Promise.all(
      recipients.map(username=>
        sendGroupPushNotification(
          username,
          "👥 グループに新しいメッセージ",
          currentUsername+"さん: "+messageText
        )
      )
    );
  }catch(error){
    console.error("グループ通知作成エラー:",error);

async function sendMessage(){
const wasBanned=await checkFriendChatBan();
if(wasBanned)return;
if(currentMute){alert("現在、発言禁止中です");return}
const value=messageInput.value.trim();
if(!value)return;
sendButton.disabled=true;
try{
const replyTarget=replyingToMessage;
const {data,error}=await supabaseClient.from("group_messages").insert({group_id:Number(groupId),sender_id:currentUsername,content:value}).select("id,group_id,sender_id,content,image_url,created_at,is_deleted,edited_at").single();
if(error){console.error(error);alert("メッセージ送信に失敗しました\n\n"+error.message);return}
pendingLocalMessageIds.add(String(data.id));
messageInput.value="";
mentionList.classList.remove("show");
replyingToMessage=null;
replyArea.style.display="none";
if(replyTarget){
const {error:replyError}=await supabaseClient.from("group_replies").insert({group_message_id:data.id,sender_id:currentUsername,content:replyTarget.content||"画像"});
if(replyError)console.error("返信保存エラー:",replyError);
}

/* グループ全員へPush通知 */

const extras=await fetchMessageExtras([data]);
messages.appendChild(buildMessageElement(data,extras))
}
scrollToBottom()
}catch(error){console.error("送信エラー:",error)}
finally{sendButton.disabled=false}
}

async function sendMentionNotifications(text,messageId){
const mentioned=[],regex=/@([a-zA-Z0-9_\-]+)/g;
let match;
while((match=regex.exec(text))){
const username=match[1];
if(username!==currentUsername&&groupMembersCache.some(member=>member.user_id===username)&&!mentioned.includes(username))mentioned.push(username)
}
if(!mentioned.length)return;
const rows=mentioned.map(username=>({user_id:username,type:"mention",title:"グループでメンションされました",message:currentUsername+"さんがあなたをメンションしました",link:"group_chat.html?id="+encodeURIComponent(groupId),is_read:false}));
const {error}=await supabaseClient.from("notifications").insert(rows);
if(error)console.error("メンション通知エラー:",error)
}

async function loadMembers(){memberList.innerHTML='<div class="member-loading">読み込み中...</div>';const {data:members,error}=await supabaseClient.from("group_members").select("id,group_id,user_id,role,created_at").eq("group_id",groupId).order("created_at",{ascending:true});if(error){console.error(error);memberList.innerHTML='<div class="member-empty">メンバーを読み込めませんでした</div>';return}if(!members?.length){memberList.innerHTML='<div class="member-empty">メンバーがいません</div>';return}const usernames=members.map(member=>member.user_id),{data:presenceData}=await supabaseClient.from("user_presence").select("user_id,last_seen").in("user_id",usernames),presenceMap={};(presenceData||[]).forEach(item=>{presenceMap[item.user_id]=item.last_seen});await getProfiles(usernames);await getItems(usernames.map(username=>profileCache[username]?.equipped_item_key));const fragment=document.createDocumentFragment();members.forEach(member=>{const profile=profileCache[member.user_id]||null,item=profile?.equipped_item_key?itemCache[profile.equipped_item_key]:null,itemElement=document.createElement("div");itemElement.className="member-item";const iconFrame=document.createElement("div");iconFrame.className="member-icon-frame";const frameClass=getFrameClass(profile?.equipped_item_key,member.user_id);if(frameClass)iconFrame.classList.add(frameClass);else iconFrame.style.background=item?.frame_color||"#eee8ff";const icon=document.createElement("div");icon.className="member-icon";if(profile?.avatar_url){const img=document.createElement("img");img.src=profile.avatar_url;img.alt="プロフィール画像";icon.appendChild(img)}else icon.textContent="👤";iconFrame.appendChild(icon);if(item?.icon){const badge=document.createElement("div");badge.className="member-icon-badge show";badge.textContent=item.icon;badge.style.border="2px solid "+(item.frame_color||"#eee8ff");iconFrame.appendChild(badge)}itemElement.appendChild(iconFrame);const info=document.createElement("div");info.className="member-info";const name=document.createElement("div");name.className="member-name";applyDecoratedName(name,profile,member.user_id);info.appendChild(name);const id=document.createElement("div");id.className="member-id";id.textContent="@"+member.user_id;info.appendChild(id);const lastSeen=presenceMap[member.user_id],online=isOnline(lastSeen),status=document.createElement("div");status.className="member-status "+(online?"online":"offline");status.textContent=online?"● オンライン":"● オフライン";info.appendChild(status);if(!online){const last=document.createElement("div");last.className="last-online";last.textContent=formatLastOnline(lastSeen);info.appendChild(last)}const roleBadge=document.createElement("div");roleBadge.className="role-badge";if(member.user_id===groupOwnerId){roleBadge.classList.add("role-owner");roleBadge.textContent="👑 オーナー"}else if(member.role==="admin"){roleBadge.classList.add("role-admin");roleBadge.textContent="🛡️ 副管理者"}else{roleBadge.classList.add("role-member");roleBadge.textContent="メンバー"}info.appendChild(roleBadge);const mute=groupMutesCache.find(m=>m.user_id===member.user_id&&new Date(m.muted_until).getTime()>Date.now());if(mute){const muteStatus=document.createElement("div");muteStatus.className="member-mute-status";muteStatus.textContent="🔇 発言禁止中";info.appendChild(muteStatus)}if(currentUsername===groupOwnerId&&member.user_id!==groupOwnerId){const roleControl=document.createElement("select");roleControl.className="role-control";const memberOption=document.createElement("option");memberOption.value="member";memberOption.textContent="通常メンバー";const adminOption=document.createElement("option");adminOption.value="admin";adminOption.textContent="副管理者";roleControl.appendChild(memberOption);roleControl.appendChild(adminOption);roleControl.value=member.role==="admin"?"admin":"member";roleControl.addEventListener("change",async()=>{await setDeputyAdmin(member.user_id,roleControl.value==="admin")});info.appendChild(roleControl)}if(isGroupAdmin&&member.user_id!==currentUsername&&member.user_id!==groupOwnerId){const muteControl=document.createElement("input");muteControl.type="number";muteControl.min="1";muteControl.placeholder="発言禁止（分）";muteControl.className="mute-control";info.appendChild(muteControl);const muteButton=document.createElement("button");muteButton.type="button";muteButton.className="mute-control";muteButton.textContent="🔇 発言禁止";muteButton.addEventListener("click",async()=>{await setMute(member.user_id,muteControl.value)});info.appendChild(muteButton);if(mute){const clearButton=document.createElement("button");clearButton.type="button";clearButton.className="mute-clear-button";clearButton.textContent="🔊 発言禁止を解除";clearButton.addEventListener("click",async()=>{await clearMute(member.user_id)});info.appendChild(clearButton)}}
const canKick=isGroupAdmin&&member.user_id!==currentUsername&&member.user_id!==groupOwnerId&&(currentGroupRole!=="admin"||member.role!=="admin");
if(canKick){const kickButton=document.createElement("button");kickButton.type="button";kickButton.className="mute-clear-button";kickButton.style.background="#fff0f0";kickButton.style.color="#d9534f";kickButton.textContent="🚪 グループから蹴る";kickButton.addEventListener("click",async()=>{await kickGroupMember(member.user_id)});info.appendChild(kickButton)}itemElement.appendChild(info);fragment.appendChild(itemElement)});memberList.innerHTML="";memberList.appendChild(fragment)}
async function leaveGroup(){
  if(currentUsername===groupOwnerId){
    alert("グループのオーナーはこの操作では抜けられません。\nグループを終了する場合は「🗑️ 削除」を使ってください。");
    return;
  }
  if(!confirm("このグループを抜けますか？"))return;
  const {error}=await supabaseClient.rpc("group_leave",{target_group_id:Number(groupId)});
  if(error){
    console.error("グループ退出エラー:",error);
    alert("グループから抜けられませんでした。\n\n"+error.message);
    return;
  }
  if(groupRealtimeChannel){
    await supabaseClient.removeChannel(groupRealtimeChannel);
    groupRealtimeChannel=null;
  }
  if(groupTypingChannel){
    await supabaseClient.removeChannel(groupTypingChannel);
    groupTypingChannel=null;
  }
  alert("グループから退出しました。");
  location.href="groups.html";
}

async function kickGroupMember(username){
  if(!isGroupAdmin)return;
  if(!username||username===currentUsername||username===groupOwnerId)return;
  const target=groupMembersCache.find(member=>member.user_id===username);
  if(!target)return;
  if(currentGroupRole==="admin"&&target.role==="admin"){
    alert("副管理者は別の副管理者を退出させられません。");
    return;
  }
  if(!confirm(username+"さんをグループから退出させますか？"))return;
  const {error}=await supabaseClient.rpc("group_kick_member",{
    target_group_id:Number(groupId),
    target_username:username
  });
  if(error){
    console.error("グループ退出処理エラー:",error);
    alert("メンバーを退出させられませんでした。\n\n"+error.message);
    return;
  }
  await loadGroupMembers();
  await loadMembers();
}

function setupRealtime(){const channel=supabaseClient.channel("group-chat-"+groupId);channel.on("postgres_changes",{event:"INSERT",schema:"public",table:"group_messages",filter:"group_id=eq."+groupId},payload=>{realtimeQueue=realtimeQueue.then(async()=>{const message=payload.new;const messageId=String(message.id);if(pendingLocalMessageIds.has(messageId)){pendingLocalMessageIds.delete(messageId);return}if(messages.querySelector(`[data-message-id="${message.id}"]`))return;const wasBottom=isNearBottom(),extras=await fetchMessageExtras([message]);messages.appendChild(buildMessageElement(message,extras));if(wasBottom)scrollToBottom();void markMessagesRead(message.sender_id!==currentUsername?[message.id]:[])}).catch(error=>console.error("Realtime INSERT処理エラー:",error))});channel.on("postgres_changes",{event:"UPDATE",schema:"public",table:"group_messages",filter:"group_id=eq."+groupId},payload=>{realtimeQueue=realtimeQueue.then(async()=>{const message=payload.new,old=messages.querySelector(`[data-message-id="${message.id}"]`);if(!old){await loadMessages();return}const extras=await fetchMessageExtras([message]);old.replaceWith(buildMessageElement(message,extras));await loadGroupReadCounts()}).catch(error=>console.error("Realtime UPDATE処理エラー:",error))});channel.on("postgres_changes",{event:"INSERT",schema:"public",table:"group_message_reads"},()=>{scheduleReadRefresh()});channel.on("postgres_changes",{event:"UPDATE",schema:"public",table:"group_message_reads"},()=>{scheduleReadRefresh()});channel.on("postgres_changes",{event:"INSERT",schema:"public",table:"group_mutes",filter:"group_id=eq."+groupId},async()=>{await loadGroupMutes()});channel.on("postgres_changes",{event:"UPDATE",schema:"public",table:"group_mutes",filter:"group_id=eq."+groupId},async()=>{await loadGroupMutes()});channel.on("postgres_changes",{event:"DELETE",schema:"public",table:"group_mutes",filter:"group_id=eq."+groupId},async()=>{await loadGroupMutes()});channel.subscribe()}
async function start(){const wasBanned=await checkFriendChatBan();if(wasBanned)return;if(!groupId){groupName.textContent="グループIDがありません";return}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="index.html";return}currentUsername=session.user.user_metadata?.username||"";if(!currentUsername){alert("ログイン情報が取得できませんでした");location.href="index.html";return}await Promise.all([updateMyPresence(),loadGroup()]);await loadGroupMembers();await loadGroupMutes();await loadMessages();setupRealtime();if(presenceTimer)clearInterval(presenceTimer);presenceTimer=setInterval(updateMyPresence,30000)}

async function reportGroupMessage(message){
 if(!message?.sender_id||message.sender_id===currentUsername)return;
 const reason=prompt("このメッセージを通報する理由を入力してください", "暴言・不適切な内容");
 if(reason===null||!reason.trim())return;
 const {error}=await supabaseClient.from("user_reports").insert({
  reporter_id:currentUsername,
  target_type:"group_message",
  target_id:String(message.id),
  target_user:message.sender_id,
  reason:reason.trim(),
  message_id:String(message.id),
  message_content:message.content||"",
  message_image_url:message.image_url||""
 });
 if(error){alert("通報に失敗しました。\n\n"+error.message);return}
 alert("🚨 通報を送信しました。管理者が確認します。");
}
