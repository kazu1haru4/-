<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>予定</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: linear-gradient(135deg, #fff4fb, #eef7ff);
      color: #333;
    }

    .container {
      width: min(92%, 500px);
      max-width: 100%;
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
    }

    .back {
      border: none;
      background: white;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      white-space: nowrap;
    }

    .add-button {
      width: 100%;
      max-width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .form {
      display: none;
      width: 100%;
      max-width: 100%;
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .form.show {
      display: block;
    }

    label {
      display: block;
      margin-top: 13px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }

    input[type="date"],
    input[type="time"] {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 46px;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .friend-list {
      display: none;
      width: 100%;
      max-width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #f8f7ff;
      border-radius: 14px;
    }

    .friend-list.show {
      display: block;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #e7e5f5;
    }

    .friend-item:last-child {
      border-bottom: none;
    }

    .friend-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      min-width: 20px;
      margin: 0;
      padding: 0;
      flex-shrink: 0;
      -webkit-appearance: auto;
      appearance: auto;
    }

    .friend-name {
      font-weight: bold;
      font-size: 14px;
    }

    .friend-id {
      color: #999;
      font-size: 12px;
      margin-left: 4px;
    }

    .no-friends {
      color: #888;
      text-align: center;
      padding: 12px;
      font-size: 13px;
    }

    .save-button {
      width: 100%;
      max-width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px;
      background: #ff82b2;
      color: white;
      font-size: 15px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .cancel-button {
      width: 100%;
      max-width: 100%;
      border: none;
      background: #f1f1f1;
      border-radius: 14px;
      padding: 12px;
      margin-top: 9px;
      cursor: pointer;
    }

    .schedule {
      width: 100%;
      max-width: 100%;
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .schedule-date {
      color: #8f7cff;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .schedule-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .schedule-info {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .visibility {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 10px;
      background: #f0edff;
      color: #6557c9;
      font-size: 12px;
      font-weight: bold;
    }

    .delete-button {
      border: none;
      background: #ffecec;
      color: #e05252;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 12px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 40px 10px;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 30px;
    }

    @media (max-width: 380px) {
      .container {
        width: 94%;
      }

      .form {
        padding: 16px;
      }

      h1 {
        font-size: 22px;
      }

      .back {
        padding: 9px 11px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <button
      class="back"
      id="backButton"
      type="button"
    >
      ← ホーム
    </button>

    <h1>📅 予定</h1>

    <div style="width:78px;"></div>

  </div>


  <button
    class="add-button"
    id="addButton"
    type="button"
  >
    ＋ 新しい予定
  </button>


  <div
    class="form"
    id="form"
  >

    <label>予定名</label>

    <input
      type="text"
      id="title"
      placeholder="例：友達と遊ぶ"
    >


    <label>日付</label>

    <input
      type="date"
      id="date"
    >


    <label>時間</label>

    <input
      type="time"
      id="time"
    >


    <label>場所</label>

    <input
      type="text"
      id="place"
      placeholder="例：渋谷駅"
    >


    <label>メモ</label>

    <textarea
      id="memo"
      placeholder="予定についてのメモ"
    ></textarea>


    <label>誰に見せる？</label>

    <select id="visibility">

      <option value="private">
        🔒 自分だけ
      </option>

      <option value="friend">
        👤 フレンドに見せる
      </option>

    </select>


    <div
      class="friend-list"
      id="friendList"
    ></div>


    <button
      class="save-button"
      id="saveButton"
      type="button"
    >
      💾 予定を保存
    </button>


    <button
      class="cancel-button"
      id="cancelButton"
      type="button"
    >
      キャンセル
    </button>

  </div>


  <div id="scheduleList">

    <div class="loading">
      予定を読み込んでいます…
    </div>

  </div>

</div>


<script>

  // =========================
  // Supabase
  // =========================

  const SUPABASE_URL =
    "https://yxonmqdyekwenyzekjwj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // 変数
  // =========================

  let currentUsername = "";

  let friendsData = [];


  // =========================
  // DOM
  // =========================

  const form =
    document.getElementById("form");

  const addButton =
    document.getElementById("addButton");

  const cancelButton =
    document.getElementById("cancelButton");

  const saveButton =
    document.getElementById("saveButton");

  const scheduleList =
    document.getElementById("scheduleList");

  const friendList =
    document.getElementById("friendList");

  const visibility =
    document.getElementById("visibility");

  const titleInput =
    document.getElementById("title");

  const dateInput =
    document.getElementById("date");

  const timeInput =
    document.getElementById("time");

  const placeInput =
    document.getElementById("place");

  const memoInput =
    document.getElementById("memo");


  // =========================
  // ホーム
  // =========================

  document
    .getElementById("backButton")
    .addEventListener(
      "click",
      function() {

        window.location.href =
          "home.html";

      }
    );


  // =========================
  // 新しい予定
  // =========================

  addButton.addEventListener(
    "click",
    async function() {

      form.classList.add("show");


      if (!dateInput.value) {

        const today =
          new Date();

        const yyyy =
          today.getFullYear();

        const mm =
          String(
            today.getMonth() + 1
          ).padStart(2, "0");

        const dd =
          String(
            today.getDate()
          ).padStart(2, "0");

        dateInput.value =
          `${yyyy}-${mm}-${dd}`;

      }


      await loadFriends();

      titleInput.focus();

    }
  );


  // =========================
  // 公開設定
  // =========================

  visibility.addEventListener(
    "change",
    async function() {

      if (
        visibility.value === "friend"
      ) {

        friendList.classList.add(
          "show"
        );

        await loadFriends();

        await renderFriends();

      } else {

        friendList.classList.remove(
          "show"
        );

      }

    }
  );


  // =========================
  // キャンセル
  // =========================

  cancelButton.addEventListener(
    "click",
    function() {

      closeForm();

    }
  );


  function closeForm() {

    form.classList.remove(
      "show"
    );

    titleInput.value = "";

    dateInput.value = "";

    timeInput.value = "";

    placeInput.value = "";

    memoInput.value = "";

    visibility.value =
      "private";

    friendList.classList.remove(
      "show"
    );

    friendList.innerHTML = "";

  }


  // =========================
  // ログインユーザー取得
  // =========================

  async function getCurrentUser() {

    const {
      data: {
        session
      },
      error
    } =
      await supabaseClient.auth.getSession();


    if (
      error ||
      !session
    ) {

      window.location.href =
        "index.html";

      return false;

    }


    currentUsername =
      session.user
        .user_metadata
        ?.username || "";


    if (!currentUsername) {

      alert(
        "ユーザー情報を取得できませんでした。"
      );

      return false;

    }


    return true;

  }


  // =========================
  // フレンド取得
  // =========================

  async function loadFriends() {

    friendList.innerHTML =
      '<div class="loading">フレンドを読み込んでいます…</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("friends")
        .select("friend_id")
        .eq(
          "user_id",
          currentUsername
        );


    if (error) {

      console.error(
        "フレンド取得エラー:",
        error
      );

      friendsData = [];

      friendList.innerHTML =
        '<div class="no-friends">フレンドを読み込めませんでした。</div>';

      return;

    }


    friendsData =
      data || [];


    if (
      visibility.value === "friend"
    ) {

      await renderFriends();

    }

  }


  // =========================
  // フレンド表示
  // =========================

  async function renderFriends() {

    if (
      visibility.value !== "friend"
    ) {

      return;

    }


    if (
      !friendsData.length
    ) {

      friendList.innerHTML =
        '<div class="no-friends">まだフレンドがいません。</div>';

      return;

    }


    const ids =
      friendsData.map(
        friend =>
          friend.friend_id
      );


    const {
      data: profiles,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "user_id, name, avatar_url"
        )
        .in(
          "user_id",
          ids
        );


    if (error) {

      console.error(
        "プロフィール取得エラー:",
        error
      );

      friendList.innerHTML =
        '<div class="no-friends">フレンド情報を取得できませんでした。</div>';

      return;

    }


    const profileMap = {};


    (profiles || []).forEach(
      profile => {

        profileMap[
          profile.user_id
        ] = profile;

      }
    );


    friendList.innerHTML = "";


    friendsData.forEach(
      friend => {

        const id =
          friend.friend_id;

        const profile =
          profileMap[id];


        const label =
          document.createElement(
            "label"
          );

        label.className =
          "friend-item";


        const checkbox =
          document.createElement(
            "input"
          );

        checkbox.type =
          "checkbox";

        checkbox.value =
          id;

        checkbox.className =
          "friend-checkbox";


        const text =
          document.createElement(
            "div"
          );


        const name =
          profile &&
          profile.name
            ? profile.name
            : id;


        text.innerHTML =
          `
          <span class="friend-name">
            ${escapeHtml(name)}
          </span>

          <span class="friend-id">
            @${escapeHtml(id)}
          </span>
          `;


        label.appendChild(
          checkbox
        );

        label.appendChild(
          text
        );

        friendList.appendChild(
          label
        );

      }
    );

  }


  // =========================
  // 予定一覧
  // =========================

  async function loadSchedules() {

    scheduleList.innerHTML =
      '<div class="loading">予定を読み込んでいます…</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("schedules")
        .select("*")
        .order(
          "date",
          {
            ascending: true
          }
        )
        .order(
          "time",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "予定取得エラー:",
        error
      );

      scheduleList.innerHTML =
        `
        <div class="empty">
          予定を読み込めませんでした。
          <br><br>
          ${escapeHtml(error.message)}
        </div>
        `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      scheduleList.innerHTML =
        '<div class="empty">📅 まだ予定はありません</div>';

      return;

    }


    scheduleList.innerHTML = "";


    data.forEach(
      schedule => {

        const element =
          document.createElement(
            "div"
          );

        element.className =
          "schedule";


        const dateText =
          formatDate(
            schedule.date
          );


        let info = "";


        if (schedule.time) {

          info +=
            `⏰ ${schedule.time.slice(0, 5)}<br>`;

        }


        if (schedule.place) {

          info +=
            `📍 ${escapeHtml(schedule.place)}<br>`;

        }


        if (schedule.memo) {

          info +=
            `📝 ${escapeHtml(schedule.memo)
              .replace(/\n/g, "<br>")}`;

        }


        const visibilityText =
          schedule.visibility === "friend"
            ? "👤 フレンドに公開"
            : "🔒 自分だけ";


        element.innerHTML =
          `
          <div class="schedule-date">
            📅 ${dateText}
          </div>

          <div class="schedule-title">
            ${escapeHtml(schedule.title)}
          </div>

          <div class="schedule-info">
            ${info || "詳細はありません"}
          </div>

          <div class="visibility">
            ${visibilityText}
          </div>

          ${
            schedule.user_id === currentUsername
              ? `
                <br>

                <button
                  class="delete-button"
                  type="button"
                >
                  🗑️ 削除
                </button>
              `
              : ""
          }
          `;


        const deleteButton =
          element.querySelector(
            ".delete-button"
          );


        if (deleteButton) {

          deleteButton.addEventListener(
            "click",
            function() {

              deleteSchedule(
                schedule.id
              );

            }
          );

        }


        scheduleList.appendChild(
          element
        );

      }
    );

  }


  // =========================
  // 保存ボタン
  // =========================

  saveButton.addEventListener(
    "click",
    async function() {

      await saveSchedule();

    }
  );


  // =========================
  // 予定保存
  // =========================

  async function saveSchedule() {

    const title =
      titleInput.value.trim();

    const date =
      dateInput.value;

    const time =
      timeInput.value || null;

    const place =
      placeInput.value.trim() || null;

    const memo =
      memoInput.value.trim() || null;


    const selectedFriends =
      Array.from(
        document.querySelectorAll(
          ".friend-checkbox:checked"
        )
      ).map(
        checkbox =>
          checkbox.value
      );


    console.log(
      "予定保存時の通知対象:",
      selectedFriends
    );


    if (!title) {

      alert(
        "予定名を入力してください。"
      );

      titleInput.focus();

      return;

    }


    if (!date) {

      alert(
        "日付を選択してください。"
      );

      dateInput.focus();

      return;

    }


    if (
      visibility.value === "friend" &&
      selectedFriends.length === 0
    ) {

      alert(
        "見せるフレンドを1人以上選択してください。"
      );

      return;

    }


    saveButton.disabled =
      true;

    saveButton.textContent =
      "保存中…";


    try {

      // =======================
      // 予定本体
      // =======================

      const {
        data: schedule,
        error
      } =
        await supabaseClient
          .from("schedules")
          .insert({

            user_id:
              currentUsername,

            title:
              title,

            date:
              date,

            time:
              time,

            place:
              place,

            memo:
              memo,

            visibility:
              visibility.value

          })
          .select()
          .single();


      if (error) {

        console.error(
          "予定保存エラー:",
          error
        );

        alert(
          "予定を保存できませんでした。\n\n" +
          error.message
        );

        return;

      }


      // =======================
      // フレンド共有
      // =======================

      if (
        visibility.value === "friend" &&
        selectedFriends.length > 0
      ) {

        const rows =
          selectedFriends.map(
            userId => ({

              schedule_id:
                schedule.id,

              user_id:
                userId

            })
          );


        const {
          error: shareError
        } =
          await supabaseClient
            .from("schedule_shares")
            .insert(rows);


        if (shareError) {

          console.error(
            "予定共有設定エラー:",
            shareError
          );


          await supabaseClient
            .from("schedules")
            .delete()
            .eq(
              "id",
              schedule.id
            )
            .eq(
              "user_id",
              currentUsername
            );


          alert(
            "予定の共有設定に失敗しました。\n\n" +
            shareError.message
          );

          return;

        }


        // =======================
        // 通知作成
        // =======================

        let notificationSuccessCount = 0;

        let notificationErrorMessages = [];


        for (
          const userId
          of selectedFriends
        ) {

          console.log(
            "通知送信開始:",
            userId
          );


          const {
            data: notificationData,
            error: notificationError
          } =
            await supabaseClient
              .from("notifications")
              .insert({

                user_id:
                  userId,

                type:
                  "schedule",

                title:
                  "📅 予定が共有されました",

                message:
                  `「${title}」があなたに共有されました。`,

                link:
                  "schedule.html",

                is_read:
                  false

              })
              .select();


          if (notificationError) {

            console.error(
              "予定共有通知エラー:",
              notificationError
            );

            notificationErrorMessages.push(
              `${userId}: ${notificationError.message}`
            );

          } else {

            console.log(
              "通知作成成功:",
              notificationData
            );

            notificationSuccessCount++;

          }

        }


        // =======================
        // 通知結果
        // =======================

        if (
          notificationErrorMessages.length > 0
        ) {

          alert(
            "予定は保存されましたが、通知の作成に失敗しました。\n\n" +
            notificationErrorMessages.join("\n")
          );

        } else {

          console.log(
            `通知作成完了: ${notificationSuccessCount}件`
          );

        }

      }


      // =======================
      // 完了
      // =======================

      if (
        visibility.value === "friend" &&
        selectedFriends.length > 0
      ) {

        alert(
          "予定を保存しました！📅\n\n" +
          "フレンドへの通知も送信しました 🔔"
        );

      } else {

        alert(
          "予定を保存しました！📅"
        );

      }


      closeForm();

      await loadSchedules();

    } catch (error) {

      console.error(
        "予定保存中のエラー:",
        error
      );

      alert(
        "予定を保存できませんでした。\n\n" +
        (error.message || error)
      );

    } finally {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "💾 予定を保存";

    }

  }


  // =========================
  // 予定削除
  // =========================

  async function deleteSchedule(
    id
  ) {

    const confirmed =
      window.confirm(
        "この予定を削除しますか？"
      );


    if (!confirmed) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("schedules")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentUsername
        );


    if (error) {

      console.error(
        "予定削除エラー:",
        error
      );

      alert(
        "予定を削除できませんでした。\n\n" +
        error.message
      );

      return;

    }


    await loadSchedules();

  }


  // =========================
  // 日付表示
  // =========================

  function formatDate(
    dateString
  ) {

    if (!dateString) {

      return "";

    }


    const parts =
      dateString.split("-");


    if (
      parts.length !== 3
    ) {

      return dateString;

    }


    const year =
      Number(parts[0]);

    const month =
      Number(parts[1]);

    const day =
      Number(parts[2]);


    const date =
      new Date(
        Date.UTC(
          year,
          month - 1,
          day
        )
      );


    const week = [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];


    return (
      `${year}年${month}月${day}日` +
      `（${week[date.getUTCDay()]}）`
    );

  }


  // =========================
  // HTMLエスケープ
  // =========================

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =========================
  // 開始
  // =========================

  async function start() {

    const ok =
      await getCurrentUser();


    if (!ok) {

      return;

    }


    await loadSchedules();

  }


  start();

</script>
