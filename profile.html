<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: linear-gradient(135deg, #fff4fb, #eef7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .home-button {
      position: fixed;
      top: 15px;
      left: 15px;
      width: auto;
      margin: 0;
      padding: 10px 15px;
      border-radius: 14px;
      background: white;
      color: #6556d8;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    /* =========================
       プロフィール画像
    ========================= */

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffe2f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 55px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================
       交換アイテム
    ========================= */

    .items-title {
      text-align: center;
      margin-top: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #777;
    }

    .profile-items {
      min-height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .profile-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 14px;
      background: #f7f5ff;
      color: #5e50c9;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #e8e3ff;
    }

    .profile-item-icon {
      font-size: 20px;
    }

    .no-items {
      color: #aaa;
      font-size: 13px;
    }

    /* =========================
       画像選択
    ========================= */

    .image-button {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #eeeaff;
      color: #6556d8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #avatarFile {
      display: none;
    }

    /* =========================
       入力
    ========================= */

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9b8cff;
    }

    /* =========================
       保存ボタン
    ========================= */

    button.save-button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       メッセージ
    ========================= */

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #666;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <a href="home.html" class="home-button">
    🏠 ホーム
  </a>

  <div class="container">

    <h1>👤 プロフィール</h1>


    <!-- =========================
         プロフィール画像
    ========================= -->

    <div
      class="avatar"
      id="avatarPreview"
    >
      😊
    </div>


    <!-- =========================
         交換アイテム
    ========================= -->

    <div class="items-title">
      🎁 交換したアイテム
    </div>

    <div
      class="profile-items"
      id="profileItems"
    >
      <div class="no-items">
        読み込み中…
      </div>
    </div>


    <!-- =========================
         画像選択
    ========================= -->

    <label
      for="avatarFile"
      class="image-button"
    >
      📷 アイコン画像を選ぶ
    </label>

    <input
      id="avatarFile"
      type="file"
      accept="image/*"
    >


    <!-- =========================
         名前
    ========================= -->

    <label for="name">
      名前
    </label>

    <input
      id="name"
      type="text"
      placeholder="表示する名前"
      maxlength="30"
    >


    <!-- =========================
         自己紹介
    ========================= -->

    <label for="bio">
      自己紹介
    </label>

    <textarea
      id="bio"
      placeholder="自己紹介を書こう！"
      maxlength="200"
    ></textarea>


    <!-- =========================
         保存
    ========================= -->

    <button
      type="button"
      class="save-button"
      id="saveButton"
      onclick="saveProfile()"
    >
      プロフィールを保存
    </button>


    <div id="message"></div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================
       Supabase
    ========================= */

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let selectedFile = null;


    /* =========================
       メッセージ
    ========================= */

    function showMessage(text) {

      document
        .getElementById("message")
        .textContent = text;

    }


    /* =========================
       画像選択
    ========================= */

    document
      .getElementById("avatarFile")
      .addEventListener(
        "change",
        function(event) {

          const file =
            event.target.files[0];

          if (!file) {
            return;
          }


          /* 画像かチェック */

          if (
            !file.type.startsWith("image/")
          ) {

            showMessage(
              "画像ファイルを選んでね！"
            );

            return;
          }


          /* サイズチェック */

          if (
            file.size >
            5 * 1024 * 1024
          ) {

            showMessage(
              "画像は5MB以下にしてね！"
            );

            return;
          }


          selectedFile = file;


          /* プレビュー */

          const imageUrl =
            URL.createObjectURL(file);

          document
            .getElementById("avatarPreview")
            .innerHTML =
              `<img src="${imageUrl}" alt="アイコン">`;


          showMessage(
            "画像を選択したよ！"
          );

        }
      );


    /* =========================
       ログインユーザー取得
    ========================= */

    async function getCurrentUsername() {

      const {
        data: { user },
        error
      } =
        await supabaseClient.auth.getUser();


      if (
        error ||
        !user
      ) {

        return null;
      }


      const username =
        user.user_metadata?.username;


      if (!username) {

        return null;
      }


      return {
        user,
        username
      };

    }


    /* =========================
       プロフィール読み込み
    ========================= */

    async function loadProfile() {

      showMessage(
        "読み込み中…"
      );


      const current =
        await getCurrentUsername();


      if (!current) {

        showMessage(
          "ログインしてください。"
        );

        return;
      }


      const username =
        current.username;


      /* =========================
         profiles取得
      ========================= */

      const {
        data: profile,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "user_id",
            username
          )
          .maybeSingle();


      if (error) {

        console.error(
          "PROFILE LOAD ERROR:",
          error
        );

        showMessage(
          "プロフィールを読み込めませんでした。"
        );

        return;
      }


      if (!profile) {

        showMessage(
          "プロフィールがまだありません。"
        );

      } else {

        /* 名前 */

        document
          .getElementById("name")
          .value =
            profile.name ||
            username;


        /* 自己紹介 */

        document
          .getElementById("bio")
          .value =
            profile.bio || "";


        /* プロフィール画像 */

        if (
          profile.avatar_url
        ) {

          document
            .getElementById(
              "avatarPreview"
            )
            .innerHTML =
              `<img src="${profile.avatar_url}" alt="プロフィール画像">`;

        }

      }


      /* =========================
         交換アイテム読み込み
      ========================= */

      await loadProfileItems(
        username
      );


      showMessage("");

    }


    /* =========================
       交換アイテム読み込み
    ========================= */

    async function loadProfileItems(
      username
    ) {

      const container =
        document.getElementById(
          "profileItems"
        );


      container.innerHTML =
        `<div class="no-items">読み込み中…</div>`;


      /*
        user_coin_items と
        coin_items を取得
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("user_coin_items")
          .select(
            `
              item_key,
              coin_items (
                name,
                icon
              )
            `
          )
          .eq(
            "user_id",
            username
          );


      if (error) {

        console.error(
          "ITEM LOAD ERROR:",
          error
        );

        container.innerHTML =
          `<div class="no-items">
            アイテムを読み込めませんでした
          </div>`;

        return;
      }


      if (
        !data ||
        data.length === 0
      ) {

        container.innerHTML =
          `<div class="no-items">
            まだ交換したアイテムはありません
          </div>`;

        return;
      }


      /* =========================
         アイテム表示
      ========================= */

      container.innerHTML =
        data
          .map(
            item => {

              const itemInfo =
                item.coin_items;


              if (!itemInfo) {
                return "";
              }


              return `
                <div
                  class="profile-item"
                  title="${escapeHtml(itemInfo.name)}"
                >

                  <span
                    class="profile-item-icon"
                  >
                    ${itemInfo.icon}
                  </span>

                  <span>
                    ${escapeHtml(itemInfo.name)}
                  </span>

                </div>
              `;

            }
          )
          .join("");

    }


    /* =========================
       HTML安全化
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       プロフィール保存
    ========================= */

    async function saveProfile() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const bio =
        document
          .getElementById("bio")
          .value
          .trim();


      const message =
        document.getElementById(
          "message"
        );


      const saveButton =
        document.getElementById(
          "saveButton"
        );


      /* 名前チェック */

      if (!name) {

        message.textContent =
          "名前を入力してね！";

        return;
      }


      /* ログインユーザー */

      const current =
        await getCurrentUsername();


      if (!current) {

        message.textContent =
          "ログイン情報を取得できませんでした。";

        return;
      }


      const user =
        current.user;

      const username =
        current.username;


      saveButton.disabled =
        true;


      message.textContent =
        "保存中…";


      let avatarUrl =
        null;


      /* =========================
         画像アップロード
      ========================= */

      if (selectedFile) {

        const fileExt =
          selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `${user.id}/${Date.now()}.${fileExt}`;


        const {
          error: uploadError
        } =
          await supabaseClient.storage
            .from("avatars")
            .upload(
              fileName,
              selectedFile,
              {
                upsert: true,
                contentType:
                  selectedFile.type
              }
            );


        if (uploadError) {

          console.error(
            "UPLOAD ERROR:",
            uploadError
          );

          message.textContent =
            "画像アップロードに失敗しました。";

          saveButton.disabled =
            false;

          return;
        }


        /* 公開URL */

        const {
          data: publicData
        } =
          supabaseClient.storage
            .from("avatars")
            .getPublicUrl(
              fileName
            );


        avatarUrl =
          publicData.publicUrl;

      }


      /* =========================
         更新データ
      ========================= */

      const updateData = {

        name: name,

        bio: bio

      };


      if (avatarUrl) {

        updateData.avatar_url =
          avatarUrl;

      }


      /* =========================
         profiles更新
      ========================= */

      const {
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .update(
            updateData
          )
          .eq(
            "user_id",
            username
          );


      if (profileError) {

        console.error(
          "PROFILE ERROR:",
          profileError
        );

        message.textContent =
          "プロフィールの保存に失敗しました。";

        saveButton.disabled =
          false;

        return;
      }


      /* =========================
         完了
      ========================= */

      selectedFile =
        null;


      message.textContent =
        "プロフィールを保存したよ！🎉";


      saveButton.disabled =
        false;

    }


    /* =========================
       開始
    ========================= */

    loadProfile();

  </script>

</body>
</html>
