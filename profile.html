<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <style>
    :root {
      --theme: #8f7cff;
      --theme-light: #eeeaff;
      --theme-bg: #f7f5ff;
      --theme-border: #b8afff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background:
        linear-gradient(135deg, var(--theme-bg), #eef7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
      transition: background 0.25s;
    }

    .home-button {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px 15px;
      border-radius: 14px;
      background: white;
      color: var(--theme);
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--theme-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 55px;
      overflow: hidden;
      transition: background 0.25s;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: var(--theme-light);
      color: var(--theme);
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #avatarFile {
      display: none;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--theme);
    }

    /* =========================
       テーマカラー
    ========================= */

    .theme-section {
      margin-top: 22px;
    }

    .theme-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .theme-colors {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .theme-color {
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid transparent;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      padding: 0;
    }

    .theme-color.selected {
      border-color: #333;
      transform: scale(1.08);
    }

    .theme-color.selected::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .color-purple {
      background: #8f7cff;
    }

    .color-pink {
      background: #ff6fae;
    }

    .color-blue {
      background: #4d8dff;
    }

    .color-sky {
      background: #35bde8;
    }

    .color-green {
      background: #42b883;
    }

    .color-orange {
      background: #ff9f43;
    }

    .color-red {
      background: #ff5c6c;
    }

    .color-yellow {
      background: #f2c94c;
    }

    .color-teal {
      background: #20bfa9;
    }

    .color-indigo {
      background: #5964d8;
    }

    .color-brown {
      background: #b87852;
    }

    .color-black {
      background: #444;
    }

    button.save-button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: var(--theme);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #666;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <a href="home.html" class="home-button">
    🏠 ホーム
  </a>

  <div class="container">

    <h1>👤 プロフィール</h1>

    <div class="avatar" id="avatarPreview">
      😊
    </div>

    <label for="avatarFile" class="image-button">
      📷 アイコン画像を選ぶ
    </label>

    <input
      id="avatarFile"
      type="file"
      accept="image/*"
    >

    <label for="name">名前</label>

    <input
      id="name"
      type="text"
      placeholder="表示する名前"
      maxlength="30"
    >

    <label for="bio">自己紹介</label>

    <textarea
      id="bio"
      placeholder="自己紹介を書こう！"
      maxlength="200"
    ></textarea>

    <div class="theme-section">

      <div class="theme-title">
        🎨 テーマカラー
      </div>

      <div class="theme-colors">

        <button class="theme-color color-purple"
          data-color="#8f7cff"
          type="button"></button>

        <button class="theme-color color-pink"
          data-color="#ff6fae"
          type="button"></button>

        <button class="theme-color color-blue"
          data-color="#4d8dff"
          type="button"></button>

        <button class="theme-color color-sky"
          data-color="#35bde8"
          type="button"></button>

        <button class="theme-color color-green"
          data-color="#42b883"
          type="button"></button>

        <button class="theme-color color-orange"
          data-color="#ff9f43"
          type="button"></button>

        <button class="theme-color color-red"
          data-color="#ff5c6c"
          type="button"></button>

        <button class="theme-color color-yellow"
          data-color="#f2c94c"
          type="button"></button>

        <button class="theme-color color-teal"
          data-color="#20bfa9"
          type="button"></button>

        <button class="theme-color color-indigo"
          data-color="#5964d8"
          type="button"></button>

        <button class="theme-color color-brown"
          data-color="#b87852"
          type="button"></button>

        <button class="theme-color color-black"
          data-color="#444444"
          type="button"></button>

      </div>

    </div>

    <button
      type="button"
      class="save-button"
      id="saveButton"
      onclick="saveProfile()"
    >
      プロフィールを保存
    </button>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let selectedFile = null;

    let selectedTheme =
      "#8f7cff";


    // =========================
    // テーマカラー
    // =========================

    function hexToRgba(hex, alpha) {

      const clean =
        hex.replace("#", "");

      const r =
        parseInt(clean.substring(0, 2), 16);

      const g =
        parseInt(clean.substring(2, 4), 16);

      const b =
        parseInt(clean.substring(4, 6), 16);

      return `rgba(${r}, ${g}, ${b}, ${alpha})`;

    }


    function applyTheme(color) {

      selectedTheme =
        color || "#8f7cff";

      document.documentElement
        .style
        .setProperty(
          "--theme",
          selectedTheme
        );

      document.documentElement
        .style
        .setProperty(
          "--theme-light",
          hexToRgba(
            selectedTheme,
            0.12
          )
        );

      document.documentElement
        .style
        .setProperty(
          "--theme-bg",
          hexToRgba(
            selectedTheme,
            0.08
          )
        );

      document.documentElement
        .style
        .setProperty(
          "--theme-border",
          hexToRgba(
            selectedTheme,
            0.45
          )
        );


      document
        .querySelectorAll(".theme-color")
        .forEach(
          function(button) {

            button.classList.toggle(
              "selected",
              button.dataset.color
                .toLowerCase() ===
              selectedTheme.toLowerCase()
            );

          }
        );

    }


    document
      .querySelectorAll(".theme-color")
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              applyTheme(
                button.dataset.color
              );

              showMessage(
                "テーマカラーを選択したよ！"
              );

            }
          );

        }
      );


    // =========================
    // メッセージ表示
    // =========================

    function showMessage(text) {

      document
        .getElementById("message")
        .textContent = text;

    }


    // =========================
    // 画像選択
    // =========================

    document
      .getElementById("avatarFile")
      .addEventListener(
        "change",
        function(event) {

          const file =
            event.target.files[0];

          if (!file) {
            return;
          }


          if (!file.type.startsWith("image/")) {

            showMessage(
              "画像ファイルを選んでね！"
            );

            return;
          }


          if (file.size > 5 * 1024 * 1024) {

            showMessage(
              "画像は5MB以下にしてね！"
            );

            return;
          }


          selectedFile = file;


          const imageUrl =
            URL.createObjectURL(file);

          document
            .getElementById("avatarPreview")
            .innerHTML =
              `<img src="${imageUrl}" alt="アイコン">`;


          showMessage(
            "画像を選択したよ！"
          );

        }
      );


    // =========================
    // プロフィール読み込み
    // =========================

    async function loadProfile() {

      showMessage("読み込み中…");


      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError || !user) {

        showMessage(
          "ログインしてください。"
        );

        return;
      }


      const username =
        user.user_metadata?.username;


      if (!username) {

        showMessage(
          "ユーザー情報を取得できませんでした。"
        );

        return;
      }


      const {
        data: profile,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("user_id", username)
          .maybeSingle();


      if (error) {

        console.error(error);

        showMessage(
          "プロフィールを読み込めませんでした。"
        );

        return;
      }


      if (!profile) {

        showMessage(
          "プロフィールがまだありません。"
        );

        return;
      }


      document
        .getElementById("name")
        .value =
          profile.name || username;


      document
        .getElementById("bio")
        .value =
          profile.bio || "";


      if (profile.avatar_url) {

        document
          .getElementById("avatarPreview")
          .innerHTML =
            `<img src="${profile.avatar_url}" alt="プロフィール画像">`;

      }


      /* 保存済みテーマ */
      applyTheme(
        profile.theme_color ||
        "#8f7cff"
      );


      showMessage("");

    }


    // =========================
    // プロフィール保存
    // =========================

    async function saveProfile() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const bio =
        document
          .getElementById("bio")
          .value
          .trim();

      const message =
        document.getElementById("message");

      const saveButton =
        document.getElementById("saveButton");


      if (!name) {

        message.textContent =
          "名前を入力してね！";

        return;
      }


      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError || !user) {

        message.textContent =
          "ログイン情報を取得できませんでした。";

        return;
      }


      const username =
        user.user_metadata?.username;


      if (!username) {

        message.textContent =
          "ユーザーIDを取得できませんでした。";

        return;
      }


      saveButton.disabled = true;

      message.textContent =
        "保存中…";


      let avatarUrl = null;


      // =========================
      // 画像アップロード
      // =========================

      if (selectedFile) {

        const fileExt =
          selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `${user.id}/${Date.now()}.${fileExt}`;


        const {
          error: uploadError
        } =
          await supabaseClient.storage
            .from("avatars")
            .upload(
              fileName,
              selectedFile,
              {
                upsert: true,
                contentType: selectedFile.type
              }
            );


        if (uploadError) {

          console.error(
            "UPLOAD ERROR:",
            uploadError
          );

          message.textContent =
            "画像アップロードに失敗しました。";

          saveButton.disabled = false;

          return;
        }


        const {
          data: publicData
        } =
          supabaseClient.storage
            .from("avatars")
            .getPublicUrl(fileName);


        avatarUrl =
          publicData.publicUrl;

      }


      // =========================
      // 更新データ
      // =========================

      const updateData = {

        name: name,

        bio: bio,

        theme_color:
          selectedTheme

      };


      if (avatarUrl) {

        updateData.avatar_url =
          avatarUrl;

      }


      // =========================
      // profiles更新
      // =========================

      const {
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .update(updateData)
          .eq(
            "user_id",
            username
          );


      if (profileError) {

        console.error(
          "PROFILE ERROR:",
          profileError
        );

        message.textContent =
          "プロフィールの保存に失敗しました。\n" +
          profileError.message;

        saveButton.disabled = false;

        return;
      }


      selectedFile = null;

      message.textContent =
        "プロフィールを保存したよ！🎉";


      saveButton.disabled = false;

    }


    // =========================
    // 開始
    // =========================

    loadProfile();

  </script>

</body>
</html>
