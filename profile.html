<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="ban-check.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;

      background: linear-gradient(
        135deg,
        #fff4fb,
        #eef7ff
      );

      color: #333;
      padding: 20px;
    }

    .home-link {
      display: inline-block;
      text-decoration: none;
      color: #7658d9;
      background: rgba(255,255,255,.9);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(100,80,150,.12);
      margin-bottom: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 35px rgba(100,80,150,.15);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 27px;
      color: #7158cf;
    }

    .avatar-area {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .avatar-frame {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      padding: 7px;
      background: #ffd9ec;

      box-shadow:
        0 5px 18px rgba(0,0,0,.12),
        0 0 0 3px white;

      transition:
        background .3s ease,
        box-shadow .3s ease;
    }

    .frame-sakura {
      background:
        linear-gradient(
          135deg,
          #ffb7d8,
          #ff65ae,
          #ffd3e8,
          #ff8bc0
        );

      box-shadow:
        0 0 0 3px white,
        0 0 18px rgba(255,100,180,.45);
    }

    .frame-star {
      background:
        linear-gradient(
          135deg,
          #fff0a6,
          #f4bf3f,
          #fff8c9,
          #e9a900
        );

      box-shadow:
        0 0 0 3px white,
        0 0 20px rgba(244,191,63,.45);
    }

    .frame-diamond {
      background:
        linear-gradient(
          135deg,
          #a8edff,
          #42b9ee,
          #e2faff,
          #48caff
        );

      box-shadow:
        0 0 0 3px white,
        0 0 20px rgba(50,190,255,.45);
    }

    .frame-heart {
      background:
        linear-gradient(
          135deg,
          #ffb1d4,
          #ff4f9a,
          #ff8fc2,
          #ff2f86
        );

      box-shadow:
        0 0 0 3px white,
        0 0 22px rgba(255,60,150,.45);
    }

    .frame-rainbow {
      background:
        conic-gradient(
          #ff0000,
          #ff7a00,
          #ffe600,
          #00d639,
          #00d9ff,
          #0066ff,
          #7a00ff,
          #ff00d4,
          #ff0000
        );

      box-shadow:
        0 0 0 3px white,
        0 0 15px rgba(80,150,255,.45),
        0 0 30px rgba(255,80,180,.35);
    }

    .frame-flame {
      background:
        linear-gradient(
          135deg,
          #ff2200,
          #ff6500,
          #ffd000,
          #ff3300,
          #ff9500
        );

      box-shadow:
        0 0 0 3px white,
        0 0 20px rgba(255,80,0,.55);
    }

    .frame-sea {
      background:
        linear-gradient(
          135deg,
          #00c6ff,
          #0072ff,
          #00e5ff,
          #0066cc
        );

      box-shadow:
        0 0 0 3px white,
        0 0 20px rgba(0,170,255,.45);
    }

    .frame-neon {
      background:
        linear-gradient(
          135deg,
          #00ff00,
          #00ffff,
          #ff00ff,
          #7a00ff,
          #00ff00
        );

      background-size: 300% 300%;

      box-shadow:
        0 0 0 3px white,
        0 0 10px #00ff00,
        0 0 20px #00ffff,
        0 0 35px #ff00ff;

      animation:
        neonMove 2s ease infinite;
    }

    @keyframes neonMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .frame-space {
      background:
        radial-gradient(
          circle at 20% 20%,
          white 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 70% 30%,
          white 0 1px,
          transparent 3px
        ),
        radial-gradient(
          circle at 40% 75%,
          #8de7ff 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 85% 80%,
          white 0 1px,
          transparent 3px
        ),
        linear-gradient(
          135deg,
          #050014,
          #26105f,
          #6d28d9,
          #09001c
        );

      box-shadow:
        0 0 0 3px white,
        0 0 20px rgba(100,70,255,.6),
        0 0 35px rgba(120,80,255,.35);
    }

    .admin-frame {
      background:
        linear-gradient(
          135deg,
          #fff4a8,
          #ffd700,
          #fff7bd,
          #e8ad00,
          #fff4a8
        );

      box-shadow:
        0 0 0 3px white,
        0 0 18px rgba(255,215,0,.5);
    }

    .avatar-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid white;

      filter: none !important;
      mix-blend-mode: normal !important;
      opacity: 1 !important;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff3f9;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
    }

    .equipped-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 27px;

      box-shadow:
        0 4px 12px rgba(0,0,0,.18),
        0 0 0 3px white;

      z-index: 5;
    }

    .equipped-badge.show {
      display: flex;
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: #f0eaff;
      color: #7158cf;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-bottom: 24px;
    }

    .image-button:active {
      transform: scale(.98);
    }

    #imageInput {
      display: none;
    }

    .items-section {
      margin-bottom: 25px;
    }

    .items-toggle {
      width: 100%;
      border: none;
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #fff7fc,
          #f3efff
        );

      color: #555;
      padding: 15px 16px;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(100,80,150,.08);
    }

    .items-toggle:active {
      transform: scale(.99);
    }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-arrow {
      font-size: 18px;
      transition: transform .25s ease;
    }

    .items-toggle.open .toggle-arrow {
      transform: rotate(180deg);
    }

    .items-content {
      display: none;
      margin-top: 12px;
      padding: 5px 0 2px;
    }

    .items-content.open {
      display: block;
    }

    .items {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .item-card {
      width: 94px;
      min-height: 118px;
      border-radius: 18px;
      background: #fafafa;
      border: 2px solid #eee;
      padding: 10px 7px;
      text-align: center;
    }

    .item-card.admin-item {
      border-color: #ffd700;

      background:
        linear-gradient(
          135deg,
          #fffdf0,
          #fff8cf
        );

      box-shadow:
        0 3px 12px rgba(255,215,0,.2);
    }

    .item-icon {
      position: relative;
      width: 62px;
      height: 62px;
      margin: 0 auto 7px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      background: white;
    }

    .item-icon.rainbow-icon {
      background:
        conic-gradient(
          #ff0000,
          #ff7a00,
          #ffe600,
          #00d639,
          #00d9ff,
          #0066ff,
          #7a00ff,
          #ff00d4,
          #ff0000
        ) !important;

      border-color: white !important;
    }

    .item-icon.neon-icon {
      background:
        linear-gradient(
          135deg,
          #00ff00,
          #00ffff,
          #ff00ff,
          #7a00ff
        ) !important;

      border-color: white !important;

      box-shadow:
        0 0 8px #00ff00,
        0 0 15px #00ffff,
        0 0 22px #ff00ff;
    }

    .item-small-badge {
      position: absolute;
      top: -9px;
      right: -9px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;

      box-shadow:
        0 2px 6px rgba(0,0,0,.15);
    }

    .item-name {
      font-size: 12px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .equip-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 6px 3px;
      background: #7658d9;
      color: white;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .equip-button.equipped {
      background: #bbb;
    }

    .no-items {
      color: #999;
      text-align: center;
      font-size: 14px;
      padding: 15px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 7px;
      color: #444;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 2px solid #eee;
      border-radius: 14px;
      padding: 13px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #b8a7ef;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      margin-top: 25px;
      border: none;
      border-radius: 16px;
      padding: 15px;
      background: #7658d9;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:active {
      transform: scale(.98);
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 22px;
      font-size: 14px;
      color: #7658d9;
    }
  </style>
</head>

<body>

<a
  class="home-link"
  href="home.html"
>
  🏠 ホーム
</a>

<div class="container">

  <h1>
    👤 プロフィール
  </h1>

  <div class="avatar-area">

    <div
      id="avatarFrame"
      class="avatar-frame"
    >

      <div
        id="avatarContent"
        class="avatar-placeholder"
      >
        😊
      </div>

      <div
        id="equippedBadge"
        class="equipped-badge"
      ></div>

    </div>

  </div>

  <div class="items-section">

    <button
      id="itemsToggle"
      class="items-toggle"
      type="button"
    >

      <span class="toggle-left">
        🎁 交換したアイテム
      </span>

      <span
        id="toggleArrow"
        class="toggle-arrow"
      >
        ▼
      </span>

    </button>

    <div
      id="itemsContent"
      class="items-content"
    >

      <div
        id="items"
        class="items"
      >

        <div class="no-items">
          読み込み中...
        </div>

      </div>

    </div>

  </div>

  <label
    for="imageInput"
    class="image-button"
  >
    📷 アイコン画像を選ぶ
  </label>

  <input
    id="imageInput"
    type="file"
    accept="image/*"
  >

  <label for="name">
    名前
  </label>

  <input
    id="name"
    type="text"
    placeholder="表示する名前"
    maxlength="30"
  >

  <label for="bio">
    自己紹介
  </label>

  <textarea
    id="bio"
    placeholder="自己紹介を書こう！"
    maxlength="300"
  ></textarea>

  <button
    id="saveButton"
    class="save-button"
    type="button"
  >
    プロフィールを保存
  </button>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
  "https://yxonmqdyekwenyzekjwj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const ADMIN_USERNAMES =
  new Set([
    "kazu1haru100",
    "kazu1haru4sub"
  ]);

const ADMIN_ITEM_KEY =
  "admin";


let currentUsername = "";

let currentProfile = null;

let ownedItems = [];


/* =========================
   メッセージ
========================= */

function showMessage(
  text,
  error = false
) {

  const el =
    document.getElementById(
      "message"
    );

  el.textContent = text;

  el.style.color =
    error
      ? "#e05252"
      : "#7658d9";
}


/* =========================
   管理者
========================= */

function isAdmin() {

  return ADMIN_USERNAMES.has(
    currentUsername
  );
}


/* =========================
   ユーザー取得
========================= */

async function getCurrentUser() {

  const wasBanned =
    await checkFriendChatBan();

  if (wasBanned) {
    return null;
  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if (
    error ||
    !data.user
  ) {

    location.href =
      "index.html";

    return null;
  }


  currentUsername =
    data.user.user_metadata?.username || "";


  if (!currentUsername) {

    showMessage(
      "ユーザー情報を取得できませんでした。",
      true
    );

    return null;
  }


  return data.user;
}


/* =========================
   プロフィール読み込み
========================= */

async function loadProfile() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "user_id",
        currentUsername
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    showMessage(
      "プロフィールの読み込みに失敗しました。",
      true
    );

    return;
  }


  currentProfile =
    data;


  if (data) {

    document
      .getElementById("name")
      .value =
      data.name || "";

    document
      .getElementById("bio")
      .value =
      data.bio || "";

    displayAvatar(
      data.avatar_url
    );
  }


  updateEquippedDisplay();
}


/* =========================
   アバター表示
========================= */

function displayAvatar(url) {

  const content =
    document.getElementById(
      "avatarContent"
    );


  if (url) {

    content.outerHTML = `
      <img
        id="avatarContent"
        class="avatar-image"
        src="${escapeHtml(url)}"
        alt="プロフィール画像"
      >
    `;

  } else {

    content.outerHTML = `
      <div
        id="avatarContent"
        class="avatar-placeholder"
      >
        😊
      </div>
    `;
  }
}


/* =========================
   アイテム読み込み
========================= */

async function loadItems() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_coin_items")
      .select(`
        item_key,
        coin_items (
          item_key,
          name,
          icon,
          frame_color
        )
      `)
      .eq(
        "user_id",
        currentUsername
      );


  if (error) {

    console.error(error);

    document
      .getElementById("items")
      .innerHTML = `
        <div class="no-items">
          アイテムを読み込めませんでした
        </div>
      `;

    return;
  }


  ownedItems =
    data || [];


  renderItems();

  updateEquippedDisplay();
}


/* =========================
   アイテム表示
========================= */

function renderItems() {

  const container =
    document.getElementById(
      "items"
    );


  if (!ownedItems.length) {

    container.innerHTML = `
      <div class="no-items">
        まだ交換したアイテムはありません
      </div>
    `;

    return;
  }


  const equipped =
    currentProfile?.equipped_item_key || "";


  container.innerHTML = "";


  ownedItems.forEach(row => {

    const item =
      row.coin_items;

    if (!item) return;


    const key =
      item.item_key ||
      row.item_key;


    const icon =
      item.icon ||
      "🎁";


    const frameColor =
      item.frame_color ||
      "#ffd9ec";


    const isAdminItem =
      key === ADMIN_ITEM_KEY;


    if (
      isAdminItem &&
      !isAdmin()
    ) {
      return;
    }


    const isEquipped =
      equipped === key;


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "item-card" +
      (
        isAdminItem
          ? " admin-item"
          : ""
      );


    let specialClass = "";


    if (
      key === "rainbow"
    ) {

      specialClass =
        " rainbow-icon";
    }


    if (
      key === "neon"
    ) {

      specialClass =
        " neon-icon";
    }


    card.innerHTML = `

      <div
        class="item-icon${specialClass}"
        style="
          border: 4px solid ${escapeHtml(frameColor)};
          background: ${escapeHtml(frameColor)}22;
        "
      >

        ${escapeHtml(icon)}

        <div
          class="item-small-badge"
          style="
            border: 2px solid ${escapeHtml(frameColor)};
          "
        >
          ${escapeHtml(icon)}
        </div>

      </div>

      <div class="item-name">
        ${escapeHtml(
          item.name || key
        )}
      </div>

      <button
        type="button"
        class="equip-button ${
          isEquipped
            ? "equipped"
            : ""
        }"
        data-key="${escapeHtml(key)}"
      >
        ${
          isEquipped
            ? "装備中"
            : "装備する"
        }
      </button>

    `;


    container.appendChild(
      card
    );
  });


  document
    .querySelectorAll(
      ".equip-button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          equipItem(
            button.dataset.key
          );

        }
      );

    });


  if (
    !container.children.length
  ) {

    container.innerHTML = `
      <div class="no-items">
        まだ交換したアイテムはありません
      </div>
    `;
  }
}


/* =========================
   アイテム装備
========================= */

async function equipItem(
  itemKey
) {

  const wasBanned =
    await checkFriendChatBan();

  if (wasBanned) {
    return;
  }


  if (
    itemKey === ADMIN_ITEM_KEY &&
    !isAdmin()
  ) {

    showMessage(
      "管理者専用アイテムです。",
      true
    );

    return;
  }


  const ownsItem =
    ownedItems.some(row => {

      const item =
        row.coin_items;

      return (
        (
          item?.item_key ||
          row.item_key
        ) === itemKey
      );

    });


  if (!ownsItem) {

    showMessage(
      "このアイテムは所有していません。",
      true
    );

    return;
  }


  showMessage(
    "装備しています..."
  );


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({
        equipped_item_key:
          itemKey
      })
      .eq(
        "user_id",
        currentUsername
      );


  if (error) {

    console.error(error);

    showMessage(
      "装備に失敗しました。",
      true
    );

    return;
  }


  if (!currentProfile) {
    currentProfile = {};
  }


  currentProfile.equipped_item_key =
    itemKey;


  renderItems();

  updateEquippedDisplay();


  showMessage(
    "装備しました！✨"
  );
}


/* =========================
   装備フレーム表示
========================= */

function updateEquippedDisplay() {

  const frame =
    document.getElementById(
      "avatarFrame"
    );

  const badge =
    document.getElementById(
      "equippedBadge"
    );


  frame.className =
    "avatar-frame";

  frame.style.background =
    "";

  frame.style.boxShadow =
    "";

  frame.style.animation =
    "";


  badge.classList.remove(
    "show"
  );

  badge.textContent = "";

  badge.style.border =
    "";

  badge.style.boxShadow =
    "";


  const key =
    currentProfile?.equipped_item_key;


  if (!key) return;


  const ownedRow =
    ownedItems.find(row => {

      const item =
        row.coin_items;

      return (
        (
          item?.item_key ||
          row.item_key
        ) === key
      );

    });


  if (!ownedRow) return;


  const item =
    ownedRow.coin_items;


  if (!item) return;


  if (
    key === ADMIN_ITEM_KEY &&
    isAdmin()
  ) {

    frame.classList.add(
      "admin-frame"
    );

    badge.textContent =
      "👑";

    badge.style.border =
      "3px solid #ffd700";

    badge.classList.add(
      "show"
    );

    return;
  }


  const frameClassMap = {

    sakura:
      "frame-sakura",

    star:
      "frame-star",

    diamond:
      "frame-diamond",

    heart:
      "frame-heart",

    rainbow:
      "frame-rainbow",

    flame:
      "frame-flame",

    sea:
      "frame-sea",

    neon:
      "frame-neon",

    space:
      "frame-space"

  };


  const className =
    frameClassMap[key];


  if (className) {

    frame.classList.add(
      className
    );

  } else {

    const color =
      item.frame_color ||
      "#ffd9ec";

    frame.style.background =
      color;

    frame.style.boxShadow = `
      0 0 0 3px white,
      0 0 15px ${color}
    `;
  }


  badge.textContent =
    item.icon || "🎁";


  badge.classList.add(
    "show"
  );


  if (
    key === "rainbow"
  ) {

    badge.style.border =
      "3px solid white";

    badge.style.boxShadow = `
      0 0 10px rgba(80,150,255,.65)
    `;

  } else if (
    key === "neon"
  ) {

    badge.style.border =
      "3px solid white";

    badge.style.boxShadow = `
      0 0 8px #00ff00,
      0 0 14px #00ffff,
      0 0 20px #ff00ff
    `;

  } else {

    const color =
      item.frame_color ||
      "#ffd9ec";

    badge.style.border =
      `3px solid ${color}`;
  }
}


/* =========================
   折りたたみ
========================= */

document
  .getElementById(
    "itemsToggle"
  )
  .addEventListener(
    "click",
    () => {

      const button =
        document.getElementById(
          "itemsToggle"
        );

      const content =
        document.getElementById(
          "itemsContent"
        );

      const isOpen =
        content.classList.contains(
          "open"
        );


      if (isOpen) {

        content.classList.remove(
          "open"
        );

        button.classList.remove(
          "open"
        );

      } else {

        content.classList.add(
          "open"
        );

        button.classList.add(
          "open"
        );
      }

    }
  );


/* =========================
   画像アップロード
========================= */

document
  .getElementById(
    "imageInput"
  )
  .addEventListener(
    "change",
    async function() {

      const wasBanned =
        await checkFriendChatBan();

      if (wasBanned) {
        return;
      }


      const file =
        this.files?.[0];

      if (!file) return;


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        showMessage(
          "画像ファイルを選んでください。",
          true
        );

        return;
      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        showMessage(
          "画像は5MB以下にしてください。",
          true
        );

        return;
      }


      showMessage(
        "画像をアップロードしています..."
      );


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const path =
        `${currentUsername}/${Date.now()}.${extension}`;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("avatars")
          .upload(
            path,
            file,
            {
              upsert: true,
              contentType:
                file.type
            }
          );


      if (uploadError) {

        console.error(
          uploadError
        );

        showMessage(
          "画像のアップロードに失敗しました。",
          true
        );

        return;
      }


      const {
        data
      } =
        supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(
            path
          );


      const imageUrl =
        data.publicUrl;


      displayAvatar(
        imageUrl
      );


      if (!currentProfile) {
        currentProfile = {};
      }


      currentProfile.avatar_url =
        imageUrl;


      showMessage(
        "画像を選びました。最後に「プロフィールを保存」を押してください。"
      );
    }
  );


/* =========================
   プロフィール保存
========================= */

document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    saveProfile
  );


async function saveProfile() {

  const wasBanned =
    await checkFriendChatBan();

  if (wasBanned) {
    return;
  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const bio =
    document
      .getElementById("bio")
      .value
      .trim();


  const avatar =
    currentProfile?.avatar_url ||
    null;


  showMessage(
    "プロフィールを保存しています..."
  );


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .upsert(
        {
          user_id:
            currentUsername,

          name:
            name,

          bio:
            bio,

          avatar_url:
            avatar,

          equipped_item_key:
            currentProfile
              ?.equipped_item_key ||
            null
        },
        {
          onConflict:
            "user_id"
        }
      );


  if (error) {

    console.error(error);

    showMessage(
      "保存に失敗しました。",
      true
    );

    return;
  }


  showMessage(
    "プロフィールを保存しました！✨"
  );
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================
   初期化
========================= */

async function init() {

  const wasBanned =
    await checkFriendChatBan();

  if (wasBanned) {
    return;
  }


  const user =
    await getCurrentUser();

  if (!user) return;


  await loadProfile();

  await loadItems();

  updateEquippedDisplay();
}


init();
