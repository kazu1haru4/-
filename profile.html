<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff4fb, #eef7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ffe2f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 55px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9b8cff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>👤 プロフィール</h1>

    <div class="avatar">
      😊
    </div>

    <label for="name">名前</label>

    <input
      id="name"
      type="text"
      placeholder="表示する名前"
      maxlength="30"
    >

    <label for="bio">自己紹介</label>

    <textarea
      id="bio"
      placeholder="自己紹介を書こう！"
      maxlength="200"
    ></textarea>

    <button type="button" onclick="saveProfile()">
      プロフィールを保存
    </button>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function saveProfile() {

      const name =
        document.getElementById("name").value.trim();

      const bio =
        document.getElementById("bio").value.trim();

      const message =
        document.getElementById("message");


      if (!name) {

        message.textContent =
          "名前を入力してね！";

        return;
      }


      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        message.textContent =
          "ログインしてください。";

        return;
      }


      message.textContent =
        "保存中…";


      const { error } =
        await supabaseClient
          .from("profiles")
          .update({
            name: name,
            bio: bio
          })
          .eq("id", user.id);


      if (error) {

        console.error(error);

        message.textContent =
          "保存できませんでした。";

        return;
      }


      message.textContent =
        "プロフィールを保存したよ！🎉";
    }

  </script>

</body>
</html>
