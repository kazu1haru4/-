<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff4fb, #eef7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffe2f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 55px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #eeeaff;
      color: #6556d8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #avatarFile {
      display: none;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9b8cff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #666;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>👤 プロフィール</h1>

    <div class="avatar" id="avatarPreview">
      😊
    </div>

    <label for="avatarFile" class="image-button">
      📷 アイコン画像を選ぶ
    </label>

    <input
      id="avatarFile"
      type="file"
      accept="image/*"
    >

    <label for="name">名前</label>

    <input
      id="name"
      type="text"
      placeholder="表示する名前"
      maxlength="30"
    >

    <label for="bio">自己紹介</label>

    <textarea
      id="bio"
      placeholder="自己紹介を書こう！"
      maxlength="200"
    ></textarea>

    <button type="button" onclick="saveProfile()">
      プロフィールを保存
    </button>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let selectedFile = null;


    // =========================
    // アイコン画像を選択
    // =========================

    document
      .getElementById("avatarFile")
      .addEventListener("change", function(event) {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }

        selectedFile = file;

        const imageUrl =
          URL.createObjectURL(file);

        document
          .getElementById("avatarPreview")
          .innerHTML =
            `<img src="${imageUrl}" alt="アイコン">`;

        document
          .getElementById("message")
          .textContent =
            "画像を選択したよ！";

      });


    // =========================
    // プロフィール保存
    // =========================

    async function saveProfile() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const bio =
        document
          .getElementById("bio")
          .value
          .trim();

      const message =
        document.getElementById("message");


      // 名前チェック
      if (!name) {

        message.textContent =
          "名前を入力してね！";

        return;
      }


      // =========================
      // ログインユーザー取得
      // =========================

      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      console.log("USER:", user);
      console.log("USER ERROR:", userError);


      if (userError) {

        message.textContent =
          "ログイン情報を取得できませんでした。";

        return;
      }


      if (!user) {

        message.textContent =
          "ログインしてください。";

        return;
      }


      message.textContent =
        "保存中…";


      let avatarUrl = "";


      // =========================
      // アイコン画像アップロード
      // =========================

      if (selectedFile) {

        const fileExt =
          selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `${user.id}/${Date.now()}.${fileExt}`;


        console.log(
          "アップロード先:",
          fileName
        );


        const {
          data: uploadData,
          error: uploadError
        } =
          await supabaseClient.storage
            .from("avatars")
            .upload(
              fileName,
              selectedFile,
              {
                upsert: true
              }
            );


        console.log(
          "UPLOAD DATA:",
          uploadData
        );

        console.log(
          "UPLOAD ERROR:",
          uploadError
        );


        // ★画像アップロードのエラー
        if (uploadError) {

          message.textContent =
            "【画像アップロード】" +
            uploadError.message;

          return;
        }


        // =========================
        // 公開URL取得
        // =========================

        const {
          data: publicData
        } =
          supabaseClient.storage
            .from("avatars")
            .getPublicUrl(fileName);


        avatarUrl =
          publicData.publicUrl;


        console.log(
          "AVATAR URL:",
          avatarUrl
        );

      }


      // =========================
      // プロフィールデータ
      // =========================

      const updateData = {

        name: name,

        bio: bio

      };


      if (avatarUrl) {

        updateData.avatar_url =
          avatarUrl;

      }


      console.log(
        "PROFILE UPDATE:",
        updateData
      );


      // =========================
      // profilesを更新
      // =========================

      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .update(updateData)
          .eq(
            "user_id",
            user.user_metadata.username
          );


      console.log(
        "PROFILE ERROR:",
        error
      );


      // ★プロフィール保存のエラー
      if (error) {

        message.textContent =
          "【プロフィール保存】" +
          error.message;

        return;
      }


      // =========================
      // 成功
      // =========================

      message.textContent =
        "プロフィールを保存したよ！🎉";

    }

  </script>

</body>
</html>
