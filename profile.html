<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff4fb, #eef7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .home-button {
      position: fixed;
      top: 15px;
      left: 15px;
      width: auto;
      margin: 0;
      padding: 10px 15px;
      border-radius: 14px;
      background: white;
      color: #6556d8;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffe2f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 55px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #eeeaff;
      color: #6556d8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #avatarFile {
      display: none;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9b8cff;
    }

    button.save-button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #666;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <a href="home.html" class="home-button">
    🏠 ホーム
  </a>

  <div class="container">

    <h1>👤 プロフィール</h1>

    <div class="avatar" id="avatarPreview">
      😊
    </div>

    <label for="avatarFile" class="image-button">
      📷 アイコン画像を選ぶ
    </label>

    <input
      id="avatarFile"
      type="file"
      accept="image/*"
    >

    <label for="name">名前</label>

    <input
      id="name"
      type="text"
      placeholder="表示する名前"
      maxlength="30"
    >

    <label for="bio">自己紹介</label>

    <textarea
      id="bio"
      placeholder="自己紹介を書こう！"
      maxlength="200"
    ></textarea>

    <button
      type="button"
      class="save-button"
      id="saveButton"
      onclick="saveProfile()"
    >
      プロフィールを保存
    </button>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let selectedFile = null;

    // =========================
    // メッセージ表示
    // =========================

    function showMessage(text) {

      document
        .getElementById("message")
        .textContent = text;

    }

    // =========================
    // 画像選択
    // =========================

    document
      .getElementById("avatarFile")
      .addEventListener(
        "change",
        function(event) {

          const file =
            event.target.files[0];

          if (!file) {
            return;
          }

          // 画像かチェック

          if (!file.type.startsWith("image/")) {

            showMessage(
              "画像ファイルを選んでね！"
            );

            return;
          }

          // サイズチェック
          // 5MBまで

          if (file.size > 5 * 1024 * 1024) {

            showMessage(
              "画像は5MB以下にしてね！"
            );

            return;
          }

          selectedFile = file;

          // プレビュー表示

          const imageUrl =
            URL.createObjectURL(file);

          document
            .getElementById("avatarPreview")
            .innerHTML =
              `<img src="${imageUrl}" alt="アイコン">`;

          showMessage(
            "画像を選択したよ！"
          );

        }
      );

    // =========================
    // プロフィール読み込み
    // =========================

    async function loadProfile() {

      showMessage("読み込み中…");

      // ログインユーザー取得

      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();

      if (userError || !user) {

        showMessage(
          "ログインしてください。"
        );

        return;
      }

      const username =
        user.user_metadata?.username;

      if (!username) {

        showMessage(
          "ユーザー情報を取得できませんでした。"
        );

        return;
      }

      // profiles取得

      const {
        data: profile,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("user_id", username)
          .maybeSingle();

      if (error) {

        console.error(error);

        showMessage(
          "プロフィールを読み込めませんでした。"
        );

        return;
      }

      if (!profile) {

        showMessage(
          "プロフィールがまだありません。"
        );

        return;
      }

      // 名前

      document
        .getElementById("name")
        .value =
          profile.name || username;

      // 自己紹介

      document
        .getElementById("bio")
        .value =
          profile.bio || "";

      // プロフィール画像

      if (profile.avatar_url) {

        document
          .getElementById("avatarPreview")
          .innerHTML =
            `<img src="${profile.avatar_url}" alt="プロフィール画像">`;

      }

      showMessage("");

    }

    // =========================
    // プロフィール保存
    // =========================

    async function saveProfile() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const bio =
        document
          .getElementById("bio")
          .value
          .trim();

      const message =
        document.getElementById("message");

      const saveButton =
        document.getElementById("saveButton");

      // 名前チェック

      if (!name) {

        message.textContent =
          "名前を入力してね！";

        return;
      }

      // ログインユーザー取得

      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();

      if (userError || !user) {

        message.textContent =
          "ログイン情報を取得できませんでした。";

        return;
      }

      const username =
        user.user_metadata?.username;

      if (!username) {

        message.textContent =
          "ユーザーIDを取得できませんでした。";

        return;
      }

      saveButton.disabled = true;

      message.textContent =
        "保存中…";

      let avatarUrl = null;

      // =========================
      // 画像アップロード
      // =========================

      if (selectedFile) {

        const fileExt =
          selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();

        const fileName =
          `${user.id}/${Date.now()}.${fileExt}`;

        const {
          error: uploadError
        } =
          await supabaseClient.storage
            .from("avatars")
            .upload(
              fileName,
              selectedFile,
              {
                upsert: true,
                contentType: selectedFile.type
              }
            );

        if (uploadError) {

          console.error(
            "UPLOAD ERROR:",
            uploadError
          );

          message.textContent =
            "画像アップロードに失敗しました。";

          saveButton.disabled = false;

          return;
        }

        // 公開URL取得

        const {
          data: publicData
        } =
          supabaseClient.storage
            .from("avatars")
            .getPublicUrl(fileName);

        avatarUrl =
          publicData.publicUrl;

      }

      // =========================
      // 更新データ
      // =========================

      const updateData = {

        name: name,

        bio: bio

      };

      if (avatarUrl) {

        updateData.avatar_url =
          avatarUrl;

      }

      // =========================
      // profiles更新
      // =========================

      const {
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .update(updateData)
          .eq(
            "user_id",
            username
          );

      if (profileError) {

        console.error(
          "PROFILE ERROR:",
          profileError
        );

        message.textContent =
          "プロフィールの保存に失敗しました。";

        saveButton.disabled = false;

        return;
      }

      // =========================
      // 完了
      // =========================

      selectedFile = null;

      message.textContent =
        "プロフィールを保存したよ！🎉";

      saveButton.disabled = false;

    }

    // =========================
    // ページ開始
    // =========================

    loadProfile();

  </script>

</body>
</html>
