<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background:
        linear-gradient(135deg, #fff3fb, #eef5ff);

      color: #333;
    }

    .container {
      width: 100%;
      max-width: 600px;

      height: 100dvh;
      min-height: 0;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* =========================
       ヘッダー
    ========================= */

    .header {
      position: relative;

      flex-shrink: 0;

      background: white;

      padding: 12px 18px;

      padding-top:
        max(12px, env(safe-area-inset-top));

      text-align: center;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.06);

      z-index: 5;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
    }

    .home-button {
      position: absolute;

      top:
        max(12px, env(safe-area-inset-top));

      left: 12px;

      padding: 9px 12px;

      background: #f5f5f5;
      color: #555;

      text-decoration: none;

      border-radius: 12px;

      font-size: 13px;
      font-weight: bold;
    }

    .profile-header {
      margin-top: 8px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 9px;
    }

    .header-avatar {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: #eee8ff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-size: 20px;

      flex-shrink: 0;
    }

    .header-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* =========================
       メッセージエリア
    ========================= */

    .messages-wrapper {
      position: relative;

      flex: 1 1 auto;

      min-height: 0;

      overflow: hidden;
    }

    .messages {
      width: 100%;
      height: 100%;

      padding: 18px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;

      overscroll-behavior-y: contain;
    }

    .empty {
      text-align: center;

      color: #999;

      margin-top: 40px;
    }

    .message {
      display: flex;

      align-items: flex-end;

      gap: 7px;

      margin-bottom: 12px;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #eee8ff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      flex-shrink: 0;

      font-size: 18px;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .bubble {
      max-width: 75%;

      padding: 10px 14px;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 3px 8px rgba(0,0,0,0.05);

      word-break: break-word;
    }

    .mine .bubble {
      background: #8f7cff;
      color: white;
    }

    .chat-image {
      display: block;

      max-width: 220px;
      max-height: 300px;

      border-radius: 14px;

      margin-bottom: 5px;

      object-fit: contain;
    }

    .time {
      font-size: 10px;

      color: #999;

      margin-top: 4px;

      text-align: right;
    }

    .mine .time {
      color: #eee;
    }

    /* =========================
       一番下へボタン
    ========================= */

    .latest-button {
      position: absolute;

      right: 16px;
      bottom: 16px;

      border: none;

      background: #8f7cff;

      color: white;

      padding: 11px 16px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: bold;

      box-shadow:
        0 4px 14px rgba(0,0,0,0.18);

      cursor: pointer;

      z-index: 10;

      opacity: 0;

      transform:
        translateY(10px);

      pointer-events: none;

      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .latest-button.show {
      opacity: 1;

      transform:
        translateY(0);

      pointer-events: auto;
    }

    .latest-button:active {
      transform:
        scale(0.95);
    }

    /* =========================
       入力欄
    ========================= */

    .input-area {
      flex-shrink: 0;

      width: 100%;

      background: white;

      padding: 12px;

      padding-bottom:
        max(12px, env(safe-area-inset-bottom));

      display: flex;

      gap: 8px;

      border-top:
        1px solid #eee;

      z-index: 5;
    }

    .input-area input[type="text"] {
      flex: 1;

      min-width: 0;

      padding: 12px;

      border:
        1px solid #ddd;

      border-radius: 18px;

      font-size: 16px;

      outline: none;
    }

    .input-area input[type="text"]:focus {
      border-color: #8f7cff;
    }

    .image-button {
      width: 46px;
      min-width: 46px;

      border: none;

      border-radius: 18px;

      background: #f1efff;

      font-size: 21px;

      cursor: pointer;
    }

    .send-button {
      border: none;

      border-radius: 18px;

      padding: 0 18px;

      background: #8f7cff;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .send-button:disabled,
    .image-button:disabled {
      opacity: 0.5;
    }

    #imageInput {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="header">

      <a
        href="home.html"
        class="home-button"
      >
        🏠 ホーム
      </a>

      <div class="profile-header">

        <div
          class="header-avatar"
          id="headerAvatar"
        >
          👤
        </div>

        <h1 id="chatTitle">
          💬 チャット
        </h1>

      </div>

    </header>


    <!-- =========================
         メッセージ
    ========================== -->

    <div class="messages-wrapper">

      <section
        class="messages"
        id="messages"
      >

        <div class="empty">
          メッセージを読み込み中...
        </div>

      </section>


      <!-- 一番下へボタン -->

      <button
        id="latestButton"
        class="latest-button"
        type="button"
      >
        ⬇️ 最新へ
      </button>

    </div>


    <!-- =========================
         入力
    ========================== -->

    <form
      class="input-area"
      id="messageForm"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >

      <button
        class="image-button"
        id="imageButton"
        type="button"
        title="画像を送る"
      >
        🖼️
      </button>

      <button
        class="send-button"
        id="sendButton"
        type="submit"
      >
        送信
      </button>

    </form>


    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================================
       Supabase
    ========================================= */

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       要素
    ========================================= */

    const messagesElement =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const messageForm =
      document.getElementById("messageForm");

    const sendButton =
      document.getElementById("sendButton");

    const imageButton =
      document.getElementById("imageButton");

    const imageInput =
      document.getElementById("imageInput");

    const chatTitle =
      document.getElementById("chatTitle");

    const headerAvatar =
      document.getElementById("headerAvatar");

    const latestButton =
      document.getElementById("latestButton");


    /* =========================================
       基本変数
    ========================================= */

    let currentUsername = "";

    let friendId = "";

    let realtimeChannel = null;

    let myAvatarUrl = "";

    let friendAvatarUrl = "";


    const params =
      new URLSearchParams(
        window.location.search
      );

    friendId =
      params.get("user") || "";


    /* =========================================
       プロフィール画像
    ========================================= */

    function createAvatar(
      url,
      fallback
    ) {

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "message-avatar";


      if (url) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          url;

        img.alt =
          "プロフィール画像";


        img.onerror =
          function() {

            avatar.innerHTML =
              fallback;

          };


        avatar.appendChild(
          img
        );

      } else {

        avatar.textContent =
          fallback;

      }


      return avatar;

    }


    /* =========================================
       通知
    ========================================= */

    async function createNotification() {

      if (
        !currentUsername ||
        !friendId
      ) {

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("notifications")
          .insert({

            user_id:
              friendId,

            type:
              "chat",

            title:
              "💬 新しいメッセージ",

            message:
              currentUsername +
              "さんからメッセージが届きました",

            link:
              "chat.html?user=" +
              encodeURIComponent(
                currentUsername
              ),

            is_read:
              false

          });


      if (error) {

        console.error(
          "通知作成エラー:",
          error
        );

      }

    }


    /* =========================================
       一番下へ移動
    ========================================= */

    function scrollToBottom(
      smooth = false
    ) {

      messagesElement.scrollTo({

        top:
          messagesElement.scrollHeight,

        behavior:
          smooth
            ? "smooth"
            : "auto"

      });

    }


    /* =========================================
       最新ボタン表示
    ========================================= */

    function updateLatestButton() {

      const distanceFromBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight;


      /*
        150px以上上にいる場合
        ボタンを表示
      */

      if (
        distanceFromBottom > 150
      ) {

        latestButton.classList.add(
          "show"
        );

      } else {

        latestButton.classList.remove(
          "show"
        );

      }

    }


    /* =========================================
       スクロール
    ========================================= */

    messagesElement.addEventListener(
      "scroll",
      function() {

        updateLatestButton();

      },
      {
        passive: true
      }
    );


    /* =========================================
       最新へボタン
    ========================================= */

    latestButton.addEventListener(
      "click",
      function() {

        scrollToBottom(true);

      }
    );


    /* =========================================
       開始
    ========================================= */

    async function start() {

      if (!friendId) {

        chatTitle.textContent =
          "💬 相手が選ばれていません";


        messageForm.style.display =
          "none";


        messagesElement.innerHTML =
          '<div class="empty">フレンドから相手を選んでね</div>';


        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data.session
      ) {

        alert(
          "ログインしてください。"
        );


        window.location.href =
          "index.html";


        return;

      }


      currentUsername =
        data.session.user
          .user_metadata
          ?.username || "";


      if (!currentUsername) {

        alert(
          "ログイン中のユーザーIDを取得できませんでした。"
        );


        return;

      }


      /* =========================
         相手プロフィール
      ========================== */

      const {
        data: friendProfile
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "name, avatar_url"
          )
          .eq(
            "user_id",
            friendId
          )
          .maybeSingle();


      friendAvatarUrl =
        friendProfile?.avatar_url ||
        "";


      chatTitle.textContent =
        "💬 " +
        (
          friendProfile?.name ||
          friendId
        );


      if (friendAvatarUrl) {

        headerAvatar.innerHTML =
          `<img src="${friendAvatarUrl}" alt="プロフィール画像">`;

      }


      /* =========================
         自分プロフィール
      ========================== */

      const {
        data: myProfile
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "avatar_url"
          )
          .eq(
            "user_id",
            currentUsername
          )
          .maybeSingle();


      myAvatarUrl =
        myProfile?.avatar_url ||
        "";


      await loadMessages();


      startRealtime();

    }


    /* =========================================
       メッセージ読み込み
    ========================================= */

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${currentUsername},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUsername})`
          )
          .order(
            "created_at",
            {
              ascending:
                true
            }
          );


      if (error) {

        console.error(
          "読み込みエラー:",
          error
        );


        messagesElement.innerHTML =
          '<div class="empty">メッセージを読み込めませんでした</div>';


        return;

      }


      messagesElement.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        messagesElement.innerHTML =
          '<div class="empty">まだメッセージがありません</div>';


        updateLatestButton();

        return;

      }


      for (
        const message of data
      ) {

        await addMessageToScreen(
          message
        );

      }


      /*
        最初に開いたときは一番下
      */

      scrollToBottom();


      updateLatestButton();

    }


    /* =========================================
       メッセージ表示
    ========================================= */

    async function addMessageToScreen(
      message
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message";


      const isMine =
        message.sender_id ===
        currentUsername;


      if (isMine) {

        wrapper.classList.add(
          "mine"
        );

      }


      /* =========================
         相手のアイコン
      ========================== */

      if (!isMine) {

        const avatar =
          createAvatar(
            friendAvatarUrl,
            "👤"
          );


        wrapper.appendChild(
          avatar
        );

      }


      /* =========================
         吹き出し
      ========================== */

      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      /* =========================
         画像
      ========================== */

      if (message.image_url) {

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "chat-image";


        image.alt =
          "送信された画像";


        const {
          data,
          error
        } =
          await supabaseClient.storage
            .from(
              "chat-images"
            )
            .createSignedUrl(
              message.image_url,
              3600
            );


        if (
          !error &&
          data?.signedUrl
        ) {

          image.src =
            data.signedUrl;


          bubble.appendChild(
            image
          );

        }

      }


      /* =========================
         テキスト
      ========================== */

      if (message.content) {

        const text =
          document.createElement(
            "div"
          );


        text.textContent =
          message.content;


        bubble.appendChild(
          text
        );

      }


      /* =========================
         時刻
      ========================== */

      const time =
        document.createElement(
          "div"
        );


      time.className =
        "time";


      const date =
        new Date(
          message.created_at
        );


      time.textContent =
        date.toLocaleTimeString(
          "ja-JP",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


      bubble.appendChild(
        time
      );


      wrapper.appendChild(
        bubble
      );


      /* =========================
         自分のアイコン
      ========================== */

      if (isMine) {

        const avatar =
          createAvatar(
            myAvatarUrl,
            "😊"
          );


        wrapper.appendChild(
          avatar
        );

      }


      messagesElement.appendChild(
        wrapper
      );

    }


    /* =========================================
       リアルタイム
    ========================================= */

    function startRealtime() {

      if (realtimeChannel) {

        return;

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "chat-" +
            currentUsername +
            "-" +
            friendId
          )
          .on(
            "postgres_changes",
            {
              event:
                "INSERT",

              schema:
                "public",

              table:
                "messages"
            },
            async function(payload) {

              const message =
                payload.new;


              const isThisChat =
                (
                  message.sender_id ===
                    currentUsername &&
                  message.receiver_id ===
                    friendId
                ) ||
                (
                  message.sender_id ===
                    friendId &&
                  message.receiver_id ===
                    currentUsername
                );


              if (!isThisChat) {

                return;

              }


              /*
                自分のメッセージは
                すでに追加済み
              */

              if (
                message.sender_id ===
                currentUsername
              ) {

                return;

              }


              await addMessageToScreen(
                message
              );


              /*
                相手から来たら
                自動的に最新へ
              */

              scrollToBottom();


              updateLatestButton();

            }
          )
          .subscribe();

    }


    /* =========================================
       テキスト送信
    ========================================= */

    messageForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (!text) {

          return;

        }


        if (
          !currentUsername ||
          !friendId
        ) {

          alert(
            "ログイン情報または相手の情報を取得できません。"
          );


          return;

        }


        sendButton.disabled =
          true;


        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUsername,

              receiver_id:
                friendId,

              content:
                text,

              image_url:
                ""

            })
            .select()
            .single();


        sendButton.disabled =
          false;


        if (error) {

          console.error(
            "送信エラー:",
            error
          );


          alert(
            "メッセージを送信できませんでした。\n\n" +
            error.message
          );


          return;

        }


        messageInput.value =
          "";


        await addMessageToScreen(
          data
        );


        /*
          送信したら一番下
        */

        scrollToBottom();


        updateLatestButton();


        await createNotification();

      }
    );


    /* =========================================
       画像ボタン
    ========================================= */

    imageButton.addEventListener(
      "click",
      function() {

        imageInput.click();

      }
    );


    /* =========================================
       画像送信
    ========================================= */

    imageInput.addEventListener(
      "change",
      async function() {

        const file =
          imageInput.files?.[0];


        if (!file) {

          return;

        }


        if (
          !currentUsername ||
          !friendId
        ) {

          alert(
            "ログイン情報または相手の情報を取得できません。"
          );


          imageInput.value =
            "";


          return;

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "画像ファイルを選んでください。"
          );


          imageInput.value =
            "";


          return;

        }


        imageButton.disabled =
          true;

        sendButton.disabled =
          true;


        try {

          const extension =
            file.name
              .split(".")
              .pop() ||
            "jpg";


          const filePath =
            currentUsername +
            "/" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .slice(2) +
            "." +
            extension;


          const {
            error:
              uploadError
          } =
            await supabaseClient.storage
              .from(
                "chat-images"
              )
              .upload(
                filePath,
                file,
                {
                  contentType:
                    file.type,

                  upsert:
                    false
                }
              );


          if (uploadError) {

            console.error(
              "画像アップロードエラー:",
              uploadError
            );


            alert(
              "画像をアップロードできませんでした。\n\n" +
              uploadError.message
            );


            return;

          }


          const {
            data,
            error
          } =
            await supabaseClient
              .from("messages")
              .insert({

                sender_id:
                  currentUsername,

                receiver_id:
                  friendId,

                content:
                  "",

                image_url:
                  filePath

              })
              .select()
              .single();


          if (error) {

            console.error(
              "画像メッセージ保存エラー:",
              error
            );


            alert(
              "画像メッセージを保存できませんでした。\n\n" +
              error.message
            );


            return;

          }


          await addMessageToScreen(
            data
          );


          /*
            画像送信後も最新へ
          */

          scrollToBottom();


          updateLatestButton();


          await createNotification();

        } finally {

          imageButton.disabled =
            false;


          sendButton.disabled =
            false;


          imageInput.value =
            "";

        }

      }
    );


    /* =========================================
       起動
    ========================================= */

    start();

  </script>

</body>
</html>
