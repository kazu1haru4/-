<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f3ff;
      color: #333;
    }

    .chat {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      margin: 0 auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #8f7cff;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      word-break: break-word;
    }

    .message.me {
      align-self: flex-end;
      background: #8f7cff;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.other {
      align-self: flex-start;
      background: #eeeef5;
      color: #333;
      border-bottom-left-radius: 5px;
    }

    .empty {
      margin: auto;
      color: #999;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
      background: white;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 16px;
      outline: none;
    }

    #sendButton {
      width: 70px;
      border: none;
      border-radius: 20px;
      background: #8f7cff;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      💬 チャット
    </div>

    <div class="messages" id="messages">
      <div class="empty">
        まだメッセージがありません
      </div>
    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力..."
        maxlength="500"
      >

      <button id="sendButton">
        送信
      </button>

    </div>

  </div>

</body>
</html>
