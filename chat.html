<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      /*
        ★重要
        ページ全体をスクロールさせない
      */
      overflow: hidden;

      overscroll-behavior: none;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff3fb,
          #eef5ff
        );

      color: #333;
    }

    /*
      ★重要
      画面全体を100dvhに固定
    */
    .container {
      width: 100%;
      max-width: 600px;

      height: 100dvh;
      min-height: 0;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .header {
      position: relative;

      flex-shrink: 0;

      background: white;

      padding:
        12px 18px;

      padding-top:
        max(12px, env(safe-area-inset-top));

      text-align: center;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.06);

      z-index: 5;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
    }

    .home-button {
      position: absolute;

      top:
        max(12px, env(safe-area-inset-top));

      left: 12px;

      padding: 9px 12px;

      background: #f5f5f5;
      color: #555;

      text-decoration: none;

      border-radius: 12px;

      font-size: 13px;
      font-weight: bold;

      z-index: 2;
    }

    .profile-header {
      margin-top: 8px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 9px;
    }

    .header-avatar {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: #eee8ff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-size: 20px;

      flex-shrink: 0;
    }

    .header-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /*
      ★ここが唯一のスクロール場所
    */
    .messages {
      flex: 1 1 auto;

      /*
        ★重要
        flexの中で正しく縮むために必要
      */
      min-height: 0;

      width: 100%;

      padding: 18px;

      overflow-y: auto;
      overflow-x: hidden;

      /*
        iPhoneでのスクロール
      */
      -webkit-overflow-scrolling: touch;

      overscroll-behavior-y: contain;

      /*
        ブラウザの自動アンカーをOFF
      */
      overflow-anchor: none;

      /*
        スクロールバー
      */
      scrollbar-width: thin;
    }

    .empty {
      text-align: center;
      color: #999;

      margin-top: 40px;
    }

    .message {
      display: flex;
      align-items: flex-end;

      gap: 7px;

      margin-bottom: 12px;

      /*
        メッセージが勝手に縮まない
      */
      flex-shrink: 0;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #eee8ff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      flex-shrink: 0;

      font-size: 18px;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .bubble {
      max-width: 75%;

      padding:
        10px 14px;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 3px 8px rgba(0,0,0,0.05);

      word-break: break-word;
    }

    .mine .bubble {
      background: #8f7cff;
      color: white;
    }

    .chat-image {
      display: block;

      max-width: 220px;
      max-height: 300px;

      border-radius: 14px;

      margin-bottom: 5px;

      object-fit: contain;
    }

    .time {
      font-size: 10px;

      color: #999;

      margin-top: 4px;

      text-align: right;
    }

    .mine .time {
      color: #eee;
    }

    /*
      ★入力欄
      ここも固定
    */
    .input-area {
      flex-shrink: 0;

      width: 100%;

      background: white;

      padding:
        12px;

      padding-bottom:
        max(12px, env(safe-area-inset-bottom));

      display: flex;

      gap: 8px;

      border-top:
        1px solid #eee;

      z-index: 5;
    }

    .input-area input[type="text"] {
      flex: 1;

      min-width: 0;

      padding: 12px;

      border:
        1px solid #ddd;

      border-radius: 18px;

      font-size: 16px;

      outline: none;
    }

    .input-area input[type="text"]:focus {
      border-color: #8f7cff;
    }

    .image-button {
      width: 46px;
      min-width: 46px;

      border: none;

      border-radius: 18px;

      background: #f1efff;

      font-size: 21px;

      cursor: pointer;
    }

    .send-button {
      border: none;

      border-radius: 18px;

      padding:
        0 18px;

      background: #8f7cff;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .send-button:disabled,
    .image-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #imageInput {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <a
        href="home.html"
        class="home-button"
      >
        🏠 ホーム
      </a>

      <div class="profile-header">

        <div
          class="header-avatar"
          id="headerAvatar"
        >
          👤
        </div>

        <h1 id="chatTitle">
          💬 チャット
        </h1>

      </div>

    </header>


    <!--
      ★ここだけがスクロールする
    -->
    <section
      class="messages"
      id="messages"
    >

      <div class="empty">
        メッセージを読み込み中...
      </div>

    </section>


    <form
      class="input-area"
      id="messageForm"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >

      <button
        class="image-button"
        id="imageButton"
        type="button"
        title="画像を送る"
      >
        🖼️
      </button>

      <button
        class="send-button"
        id="sendButton"
        type="submit"
      >
        送信
      </button>

    </form>


    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================================
       Supabase
    ========================================= */

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       要素
    ========================================= */

    const messagesElement =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const messageForm =
      document.getElementById("messageForm");

    const sendButton =
      document.getElementById("sendButton");

    const imageButton =
      document.getElementById("imageButton");

    const imageInput =
      document.getElementById("imageInput");

    const chatTitle =
      document.getElementById("chatTitle");

    const headerAvatar =
      document.getElementById("headerAvatar");


    /* =========================================
       基本変数
    ========================================= */

    let currentUsername = "";
    let friendId = "";
    let realtimeChannel = null;

    let myAvatarUrl = "";
    let friendAvatarUrl = "";

    let restoringPosition = false;


    const params =
      new URLSearchParams(
        window.location.search
      );

    friendId =
      params.get("user") || "";


    /*
      相手ごとにスクロール位置を保存
    */

    const chatPositionKey =
      "chat-position-" +
      friendId;


    /*
      ★ブラウザのページスクロール復元をOFF
    */

    if (
      "scrollRestoration" in history
    ) {

      history.scrollRestoration =
        "manual";

    }


    /* =========================================
       ページ全体を上に戻す
       メッセージ欄には影響しない
    ========================================= */

    function resetPageScroll() {

      window.scrollTo(
        0,
        0
      );

      document.documentElement.scrollTop =
        0;

      document.body.scrollTop =
        0;

    }


    /*
      起動直後にも実行
    */

    resetPageScroll();


    /* =========================================
       プロフィール画像
    ========================================= */

    function createAvatar(
      url,
      fallback
    ) {

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "message-avatar";


      if (url) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          url;

        img.alt =
          "プロフィール画像";


        img.onerror =
          function() {

            avatar.innerHTML =
              fallback;

          };


        avatar.appendChild(
          img
        );

      } else {

        avatar.textContent =
          fallback;

      }


      return avatar;

    }


    /* =========================================
       通知
    ========================================= */

    async function createNotification() {

      if (
        !currentUsername ||
        !friendId
      ) {

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("notifications")
          .insert({

            user_id:
              friendId,

            type:
              "chat",

            title:
              "💬 新しいメッセージ",

            message:
              currentUsername +
              "さんからメッセージが届きました",

            link:
              "chat.html?user=" +
              encodeURIComponent(
                currentUsername
              ),

            is_read:
              false

          });


      if (error) {

        console.error(
          "通知作成エラー:",
          error
        );

      }

    }


    /* =========================================
       スクロール位置保存
    ========================================= */

    function saveChatPosition() {

      if (
        restoringPosition ||
        !messagesElement
      ) {

        return;

      }


      const messageElements =
        messagesElement.querySelectorAll(
          ".message[data-message-id]"
        );


      if (
        !messageElements.length
      ) {

        /*
          メッセージがない場合でも
          scrollTopだけ保存
        */

        try {

          sessionStorage.setItem(
            chatPositionKey,
            JSON.stringify({

              messageId: null,

              offset: 0,

              scrollTop:
                messagesElement.scrollTop

            })
          );

        } catch (error) {

          console.error(
            "位置保存エラー:",
            error
          );

        }

        return;

      }


      const containerRect =
        messagesElement.getBoundingClientRect();


      let target = null;


      /*
        現在見えている最初のメッセージ
      */

      for (
        const element of messageElements
      ) {

        const rect =
          element.getBoundingClientRect();


        if (
          rect.bottom >
          containerRect.top + 5
        ) {

          target =
            element;

          break;

        }

      }


      if (!target) {

        target =
          messageElements[
            messageElements.length - 1
          ];

      }


      const rect =
        target.getBoundingClientRect();


      const position = {

        messageId:
          target.dataset.messageId,

        offset:
          rect.top -
          containerRect.top,

        scrollTop:
          messagesElement.scrollTop

      };


      try {

        sessionStorage.setItem(
          chatPositionKey,
          JSON.stringify(
            position
          )
        );

      } catch (error) {

        console.error(
          "スクロール位置保存エラー:",
          error
        );

      }

    }


    /* =========================================
       スクロール中に保存
    ========================================= */

    messagesElement.addEventListener(
      "scroll",
      function() {

        if (
          restoringPosition
        ) {

          return;

        }


        saveChatPosition();

      },
      {
        passive: true
      }
    );


    /* =========================================
       ページを離れる前に保存
    ========================================= */

    window.addEventListener(
      "pagehide",
      function() {

        saveChatPosition();

      }
    );


    window.addEventListener(
      "beforeunload",
      function() {

        saveChatPosition();

      }
    );


    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState ===
          "hidden"
        ) {

          saveChatPosition();

        }

      }
    );


    /* =========================================
       画像読み込み待ち
    ========================================= */

    async function waitForImages() {

      const images =
        Array.from(
          messagesElement.querySelectorAll(
            "img.chat-image"
          )
        );


      if (!images.length) {

        return;

      }


      await Promise.all(

        images.map(
          function(img) {

            if (
              img.complete
            ) {

              return Promise.resolve();

            }


            return new Promise(
              function(resolve) {

                let finished =
                  false;


                function done() {

                  if (
                    finished
                  ) {

                    return;

                  }


                  finished =
                    true;

                  resolve();

                }


                img.addEventListener(
                  "load",
                  done,
                  {
                    once: true
                  }
                );


                img.addEventListener(
                  "error",
                  done,
                  {
                    once: true
                  }
                );


                setTimeout(
                  done,
                  3000
                );

              }
            );

          }
        )

      );

    }


    /* =========================================
       保存位置を復元
    ========================================= */

    async function restoreChatPosition() {

      let saved = null;


      try {

        saved =
          JSON.parse(
            sessionStorage.getItem(
              chatPositionKey
            ) || "null"
          );

      } catch (error) {

        saved =
          null;

      }


      /*
        保存位置がなければ一番下
      */

      if (
        !saved
      ) {

        scrollToBottom();

        return;

      }


      /*
        scrollTopだけ保存されている場合
      */

      if (
        !saved.messageId
      ) {

        restoringPosition =
          true;


        messagesElement.scrollTop =
          Number(
            saved.scrollTop || 0
          );


        requestAnimationFrame(
          function() {

            messagesElement.scrollTop =
              Number(
                saved.scrollTop || 0
              );


            restoringPosition =
              false;

          }
        );

        return;

      }


      restoringPosition =
        true;


      await waitForImages();


      function findTarget() {

        const all =
          messagesElement.querySelectorAll(
            ".message[data-message-id]"
          );


        for (
          const element of all
        ) {

          if (
            String(
              element.dataset.messageId
            ) ===
            String(
              saved.messageId
            )
          ) {

            return element;

          }

        }


        return null;

      }


      let target =
        findTarget();


      /*
        見つからない場合は保存していた
        scrollTopを使用
      */

      if (!target) {

        messagesElement.scrollTop =
          Number(
            saved.scrollTop || 0
          );

      } else {

        const containerRect =
          messagesElement.getBoundingClientRect();


        const targetRect =
          target.getBoundingClientRect();


        const currentOffset =
          targetRect.top -
          containerRect.top;


        const difference =
          currentOffset -
          Number(
            saved.offset || 0
          );


        messagesElement.scrollTop =
          messagesElement.scrollTop +
          difference;

      }


      /*
        レイアウト確定後に何度か確認
      */

      const correctPosition =
        function() {

          target =
            findTarget();


          if (!target) {

            return;

          }


          const containerRect =
            messagesElement.getBoundingClientRect();


          const targetRect =
            target.getBoundingClientRect();


          const currentOffset =
            targetRect.top -
            containerRect.top;


          const difference =
            currentOffset -
            Number(
              saved.offset || 0
            );


          if (
            Math.abs(
              difference
            ) > 1
          ) {

            messagesElement.scrollTop =
              messagesElement.scrollTop +
              difference;

          }

        };


      requestAnimationFrame(
        function() {

          correctPosition();


          requestAnimationFrame(
            function() {

              correctPosition();


              setTimeout(
                correctPosition,
                100
              );


              setTimeout(
                correctPosition,
                300
              );


              setTimeout(
                correctPosition,
                600
              );


              setTimeout(
                function() {

                  correctPosition();

                  restoringPosition =
                    false;

                },
                900
              );

            }
          );

        }
      );

    }


    /* =========================================
       一番下へ
    ========================================= */

    function scrollToBottom() {

      restoringPosition =
        true;


      function move() {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      }


      move();


      requestAnimationFrame(
        function() {

          move();


          requestAnimationFrame(
            function() {

              move();


              setTimeout(
                move,
                100
              );


              setTimeout(
                move,
                300
              );


              setTimeout(
                function() {

                  move();

                  restoringPosition =
                    false;

                },
                500
              );

            }
          );

        }
      );

    }


    /* =========================================
       開始
    ========================================= */

    async function start() {

      /*
        ★ページ全体は必ずトップ
      */

      resetPageScroll();


      if (!friendId) {

        chatTitle.textContent =
          "💬 相手が選ばれていません";


        messageForm.style.display =
          "none";


        messagesElement.innerHTML =
          '<div class="empty">フレンドから相手を選んでね</div>';


        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data.session
      ) {

        alert(
          "ログインしてください。"
        );


        window.location.href =
          "index.html";


        return;

      }


      currentUsername =
        data.session.user
          .user_metadata
          ?.username || "";


      if (!currentUsername) {

        alert(
          "ログイン中のユーザーIDを取得できませんでした。"
        );


        return;

      }


      /* 相手プロフィール */

      const {
        data: friendProfile
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "name, avatar_url"
          )
          .eq(
            "user_id",
            friendId
          )
          .maybeSingle();


      friendAvatarUrl =
        friendProfile?.avatar_url ||
        "";


      chatTitle.textContent =
        "💬 " +
        (
          friendProfile?.name ||
          friendId
        );


      if (friendAvatarUrl) {

        headerAvatar.innerHTML =
          `<img src="${friendAvatarUrl}" alt="プロフィール画像">`;

      }


      /* 自分プロフィール */

      const {
        data: myProfile
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "avatar_url"
          )
          .eq(
            "user_id",
            currentUsername
          )
          .maybeSingle();


      myAvatarUrl =
        myProfile?.avatar_url ||
        "";


      await loadMessages();


      startRealtime();

    }


    /* =========================================
       メッセージ読み込み
    ========================================= */

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${currentUsername},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUsername})`
          )
          .order(
            "created_at",
            {
              ascending:
                true
            }
          );


      if (error) {

        console.error(
          "読み込みエラー:",
          error
        );


        messagesElement.innerHTML =
          '<div class="empty">メッセージを読み込めませんでした</div>';


        return;

      }


      messagesElement.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        messagesElement.innerHTML =
          '<div class="empty">まだメッセージがありません</div>';


        return;

      }


      for (
        const message of data
      ) {

        await addMessageToScreen(
          message
        );

      }


      /*
        保存位置を復元
      */

      await restoreChatPosition();

    }


    /* =========================================
       メッセージ表示
    ========================================= */

    async function addMessageToScreen(
      message
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message";


      /*
        ★メッセージID
      */

      wrapper.dataset.messageId =
        String(
          message.id
        );


      const isMine =
        message.sender_id ===
        currentUsername;


      if (isMine) {

        wrapper.classList.add(
          "mine"
        );

      }


      if (!isMine) {

        const avatar =
          createAvatar(
            friendAvatarUrl,
            "👤"
          );


        wrapper.appendChild(
          avatar
        );

      }


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      /* 画像 */

      if (message.image_url) {

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "chat-image";


        image.alt =
          "送信された画像";


        const {
          data,
          error
        } =
          await supabaseClient.storage
            .from(
              "chat-images"
            )
            .createSignedUrl(
              message.image_url,
              3600
            );


        if (
          !error &&
          data?.signedUrl
        ) {

          image.src =
            data.signedUrl;


          bubble.appendChild(
            image
          );

        }

      }


      /* テキスト */

      if (message.content) {

        const text =
          document.createElement(
            "div"
          );


        text.textContent =
          message.content;


        bubble.appendChild(
          text
        );

      }


      /* 時刻 */

      const time =
        document.createElement(
          "div"
        );


      time.className =
        "time";


      const date =
        new Date(
          message.created_at
        );


      time.textContent =
        date.toLocaleTimeString(
          "ja-JP",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


      bubble.appendChild(
        time
      );


      wrapper.appendChild(
        bubble
      );


      if (isMine) {

        const avatar =
          createAvatar(
            myAvatarUrl,
            "😊"
          );


        wrapper.appendChild(
          avatar
        );

      }


      messagesElement.appendChild(
        wrapper
      );

    }


    /* =========================================
       リアルタイム
    ========================================= */

    function startRealtime() {

      if (realtimeChannel) {

        return;

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "chat-" +
            currentUsername +
            "-" +
            friendId
          )
          .on(
            "postgres_changes",
            {
              event:
                "INSERT",

              schema:
                "public",

              table:
                "messages"
            },
            async function(payload) {

              const message =
                payload.new;


              const isThisChat =
                (
                  message.sender_id ===
                    currentUsername &&
                  message.receiver_id ===
                    friendId
                ) ||
                (
                  message.sender_id ===
                    friendId &&
                  message.receiver_id ===
                    currentUsername
                );


              if (!isThisChat) {

                return;

              }


              /*
                自分のメッセージは
                すでに追加済み
              */

              if (
                message.sender_id ===
                currentUsername
              ) {

                return;

              }


              await addMessageToScreen(
                message
              );


              /*
                相手から来たら一番下
              */

              scrollToBottom();

            }
          )
          .subscribe();

    }


    /* =========================================
       テキスト送信
    ========================================= */

    messageForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (!text) {

          return;

        }


        if (
          !currentUsername ||
          !friendId
        ) {

          alert(
            "ログイン情報または相手の情報を取得できません。"
          );


          return;

        }


        sendButton.disabled =
          true;


        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUsername,

              receiver_id:
                friendId,

              content:
                text,

              image_url:
                ""

            })
            .select()
            .single();


        sendButton.disabled =
          false;


        if (error) {

          console.error(
            "送信エラー:",
            error
          );


          alert(
            "メッセージを送信できませんでした。\n\n" +
            error.message
          );


          return;

        }


        messageInput.value =
          "";


        await addMessageToScreen(
          data
        );


        /*
          ★送信時は一番下
        */

        scrollToBottom();


        await createNotification();

      }
    );


    /* =========================================
       画像ボタン
    ========================================= */

    imageButton.addEventListener(
      "click",
      function() {

        imageInput.click();

      }
    );


    /* =========================================
       画像送信
    ========================================= */

    imageInput.addEventListener(
      "change",
      async function() {

        const file =
          imageInput.files?.[0];


        if (!file) {

          return;

        }


        if (
          !currentUsername ||
          !friendId
        ) {

          alert(
            "ログイン情報または相手の情報を取得できません。"
          );


          imageInput.value =
            "";


          return;

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "画像ファイルを選んでください。"
          );


          imageInput.value =
            "";


          return;

        }


        imageButton.disabled =
          true;

        sendButton.disabled =
          true;


        try {

          const extension =
            file.name
              .split(".")
              .pop() ||
            "jpg";


          const filePath =
            currentUsername +
            "/" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .slice(2) +
            "." +
            extension;


          const {
            error:
              uploadError
          } =
            await supabaseClient.storage
              .from(
                "chat-images"
              )
              .upload(
                filePath,
                file,
                {
                  contentType:
                    file.type,

                  upsert:
                    false
                }
              );


          if (uploadError) {

            console.error(
              "画像アップロードエラー:",
              uploadError
            );


            alert(
              "画像をアップロードできませんでした。\n\n" +
              uploadError.message
            );


            return;

          }


          const {
            data,
            error
          } =
            await supabaseClient
              .from("messages")
              .insert({

                sender_id:
                  currentUsername,

                receiver_id:
                  friendId,

                content:
                  "",

                image_url:
                  filePath

              })
              .select()
              .single();


          if (error) {

            console.error(
              "画像メッセージ保存エラー:",
              error
            );


            alert(
              "画像メッセージを保存できませんでした。\n\n" +
              error.message
            );


            return;

          }


          await addMessageToScreen(
            data
          );


          /*
            ★画像送信後も一番下
          */

          scrollToBottom();


          await createNotification();

        } finally {

          imageButton.disabled =
            false;


          sendButton.disabled =
            false;


          imageInput.value =
            "";

        }

      }
    );


    /* =========================================
       起動
    ========================================= */

    start();

  </script>

</body>
</html>
