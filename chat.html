async function editMessage(id,currentContent){
 if(!currentContent){alert("画像メッセージは編集できません。");return}
 const value=prompt("メッセージを編集してください",currentContent);
 if(value===null)return;
 const text=value.trim();
 if(!text)return;
 const {error}=await db.from("messages").update({content:text,is_edited:true}).eq("id",id).eq("sender_id",currentUsername);
 if(error){alert("メッセージの編集に失敗しました。\n\n"+error.message);return}
 await loadMessages();
}
async function toggleReaction(messageId,reaction){
 const {data:old,error:findError}=await db.from("chat_reactions").select("id").eq("message_id",messageId).eq("user_id",currentUsername).eq("reaction",reaction).maybeSingle();
 if(findError){alert("リアクションを確認できませんでした。\n\n"+findError.message);return}
 let result;
 if(old){
  result=await db.from("chat_reactions").delete().eq("id",old.id).eq("user_id",currentUsername);
 }else{
  result=await db.from("chat_reactions").insert({message_id:messageId,user_id:currentUsername,reaction});
 }
 if(result.error){alert("リアクションに失敗しました。\n\n"+result.error.message);return}
 await loadMessages();
}
function setReplyTarget(message){
 replyTarget=message;
 $("replyBarText").textContent="↩️ "+(message.content||"画像")+" に返信";
 $("replyBar").classList.add("show");
 messageInput.placeholder="返信を入力...";
 messageInput.focus();
}
function clearReplyTarget(){
 replyTarget=null;
 $("replyBar").classList.remove("show");
 $("replyBarText").textContent="";
 messageInput.placeholder="メッセージを入力...";
}
async function sendReply(content){
 if(!replyTarget||!content||!currentUsername)return false;
 const {error}=await db.from("chat_replies").insert({message_id:replyTarget.id,sender_id:currentUsername,content});
 if(error){alert("返信を送信できませんでした。\n\n"+error.message);return false}
 const target=replyTarget;
 clearReplyTarget();
 await loadMessages();
 await sendPushToUser(target.sender_id,"↩️ "+currentUsername+"さんが返信",currentUsername+"さんがあなたのメッセージに返信しました","./chat.html?user="+encodeURIComponent(currentUsername));
 return true;
}
async function loadChatExtras(messages){
 const ids=messages.map(m=>m.id);
 if(!ids.length)return {replies:[],reactions:[]};
 const [r1,r2]=await Promise.all([
  db.from("chat_replies").select("id,message_id,sender_id,content,created_at").in("message_id",ids).order("created_at",{ascending:true}),
  db.from("chat_reactions").select("id,message_id,user_id,reaction").in("message_id",ids)
 ]);
 if(r1.error)console.warn("返信取得エラー:",r1.error);
 if(r2.error)console.warn("リアクション取得エラー:",r2.error);
 return {replies:r1.data||[],reactions:r2.data||[]};
}
async function deleteMessage(id){
 if(!confirm("このメッセージを送信取り消ししますか？"))return;
 const {error}=await db.from("messages").update({is_deleted:true}).eq("id",id).eq("sender_id",currentUsername);
 if(error){alert("送信取り消しに失敗しました。\n\n"+error.message);return}
 await loadMessages();scrollToBottom();
}
async function reportChatMessage(message){
 if(!message?.sender_id||message.sender_id===currentUsername)return;
 const reason=prompt("このメッセージを通報する理由を入力してください","暴言・不適切な内容");
 if(reason===null||!reason.trim())return;
 const {error}=await db.from("user_reports").insert({
  reporter_id:currentUsername,
  target_type:"chat_message",
  target_id:String(message.id),
  target_user:message.sender_id,
  reason:reason.trim(),
  message_id:String(message.id),
  message_content:message.content||"",
  message_image_url:message.image_url||""
 });
 if(error){
  console.error("個別チャット通報エラー:",error);
  alert("通報に失敗しました。\n\n"+error.message);
  return;
 }
 alert("🚨 通報を送信しました。管理者が確認します。");
}

function mediaKind(path){
 const v=String(path||"");
 if(v.startsWith("video:"))return "video";
 if(v.startsWith("audio:"))return "audio";
 return "image";
}
function mediaPath(path){return String(path||"").replace(/^video:/,"").replace(/^audio:/,"");}
function showMediaStatus(text){if(!mediaStatus)return;mediaStatus.textContent=text||"";mediaStatus.classList.toggle("show",!!text)}
function closeMediaMenu(){mediaMenu?.classList.remove("show")}
function makeMediaMessage(message,url,kind){
 if(kind==="video"){const video=document.createElement("video");video.className="chat-video";video.controls=true;video.playsInline=true;video.preload="metadata";video.src=url;return video}
 if(kind==="audio"){const audio=document.createElement("audio");audio.className="chat-audio";audio.controls=true;audio.preload="metadata";audio.src=url;return audio}
 const img=document.createElement("img");img.className="chat-image";img.src=url;img.alt="送信された画像";return img
}
async function uploadMediaFile(file,kind){
 if(!file||!currentUsername||!friendId)return;
 const allowed=kind==="image"?file.type.startsWith("image/"):kind==="video"?file.type.startsWith("video/"):file.type.startsWith("audio/");
 if(!allowed){alert(kind==="image"?"画像ファイルを選んでください。":kind==="video"?"動画ファイルを選んでください。":"音声ファイルを選んでください。");return}
 closeMediaMenu();imageInput.value="";videoInput.value="";plusButton.disabled=true;sendButton.disabled=true;
 showMediaStatus(kind==="image"?"🖼️ 画像を送信中…":kind==="video"?"🎥 動画を送信中…":"🎙️ 音声を送信中…");
 try{
  const ext=(file.name.split(".").pop()||({image:"jpg",video:"mp4",audio:"webm"}[kind]||"bin")).replace(/[^a-zA-Z0-9]/g,"");
  const path=currentUsername+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
  const up=await db.storage.from("chat-images").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});if(up.error)throw up.error;
  const storedPath=(kind==="video"?"video:":kind==="audio"?"audio:":"")+path;
  const {data,error}=await db.from("messages").insert({sender_id:currentUsername,receiver_id:friendId,content:"",image_url:storedPath,is_deleted:false,is_edited:false}).select().single();if(error)throw error;
  const {data:signed}=await db.storage.from("chat-images").createSignedUrl(path,3600);
  messagesElement.appendChild(createMessageElement(data,signed?.signedUrl||""));scrollToBottom();updateLatestButton();
  const label=kind==="image"?"🖼️ 画像を送信しました":kind==="video"?"🎥 動画を送信しました":"🎙️ ボイスメッセージを送信しました";
  await createNotification(label);await sendPushToUser(friendId,"💬 "+currentUsername+"さんからメッセージ",label,"./chat.html?user="+encodeURIComponent(currentUsername));
 }catch(e){console.error(e);alert("送信に失敗しました。\n\n"+(e?.message||e))}
 finally{plusButton.disabled=false;sendButton.disabled=false;showMediaStatus("")}
}
let mediaRecorder=null,mediaChunks=[],voiceStream=null,voiceRecording=false;
async function toggleVoiceRecording(){
 if(voiceRecording){mediaRecorder?.stop();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert("この端末・ブラウザではボイスメッセージを録音できません。");return}
 try{
  closeMediaMenu();voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(x=>MediaRecorder.isTypeSupported(x))||"";
  mediaRecorder=new MediaRecorder(voiceStream,mime?{mimeType:mime}:undefined);mediaChunks=[];voiceRecording=true;
  menuVoiceButton.textContent="⏹️ 録音を停止";showMediaStatus("🔴 録音中…もう一度押すと送信します");
  mediaRecorder.ondataavailable=e=>{if(e.data?.size)mediaChunks.push(e.data)};
  mediaRecorder.onstop=async()=>{
   voiceRecording=false;menuVoiceButton.textContent="🎙️ ボイスメッセージ";voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;
   const type=mediaRecorder?.mimeType||"audio/webm",ext=type.includes("mp4")?"m4a":"webm",blob=new Blob(mediaChunks,{type});mediaRecorder=null;mediaChunks=[];
   if(blob.size)await uploadMediaFile(new File([blob],"voice."+ext,{type}),"audio");
  };
  mediaRecorder.start();
 }catch(e){console.error(e);voiceRecording=false;voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;alert("マイクを使用できませんでした。\n\n"+(e?.message||e))}
}

async function loadMessages(){
 if(!currentUsername||!friendId){messagesElement.innerHTML='<div class="empty">ユーザー情報を取得できませんでした</div>';return}
 messagesElement.innerHTML='<div class="empty">メッセージを読み込み中...</div>';
 const [a,b]=await Promise.all([
  db.from("messages").select("id,sender_id,receiver_id,content,image_url,created_at,is_deleted,is_edited").eq("sender_id",currentUsername).eq("receiver_id",friendId),
  db.from("messages").select("id,sender_id,receiver_id,content,image_url,created_at,is_deleted,is_edited").eq("sender_id",friendId).eq("receiver_id",currentUsername)
 ]);
 if(a.error||b.error){console.error(a.error||b.error);messagesElement.innerHTML='<div class="empty">メッセージを読み込めませんでした</div>';return}
 const messages=[...(a.data||[]),...(b.data||[])].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));
 await loadReadStatuses(messages);const urls=await prepareImageUrls(messages);const extras=await loadChatExtras(messages);await markMessagesAsRead(messages);messagesElement.innerHTML="";
 if(!messages.length){messagesElement.innerHTML='<div class="empty">まだメッセージがありません</div>';updateLatestButton();return}
 const f=document.createDocumentFragment();messages.forEach(m=>f.appendChild(createMessageElement(m,urls.get(m.id)||"",extras)));messagesElement.appendChild(f);scrollToBottom();updateLatestButton();
}
function startIncomingCallListener(){
 if(!currentUsername)return;

 const inboxName="friend-call-inbox-"+encodeURIComponent(currentUsername);
 incomingCallChannel=db.channel(inboxName);

 incomingCallChannel
  .on("broadcast",{event:"incoming-call"},async payload=>{
    const data=payload?.payload||{};

    if(!data.from||data.from===currentUsername)return;
    if(data.type!=="ring")return;
    if(data.to&&data.to!==currentUsername)return;
    if(!data.callId)return;

    incomingCallId=data.callId;
    incomingCallTitle.textContent="📞 "+data.from+"さんから着信";

    /* 相手のプロフィールを取得して表示 */
    try{
      const {data:callerProfile}=await db
        .from("profiles")
        .select("user_id,name,avatar_url")
        .eq("user_id",data.from)
        .maybeSingle();

      const callerName=callerProfile?.name||data.from;
      incomingCallTitle.textContent="📞 "+callerName+"さんから着信";

      incomingCallAvatar.innerHTML="";
      if(callerProfile?.avatar_url){
        const img=document.createElement("img");
        img.src=callerProfile.avatar_url;
        img.alt="プロフィール画像";
        img.style.width="100%";
        img.style.height="100%";
        img.style.objectFit="cover";
        img.onerror=()=>{incomingCallAvatar.textContent="👤"};
        incomingCallAvatar.appendChild(img);
      }else{
        incomingCallAvatar.textContent="👤";
      }
    }catch(e){
      console.warn("発信者プロフィール取得:",e);
      incomingCallAvatar.textContent="👤";
    }

    /* 発信者IDを保持 */
    incomingCallOverlay.dataset.caller=data.from;
    incomingCallOverlay.style.display="flex";
  })
  .subscribe(st=>{
    if(st!=="SUBSCRIBED"){
      console.warn("通話着信チャンネル:",st);
    }
  });
}

async function closeIncomingCallChannel(){
 if(incomingCallChannel){
   await db.removeChannel(incomingCallChannel);
   incomingCallChannel=null;
 }
}

incomingCallAccept.onclick=async()=>{
 if(!incomingCallId)return;

 const caller=incomingCallOverlay.dataset.caller||"";
 if(!caller)return;
 const callParam=encodeURIComponent(incomingCallId);

 incomingCallOverlay.style.display="none";
 await closeIncomingCallChannel();

 location.href=
   "call.html?user="+encodeURIComponent(caller)+
   "&incoming=1&call="+callParam;
};

incomingCallReject.onclick=async()=>{
 if(!incomingCallId){
   incomingCallOverlay.style.display="none";
   return;
 }

 const caller=incomingCallOverlay.dataset.caller||"";
 if(caller){
   try{
     const pair=[currentUsername,caller].sort().map(encodeURIComponent).join("-");
     const rejectChannel=db.channel("friend-call-"+pair);
     await new Promise(resolve=>{
       rejectChannel.subscribe(st=>{
         if(st==="SUBSCRIBED")resolve();
       });
     });
     await rejectChannel.send({
       type:"broadcast",
       event:"call",
       payload:{
         type:"reject",
         callId:incomingCallId,
         from:currentUsername
       }
     });
     await db.removeChannel(rejectChannel);
   }catch(error){
     console.warn("着信拒否通知:",error);
   }
 }

 incomingCallOverlay.style.display="none";
 incomingCallId="";
delete incomingCallOverlay.dataset.caller;
};
