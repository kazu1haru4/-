<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: white;
      padding: 18px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
    }

    .empty {
      text-align: center;
      color: #999;
      margin-top: 40px;
    }

    .message {
      display: flex;
      margin-bottom: 12px;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      word-break: break-word;
    }

    .mine .bubble {
      background: #8f7cff;
      color: white;
    }

    .time {
      font-size: 10px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    .mine .time {
      color: #eee;
    }

    .input-area {
      background: white;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #eee;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 18px;
      font-size: 16px;
    }

    .send-button {
      border: none;
      border-radius: 18px;
      padding: 0 18px;
      background: #8f7cff;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1 id="chatTitle">💬 チャット</h1>
    </header>

    <section class="messages" id="messages">
      <div class="empty">メッセージを読み込み中...</div>
    </section>

    <form class="input-area" id="messageForm">

      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >

      <button
        class="send-button"
        type="submit"
      >
        送信
      </button>

    </form>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const messagesElement =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const messageForm =
      document.getElementById("messageForm");

    const chatTitle =
      document.getElementById("chatTitle");


    let currentUser = null;
    let friendId = "";


    // URLから相手のユーザーIDを取得
    const params =
      new URLSearchParams(window.location.search);

    friendId =
      params.get("user") || "";


    async function start() {

      if (!friendId) {

        chatTitle.textContent =
          "💬 チャット相手がいません";

        messagesElement.innerHTML =
          '<div class="empty">フレンドから相手を選んでね</div>';

        messageForm.style.display = "none";

        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error || !data.session) {

        alert("ログインしてください。");

        window.location.href =
          "index.html";

        return;
      }


      currentUser =
        data.session.user;


      // 相手の名前を取得
      const {
        data: profile
      } =
        await supabaseClient
          .from("profiles")
          .select("name")
          .eq("user_id", friendId)
          .maybeSingle();


      chatTitle.textContent =
        "💬 " +
        (profile?.name || friendId);


      await loadMessages();

    }


    // ==============================
    // メッセージ読み込み
    // ==============================

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`
          )
          .order("created_at", {
            ascending: true
          });


      if (error) {

        console.error(error);

        messagesElement.innerHTML =
          '<div class="empty">メッセージを読み込めませんでした</div>';

        return;
      }


      messagesElement.innerHTML = "";


      if (!data || data.length === 0) {

        messagesElement.innerHTML =
          '<div class="empty">まだメッセージがありません</div>';

        return;
      }


      for (const message of data) {

        addMessageToScreen(message);

      }


      scrollToBottom();

    }


    // ==============================
    // 画面にメッセージを表示
    // ==============================

    function addMessageToScreen(message) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message";


      const isMine =
        message.sender_id === currentUser.id;


      if (isMine) {

        wrapper.classList.add("mine");

      }


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      bubble.textContent =
        message.content || "";


      const time =
        document.createElement("div");

      time.className =
        "time";


      const date =
        new Date(message.created_at);


      time.textContent =
        date.toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      bubble.appendChild(time);
      wrapper.appendChild(bubble);

      messagesElement.appendChild(wrapper);

    }


    function scrollToBottom() {

      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }


    // ==============================
    // メッセージ送信
    // ==============================

    messageForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (!text) {
          return;
        }


        if (!currentUser || !friendId) {
          return;
        }


        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUser.id,

              receiver_id:
                friendId,

              content:
                text,

              image_url:
                ""

            })
            .select()
            .single();


        if (error) {

          console.error(error);

          alert("メッセージを送信できませんでした。");

          return;
        }


        messageInput.value = "";


        addMessageToScreen(data);

        scrollToBottom();

      }
    );


    start();

  </script>

</body>
</html>
