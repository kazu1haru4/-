<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チャット</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff3fb,#eef5ff);color:#333}
.container{width:100%;max-width:600px;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden}
.header{position:relative;flex-shrink:0;background:#fff;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.06);z-index:5}
.header h1{margin:0;font-size:18px}
.home-button{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;padding:9px 12px;background:#f5f5f5;color:#555;text-decoration:none;border-radius:12px;font-size:13px;font-weight:bold}
.profile-header{margin-top:8px;display:flex;justify-content:center;align-items:center;gap:9px}
.header-avatar-frame,.message-avatar-frame{position:relative;border-radius:50%;padding:3px;flex-shrink:0;transition:.2s}
.header-avatar-frame{width:48px;height:48px;background:#eee8ff}
.message-avatar-frame{width:40px;height:40px;background:#eee8ff}
.header-avatar,.message-avatar{width:100%;height:100%;border-radius:50%;background:#eee8ff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid white}
.header-avatar{font-size:20px}.message-avatar{font-size:18px}
.header-avatar img,.message-avatar img{width:100%;height:100%;object-fit:cover;display:block;filter:none}
.avatar-badge,.message-avatar-badge{position:absolute;border-radius:50%;background:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.18),0 0 0 2px #fff;z-index:5}
.avatar-badge{top:-7px;right:-7px;width:25px;height:25px;font-size:15px}
.message-avatar-badge{top:-6px;right:-6px;width:22px;height:22px;font-size:13px}
.avatar-badge.show,.message-avatar-badge.show{display:flex}
.friend-status{margin-top:3px;font-size:12px;font-weight:bold}.online{color:#22a447}.offline{color:#999}
.messages-wrapper{position:relative;flex:1;min-height:0;overflow:hidden}
.messages{width:100%;height:100%;padding:18px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:#999;margin-top:40px}
.message{display:flex;align-items:flex-end;gap:7px;margin-bottom:12px}.message.mine{justify-content:flex-end}
.message-content-box{display:flex;flex-direction:column;align-items:flex-end;max-width:75%}
.bubble{max-width:100%;padding:10px 14px;border-radius:18px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.05);word-break:break-word}
.mine .bubble{background:#8f7cff;color:#fff}
.chat-image{display:block;max-width:220px;max-height:300px;border-radius:14px;margin-bottom:5px;object-fit:contain}
.time{font-size:10px;color:#999;margin-top:4px;text-align:right}.mine .time{color:#eee}
.read-status{font-size:10px;color:#8f7cff;margin-top:3px;font-weight:bold}
.deleted-message{color:#999!important;background:#f1f1f1!important;box-shadow:none!important;font-size:13px;font-style:italic}
.delete-button{border:0;background:rgba(255,255,255,.9);color:#777;border-radius:10px;padding:5px 8px;margin-top:5px;font-size:11px}
.latest-button{position:absolute;right:16px;bottom:16px;border:0;background:#8f7cff;color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:10}.latest-button.show{opacity:1;transform:none;pointer-events:auto}
.input-area{flex-shrink:0;background:#fff;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid #eee;z-index:5}
.input-area input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:18px;font-size:16px;outline:0}.input-area input:focus{border-color:#8f7cff}
.image-button{width:46px;min-width:46px;border:0;border-radius:18px;background:#f1efff;font-size:21px}.send-button{border:0;border-radius:18px;padding:0 18px;background:#8f7cff;color:#fff;font-weight:bold}
button:disabled{opacity:.5}#imageInput{display:none}

/* フレーム */
.frame-sakura{background:linear-gradient(135deg,#ff77b7,#ffb7d5,#ffd6e7,#ff77b7)!important;box-shadow:0 3px 9px rgba(255,119,183,.35)!important}
.frame-star{background:linear-gradient(135deg,#f4bf3f,#ffe58a,#fff3b0,#e7a900)!important;box-shadow:0 3px 9px rgba(244,191,63,.35)!important}
.frame-diamond{background:linear-gradient(135deg,#38bdf8,#a5f3fc,#fff,#38bdf8)!important;box-shadow:0 3px 9px rgba(56,189,248,.35)!important}
.frame-heart{background:linear-gradient(135deg,#ff2d55,#ff6b9d,#ff9ec4,#ff2d55)!important;box-shadow:0 3px 9px rgba(255,45,85,.35)!important}
.frame-rainbow{background:linear-gradient(135deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de)!important;box-shadow:0 0 8px rgba(255,120,200,.45),0 0 16px rgba(80,180,255,.35)!important}
.frame-flame{background:linear-gradient(135deg,#ff2d00,#ff5e00,#ff9500,#ffd60a,#ff3b30)!important;box-shadow:0 3px 10px rgba(255,80,0,.35)!important}
.frame-sea{background:linear-gradient(135deg,#007aff,#00c7be,#00e5ff,#0066ff,#0047ab)!important;box-shadow:0 3px 10px rgba(0,122,255,.35)!important}
.frame-space{background:linear-gradient(135deg,#09001f,#24105c,#5b21b6,#111827,#020617)!important;box-shadow:0 3px 10px rgba(91,33,182,.4)!important}
.frame-neon{background:linear-gradient(135deg,#00f5ff,#00ff87,#fff000,#ff00e5,#7a00ff,#00f5ff)!important;box-shadow:0 0 7px rgba(0,255,255,.7),0 0 14px rgba(255,0,230,.5)!important}
.admin-frame{background:linear-gradient(135deg,#fff4a8,#ffd700,#fff7bd,#e8ad00,#fff4a8)!important;box-shadow:0 0 12px rgba(255,215,0,.55)!important}

/* 名前装飾 */
.name-decoration-sakura{color:#ff4f9a!important;text-shadow:0 0 5px #ffd0e5}
.name-decoration-star{color:#d99d00!important;text-shadow:0 0 5px #ffe58a}
.name-decoration-diamond{color:#159ed1!important;text-shadow:0 0 6px #a5f3fc}
.name-decoration-heart{color:#ff3866!important;text-shadow:0 0 5px #ffb0c5}
.name-decoration-rainbow{background:linear-gradient(90deg,#ff3b30,#ff9500,#34c759,#007aff,#af52de);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.name-decoration-flame{color:#ff4b00!important;text-shadow:0 0 5px #ffb000}
.name-decoration-sea{color:#007aff!important;text-shadow:0 0 5px #00e5ff}
.name-decoration-space{color:#7b5cff!important;text-shadow:0 0 6px #c4b5fd}
.name-decoration-neon{color:#00d9ff!important;text-shadow:0 0 5px #00ffff,0 0 10px #ff00e5}
.name-decoration-admin{color:#d49b00!important;font-weight:900;text-shadow:0 0 5px #ffd700}
.chat-name{font-size:12px;font-weight:800;margin-bottom:3px;align-self:flex-start}
.mine .chat-name{align-self:flex-end}
</style>
</head>
<body>
<main class="container">
<header class="header">
<a href="home.html" class="home-button">🏠 ホーム</a>
<div class="profile-header">
<div id="headerAvatarFrame" class="header-avatar-frame"><div id="headerAvatar" class="header-avatar">👤</div><div id="headerAvatarBadge" class="avatar-badge"></div></div>
<div><h1 id="chatTitle">💬 チャット</h1><div id="friendStatus" class="friend-status offline">⚪ オフライン</div></div>
</div>
</header>
<div class="messages-wrapper">
<section class="messages" id="messages"><div class="empty">メッセージを読み込み中...</div></section>

<button class="send-button" id="sendButton" type="submit">送信</button>
</form>
<input id="imageInput" type="file" accept="image/*">
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

let currentUsername="",myAvatarUrl="",friendAvatarUrl="",myItem=null,friendItem=null,myName="",friendName="",myNameClass="",friendNameClass="",realtimeChannel=null,presenceTimer=null,readMessageIds=new Set();

 if(friendAvatarUrl){const img=document.createElement("img");img.src=friendAvatarUrl;img.alt="プロフィール画像";img.onerror=()=>{headerAvatar.textContent="👤"};headerAvatar.appendChild(img)}else headerAvatar.textContent="👤";

}

 if(url){const img=document.createElement("img");img.src=url;img.alt="プロフィール画像";img.onerror=()=>{av.textContent=fallback};av.appendChild(img)}else av.textContent=fallback;
 frame.appendChild(av);
 if(item?.icon){const b=document.createElement("div");b.className="message-avatar-badge show";b.textContent=item.icon;b.style.border="2px solid "+(item.frame_color||"#eee8ff");frame.appendChild(b)}

}
async function updateFriendStatus(){
 if(!friendId)return;
 const {data}=await db.from("user_presence").select("last_seen").eq("user_id",friendId).maybeSingle();
 const online=data?.last_seen&&!Number.isNaN(new Date(data.last_seen).getTime())&&Date.now()-new Date(data.last_seen).getTime()<=ONLINE_LIMIT;
 friendStatus.className="friend-status "+(online?"online":"offline");friendStatus.textContent=online?"🟢 オンライン":"⚪ オフライン";

async function updateMyPresence(){if(currentUsername)await db.from("user_presence").upsert({user_id:currentUsername,last_seen:new Date().toISOString()},{onConflict:"user_id"})}
async function createNotification(){if(!currentUsername||!friendId)return;await db.from("notifications").insert({user_id:friendId,type:"chat",title:"💬 新しいメッセージ",message:currentUsername+"さんからメッセージが届きました",link:"chat.html?user="+encodeURIComponent(currentUsername),is_read:false})}
function scrollToBottom(smooth=false){messagesElement.scrollTo({top:messagesElement.scrollHeight,behavior:smooth?"smooth":"auto"})}
function updateLatestButton(){messagesElement.scrollHeight-messagesElement.scrollTop-messagesElement.clientHeight>150?latestButton.classList.add("show"):latestButton.classList.remove("show")}
messagesElement.addEventListener("scroll",updateLatestButton,{passive:true});latestButton.onclick=()=>scrollToBottom(true);

async function markMessagesAsRead(messages){
 const unread=messages.filter(m=>m.sender_id===friendId&&m.receiver_id===currentUsername&&!m.is_deleted&&!readMessageIds.has(m.id));
 if(!unread.length)return;
 const {error}=await db.from("message_reads").upsert(unread.map(m=>({message_id:m.id,user_id:currentUsername})),{onConflict:"message_id,user_id"});
 if(!error)unread.forEach(m=>readMessageIds.add(m.id));else console.error("既読保存:",error);
}
async function loadReadStatuses(messages){
 readMessageIds=new Set();const mine=messages.filter(m=>m.sender_id===currentUsername&&m.receiver_id===friendId);if(!mine.length)return;
 const {data,error}=await db.from("message_reads").select("message_id").eq("user_id",friendId).in("message_id",mine.map(m=>m.id));
 if(!error)(data||[]).forEach(x=>readMessageIds.add(x.message_id));
}
async function prepareImageUrls(messages){
 const list=messages.filter(m=>!m.is_deleted&&m.image_url);if(!list.length)return new Map();
 const out=await Promise.all(list.map(async m=>{const {data,error}=await db.storage.from("chat-images").createSignedUrl(m.image_url,3600);return[m.id,error?"":data?.signedUrl||""]}));return new Map(out);
}
async function deleteMessage(id){
 if(!confirm("このメッセージを送信取り消ししますか？"))return;
 const {error}=await db.from("messages").update({is_deleted:true}).eq("id",id).eq("sender_id",currentUsername);
 if(error){alert("送信取り消しに失敗しました。\n\n"+error.message);return}await loadMessages();scrollToBottom();
}
function createMessageElement(message,imageUrl){
 const wrap=document.createElement("div");wrap.className="message";wrap.dataset.messageId=message.id;
 const mine=message.sender_id===currentUsername;if(mine)wrap.classList.add("mine");
 const item=mine?myItem:friendItem,avatarUrl=mine?myAvatarUrl:friendAvatarUrl,name=mine?myName:friendName,nc=mine?myNameClass:friendNameClass;
 if(!mine)wrap.appendChild(createAvatar(avatarUrl,"👤",item));
 const box=document.createElement("div");box.className="message-content-box";
 const nm=document.createElement("div");nm.className="chat-name "+(nc||"");nm.textContent=name||message.sender_id;box.appendChild(nm);
 const bubble=document.createElement("div");bubble.className="bubble";
 if(message.is_deleted){bubble.classList.add("deleted-message");bubble.textContent="このメッセージは取り消されました"}
 else{
  if(imageUrl){const img=document.createElement("img");img.className="chat-image";img.src=imageUrl;img.alt="送信された画像";bubble.appendChild(img)}
  if(message.content){const t=document.createElement("div");t.textContent=message.content;bubble.appendChild(t)}
 }
 const time=document.createElement("div");time.className="time";time.textContent=new Date(message.created_at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});bubble.appendChild(time);box.appendChild(bubble);
 if(mine&&!message.is_deleted&&readMessageIds.has(message.id)){const r=document.createElement("div");r.className="read-status";r.textContent="既読";box.appendChild(r)}
 if(mine&&!message.is_deleted){const b=document.createElement("button");b.type="button";b.className="delete-button";b.textContent="🗑️ 送信取り消し";b.onclick=e=>{e.preventDefault();e.stopPropagation();deleteMessage(message.id)};box.appendChild(b)}
 if(!mine&&!message.is_deleted){const b=document.createElement("button");b.type="button";b.className="delete-button report-button";b.textContent="🚨 通報";b.onclick=e=>{e.preventDefault();e.stopPropagation();reportMessage(message)};box.appendChild(b)}
 wrap.appendChild(box);if(mine)wrap.appendChild(createAvatar(avatarUrl,"😊",item));return wrap;
}

async function reportMessage(message){
 const targetUser=message.sender_id;
 if(!targetUser||targetUser===currentUsername)return;
 const reason=prompt("このメッセージを通報する理由を入力してください", "暴言・不適切な内容");
 if(reason===null||!reason.trim())return;
 const {error}=await db.from("user_reports").insert({
  reporter_id:currentUsername,
  target_type:"message",
  target_id:String(message.id),
  target_user:targetUser,
  reason:reason.trim(),
  message_id:String(message.id),
  message_content:message.content||"",
  message_image_url:message.image_url||""

 if(error){alert("通報に失敗しました。\n\n"+error.message);return}

}

 if(!currentUsername||!friendId){messagesElement.innerHTML='<div class="empty">ユーザー情報を取得できませんでした</div>';return}
 messagesElement.innerHTML='<div class="empty">メッセージを読み込み中...</div>';

  db.from("messages").select("id,sender_id,receiver_id,content,image_url,created_at,is_deleted").eq("sender_id",currentUsername).eq("receiver_id",friendId),
  db.from("messages").select("id,sender_id,receiver_id,content,image_url,created_at,is_deleted").eq("sender_id",friendId).eq("receiver_id",currentUsername)
 ]);
 if(a.error||b.error){console.error(a.error||b.error);messagesElement.innerHTML='<div class="empty">メッセージを読み込めませんでした</div>';return}
 const messages=[...(a.data||[]),...(b.data||[])].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));

 if(realtimeChannel)return;
 realtimeChannel=db.channel("chat-"+currentUsername+"-"+friendId)
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async p=>{
  const m=p.new,isChat=(m.sender_id===currentUsername&&m.receiver_id===friendId)||(m.sender_id===friendId&&m.receiver_id===currentUsername);if(!isChat||m.sender_id===currentUsername)return;
  await markMessagesAsRead([m]);let u="";if(m.image_url){const {data}=await db.storage.from("chat-images").createSignedUrl(m.image_url,3600);u=data?.signedUrl||""}messagesElement.appendChild(createMessageElement(m,u));scrollToBottom();updateLatestButton();
 }).on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},async p=>{const m=p.new;if((m.sender_id===currentUsername&&m.receiver_id===friendId)||(m.sender_id===friendId&&m.receiver_id===currentUsername))await loadMessages()})

 .subscribe();
}
messageForm.onsubmit=async e=>{
 e.preventDefault();const text=messageInput.value.trim();if(!text||!currentUsername||!friendId)return;sendButton.disabled=true;

 const file=imageInput.files?.[0];if(!file)return;

  const {data:signed}=await db.storage.from("chat-images").createSignedUrl(path,3600);messagesElement.appendChild(createMessageElement(data,signed?.signedUrl||""));scrollToBottom();updateLatestButton();createNotification();
 }catch(e){console.error(e);alert("画像を送信できませんでした。\n\n"+e.message)}finally{imageButton.disabled=false;sendButton.disabled=false;imageInput.value=""}

window.addEventListener("pagehide",()=>{if(presenceTimer)clearInterval(presenceTimer);if(realtimeChannel)db.removeChannel(realtimeChannel)});
async function start(){
 if(!friendId){chatTitle.textContent="💬 相手が選ばれていません";messageForm.style.display="none";messagesElement.innerHTML='<div class="empty">フレンドから相手を選んでね</div>';return}
 const {data,error}=await db.auth.getSession();if(error||!data.session){alert("ログインしてください。");location.href="index.html";return}
