<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: relative;
      background: white;
      padding: 12px 18px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
    }

    .home-button {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 9px 12px;
      background: #f5f5f5;
      color: #555;
      text-decoration: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      z-index: 2;
    }

    .profile-header {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #eee8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 20px;
    }

    .header-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .notification-button {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      padding: 9px 11px;
      background: #fff4cc;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .notification-button.enabled {
      background: #e7f8e7;
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
    }

    .empty {
      text-align: center;
      color: #999;
      margin-top: 40px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      margin-bottom: 12px;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #eee8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 18px;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      word-break: break-word;
    }

    .mine .bubble {
      background: #8f7cff;
      color: white;
    }

    .chat-image {
      display: block;
      max-width: 220px;
      max-height: 300px;
      border-radius: 14px;
      margin-bottom: 5px;
      object-fit: contain;
    }

    .time {
      font-size: 10px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    .mine .time {
      color: #eee;
    }

    .input-area {
      background: white;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #eee;
    }

    .input-area input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 18px;
      font-size: 16px;
    }

    .image-button {
      width: 46px;
      border: none;
      border-radius: 18px;
      background: #f1efff;
      font-size: 21px;
    }

    .send-button {
      border: none;
      border-radius: 18px;
      padding: 0 18px;
      background: #8f7cff;
      color: white;
      font-weight: bold;
    }

    .send-button:disabled,
    .image-button:disabled,
    .notification-button:disabled {
      opacity: 0.5;
    }

    #imageInput {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <a href="home.html" class="home-button">
        🏠 ホーム
      </a>

      <button
        id="notificationButton"
        class="notification-button"
        type="button"
        title="通知を設定"
      >
        🔔
      </button>

      <div class="profile-header">

        <div class="header-avatar" id="headerAvatar">
          👤
        </div>

        <h1 id="chatTitle">
          💬 チャット
        </h1>

      </div>

    </header>

    <section class="messages" id="messages">

      <div class="empty">
        メッセージを読み込み中...
      </div>

    </section>

    <form class="input-area" id="messageForm">

      <input
        id="messageInput"
        type="text"
        placeholder="メッセージを入力..."
        autocomplete="off"
      >

      <button
        class="image-button"
        id="imageButton"
        type="button"
        title="画像を送る"
      >
        🖼️
      </button>

      <button
        class="send-button"
        id="sendButton"
        type="submit"
      >
        送信
      </button>

    </form>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // =========================
    // Service Worker登録
    // =========================

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register(
        "./service-worker.js"
      )
      .then(function() {

        console.log(
          "Service Worker 登録成功"
        );

      })
      .catch(function(error) {

        console.error(
          "Service Worker 登録失敗:",
          error
        );

      });

    }


    // =========================
    // Supabase
    // =========================

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================
    // 要素
    // =========================

    const messagesElement =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const messageForm =
      document.getElementById("messageForm");

    const sendButton =
      document.getElementById("sendButton");

    const imageButton =
      document.getElementById("imageButton");

    const imageInput =
      document.getElementById("imageInput");

    const chatTitle =
      document.getElementById("chatTitle");

    const headerAvatar =
      document.getElementById("headerAvatar");

    const notificationButton =
      document.getElementById(
        "notificationButton"
      );


    // =========================
    // 状態
    // =========================

    let currentUsername = "";
    let friendId = "";
    let realtimeChannel = null;

    let myAvatarUrl = "";
    let friendAvatarUrl = "";


    // =========================
    // URL
    // =========================

    const params =
      new URLSearchParams(
        window.location.search
      );

    friendId =
      params.get("user") || "";


    // =========================
    // 通知ボタン状態
    // =========================

    function updateNotificationButton() {

      if (!("Notification" in window)) {

        notificationButton.textContent =
          "🔕";

        notificationButton.title =
          "このブラウザは通知に対応していません";

        return;

      }


      if (
        Notification.permission ===
        "granted"
      ) {

        notificationButton.textContent =
          "🔔";

        notificationButton.classList.add(
          "enabled"
        );

        notificationButton.title =
          "通知ON";

      } else if (
        Notification.permission ===
        "denied"
      ) {

        notificationButton.textContent =
          "🔕";

        notificationButton.classList.remove(
          "enabled"
        );

        notificationButton.title =
          "通知がOFFです";

      } else {

        notificationButton.textContent =
          "🔔";

        notificationButton.classList.remove(
          "enabled"
        );

        notificationButton.title =
          "通知をONにする";

      }

    }


    // =========================
    // 通知許可
    // =========================

    async function enableNotifications() {

      if (!("Notification" in window)) {

        alert(
          "このブラウザでは通知を利用できません。"
        );

        return;

      }


      if (
        Notification.permission ===
        "granted"
      ) {

        alert(
          "通知はすでにONになっています。"
        );

        return;

      }


      if (
        Notification.permission ===
        "denied"
      ) {

        alert(
          "通知がOFFになっています。\n\n" +
          "iPhoneの設定から通知を許可してください。"
        );

        return;

      }


      try {

        const permission =
          await Notification.requestPermission();


        updateNotificationButton();


        if (
          permission === "granted"
        ) {

          alert(
            "通知がONになりました！"
          );

        } else {

          alert(
            "通知が許可されませんでした。"
          );

        }

      } catch (error) {

        console.error(
          "通知設定エラー:",
          error
        );

        alert(
          "通知の設定に失敗しました。"
        );

      }

    }


    notificationButton.addEventListener(
      "click",
      enableNotifications
    );


    // =========================
    // 通知表示
    // =========================

    function showMessageNotification(
      message
    ) {

      let body =
        "新しいメッセージが届きました";


      if (message.content) {

        body =
          message.content;

      } else if (
        message.image_url
      ) {

        body =
          "🖼️ 画像が届きました";

      }


      document.title =
        "🔴 新着メッセージ！";


      setTimeout(
        function() {

          document.title =
            "チャット";

        },
        3000
      );


      if (
        "Notification" in window &&
        Notification.permission ===
        "granted"
      ) {

        try {

          const notification =
            new Notification(
              "💬 " +
              (
                chatTitle.textContent
                  .replace("💬 ", "")
                  .trim() ||
                friendId
              ),
              {
                body: body,
                icon:
                  friendAvatarUrl ||
                  undefined,
                tag:
                  "friend-chat-" +
                  friendId
              }
            );


          notification.onclick =
            function() {

              window.focus();

              notification.close();

            };

        } catch (error) {

          console.error(
            "通知表示エラー:",
            error
          );

        }

      }

    }


    // =========================
    // アバター
    // =========================

    function createAvatar(
      url,
      fallback
    ) {

      const avatar =
        document.createElement("div");

      avatar.className =
        "message-avatar";


      if (url) {

        const img =
          document.createElement("img");

        img.src =
          url;

        img.alt =
          "プロフィール画像";


        img.onerror =
          function() {

            avatar.innerHTML =
              fallback;

          };


        avatar.appendChild(
          img
        );

      } else {

        avatar.textContent =
          fallback;

      }


      return avatar;

    }


    // =========================
    // 開始
    // =========================

    async function start() {

      updateNotificationButton();


      if (!friendId) {

        chatTitle.textContent =
          "💬 相手が選ばれていません";

        messageForm.style.display =
          "none";

        messagesElement.innerHTML =
          '<div class="empty">フレンドから相手を選んでね</div>';

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (
        error ||
        !data.session
      ) {

        alert(
          "ログインしてください。"
        );

        window.location.href =
          "index.html";

        return;

      }


      currentUsername =
        data.session.user
          .user_metadata
          ?.username || "";


      if (!currentUsername) {

        alert(
          "ログイン中のユーザーIDを取得できませんでした。"
        );

        return;

      }


      // =========================
      // 相手プロフィール
      // =========================

      const {
        data: friendProfile
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "name, avatar_url"
          )
          .eq(
            "user_id",
            friendId
          )
          .maybeSingle();


      friendAvatarUrl =
        friendProfile?.avatar_url ||
        "";


      chatTitle.textContent =
        "💬 " +
        (
          friendProfile?.name ||
          friendId
        );


      if (friendAvatarUrl) {

        headerAvatar.innerHTML =
          `<img src="${friendAvatarUrl}" alt="プロフィール画像">`;

      }


      // =========================
      // 自分のプロフィール
      // =========================

      const {
        data: myProfile
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "avatar_url"
          )
          .eq(
            "user_id",
            currentUsername
          )
          .maybeSingle();


      myAvatarUrl =
        myProfile?.avatar_url ||
        "";


      await loadMessages();

      startRealtime();

    }


    // =========================
    // メッセージ読み込み
    // =========================

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${currentUsername},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUsername})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "読み込みエラー:",
          error
        );

        messagesElement.innerHTML =
          '<div class="empty">メッセージを読み込めませんでした</div>';

        return;

      }


      messagesElement.innerHTML =
        "";


      if (
        !data ||
        data.length === 0
      ) {

        messagesElement.innerHTML =
          '<div class="empty">まだメッセージがありません</div>';

        return;

      }


      for (
        const message of data
      ) {

        await addMessageToScreen(
          message
        );

      }


      scrollToBottom();

    }


    // =========================
    // メッセージ表示
    // =========================

    async function addMessageToScreen(
      message
    ) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "message";


      const isMine =
        message.sender_id ===
        currentUsername;


      if (isMine) {

        wrapper.classList.add(
          "mine"
        );

      }


      if (!isMine) {

        const avatar =
          createAvatar(
            friendAvatarUrl,
            "👤"
          );

        wrapper.appendChild(
          avatar
        );

      }


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      // =========================
      // 画像
      // =========================

      if (message.image_url) {

        const image =
          document.createElement("img");

        image.className =
          "chat-image";

        image.alt =
          "送信された画像";


        const {
          data,
          error
        } =
        await supabaseClient.storage
          .from("chat-images")
          .createSignedUrl(
            message.image_url,
            3600
          );


        if (
          !error &&
          data?.signedUrl
        ) {

          image.src =
            data.signedUrl;

          bubble.appendChild(
            image
          );

        }

      }


      // =========================
      // テキスト
      // =========================

      if (message.content) {

        const text =
          document.createElement("div");

        text.textContent =
          message.content;

        bubble.appendChild(
          text
        );

      }


      // =========================
      // 時刻
      // =========================

      const time =
        document.createElement("div");

      time.className =
        "time";


      const date =
        new Date(
          message.created_at
        );


      time.textContent =
        date.toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      bubble.appendChild(
        time
      );


      wrapper.appendChild(
        bubble
      );


      if (isMine) {

        const avatar =
          createAvatar(
            myAvatarUrl,
            "😊"
          );

        wrapper.appendChild(
          avatar
        );

      }


      messagesElement.appendChild(
        wrapper
      );

    }


    // =========================
    // 一番下へ
    // =========================

    function scrollToBottom() {

      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }


    // =========================
    // リアルタイム
    // =========================

    function startRealtime() {

      if (realtimeChannel) {

        return;

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "chat-" +
            currentUsername +
            "-" +
            friendId
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },
            async function(payload) {

              const message =
                payload.new;


              const isThisChat =
                (
                  message.sender_id ===
                    currentUsername &&
                  message.receiver_id ===
                    friendId
                ) ||
                (
                  message.sender_id ===
                    friendId &&
                  message.receiver_id ===
                    currentUsername
                );


              if (!isThisChat) {

                return;

              }


              if (
                message.sender_id ===
                currentUsername
              ) {

                return;

              }


              await addMessageToScreen(
                message
              );

              scrollToBottom();


              // 通知

              showMessageNotification(
                message
              );

            }
          )
          .subscribe();

    }


    // =========================
    // テキスト送信
    // =========================

    messageForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (!text) {

          return;

        }


        if (
          !currentUsername ||
          !friendId
        ) {

          alert(
            "ログイン情報または相手の情報を取得できません。"
          );

          return;

        }


        sendButton.disabled =
          true;


        const {
          data,
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUsername,

              receiver_id:
                friendId,

              content:
                text,

              image_url:
                ""

            })
            .select()
            .single();


        sendButton.disabled =
          false;


        if (error) {

          console.error(
            "送信エラー:",
            error
          );

          alert(
            "メッセージを送信できませんでした。\n\n" +
            error.message
          );

          return;

        }


        messageInput.value =
          "";


        await addMessageToScreen(
          data
        );

        scrollToBottom();

      }
    );


    // =========================
    // 画像ボタン
    // =========================

    imageButton.addEventListener(
      "click",
      function() {

        imageInput.click();

      }
    );


    // =========================
    // 画像送信
    // =========================

    imageInput.addEventListener(
      "change",
      async function() {

        const file =
          imageInput.files?.[0];


        if (!file) {

          return;

        }


        if (
          !currentUsername ||
          !friendId
        ) {

          alert(
            "ログイン情報または相手の情報を取得できません。"
          );

          imageInput.value =
            "";

          return;

        }


        if (
          !file.type.startsWith("image/")
        ) {

          alert(
            "画像ファイルを選んでください。"
          );

          imageInput.value =
            "";

          return;

        }


        imageButton.disabled =
          true;

        sendButton.disabled =
          true;


        try {

          const extension =
            file.name
              .split(".")
              .pop() ||
            "jpg";


          const filePath =
            currentUsername +
            "/" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .slice(2) +
            "." +
            extension;


          const {
            error: uploadError
          } =
            await supabaseClient.storage
              .from("chat-images")
              .upload(
                filePath,
                file,
                {
                  contentType:
                    file.type,

                  upsert:
                    false
                }
              );


          if (uploadError) {

            console.error(
              "画像アップロードエラー:",
              uploadError
            );

            alert(
              "画像をアップロードできませんでした。\n\n" +
              uploadError.message
            );

            return;

          }


          const {
            data,
            error
          } =
            await supabaseClient
              .from("messages")
              .insert({

                sender_id:
                  currentUsername,

                receiver_id:
                  friendId,

                content:
                  "",

                image_url:
                  filePath

              })
              .select()
              .single();


          if (error) {

            console.error(
              "画像メッセージ保存エラー:",
              error
            );

            alert(
              "画像メッセージを保存できませんでした。\n\n" +
              error.message
            );

            return;

          }


          await addMessageToScreen(
            data
          );

          scrollToBottom();


        } finally {

          imageButton.disabled =
            false;

          sendButton.disabled =
            false;

          imageInput.value =
            "";

        }

      }
    );


    // =========================
    // 起動
    // =========================

    start();

  </script>

</body>
</html>
