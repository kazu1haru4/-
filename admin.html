<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>管理者パネル</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background: linear-gradient(135deg, #fff4fb, #eef7ff);
  color: #333;
}

.container {
  width: min(100% - 24px, 900px);
  margin: 24px auto 50px;
}

header {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(100, 80, 130, .12);
  margin-bottom: 18px;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.admin-name {
  margin-top: 8px;
  color: #777;
  font-size: 14px;
}

.panel {
  background: white;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 30px rgba(100, 80, 130, .10);
}

.panel h2 {
  margin: 0 0 16px;
  font-size: 20px;
}

.message {
  padding: 12px 14px;
  border-radius: 14px;
  background: #f5f5f8;
  margin-bottom: 10px;
}

.user-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-radius: 16px;
  background: #f7f8fc;
  margin-bottom: 10px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
  flex-shrink: 0;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-weight: bold;
}

.user-id {
  color: #777;
  font-size: 13px;
  word-break: break-all;
}

.banned {
  color: #e53935;
  font-weight: bold;
  font-size: 13px;
  margin-top: 3px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
  background: #8f7cff;
  color: white;
}

button:hover {
  opacity: .9;
}

button.danger {
  background: #ef5350;
}

button.success {
  background: #43a047;
}

button.gray {
  background: #777;
}

button.small {
  padding: 8px 11px;
  font-size: 13px;
}

textarea,
input,
select {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 12px;
  font-size: 16px;
  font-family: inherit;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  margin-bottom: 12px;
}

.form-row label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.board-message {
  padding: 14px;
  border-radius: 16px;
  background: #f7f8fc;
  margin-bottom: 12px;
}

.board-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.board-user {
  font-weight: bold;
}

.board-date {
  color: #888;
  font-size: 12px;
}

.board-content {
  white-space: pre-wrap;
  word-break: break-word;
}

.event-card {
  padding: 15px;
  border-radius: 17px;
  background: #f7f8fc;
  margin-bottom: 12px;
}

.event-title {
  font-size: 18px;
  font-weight: bold;
}

.event-description {
  margin-top: 7px;
  white-space: pre-wrap;
}

.event-info {
  color: #777;
  font-size: 13px;
  margin-top: 8px;
}

.status {
  padding: 12px;
  border-radius: 14px;
  background: #f4f4f7;
  margin-bottom: 14px;
}

.hidden {
  display: none !important;
}

.loading {
  text-align: center;
  color: #777;
  padding: 20px;
}

.empty {
  color: #888;
  padding: 10px 0;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 9999;
}

.modal-box {
  width: min(100%, 520px);
  max-height: 90vh;
  overflow: auto;
  background: white;
  border-radius: 24px;
  padding: 22px;
}

.modal-box h3 {
  margin-top: 0;
}

@media (max-width: 600px) {
  .user-card {
    align-items: flex-start;
  }

  .user-card .actions {
    width: 100%;
  }

  .user-card button {
    width: 100%;
  }

  .board-header {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>👑 管理者パネル</h1>
  <div id="adminName" class="admin-name">確認中...</div>
</header>

<div id="status" class="status">
  読み込み中...
</div>


<!-- =========================
     ユーザー管理
========================= -->

<section class="panel">

  <h2>👤 ユーザー管理</h2>

  <div id="usersLoading" class="loading">
    ユーザーを読み込んでいます...
  </div>

  <div id="usersList"></div>

</section>


<!-- =========================
     掲示板管理
========================= -->

<section class="panel">

  <h2>💬 掲示板管理</h2>

  <div id="boardLoading" class="loading">
    掲示板を読み込んでいます...
  </div>

  <div id="boardList"></div>

</section>


<!-- =========================
     イベント作成
========================= -->

<section class="panel">

  <h2>🎉 イベント作成</h2>

  <div class="form-row">
    <label>イベント名</label>
    <input id="eventTitle" type="text" placeholder="例：秋のコインイベント">
  </div>

  <div class="form-row">
    <label>説明</label>
    <textarea
      id="eventDescription"
      placeholder="イベントの説明を入力"></textarea>
  </div>

  <div class="form-row">
    <label>開始日時</label>
    <input id="eventStart" type="datetime-local">
  </div>

  <div class="form-row">
    <label>終了日時</label>
    <input id="eventEnd" type="datetime-local">
  </div>

  <div class="form-row">
    <label>コイン報酬</label>
    <input
      id="eventCoins"
      type="number"
      min="0"
      value="0">
  </div>

  <div class="form-row">
    <label>フレーム報酬</label>

    <select id="eventItem">
      <option value="">なし</option>
    </select>
  </div>

  <button id="createEventButton">
    🎉 イベントを作成
  </button>

</section>


<!-- =========================
     イベント一覧
========================= -->

<section class="panel">

  <h2>📋 イベント管理</h2>

  <div id="eventsLoading" class="loading">
    イベントを読み込んでいます...
  </div>

  <div id="eventsList"></div>

</section>

</div>


<!-- =========================
     BANモーダル
========================= -->

<div id="banModal" class="modal hidden">

  <div class="modal-box">

    <h3>🚫 ユーザーをBAN</h3>

    <p id="banTarget"></p>

    <div class="form-row">
      <label>理由</label>

      <textarea
        id="banReason"
        placeholder="BAN理由を入力"></textarea>
    </div>

    <div class="actions">

      <button
        id="confirmBanButton"
        class="danger">
        🚫 BANする
      </button>

      <button
        id="cancelBanButton"
        class="gray">
        キャンセル
      </button>

    </div>

  </div>

</div>


<!-- =========================
     掲示板編集モーダル
========================= -->

<div id="editModal" class="modal hidden">

  <div class="modal-box">

    <h3>✏️ 掲示板メッセージを編集</h3>

    <div class="form-row">

      <textarea
        id="editContent"
        placeholder="メッセージ"></textarea>

    </div>

    <div class="actions">

      <button
        id="saveEditButton">
        💾 保存
      </button>

      <button
        id="cancelEditButton"
        class="gray">
        キャンセル
      </button>

    </div>

  </div>

</div>


<script>
const SUPABASE_URL =
  "https://yxonmqdyekwenyzekjwj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const ADMIN_USERNAMES = new Set([
  "kazu1haru100",
  "kazu1haru4sub"
]);


let currentUsername = "";

let banTargetUsername = "";

let editTargetMessageId = null;


/* =========================
   共通
========================= */

function setStatus(text) {
  const el = document.getElementById("status");

  if (el) {
    el.textContent = text;
  }
}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatDate(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString("ja-JP");
}


/* =========================
   初期化
========================= */

async function init() {

  try {

    const {
      data,
      error
    } = await supabase.auth.getSession();

    if (error) {
      throw error;
    }

    const session = data.session;

    if (!session) {

      document.body.innerHTML = `
        <div style="
          padding:40px;
          text-align:center;
          font-family:sans-serif;
        ">
          <h2>ログインが必要です</h2>
          <p>管理者アカウントでログインしてください。</p>
        </div>
      `;

      return;
    }


    currentUsername =
      session.user.user_metadata?.username || "";


    if (!ADMIN_USERNAMES.has(currentUsername)) {

      document.body.innerHTML = `
        <div style="
          padding:40px;
          text-align:center;
          font-family:sans-serif;
        ">
          <h2>🚫 アクセスできません</h2>
          <p>このページは管理者専用です。</p>
        </div>
      `;

      return;
    }


    document.getElementById("adminName").textContent =
      `ログイン中：${currentUsername}`;


    setStatus("管理者としてログインしています。");


    await Promise.all([
      loadUsers(),
      loadBoardMessages(),
      loadItems(),
      loadEvents()
    ]);

  } catch (error) {

    console.error(error);

    setStatus(
      "エラー：" +
      (error.message || "読み込みに失敗しました")
    );
  }
}


/* =========================
   ユーザー一覧
========================= */

async function loadUsers() {

  const loading =
    document.getElementById("usersLoading");

  const list =
    document.getElementById("usersList");


  loading.classList.remove("hidden");

  list.innerHTML = "";


  const {
    data: profiles,
    error
  } = await supabase
    .from("profiles")
    .select(
      "user_id,name,avatar_url,created_at"
    )
    .order("created_at", {
      ascending: false
    });


  if (error) {

    loading.textContent =
      "ユーザー読み込みエラー：" +
      error.message;

    return;
  }


  const {
    data: bans,
    error: banError
  } = await supabase
    .from("user_bans")
    .select(
      "user_id,reason,banned_at,expires_at"
    );


  if (banError) {

    loading.textContent =
      "BAN情報読み込みエラー：" +
      banError.message;

    return;
  }


  const banMap = new Map();

  (bans || []).forEach(ban => {
    banMap.set(ban.user_id, ban);
  });


  loading.classList.add("hidden");


  if (!profiles || profiles.length === 0) {

    list.innerHTML =
      `<div class="empty">ユーザーがいません。</div>`;

    return;
  }


  profiles.forEach(profile => {

    const username =
      profile.user_id || "";


    const isAdmin =
      ADMIN_USERNAMES.has(username);


    const ban =
      banMap.get(username);


    const card =
      document.createElement("div");

    card.className = "user-card";


    const avatar =
      profile.avatar_url ||
      "https://via.placeholder.com/100";


    card.innerHTML = `

      <img
        class="avatar"
        src="${escapeHtml(avatar)}"
        alt="">

      <div class="user-info">

        <div class="user-name">
          ${escapeHtml(
            profile.name || username
          )}
        </div>

        <div class="user-id">
          ID：${escapeHtml(username)}
        </div>

        ${
          isAdmin
            ? `<div style="
                color:#8f6b00;
                font-weight:bold;
                font-size:13px;
                margin-top:3px;
              ">👑 管理者</div>`
            : ""
        }

        ${
          ban
            ? `<div class="banned">
                🚫 BAN中
              </div>`
            : ""
        }

      </div>

      <div class="actions">

        ${
          isAdmin
            ? ""
            : ban

              ? `
                <button
                  class="success small"
                  data-unban="${escapeHtml(username)}">
                  🔓 BAN解除
                </button>
              `

              : `
                <button
                  class="danger small"
                  data-ban="${escapeHtml(username)}">
                  🚫 BAN
                </button>
              `
        }

      </div>
    `;


    list.appendChild(card);
  });


  list.querySelectorAll("[data-ban]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          openBanModal(
            button.dataset.ban
          );

        }
      );

    });


  list.querySelectorAll("[data-unban]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          unbanUser(
            button.dataset.unban
          );

        }
      );

    });
}


/* =========================
   BANモーダル
========================= */

function openBanModal(username) {

  banTargetUsername =
    username;

  document.getElementById("banTarget")
    .textContent =
      `対象ユーザー：${username}`;

  document.getElementById("banReason")
    .value = "";

  document.getElementById("banModal")
    .classList.remove("hidden");
}


function closeBanModal() {

  document.getElementById("banModal")
    .classList.add("hidden");

  banTargetUsername = "";
}


async function banUser() {

  if (!banTargetUsername) {
    return;
  }


  if (
    ADMIN_USERNAMES.has(
      banTargetUsername
    )
  ) {

    alert(
      "管理者はBANできません。"
    );

    return;
  }


  const reason =
    document.getElementById("banReason")
      .value.trim();


  const {
    error
  } = await supabase
    .from("user_bans")
    .insert({
      user_id: banTargetUsername,
      reason,
      banned_by: currentUsername
    });


  if (error) {

    alert(
      "BANに失敗しました：\n" +
      error.message
    );

    return;
  }


  closeBanModal();

  await loadUsers();

  alert(
    `${banTargetUsername} をBANしました。`
  );
}


async function unbanUser(username) {

  if (
    !confirm(
      `${username} のBANを解除しますか？`
    )
  ) {
    return;
  }


  const {
    error
  } = await supabase
    .from("user_bans")
    .delete()
    .eq("user_id", username);


  if (error) {

    alert(
      "BAN解除に失敗しました：\n" +
      error.message
    );

    return;
  }


  await loadUsers();

  alert(
    `${username} のBANを解除しました。`
  );
}


/* =========================
   掲示板
========================= */

async function loadBoardMessages() {

  const loading =
    document.getElementById(
      "boardLoading"
    );

  const list =
    document.getElementById(
      "boardList"
    );


  loading.classList.remove("hidden");

  list.innerHTML = "";


  const {
    data,
    error
  } = await supabase
    .from("board_messages")
    .select(
      "id,sender_id,content,created_at,is_deleted"
    )
    .order("created_at", {
      ascending: false
    })
    .limit(100);


  if (error) {

    loading.textContent =
      "掲示板読み込みエラー：" +
      error.message;

    return;
  }


  loading.classList.add("hidden");


  if (!data || data.length === 0) {

    list.innerHTML =
      `<div class="empty">
        掲示板メッセージがありません。
      </div>`;

    return;
  }


  data.forEach(message => {

    const card =
      document.createElement("div");

    card.className =
      "board-message";


    card.innerHTML = `

      <div class="board-header">

        <div class="board-user">
          👤 ${escapeHtml(
            message.sender_id
          )}
        </div>

        <div class="board-date">
          ${escapeHtml(
            formatDate(
              message.created_at
            )
          )}
        </div>

      </div>

      <div
        class="board-content"
        data-content>
        ${escapeHtml(
          message.content
        )}
      </div>

      ${
        message.is_deleted
          ? `
            <div style="
              color:#e53935;
              margin-top:8px;
              font-weight:bold;
            ">
              🗑️ 削除済み
            </div>
          `
          : ""
      }

      <div class="actions">

        ${
          message.is_deleted
            ? ""
            : `
              <button
                class="small"
                data-edit="${message.id}">
                ✏️ 編集
              </button>

              <button
                class="danger small"
                data-delete="${message.id}">
                🗑️ 削除
              </button>
            `
        }

      </div>
    `;


    list.appendChild(card);
  });


  list.querySelectorAll("[data-edit]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            Number(button.dataset.edit);

          const message =
            data.find(
              item =>
                Number(item.id) === id
            );

          if (message) {
            openEditModal(message);
          }

        }
      );

    });


  list.querySelectorAll("[data-delete]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deleteBoardMessage(
            Number(button.dataset.delete)
          );

        }
      );

    });
}


/* =========================
   掲示板編集
========================= */

function openEditModal(message) {

  editTargetMessageId =
    message.id;

  document.getElementById(
    "editContent"
  ).value =
    message.content || "";


  document.getElementById(
    "editModal"
  ).classList.remove("hidden");
}


function closeEditModal() {

  document.getElementById(
    "editModal"
  ).classList.add("hidden");

  editTargetMessageId = null;
}


async function saveBoardEdit() {

  if (
    editTargetMessageId === null
  ) {
    return;
  }


  const content =
    document.getElementById(
      "editContent"
    ).value.trim();


  if (!content) {

    alert(
      "メッセージを入力してください。"
    );

    return;
  }


  const {
    error
  } = await supabase
    .from("board_messages")
    .update({
      content
    })
    .eq(
      "id",
      editTargetMessageId
    );


  if (error) {

    alert(
      "編集に失敗しました：\n" +
      error.message
    );

    return;
  }


  closeEditModal();

  await loadBoardMessages();

  alert("編集しました。");
}


/* =========================
   掲示板削除
========================= */

async function deleteBoardMessage(id) {

  if (
    !confirm(
      "この掲示板メッセージを削除しますか？"
    )
  ) {
    return;
  }


  const {
    error
  } = await supabase
    .from("board_messages")
    .delete()
    .eq("id", id);


  if (error) {

    alert(
      "削除に失敗しました：\n" +
      error.message
    );

    return;
  }


  await loadBoardMessages();

  alert("削除しました。");
}


/* =========================
   フレーム一覧
========================= */

async function loadItems() {

  const select =
    document.getElementById(
      "eventItem"
    );


  const {
    data,
    error
  } = await supabase
    .from("coin_items")
    .select(
      "item_key,name,price"
    )
    .neq(
      "item_key",
      "admin"
    )
    .order(
      "price",
      { ascending: true }
    );


  if (error) {

    console.error(
      "アイテム取得エラー",
      error
    );

    return;
  }


  select.innerHTML =
    `<option value="">なし</option>`;


  (data || []).forEach(item => {

    const option =
      document.createElement("option");

    option.value =
      item.item_key;

    option.textContent =
      item.name;

    select.appendChild(option);
  });
}


/* =========================
   イベント作成
========================= */

async function createEvent() {

  const title =
    document.getElementById(
      "eventTitle"
    ).value.trim();


  const description =
    document.getElementById(
      "eventDescription"
    ).value.trim();


  const startValue =
    document.getElementById(
      "eventStart"
    ).value;


  const endValue =
    document.getElementById(
      "eventEnd"
    ).value;


  const rewardCoins =
    Number(
      document.getElementById(
        "eventCoins"
      ).value || 0
    );


  const rewardItem =
    document.getElementById(
      "eventItem"
    ).value || null;


  if (!title) {

    alert(
      "イベント名を入力してください。"
    );

    return;
  }


  if (!startValue || !endValue) {

    alert(
      "開始日時と終了日時を入力してください。"
    );

    return;
  }


  const start =
    new Date(startValue);


  const end =
    new Date(endValue);


  if (
    Number.isNaN(start.getTime()) ||
    Number.isNaN(end.getTime())
  ) {

    alert(
      "日時が正しくありません。"
    );

    return;
  }


  if (end <= start) {

    alert(
      "終了日時は開始日時より後にしてください。"
    );

    return;
  }


  if (
    !Number.isFinite(rewardCoins) ||
    rewardCoins < 0
  ) {

    alert(
      "コイン報酬が正しくありません。"
    );

    return;
  }


  const {
    error
  } = await supabase
    .from("events")
    .insert({

      title,

      description,

      start_at:
        start.toISOString(),

      end_at:
        end.toISOString(),

      reward_coins:
        Math.floor(rewardCoins),

      reward_item_key:
        rewardItem,

      created_by:
        currentUsername,

      is_active:
        true
    });


  if (error) {

    alert(
      "イベント作成に失敗しました：\n" +
      error.message
    );

    return;
  }


  document.getElementById(
    "eventTitle"
  ).value = "";


  document.getElementById(
    "eventDescription"
  ).value = "";


  document.getElementById(
    "eventStart"
  ).value = "";


  document.getElementById(
    "eventEnd"
  ).value = "";


  document.getElementById(
    "eventCoins"
  ).value = "0";


  document.getElementById(
    "eventItem"
  ).value = "";


  await loadEvents();

  alert("🎉 イベントを作成しました！");
}


/* =========================
   イベント一覧
========================= */

async function loadEvents() {

  const loading =
    document.getElementById(
      "eventsLoading"
    );

  const list =
    document.getElementById(
      "eventsList"
    );


  loading.classList.remove("hidden");

  list.innerHTML = "";


  const {
    data,
    error
  } = await supabase
    .from("events")
    .select(`
      id,
      title,
      description,
      start_at,
      end_at,
      reward_coins,
      reward_item_key,
      created_by,
      is_active,
      created_at,
      coin_items(
        name
      )
    `)
    .order(
      "created_at",
      { ascending: false }
    );


  if (error) {

    loading.textContent =
      "イベント読み込みエラー：" +
      error.message;

    return;
  }


  loading.classList.add("hidden");


  if (!data || data.length === 0) {

    list.innerHTML =
      `<div class="empty">
        イベントはまだありません。
      </div>`;

    return;
  }


  data.forEach(event => {

    const card =
      document.createElement("div");

    card.className =
      "event-card";


    const itemName =
      event.coin_items?.name ||
      "";


    card.innerHTML = `

      <div class="event-title">
        ${escapeHtml(event.title)}
      </div>

      <div class="event-description">
        ${escapeHtml(
          event.description
        )}
      </div>

      <div class="event-info">

        📅
        ${escapeHtml(
          formatDate(event.start_at)
        )}

        〜

        ${escapeHtml(
          formatDate(event.end_at)
        )}

        <br>

        🪙 コイン：
        ${event.reward_coins || 0}

        ${
          itemName
            ? `
              <br>
              🖼️ フレーム：
              ${escapeHtml(itemName)}
            `
            : ""
        }

        <br>

        ${
          event.is_active
            ? "🟢 公開中"
            : "⚪ 非公開"
        }

      </div>

      <div class="actions">

        <button
          class="small"
          data-toggle-event="${event.id}">
          ${
            event.is_active
              ? "⏸️ 非公開"
              : "▶️ 公開"
          }
        </button>

        <button
          class="danger small"
          data-delete-event="${event.id}">
          🗑️ 削除
        </button>

      </div>
    `;


    list.appendChild(card);
  });


  list.querySelectorAll(
    "[data-toggle-event]"
  ).forEach(button => {

    button.addEventListener(
      "click",
      () => {

        toggleEvent(
          Number(
            button.dataset.toggleEvent
          )
        );

      }
    );

  });


  list.querySelectorAll(
    "[data-delete-event]"
  ).forEach(button => {

    button.addEventListener(
      "click",
      () => {

        deleteEvent(
          Number(
            button.dataset.deleteEvent
          )
        );

      }
    );

  });
}


/* =========================
   イベント公開切替
========================= */

async function toggleEvent(id) {

  const {
    data: event,
    error: getError
  } = await supabase
    .from("events")
    .select("is_active")
    .eq("id", id)
    .single();


  if (getError) {

    alert(
      "イベント取得に失敗しました：\n" +
      getError.message
    );

    return;
  }


  const {
    error
  } = await supabase
    .from("events")
    .update({
      is_active:
        !event.is_active
    })
    .eq("id", id);


  if (error) {

    alert(
      "変更に失敗しました：\n" +
      error.message
    );

    return;
  }


  await loadEvents();
}


/* =========================
   イベント削除
========================= */

async function deleteEvent(id) {

  if (
    !confirm(
      "このイベントを削除しますか？"
    )
  ) {
    return;
  }


  const {
    error
  } = await supabase
    .from("events")
    .delete()
    .eq("id", id);


  if (error) {

    alert(
      "イベント削除に失敗しました：\n" +
      error.message
    );

    return;
  }


  await loadEvents();

  alert("イベントを削除しました。");
}
