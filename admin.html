<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>管理者パネル</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fff4fb,
      #eef7ff
    );

  color: #333;
}

.container {
  width: min(
    calc(100% - 24px),
    900px
  );

  margin:
    24px auto 50px;
}

/* =========================
   ヘッダー
========================= */

header {
  background: white;
  border-radius: 24px;

  padding: 20px;

  margin-bottom: 18px;

  box-shadow:
    0 8px 30px
    rgba(100,80,130,.10);
}

header h1 {
  margin: 0;

  font-size: 26px;
}

.admin-name {
  margin-top: 8px;

  color: #777;

  font-size: 14px;
}

/* =========================
   ホーム
========================= */

.home-button {
  display: block;

  width: 100%;

  margin-top: 16px;

  padding: 14px;

  border-radius: 15px;

  background: #8f7cff;

  color: white;

  text-align: center;

  text-decoration: none;

  font-size: 16px;

  font-weight: bold;

  transition:
    transform .15s,
    opacity .15s;
}

.home-button:active {
  transform: scale(.98);
  opacity: .85;
}

/* =========================
   ステータス
========================= */

.status {
  padding: 14px;

  border-radius: 14px;

  margin-bottom: 18px;

  white-space: pre-wrap;

  word-break: break-word;

  background: #f1f3f8;
}

.status.info {
  background: #eef0ff;
  color: #3949ab;
}

.status.success {
  background: #e8f5e9;
  color: #2e7d32;
}

.status.error {
  background: #ffebee;
  color: #c62828;
}

/* =========================
   折りたたみ
========================= */

details.panel {
  background: white;

  border-radius: 22px;

  margin-bottom: 18px;

  box-shadow:
    0 8px 30px
    rgba(100,80,130,.10);

  overflow: hidden;
}

details.panel > summary {
  list-style: none;

  cursor: pointer;

  padding: 20px;

  font-size: 20px;

  font-weight: bold;

  display: flex;

  align-items: center;

  justify-content: space-between;

  user-select: none;
}

details.panel > summary::-webkit-details-marker {
  display: none;
}

details.panel > summary::after {
  content: "＋";

  color: #8f7cff;

  font-size: 26px;

  line-height: 1;
}

details.panel[open] > summary::after {
  content: "−";
}

details.panel > summary:active {
  background: #f8f7ff;
}

.panel-content {
  padding:
    0 20px 20px;
}

/* =========================
   カード
========================= */

.card {
  background: #f7f8fc;

  border-radius: 16px;

  padding: 14px;

  margin-bottom: 12px;
}

.user-card {
  display: flex;

  align-items: center;

  gap: 12px;

  flex-wrap: wrap;
}

.avatar {
  width: 50px;
  height: 50px;

  border-radius: 50%;

  object-fit: cover;

  background: #eee;

  flex-shrink: 0;
}

.user-info {
  flex: 1;

  min-width: 150px;
}

.user-name {
  font-weight: bold;

  font-size: 16px;
}

.user-id {
  color: #777;

  font-size: 13px;

  word-break: break-all;

  margin-top: 3px;
}

.admin-label {
  color: #9b7700;

  font-size: 13px;

  font-weight: bold;

  margin-top: 3px;
}

.banned {
  color: #e53935;

  font-size: 13px;

  font-weight: bold;

  margin-top: 3px;
}

/* =========================
   掲示板
========================= */

.board-header {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 8px;
}

.board-user {
  font-weight: bold;
}

.board-date {
  color: #888;

  font-size: 12px;
}

.board-content {
  white-space: pre-wrap;

  word-break: break-word;

  line-height: 1.6;
}

/* =========================
   配布コード
========================= */

.reward-code-title {
  font-size: 19px;

  font-weight: bold;

  word-break: break-word;
}

.reward-code-info {
  color: #666;

  font-size: 13px;

  line-height: 1.8;

  margin-top: 8px;
}

.reward-users {
  margin-top: 14px;

  padding-top: 14px;

  border-top:
    1px solid #ddd;
}

.reward-users-title {
  font-weight: bold;

  margin-bottom: 10px;
}

.reward-user {
  background: white;

  border-radius: 12px;

  padding: 10px;

  margin-bottom: 7px;
}

.reward-user-name {
  font-weight: bold;
}

.reward-user-date {
  color: #888;

  font-size: 12px;

  margin-top: 3px;
}

/* =========================
   イベント
========================= */

.event-title {
  font-size: 18px;

  font-weight: bold;

  word-break: break-word;
}

.event-description {
  margin-top: 7px;

  white-space: pre-wrap;

  word-break: break-word;

  line-height: 1.6;
}

.event-info {
  color: #777;

  font-size: 13px;

  line-height: 1.8;

  margin-top: 8px;
}

.active {
  color: #2e7d32;

  font-weight: bold;
}

.inactive {
  color: #e53935;

  font-weight: bold;
}

/* =========================
   フォーム
========================= */

.form-row {
  margin-bottom: 14px;
}

.form-row label {
  display: block;

  font-weight: bold;

  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;

  padding: 12px;

  border:
    1px solid #ddd;

  border-radius: 13px;

  background: white;

  font-size: 16px;

  font-family: inherit;
}

textarea {
  min-height: 100px;

  resize: vertical;
}

.hint {
  color: #888;

  font-size: 12px;

  margin-top: 5px;
}

/* =========================
   ボタン
========================= */

button {
  border: none;

  border-radius: 12px;

  padding: 10px 14px;

  background: #8f7cff;

  color: white;

  font-weight: bold;

  font-size: 14px;

  cursor: pointer;
}

button:disabled {
  opacity: .45;

  cursor: not-allowed;
}

button.danger {
  background: #ef5350;
}

button.success {
  background: #43a047;
}

button.gray {
  background: #777;
}

button.small {
  padding: 8px 11px;

  font-size: 13px;
}

.actions {
  display: flex;

  gap: 8px;

  flex-wrap: wrap;

  margin-top: 12px;
}

/* =========================
   フレーム読み込み状態
========================= */

.frame-status {
  margin-top: 7px;

  padding: 10px 12px;

  border-radius: 12px;

  background: #f3f3f7;

  color: #666;

  font-size: 13px;

  white-space: pre-wrap;
}

.frame-status.success {
  background: #e8f5e9;

  color: #2e7d32;
}

.frame-status.error {
  background: #ffebee;

  color: #c62828;
}

/* =========================
   ローディング
========================= */

.loading {
  color: #777;

  padding: 12px 0;
}

.empty {
  color: #888;

  padding: 10px 0;
}

/* =========================
   モーダル
========================= */

.modal {
  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.45);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 18px;

  z-index: 9999;
}

.modal-box {
  width: min(
    100%,
    520px
  );

  max-height: 90vh;

  overflow: auto;

  background: white;

  border-radius: 24px;

  padding: 22px;
}

.modal-box h3 {
  margin-top: 0;
}

.hidden {
  display: none !important;
}

/* =========================
   スマホ
========================= */

@media(max-width:600px) {

  .container {
    width:
      calc(100% - 16px);

    margin-top: 12px;
  }

  header h1 {
    font-size: 23px;
  }

  details.panel > summary {
    padding: 17px;

    font-size: 18px;
  }

  .panel-content {
    padding:
      0 15px 15px;
  }

  .user-card {
    align-items: flex-start;
  }

  .user-card .actions {
    width: 100%;
  }

  .user-card .actions button {
    width: 100%;
  }

  .board-header {
    flex-direction: column;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================
     ヘッダー
===================================== -->

<header>

    👑 管理者パネル
  </h1>

  <div
    id="adminName"
    class="admin-name"
  >
    起動しています...
  </div>

  <a

  </a>

</header>


<div
  id="status"

>
  🔄 管理者パネルを起動しています...
</div>


<!-- =====================================

===================================== -->

<details

  open
>

  <summary>

  <div class="panel-content">

<!-- =====================================
     掲示板管理
===================================== -->

<details
  class="panel"
  open
>

    💬 掲示板管理
  </summary>

  <div class="panel-content">

    <div
      id="boardLoading"
      class="loading"
    >
      掲示板を読み込んでいます...
    </div>

    <div id="boardList"></div>

  </div>

</details>


<!-- =====================================
     配布コード作成
===================================== -->

<details
  class="panel"
  open
>

  <summary>
    🎁 配布コードを作成

  <div class="panel-content">


    <div class="form-row">

      <label>
        配布コード
      </label>

      <input

      <label>
        🖼️ フレーム報酬

      <select

      </select>

      <div

    <div class="form-row">

      <label>
        👥 最大利用人数
      </label>

      <input

        step="1"

        0なら無制限です。

</details>


<!-- =====================================
     配布コード一覧
===================================== -->

<details
  class="panel"
  open
>

  <summary>
    📦 配布コード一覧・受取履歴
  </summary>

  <div class="panel-content">

    <div
      id="rewardCodesLoading"
      class="loading"
    >
      配布コードを読み込んでいます...
    </div>

    <div id="rewardCodesList"></div>

  </div>

</details>


<!-- =====================================
     イベント作成
===================================== -->

<details
  class="panel"
>

  <summary>
    🎉 イベント作成
  </summary>

  <div class="panel-content">


    <div class="form-row">

      <label>
        イベント名
      </label>

      <input
        id="eventTitle"
        type="text"

    <div class="form-row">

      <input

        type="number"

    <div class="form-row">

      <label>
        🖼️ フレーム報酬

      <select
        id="eventItem"
      >

        <option value="">
          なし
        </option>

      </select>

    </div>


    <button
      id="createEventButton"

      🎉 イベントを作成

  </div>

</details>


<!-- =====================================
     イベント管理
===================================== -->

<details
  class="panel"
>

  <summary>
    📋 イベント管理
  </summary>

  <div class="panel-content">

    <div
      id="eventsLoading"
      class="loading"
    >
      イベントを読み込んでいます...
    </div>

    <div id="eventsList"></div>

  </div>

</details>


</div>


<!-- =====================================
     BANモーダル
===================================== -->

<div
  id="banModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h3>
      🚫 ユーザーをBAN
    </h3>

    <p id="banTarget"></p>

    <div class="form-row">

      <label>
        BAN理由
      </label>

      <textarea
        id="banReason"
        placeholder="BAN理由を入力"
      ></textarea>

===================================== -->

>

    <h3>

      <textarea
        id="editContent"

        id="saveEditButton"
        type="button"

        💾 保存

        id="cancelEditButton"

      </button>

<script>

/* =====================================
   Supabase
===================================== */

const SUPABASE_URL =
  "https://yxonmqdyekwenyzekjwj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";


let supabaseClient = null;

let currentUsername = "";

let banTargetUsername = "";

let editTargetMessageId = null;


const ADMIN_USERNAMES =
  new Set([
    "kazu1haru100",
    "kazu1haru4sub"
  ]);


/* =====================================
   エラー表示
===================================== */

window.addEventListener(
  "error",
  event => {

    console.error(
      "JavaScript Error:",
      event.error || event.message
    );

    const status =
      document.getElementById("status");

    if (status) {

      status.textContent =
        "❌ JavaScriptエラー\n\n" +
        (
          event.message ||
          "不明なエラー"
        );

      status.className =
        "status error";
    }

  }
);


window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Promise Error:",
      event.reason
    );

  }
);


/* =====================================
   共通
===================================== */

function setStatus(
  text,
  type = "info"
) {

  const element =
    document.getElementById("status");

  if (!element) return;

  element.textContent = text;

  element.className =
    "status " + type;
}


function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function escapeAttribute(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    );
}


function formatDate(value) {

  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return String(value);
  }

  return date.toLocaleString(
    "ja-JP"
  );
}


/* =====================================
   Supabase初期化
===================================== */

function createSupabaseClient() {

  if (!window.supabase) {

    throw new Error(
      "Supabaseライブラリを読み込めませんでした。"
    );

  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
}


/* =====================================
   ログイン・管理者確認
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {
    throw error;
  }


  const session =
    data.session;


  if (!session) {

    document.body.innerHTML = `

      <div style="
        padding:40px;
        text-align:center;
        font-family:sans-serif;
      ">

        <h2>
          🔐 ログインが必要です
        </h2>

        <p>
          管理者アカウントでログインしてください。
        </p>

      </div>

    `;

    return false;
  }


  currentUsername =
    session.user
      ?.user_metadata
      ?.username || "";


  if (!currentUsername) {

    throw new Error(
      "ログインユーザーIDを取得できません。"
    );

  }


  if (
    !ADMIN_USERNAMES.has(
      currentUsername
    )
  ) {

    document.body.innerHTML = `

      <div style="
        padding:40px;
        text-align:center;
        font-family:sans-serif;
      ">

        <h2>
          🚫 アクセスできません
        </h2>

        <p>
          このページは管理者専用です。
        </p>

      </div>

    `;

    return false;
  }


  document.getElementById(
    "adminName"
  ).textContent =
    "ログイン中：" +
    currentUsername;


  return true;
}


/* =====================================
   BAN確認
===================================== */

async function checkBan() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "check_user_banned",
        {
          target_username:
            currentUsername
        }
      );


    if (error) {

      console.warn(
        "BAN確認エラー:",
        error.message
      );

      return false;
    }


    if (data === true) {

      await supabaseClient
        .auth
        .signOut();


      document.body.innerHTML = `

        <div style="
          padding:40px;
          text-align:center;
          font-family:sans-serif;
        ">

          <h2>
            🚫 このアカウントはBANされています
          </h2>

        </div>

      `;

      return true;
    }


  } catch(error) {

    console.warn(
      "BAN確認エラー:",
      error
    );

  }


  return false;
}


/* =====================================
   ユーザー管理
===================================== */

async function loadUsers() {

  const loading =
    document.getElementById(
      "usersLoading"
    );

  const list =
    document.getElementById(
      "usersList"
    );


  loading.textContent =
    "ユーザーを読み込んでいます...";

  loading.classList.remove(
    "hidden"
  );

  list.innerHTML = "";


  const {
    data: profiles,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "user_id,name,avatar_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    loading.textContent =
      "❌ ユーザー読み込みエラー\n\n" +
      error.message;

    return;
  }


  const {
    data: bans,
    error: banError
  } =
    await supabaseClient
      .from("user_bans")
      .select(
        "user_id,reason,banned_at,expires_at"
      );


  if (banError) {

    loading.textContent =
      "❌ BAN情報読み込みエラー\n\n" +
      banError.message;

    return;
  }


  const banMap =
    new Map();


  (bans || []).forEach(
    ban => {

      banMap.set(
        ban.user_id,
        ban
      );

    }
  );


  loading.classList.add(
    "hidden"
  );


  if (
    !profiles ||
    profiles.length === 0

  profiles.forEach(

        );

        document.createElement(

        );

        profile.avatar_url ||

            `
              <div class="banned">
                🚫 BAN中
              </div>
            `
            :
            ""
          }

        </div>


        <div class="actions">

          ${
            isAdmin
            ?
            ""
            :
            ban
            ?
            `
              <button
                class="success small"
                data-unban="${escapeAttribute(
                  username
                )}"
                type="button"
              >
                🔓 BAN解除
              </button>
            `
            :
            `
              <button
                class="danger small"
                data-ban="${escapeAttribute(
                  username
                )}"
                type="button"
              >
                🚫 BAN
              </button>
            `
          }

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );


  list
    .querySelectorAll(
      "[data-ban]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openBanModal(
              button.dataset.ban

    );


  list
    .querySelectorAll(
      "[data-unban]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            unbanUser(
              button.dataset.unban
            );

          }
        );

      }
    );

}

function openBanModal(
  username
) {

  banTargetUsername =
    username;


  document.getElementById(
    "banTarget"
  ).textContent =
    "対象ユーザー：" +
    username;


  document.getElementById(
    "banReason"
  ).value = "";


  document.getElementById(
    "banModal"
  ).classList.remove(
    "hidden"
  );
}


function closeBanModal() {

  document.getElementById(
    "banModal"
  ).classList.add(
    "hidden"
  );

  banTargetUsername =
    "";
}


async function banUser() {

  if (!banTargetUsername) {
    return;
  }


  if (
    ADMIN_USERNAMES.has(
      banTargetUsername
    )
  ) {

    alert(
      "管理者はBANできません。"
    );

    return;
  }


  const reason =
    document.getElementById(
      "banReason"
    ).value.trim();


  const {
    error
  } =
    await supabaseClient
      .from("user_bans")
      .insert({

        user_id:
          banTargetUsername,

        reason,

        banned_by:
          currentUsername

      });


  if (error) {

    alert(
      "BANに失敗しました。\n\n" +
      error.message
    );

    return;
  }


  const target =
    banTargetUsername;


  closeBanModal();

  await loadUsers();


  alert(
    target +
    " をBANしました。"
  );
}


async function unbanUser(
  username
) {

  if (
    !confirm(
      username +
      " のBANを解除しますか？"
    )
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("user_bans")
      .delete()
      .eq(
        "user_id",
        username
      );


  if (error) {

    alert(
      "BAN解除に失敗しました。\n\n" +
      error.message
    );

    return;
  }


  await loadUsers();


  alert(
    username +
    " のBANを解除しました。"
  );
}

    );

/* =====================================
   配布コード作成
===================================== */

async function createRewardCode() {

  const button =
    document.getElementById(
      "createRewardCodeButton"
    );


  try {

    button.disabled = true;


    button.textContent =
      "⏳ 作成しています...";


    const code =
      document.getElementById(
        "rewardCode"
      )
      .value
      .trim()
      .toUpperCase();


    const rewardCoins =
      Number(
        document.getElementById(
          "rewardCodeCoins"
        ).value || 0
      );


    const rewardItem =
      document.getElementById(
        "rewardCodeItem"
      ).value ||
      null;


    const maxUses =
      Number(
        document.getElementById(
          "rewardCodeMaxUses"
        ).value || 0
      );


    if (!code) {

      throw new Error(
        "配布コードを入力してください。"
      );

    }


    if (
      !Number.isInteger(
        rewardCoins
      ) ||
      rewardCoins < 0
    ) {

      throw new Error(
        "コイン報酬が正しくありません。"
      );

    }


    if (
      !Number.isInteger(
        maxUses
      ) ||
      maxUses < 0
    ) {

      throw new Error(
        "最大利用人数が正しくありません。"
      );

    }


    if (
      rewardCoins === 0 &&
      !rewardItem
    ) {

      throw new Error(
        "コインまたはフレームを設定してください。"
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("coin_reward_codes")
        .insert({

          code,

          reward_coins:
            rewardCoins,

          reward_item_key:
            rewardItem,

          max_uses:
            maxUses,

          is_active:
            true,

          created_by:
            currentUsername

        })
        .select()
        .single();


    if (error) {

      throw new Error(
        error.message
      );

    }


    console.log(
      "配布コード作成:",
      data
    );


    document.getElementById(
      "rewardCode"
    ).value = "";


    document.getElementById(
      "rewardCodeCoins"
    ).value =
      "0";


    document.getElementById(
      "rewardCodeItem"
    ).value =
      "";


    document.getElementById(
      "rewardCodeMaxUses"
    ).value =
      "0";


    await loadRewardCodes();


    setStatus(
      "✅ 配布コード「" +
      code +
      "」を作成しました！",
      "success"
    );


    alert(
      "🎁 配布コードを作成しました！\n\n" +
      code
    );


  } catch(error) {

    console.error(
      "createRewardCode:",
      error
    );


    setStatus(
      "❌ 配布コード作成エラー\n\n" +
      (
        error.message ||
        error
      ),
      "error"
    );


    alert(
      "❌ 配布コードを作成できませんでした。\n\n" +
      (
        error.message ||
        error
      )
    );


  } finally {

    button.disabled = false;

    button.textContent =
      "🎁 配布コードを作成";

  }

}


/* =====================================
   配布コード一覧＋受取ユーザー
===================================== */

async function loadRewardCodes() {

  const loading =
    document.getElementById(
      "rewardCodesLoading"
    );

  const list =
    document.getElementById(
      "rewardCodesList"
    );


  loading.classList.remove(
    "hidden"
  );


  loading.textContent =
    "配布コードを読み込んでいます...";


  list.innerHTML = "";


  const {
    data: codes,
    error
  } =
    await supabaseClient
      .from("coin_reward_codes")
      .select(`
        id,
        code,
        reward_coins,
        reward_item_key,
        max_uses,
        is_active,
        created_by,
        created_at,
        coin_items(
          name,
          icon
        )
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    loading.textContent =
      "❌ 配布コード読み込みエラー\n\n" +
      error.message;

    return;
  }


  const {
    data: uses,
    error: usesError
  } =
    await supabaseClient
      .from("coin_reward_code_uses")
      .select(`
        id,
        reward_code_id,
        user_id,
        used_at
      `)
      .order(
        "used_at",
        {
          ascending: false
        }
      );


  if (usesError) {

    loading.textContent =
      "❌ 配布コード受取履歴の読み込みエラー\n\n" +
      usesError.message;

    return;
  }


  loading.classList.add(
    "hidden"
  );


  if (
    !codes ||
    codes.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        配布コードはまだありません。
      </div>
    `;

    return;
  }


  const useMap =
    new Map();


  (uses || []).forEach(
    use => {

      const id =
        Number(
          use.reward_code_id
        );


      if (
        !useMap.has(id)
      ) {

        useMap.set(
          id,
          []
        );

      }


      useMap
        .get(id)
        .push(use);

    }
  );


  codes.forEach(
    code => {

      const usedUsers =
        useMap.get(
          Number(code.id)
        ) || [];


      const usedCount =
        usedUsers.length;


      const maxUses =
        Number(
          code.max_uses || 0
        );


      const item =
        code.coin_items;


      const rewards = [];


      if (
        Number(
          code.reward_coins
        ) > 0
      ) {

        rewards.push(
          "🪙 " +
          Number(
            code.reward_coins
          ).toLocaleString() +
          " COIN"
        );

      }


      if (item) {

        rewards.push(
          (
            item.icon ||
            "🖼️"
          ) +
          " " +
          escapeHtml(
            item.name
          )
        );

      }


      let usersHtml = "";


      if (
        usedUsers.length === 0
      ) {

        usersHtml = `

          <div
            class="reward-users"
          >

            <div class="reward-users-title">
              👥 受け取ったユーザー
            </div>

            <div class="empty">
              まだ誰も受け取っていません。
            </div>

          </div>

        `;

      } else {

        usersHtml = `

          <div
            class="reward-users"
          >

            <div class="reward-users-title">
              👥 受け取ったユーザー
              (${usedCount}人)
            </div>


            ${usedUsers
              .map(
                use => `

                  <div
                    class="reward-user"
                  >

                    <div
                      class="reward-user-name"
                    >
                      👤
                      ${escapeHtml(
                        use.user_id
                      )}
                    </div>


                    <div
                      class="reward-user-date"
                    >
                      受取日時：
                      ${escapeHtml(
                        formatDate(
                          use.used_at
                        )
                      )}
                    </div>

                  </div>

                `
              )
              .join("")
            }

          </div>

        `;

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      card.innerHTML = `

        <div
          class="reward-code-title"
        >
          🎁
          ${escapeHtml(
            code.code
          )}
        </div>


        <div
          class="reward-code-info"
        >

          報酬：
          ${
            rewards.length
            ?
            rewards.join(
              " ＋ "
            )
            :
            "なし"
          }

          <br>

          利用人数：
          ${usedCount}
          /
          ${
            maxUses === 0
            ?
            "無制限"
            :
            maxUses
          }

          <br>

          状態：

          <span
            class="${
              code.is_active
              ?
              "active"
              :
              "inactive"
            }"
          >

            ${
              code.is_active
              ?
              "🟢 有効"
              :
              "🔴 無効"
            }

          </span>

          <br>

          作成者：
          ${escapeHtml(
            code.created_by
          )}

          <br>

          作成日：
          ${escapeHtml(
            formatDate(
              code.created_at
            )
          )}

        </div>


        ${usersHtml}


        <div class="actions">

          <button
            class="small"
            data-toggle-code="${code.id}"
            type="button"
          >

            ${
              code.is_active
              ?
              "⏸️ 無効にする"
              :
              "▶️ 有効にする"
            }

          </button>


          <button
            class="danger small"
            data-delete-code="${code.id}"
            type="button"
          >
            🗑️ 削除
          </button>

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );


  list
    .querySelectorAll(
      "[data-toggle-code]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            toggleRewardCode(
              Number(
                button.dataset
                  .toggleCode
              )
            );

          }
        );

      }
    );


  list
    .querySelectorAll(
      "[data-delete-code]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            deleteRewardCode(
              Number(
                button.dataset
                  .deleteCode
              )
            );

          }
        );

      }
    );

}

    document.getElementById(
      "eventDescription"
    ).value.trim();


  const startValue =
    document.getElementById(
      "eventStart"
    ).value;


  const endValue =
    document.getElementById(
      "eventEnd"
    ).value;


  const rewardCoins =
    Number(
      document.getElementById(
        "eventCoins"
      ).value || 0
    );


  const rewardItem =
    document.getElementById(
      "eventItem"
    ).value ||
    null;


  if (!title) {

    alert(
      "イベント名を入力してください。"
    );

    return;
  }


  if (
    !startValue ||
    !endValue
  ) {

    alert(
      "開始日時と終了日時を入力してください。"
    );

    return;
  }


  const start =
    new Date(
      startValue
    );


  const end =
    new Date(
      endValue
    );


  if (
    Number.isNaN(
      start.getTime()
    ) ||
    Number.isNaN(
      end.getTime()
    )
  ) {

    alert(
      "日時が正しくありません。"
    );

    return;
  }


  if (end <= start) {

    alert(
      "終了日時は開始日時より後にしてください。"
    );

    return;
  }


  if (
    !Number.isInteger(
      rewardCoins
    ) ||
    rewardCoins < 0
  ) {

    alert(
      "コイン報酬が正しくありません。"
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("events")
      .insert({

        title,

        description,

        start_at:
          start.toISOString(),

        end_at:
          end.toISOString(),

        reward_coins:
          rewardCoins,

        reward_item_key:
          rewardItem,

        created_by:
          currentUsername,

        is_active:
          true

      });


  if (error) {

    alert(
      "イベント作成に失敗しました。\n\n" +
      error.message
    );

    return;
  }


  document.getElementById(
    "eventTitle"
  ).value = "";


  document.getElementById(
    "eventDescription"
  ).value = "";


  document.getElementById(
    "eventStart"
  ).value = "";


  document.getElementById(
    "eventEnd"
  ).value = "";


  document.getElementById(
    "eventCoins"
  ).value =
    "0";


  document.getElementById(
    "eventItem"
  ).value =
    "";


  await loadEvents();


  alert(
    "🎉 イベントを作成しました！"
  );
}


/* =====================================
   イベント一覧
===================================== */

async function loadEvents() {

  const loading =
    document.getElementById(
      "eventsLoading"
    );

  const list =
    document.getElementById(
      "eventsList"
    );


  loading.classList.remove(
    "hidden"
  );


  loading.textContent =
    "イベントを読み込んでいます...";


  list.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("events")
      .select(`
        id,
        title,
        description,
        start_at,
        end_at,
        reward_coins,
        reward_item_key,
        created_by,
        is_active,
        created_at,
        coin_items(
          name,
          icon
        )
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    loading.textContent =
      "❌ イベント読み込みエラー\n\n" +
      error.message;

    return;
  }


  loading.classList.add(
    "hidden"
  );


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        イベントはまだありません。
      </div>
    `;

    return;
  }


  data.forEach(
    event => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const item =
        event.coin_items;


      card.innerHTML = `

        <div
          class="event-title"
        >
          ${escapeHtml(
            event.title
          )}
        </div>


        <div
          class="event-description"
        >
          ${escapeHtml(
            event.description
          )}
        </div>


        <div
          class="event-info"
        >

          📅
          ${escapeHtml(
            formatDate(
              event.start_at
            )
          )}

          〜

          ${escapeHtml(
            formatDate(
              event.end_at
            )
          )}

          <br>

          🪙 コイン：
          ${Number(
            event.reward_coins ||
            0
          ).toLocaleString()}


          ${
            item
            ?
            `
              <br>
              ${item.icon || "🖼️"}
              フレーム：
              ${escapeHtml(
                item.name
              )}
            `
            :
            ""
          }


          <br>

          状態：

          <span
            class="${
              event.is_active
              ?
              "active"
              :
              "inactive"
            }"
          >

            ${
              event.is_active
              ?
              "🟢 公開中"
              :
              "⚪ 非公開"
            }

          </span>

        </div>


        <div class="actions">

          <button
            class="small"
            data-toggle-event="${event.id}"
            type="button"
          >

            ${
              event.is_active
              ?
              "⏸️ 非公開"
              :
              "▶️ 公開"
            }

          </button>


          <button
            class="danger small"
            data-delete-event="${event.id}"
            type="button"
          >
            🗑️ 削除
          </button>

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );


  list
    .querySelectorAll(
      "[data-toggle-event]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            toggleEvent(
              Number(
                button.dataset
                  .toggleEvent
              )
            );

          }
        );

      }
    );


  list
    .querySelectorAll(
      "[data-delete-event]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            deleteEvent(
              Number(
                button.dataset
                  .deleteEvent
              )
            );

          }
        );

      }
    );

}


/* =====================================
   イベントON/OFF
===================================== */

async function toggleEvent(
  id
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("events")
      .select(
        "is_active"
      )
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    alert(
      "イベント取得に失敗しました。\n\n" +
      error.message
    );

    return;
  }


  const {
    error: updateError
  } =
    await supabaseClient
      .from("events")
      .update({

        is_active:
          !data.is_active

      })
      .eq(
        "id",
        id
      );


  if (updateError) {

    alert(
      "変更に失敗しました。\n\n" +
      updateError.message
    );

    return;
  }


  await loadEvents();
}


/* =====================================
   イベント削除
===================================== */

async function deleteEvent(
  id
) {

  if (
    !confirm(
      "このイベントを削除しますか？"
    )
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("events")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "イベント削除に失敗しました。\n\n" +
      error.message
    );

    return;
  }


  await loadEvents();


  alert(
    "イベントを削除しました。"
  );
}

/* =====================================
   初期化
===================================== */

async function init() {

  try {

    setStatus(
      "🟢 JavaScriptを開始しました。",
      "success"
    );


    createSupabaseClient();


    setStatus(
      "🔐 ログイン情報を確認しています...",
      "info"
    );


    const loggedIn =
      await checkLogin();


    if (!loggedIn) {
      return;
    }


    const banned =
      await checkBan();


    if (banned) {
      return;
    }


    setStatus(
      "📦 管理データを読み込んでいます...",
      "info"
    );


    await Promise.all([

      loadUsers(),

      loadBoardMessages(),

      loadItems(),

      loadRewardCodes(),

      loadEvents()

    ]);


    setStatus(
      "✅ 管理者パネルの読み込みが完了しました！",
      "success"
    );


  } catch(error) {

    console.error(
      "管理者パネル初期化エラー:",
      error
    );


    setStatus(
      "❌ 読み込みエラー\n\n" +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =====================================
   起動
===================================== */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    init
  );

} else {

  init();

}

</script>
