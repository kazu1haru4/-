<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>管理者パネル</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: linear-gradient(135deg,#fff4fb,#eef7ff);
  color: #333;
}

.container {
  width: min(100% - 24px,900px);
  margin: 24px auto 50px;
}

header,
.panel {
  background: white;
  border-radius: 24px;
  margin-bottom: 18px;
  box-shadow: 0 8px 30px rgba(100,80,130,.10);
}

header {
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.admin-name {
  margin-top: 8px;
  color: #777;
  font-size: 14px;
}

.panel h2 {
  margin: 0 0 16px;
  font-size: 20px;
}

.status {
  padding: 14px;
  border-radius: 14px;
  background: #f5f5f8;
  margin-bottom: 18px;
  white-space: pre-wrap;
  word-break: break-word;
}

.status.success {
  background: #e8f5e9;
  color: #2e7d32;
}

.status.error {
  background: #ffebee;
  color: #c62828;
}

.status.info {
  background: #e8eaf6;
  color: #3949ab;
}

.panel.collapsible-panel {
  padding: 0;
  overflow: hidden;
}

.panel.collapsible-panel > summary {
  list-style: none;
  cursor: pointer;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .15s;
}

.panel.collapsible-panel > summary::-webkit-details-marker {
  display: none;
}

.panel.collapsible-panel > summary::after {
  content: "＋";
  font-size: 25px;
  color: #8f7cff;
  line-height: 1;
}

.panel.collapsible-panel[open] > summary::after {
  content: "−";
}

.panel.collapsible-panel > summary:active {
  background: #f8f6ff;
}

.panel.collapsible-panel > :not(summary) {
  margin-left: 20px;
  margin-right: 20px;
}

.panel.collapsible-panel > :last-child {
  margin-bottom: 20px;
}

.user-card,
.board-message,
.event-card,
.reward-code-card {
  padding: 14px;
  border-radius: 16px;
  background: #f7f8fc;
  margin-bottom: 12px;
}

.user-card {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
  flex-shrink: 0;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-weight: bold;
}

.user-id {
  color: #777;
  font-size: 13px;
  word-break: break-all;
}

.user-coins {
  margin-top: 5px;
  color: #8f6b00;
  font-size: 14px;
  font-weight: 800;
}
.user-coins-error {
  color: #d9534f;
  font-weight: 600;
}

.banned {
  color: #e53935;
  font-weight: bold;
  font-size: 13px;
  margin-top: 3px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
  background: #8f7cff;
  color: white;
  font-size: 14px;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button.danger {
  background: #ef5350;
}

button.success {
  background: #43a047;
}

button.gray {
  background: #777;
}

button.small {
  padding: 8px 11px;
  font-size: 13px;
}

textarea,
input,
select {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 12px;
  font-size: 16px;
  font-family: inherit;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  margin-bottom: 12px;
}

.form-row label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

.hint {
  color: #888;
  font-size: 12px;
  margin-top: 5px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.board-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.board-user {
  font-weight: bold;
}

.board-date {
  color: #888;
  font-size: 12px;
}

.board-content {
  white-space: pre-wrap;
  word-break: break-word;
}

.event-title,
.reward-code-title {
  font-size: 18px;
  font-weight: bold;
  word-break: break-word;
}

.event-description {
  margin-top: 7px;
  white-space: pre-wrap;
}

.event-info,
.reward-code-info {
  color: #777;
  font-size: 13px;
  margin-top: 8px;
  line-height: 1.7;
}

.active {
  color: #2e7d32;
  font-weight: bold;
}

.inactive {
  color: #e53935;
  font-weight: bold;
}

.loading {
  text-align: center;
  color: #777;
  padding: 20px;
}

.empty {
  color: #888;
  padding: 10px 0;
}

.frame-status {
  padding: 10px 12px;
  border-radius: 12px;
  background: #f5f5f8;
  color: #666;
  font-size: 13px;
  margin-top: 8px;
  white-space: pre-wrap;
  word-break: break-word;
}

.frame-status.success {
  background: #e8f5e9;
  color: #2e7d32;
}

.frame-status.error {
  background: #ffebee;
  color: #c62828;
}


.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
}
.stat-card { padding: 14px; border-radius: 16px; background: #f7f8fc; text-align: center; }
.stat-label { color: #777; font-size: 13px; }
.stat-value { margin-top: 5px; font-size: 25px; font-weight: 800; }
.frame-admin-card { padding: 14px; border-radius: 16px; background: #f7f8fc; margin-bottom: 10px; display:flex; align-items:center; gap:12px; }
.frame-preview { width:54px; height:54px; border-radius:50%; display:grid; place-items:center; font-size:25px; background:white; border:4px solid var(--frame-color,#ffd0e7); flex-shrink:0; }
.frame-admin-info { min-width:0; flex:1; }
.frame-admin-name { font-weight:800; }
.frame-admin-meta { color:#777; font-size:13px; margin-top:3px; line-height:1.6; }
.home-button { margin-top:12px; display:inline-block; text-decoration:none; border-radius:12px; padding:10px 14px; font-weight:bold; background:#8f7cff; color:white; }
.history { margin-top:12px; padding-top:10px; border-top:1px solid #e5e5eb; }
.history-title { font-weight:bold; margin-bottom:6px; }
.history-row { font-size:13px; color:#666; padding:4px 0; word-break:break-word; }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 9999;
}

.modal-box {
  width: min(100%,520px);
  max-height: 90vh;
  overflow: auto;
  background: white;
  border-radius: 24px;
  padding: 22px;
}

.modal-box h3 {
  margin-top: 0;
}

.hidden {
  display: none !important;
}

@media(max-width:600px) {
  .user-card {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .user-card .actions {
    width: 100%;
  }

  .user-card button {
    width: 100%;
  }

  .board-header {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>👑 管理者パネル</h1>
  <div id="adminName" class="admin-name">起動しています...</div>
  <a class="home-button" href="home.html">🏠 ホームへ戻る</a>
</header>

<div id="status" class="status info">
  🔄 管理者パネルを起動しています...
</div>

<details class="panel collapsible-panel">
<summary>📊 サイト統計</summary>
<div id="statsLoading" class="loading">統計を読み込んでいます...</div>
<div id="statsGrid" class="stat-grid"></div>
</details>

<details class="panel collapsible-panel">
<summary>🖼️ フレーム一覧</summary>
<div id="framesLoading" class="loading">フレームを読み込んでいます...</div>
<div id="framesList"></div>
</details>

<details class="panel collapsible-panel">

<summary>👤 ユーザー管理</summary>

<div id="usersLoading" class="loading">ユーザーを読み込んでいます...</div>
<div id="usersList"></div>

</details>

<details class="panel collapsible-panel">

<summary>💬 掲示板管理</summary>

<div id="boardLoading" class="loading">掲示板を読み込んでいます...</div>
<div id="boardList"></div>

</details>

<details class="panel collapsible-panel">

<summary>🎁 配布コードを作成</summary>


<div class="form-row">
<label>配布コード</label>
<input id="rewardCode" type="text" maxlength="100" placeholder="例：WELCOME2026">
</div>

<div class="form-row">
<label>🪙 コイン報酬</label>
<input id="rewardCodeCoins" type="number" min="0" step="1" value="0">
</div>

<div class="form-row">
<label>🖼️ フレーム報酬</label>
<select id="rewardCodeItem">
<option value="">なし</option>
</select>

<div id="rewardFrameStatus" class="frame-status">
🔄 フレーム一覧を読み込んでいます...
</div>
</div>

<div class="form-row">
<label>👥 最大利用人数</label>
<input id="rewardCodeMaxUses" type="number" min="0" step="1" value="0">

</div>

<button id="createRewardCodeButton" type="button">🎁 配布コードを作成</button>

</details>

<details class="panel collapsible-panel">

<summary>📦 配布コード一覧</summary>

<div id="rewardCodesLoading" class="loading">配布コードを読み込んでいます...</div>
<div id="rewardCodesList"></div>

</details>

<details class="panel collapsible-panel">

<summary>🎉 イベント作成</summary>


<div class="form-row">
<label>イベント名</label>
<input id="eventTitle" type="text" placeholder="例：秋のコインイベント">
</div>

<div class="form-row">
<label>説明</label>
<textarea id="eventDescription" placeholder="イベントの説明を入力"></textarea>
</div>

<div class="form-row">
<label>開始日時</label>
<input id="eventStart" type="datetime-local">
</div>

<div class="form-row">
<label>終了日時</label>
<input id="eventEnd" type="datetime-local">
</div>

<div class="form-row">
<label>🪙 コイン報酬</label>
<input id="eventCoins" type="number" min="0" step="1" value="0">
</div>

<div class="form-row">
<label>🖼️ フレーム報酬</label>
<select id="eventItem">
<option value="">なし</option>
</select>
</div>

<button id="createEventButton" type="button">🎉 イベントを作成</button>

</details>

<details class="panel collapsible-panel">

<summary>📋 イベント管理</summary>

<div id="eventsLoading" class="loading">イベントを読み込んでいます...</div>
<div id="eventsList"></div>

</details>

</div>

<div id="banModal" class="modal hidden">
<div class="modal-box">
<h3>🚫 ユーザーをBAN</h3>
<p id="banTarget"></p>

<div class="form-row">
<label>理由</label>
<textarea id="banReason" placeholder="BAN理由を入力"></textarea>
</div>

<div class="actions">
<button id="confirmBanButton" class="danger" type="button">🚫 BANする</button>
<button id="cancelBanButton" class="gray" type="button">キャンセル</button>
</div>
</div>
</div>

<div id="editModal" class="modal hidden">
<div class="modal-box">
<h3>✏️ 掲示板メッセージを編集</h3>

<div class="form-row">
<textarea id="editContent" placeholder="メッセージ"></textarea>
</div>

<div class="actions">
<button id="saveEditButton" type="button">💾 保存</button>
<button id="cancelEditButton" class="gray" type="button">キャンセル</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL =
"https://yxonmqdyekwenyzekjwj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

let supabaseClient = null;
let currentUsername = "";
let banTargetUsername = "";
let editTargetMessageId = null;

const ADMIN_USERNAMES =
new Set([
  "kazu1haru100",
  "kazu1haru4sub"
]);

function setStatus(text, type = "info") {
  const element = document.getElementById("status");
  if (!element) return;
  element.textContent = text;
  element.className = "status " + type;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttribute(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString("ja-JP");
}

function createSupabaseClient() {
  if (!window.supabase) {
    throw new Error("Supabaseライブラリを読み込めませんでした。");
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
}

async function checkLogin() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) throw error;

  const session = data.session;

  if (!session) {
    document.body.innerHTML = `
      <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h2>🔐 ログインが必要です</h2>
        <p>管理者アカウントでログインしてください。</p>
      </div>
    `;
    return false;
  }

  currentUsername =
    session.user?.user_metadata?.username || "";

  if (!currentUsername) {
    document.body.innerHTML = `
      <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h2>❌ ユーザーIDを取得できません</h2>
        <p>ログイン情報を確認してください。</p>
      </div>
    `;
    return false;
  }

  if (!ADMIN_USERNAMES.has(currentUsername)) {
    document.body.innerHTML = `
      <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h2>🚫 アクセスできません</h2>
        <p>このページは管理者専用です。</p>
      </div>
    `;
    return false;
  }

  document.getElementById("adminName").textContent =
    `ログイン中：${currentUsername}`;

  return true;
}

async function checkBan() {
  try {
    const { data, error } =
      await supabaseClient.rpc(
        "check_user_banned",
        { target_username: currentUsername }
      );

    if (error) {
      console.warn("BAN確認をスキップ:", error.message);
      return false;
    }

    if (data === true) {
      await supabaseClient.auth.signOut();

      document.body.innerHTML = `
        <div style="padding:40px;text-align:center;font-family:sans-serif;">
          <h2>🚫 このアカウントはBANされています</h2>
        </div>
      `;

      return true;
    }
  } catch(error) {
    console.warn("BAN確認エラー:", error);
  }

  return false;
}

async function loadUsers() {
  const loading = document.getElementById("usersLoading");
  const list = document.getElementById("usersList");

  loading.classList.remove("hidden");
  list.innerHTML = "";

  const { data:profiles, error } =
    await supabaseClient
      .from("profiles")
      .select("user_id,name,avatar_url,created_at")
      .order("created_at",{ascending:false});

  if (error) {
    loading.textContent =
      "❌ ユーザー読み込みエラー：\n" + error.message;
    return;
  }

  const { data:bans, error:banError } =
    await supabaseClient
      .from("user_bans")
      .select("user_id,reason,banned_at,expires_at");

  if (banError) {
    loading.textContent =
      "❌ BAN情報読み込みエラー：\n" + banError.message;
    return;
  }

  const banMap = new Map();
  (bans || []).forEach(ban => banMap.set(ban.user_id, ban));

  loading.classList.add("hidden");

  if (!profiles?.length) {
    list.innerHTML = `<div class="empty">ユーザーがいません。</div>`;
    return;
  }

  // 管理者専用RPCで各ユーザーの現在のコイン残高を取得
  const coinResults = await Promise.all(
    profiles.map(async profile => {
      const username = profile.user_id || "";
      try {
        const { data, error } = await supabaseClient.rpc(
          "admin_get_user_coins",
          { target_username: username }
        );

        if (error) {
          console.error("コイン残高取得エラー:", username, error);
          return [username, null];
        }

        return [username, Number(data || 0)];
      } catch (error) {
        console.error("コイン残高取得エラー:", username, error);
        return [username, null];
      }
    })
  );

  const coinMap = new Map(coinResults);

  profiles.forEach(profile => {
    const username = profile.user_id || "";
    const isAdmin = ADMIN_USERNAMES.has(username);
    const ban = banMap.get(username);
    const coinBalance = coinMap.get(username);

    const card = document.createElement("div");
    card.className = "user-card";

    const avatar =
      profile.avatar_url ||
      "https://via.placeholder.com/100";

    const coinHtml =
      coinBalance === null || coinBalance === undefined
      ? `<div class="user-coins user-coins-error">🪙 残高：取得できません</div>`
      : `<div class="user-coins">🪙 残高：${coinBalance.toLocaleString("ja-JP")} COIN</div>`;

    card.innerHTML = `
      <img class="avatar" src="${escapeAttribute(avatar)}" alt="">

      <div class="user-info">
        <div class="user-name">
          ${escapeHtml(profile.name || username)}
        </div>

        <div class="user-id">
          ID：${escapeHtml(username)}
        </div>

        ${coinHtml}

        ${
          isAdmin
          ? `<div style="color:#8f6b00;font-weight:bold;font-size:13px;margin-top:3px;">👑 管理者</div>`
          : ""
        }

        ${
          ban
          ? `<div class="banned">🚫 BAN中</div>`
          : ""
        }
      </div>

      <div class="actions">
        <button class="coin small" data-coin="${escapeAttribute(username)}" type="button">🪙 コイン変更</button>
        ${
          isAdmin
          ? ""
          : ban
          ? `
            <button class="success small"
              data-unban="${escapeAttribute(username)}"
              type="button">
              🔓 BAN解除
            </button>
          `
          : `
            <button class="danger small"
              data-ban="${escapeAttribute(username)}"
              type="button">
              🚫 BAN
            </button>
          `
        }
      </div>
    `;

    list.appendChild(card);
  });

  list.querySelectorAll("[data-ban]").forEach(button => {
    button.addEventListener("click", () => {
      openBanModal(button.dataset.ban);
    });
  });

  list.querySelectorAll("[data-unban]").forEach(button => {
    button.addEventListener("click", () => {
      unbanUser(button.dataset.unban);
    });
  });

  list.querySelectorAll("[data-coin]").forEach(button => {
    button.addEventListener("click", () => {
      openCoinModal(button.dataset.coin);
    });
  });
}

async function openCoinModal(username) {
  document.getElementById("coinTarget").textContent = `対象ユーザー：${username}`;
  document.getElementById("coinCurrent").textContent = "🔄 現在の残高を読み込んでいます...";
  document.getElementById("coinNewBalance").value = "0";
  document.getElementById("coinModal").classList.remove("hidden");

  const { data, error } = await supabaseClient.rpc("admin_get_user_coins", {
    target_username: username
  });

  if (error) {
    document.getElementById("coinCurrent").className = "frame-status error";
    document.getElementById("coinCurrent").textContent = "❌ 残高取得に失敗しました：\n" + error.message;
    return;
  }

  const balance = Number(data || 0);
  document.getElementById("coinCurrent").className = "frame-status success";
  document.getElementById("coinCurrent").textContent = `現在の残高：${balance.toLocaleString("ja-JP")} COIN`;
  document.getElementById("coinNewBalance").value = String(balance);
}

function closeCoinModal() {
  document.getElementById("coinModal").classList.add("hidden");
}

async function saveUserCoins() {
  const usernameText = document.getElementById("coinTarget").textContent;
  const username = usernameText.replace("対象ユーザー：", "").trim();
  const newBalance = Number(document.getElementById("coinNewBalance").value);

  if (!username) {
    alert("ユーザーが指定されていません。");
    return;
  }

  if (!Number.isInteger(newBalance) || newBalance < 0) {
    alert("0以上の整数を入力してください。");
    return;
  }

  const button = document.getElementById("confirmCoinButton");
  button.disabled = true;
  button.textContent = "⏳ 変更中...";

  try {
    const { data, error } = await supabaseClient.rpc("admin_set_user_coins", {
      target_username: username,
      new_balance: newBalance
    });

    if (error) throw error;

    closeCoinModal();
    setStatus(`✅ ${username} のコインを ${Number(data).toLocaleString("ja-JP")} COIN に変更しました。`, "success");
    alert(`🪙 ${username} のコインを変更しました。\n\n${Number(data).toLocaleString("ja-JP")} COIN`);
  } catch (error) {

async function createRewardCode() {
  const button =
    document.getElementById("createRewardCodeButton");

  try {
    button.disabled = true;
    button.textContent = "⏳ 作成しています...";

    setStatus(
      "🎁 配布コードを作成しています...",
      "info"
    );

    const code =
      document.getElementById("rewardCode").value
        .trim().toUpperCase();

    const rewardCoins =
      Number(
        document.getElementById("rewardCodeCoins").value || 0
      );

    const rewardItem =
      document.getElementById("rewardCodeItem").value || null;

    const maxUses =
      Number(
        document.getElementById("rewardCodeMaxUses").value || 0
      );

    if (!code) {
      throw new Error("配布コードを入力してください。");
    }

    if (!Number.isInteger(rewardCoins) || rewardCoins < 0) {
      throw new Error("コイン報酬が正しくありません。");
    }

    if (!Number.isInteger(maxUses) || maxUses < 0) {
      throw new Error("最大利用人数が正しくありません。");
    }

    if (rewardCoins === 0 && !rewardItem) {
      throw new Error(
        "コインまたはフレームを1つ以上設定してください。"
      );
    }

    setStatus(
      "📡 Supabaseに保存しています...",
      "info"
    );

    const { data, error } =
      await supabaseClient
        .from("coin_reward_codes")
        .insert({
          code,
          reward_coins: Math.floor(rewardCoins),
          reward_item_key: rewardItem,
          max_uses: Math.floor(maxUses),
          is_active: true,
          created_by: currentUsername
        })
        .select()
        .single();

    if (error) {
      console.error("reward code error:", error);
      throw new Error(error.message);
    }

    console.log("作成成功:", data);

    document.getElementById("rewardCode").value = "";
    document.getElementById("rewardCodeCoins").value = "0";
    document.getElementById("rewardCodeItem").value = "";
    document.getElementById("rewardCodeMaxUses").value = "0";

    await loadRewardCodes();

    setStatus(
      `✅ 配布コード「${code}」を作成しました！`,
      "success"
    );

    alert(`🎁 配布コードを作成しました！\n\n${code}`);

  } catch(error) {
    console.error("createRewardCode:", error);

    setStatus(
      "❌ 配布コード作成エラー\n\n" +
      (error.message || error),
      "error"
    );

    alert(
      "❌ 配布コードを作成できませんでした。\n\n" +
      (error.message || error)
    );

  } finally {
    button.disabled = false;
    button.textContent = "🎁 配布コードを作成";
  }
}

async function loadRewardCodes() {
  const loading = document.getElementById("rewardCodesLoading");
  const list = document.getElementById("rewardCodesList");
  loading.classList.remove("hidden");
  list.innerHTML = "";

  const { data: codes, error } = await supabaseClient
    .from("coin_reward_codes")
    .select(`id,code,reward_coins,reward_item_key,max_uses,is_active,created_by,created_at,coin_items(name,icon)`)
    .order("created_at", { ascending:false });

  if (error) {
    loading.textContent = "❌ 配布コード読み込みエラー：\n" + error.message;
    return;
  }

  const { data: uses, error: usesError } = await supabaseClient
    .from("coin_reward_code_uses")
    .select("reward_code_id,user_id,used_at")
    .order("used_at", { ascending:false });

  if (usesError) console.warn("使用履歴取得エラー:", usesError.message);

  const useMap = new Map();
  (uses || []).forEach(row => {
    const id = Number(row.reward_code_id);
    if (!useMap.has(id)) useMap.set(id, []);
    useMap.get(id).push(row);
  });

  loading.classList.add("hidden");
  if (!codes?.length) {
    list.innerHTML = `<div class="empty">配布コードはまだありません。</div>`;
    return;
  }

  codes.forEach(code => {
    const history = useMap.get(Number(code.id)) || [];
    const item = code.coin_items;
    const rewards = [];
    if (Number(code.reward_coins) > 0) rewards.push(`🪙 ${Number(code.reward_coins).toLocaleString()} COIN`);
    if (item) rewards.push(`${item.icon || "🖼️"} ${escapeHtml(item.name)}`);

    const historyHtml = history.length
      ? `<div class="history"><div class="history-title">👥 受取履歴（${history.length}人）</div>${history.map(row => `<div class="history-row">👤 ${escapeHtml(row.user_id)}　${escapeHtml(formatDate(row.used_at))}</div>`).join("")}</div>`
      : `<div class="history"><div class="history-row">まだ使用されていません。</div></div>`;

    const card = document.createElement("div");
    card.className = "reward-code-card";
    card.innerHTML = `
      <div class="reward-code-title">🎁 ${escapeHtml(code.code)}</div>
      <div class="reward-code-info">
        報酬：${rewards.length ? rewards.join(" ＋ ") : "なし"}<br>
        利用：${history.length} / ${Number(code.max_uses || 0) === 0 ? "無制限" : Number(code.max_uses)}<br>
        状態：<span class="${code.is_active ? "active" : "inactive"}">${code.is_active ? "🟢 有効" : "🔴 無効"}</span><br>
        作成者：${escapeHtml(code.created_by)}<br>
        作成日：${escapeHtml(formatDate(code.created_at))}
      </div>
      ${historyHtml}
      <div class="actions">
        <button class="small" data-toggle-code="${code.id}" type="button">${code.is_active ? "⏸️ 無効にする" : "▶️ 有効にする"}</button>
        <button class="danger small" data-delete-code="${code.id}" type="button">🗑️ 削除</button>
      </div>`;
    list.appendChild(card);
  });

  list.querySelectorAll("[data-toggle-code]").forEach(button => {
    button.addEventListener("click", () => toggleRewardCode(Number(button.dataset.toggleCode)));
  });
  list.querySelectorAll("[data-delete-code]").forEach(button => {
    button.addEventListener("click", () => deleteRewardCode(Number(button.dataset.deleteCode)));
  });
}

async function createEvent() {
  const title =
    document.getElementById("eventTitle").value.trim();

  const description =
    document.getElementById("eventDescription").value.trim();

  const startValue =
    document.getElementById("eventStart").value;

  const endValue =
    document.getElementById("eventEnd").value;

  const rewardCoins =
    Number(
      document.getElementById("eventCoins").value || 0
    );

  const rewardItem =
    document.getElementById("eventItem").value || null;

  if (!title) {
    alert("イベント名を入力してください。");
    return;
  }

  if (!startValue || !endValue) {
    alert("開始日時と終了日時を入力してください。");
    return;
  }

  const start = new Date(startValue);
  const end = new Date(endValue);

  if (
    Number.isNaN(start.getTime()) ||
    Number.isNaN(end.getTime())
  ) {
    alert("日時が正しくありません。");
    return;
  }

  if (end <= start) {
    alert(
      "終了日時は開始日時より後にしてください。"
    );
    return;
  }

  if (!Number.isInteger(rewardCoins) || rewardCoins < 0) {
    alert("コイン報酬が正しくありません。");
    return;
  }

  const { error } =
    await supabaseClient
      .from("events")
      .insert({
        title,
        description,
        start_at: start.toISOString(),
        end_at: end.toISOString(),
        reward_coins: Math.floor(rewardCoins),
        reward_item_key: rewardItem,
        created_by: currentUsername,
        is_active: true
      });

  if (error) {
    alert(
      "イベント作成に失敗しました：\n" +
      error.message
    );
    return;
  }

  document.getElementById("eventTitle").value = "";
  document.getElementById("eventDescription").value = "";
  document.getElementById("eventStart").value = "";
  document.getElementById("eventEnd").value = "";
  document.getElementById("eventCoins").value = "0";
  document.getElementById("eventItem").value = "";

  await loadEvents();

  alert("🎉 イベントを作成しました！");
}

async function loadSiteStats() {
  const loading = document.getElementById("statsLoading");
  const grid = document.getElementById("statsGrid");

  if (!loading || !grid) return;

  loading.classList.remove("hidden");
  grid.innerHTML = "";

  const targets = [
    ["profiles", "👤 ユーザー"],
    ["messages", "💬 1対1メッセージ"],
    ["groups", "👥 グループ"],
    ["group_messages", "💬 グループメッセージ"],
    ["board_messages", "📢 掲示板"],
    ["coin_items", "🖼️ フレーム"]
  ];

  try {
    const results = await Promise.all(
      targets.map(async ([table, label]) => {
        const { count, error } = await supabaseClient
          .from(table)
          .select("*", { count: "exact", head: true });

        if (error) {
          console.warn(`統計取得失敗 (${table}):`, error.message);
          return { label, value: "取得失敗" };
        }

        return {
          label,
          value: Number.isFinite(count) ? count.toLocaleString("ja-JP") : "0"
        };
      })
    );

    results.forEach(item => {
      const card = document.createElement("div");
      card.className = "stat-card";
      card.innerHTML = `
        <div class="stat-label">${escapeHtml(item.label)}</div>
        <div class="stat-value">${escapeHtml(item.value)}</div>
      `;
      grid.appendChild(card);
    });

    loading.classList.add("hidden");
  } catch (error) {
    loading.textContent =
      "❌ サイト統計の読み込みに失敗しました：\n" +
      (error.message || error);
  }
}

      const frameColor = item.frame_color || "#ffd0e7";

      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="
            width:52px;
            height:52px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:26px;
            background:${escapeAttribute(frameColor)};
            border:4px solid ${escapeAttribute(frameColor)};
          ">${escapeHtml(icon)}</div>

          <div style="flex:1;min-width:0;">
            <div class="reward-code-title">
              ${escapeHtml(item.name || item.item_key)}
            </div>
            <div class="reward-code-info">
              ID：${escapeHtml(item.item_key)}
              <br>
              価格：${Number(item.price || 0).toLocaleString("ja-JP")} COIN
              <br>
              フレーム色：${escapeHtml(frameColor)}
            </div>
          </div>
        </div>
      `;

      list.appendChild(card);
    });
  } catch (error) {
    loading.textContent =
      "❌ フレーム一覧の読み込みに失敗しました：\n" +
      (error.message || error);
  }
}

async function init() {
  try {
    setStatus(
      "🔄 Supabaseを起動しています...",
      "info"
    );

    createSupabaseClient();

    setStatus(
      "🔄 ログイン状態を確認しています...",
      "info"
    );

    const loggedIn = await checkLogin();

    if (!loggedIn) return;

    const banned = await checkBan();

    if (banned) return;

    setStatus(
      "✅ 管理者としてログインしています。読み込みを開始します。",
      "success"
    );

    setStatus("📊 サイト統計を読み込んでいます...", "info");
    await loadSiteStats();

    setStatus("🖼️ フレーム一覧を読み込んでいます...", "info");
    await loadFrameList();

    setStatus(
      "👤 ユーザーを読み込んでいます...",
      "info"
    );
    await loadUsers();

    setStatus(
      "💬 掲示板を読み込んでいます...",
      "info"
    );
    await loadBoardMessages();

    setStatus(
      "🖼️ フレーム一覧を読み込んでいます...",
      "info"
    );
    await loadItems();

    setStatus(
      "🎁 配布コードを読み込んでいます...",
      "info"
    );
    await loadRewardCodes();

    setStatus(
      "🎉 イベントを読み込んでいます...",
      "info"
    );
    await loadEvents();

    setStatus(
      "✅ 管理者パネルの読み込みが完了しました！",
      "success"
    );

  } catch(error) {
    console.error("管理者パネルエラー:", error);

    setStatus(
      "❌ エラーが発生しました\n\n" +
      (error.message || error),
      "error"
    );
  }
}

try {
  setupButtons();
  init();
} catch(error) {
  console.error(error);

  setStatus(
    "❌ ページ起動エラー\n\n" +
    (error.message || error),
    "error"
  );
}
</script>

</body>
</html>
