<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>設定 - フレンドチャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --theme: #8f7cff;
      --theme-light: #f0edff;
      --theme-text: #5e50c9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      position: relative;
      background: white;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      margin-bottom: 15px;
    }

    .back-button {
      position: absolute;
      left: 15px;
      top: 15px;
      width: 45px;
      height: 45px;
      border-radius: 15px;
      background: var(--theme-light);
      color: var(--theme-text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .header-icon {
      font-size: 38px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: #999;
      font-size: 13px;
    }

    .section {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .theme-button {
      border: 3px solid transparent;
      border-radius: 18px;
      padding: 14px 10px;
      background: #f7f7f7;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .theme-button:active {
      transform: scale(0.96);
    }

    .theme-button.selected {
      border-color: var(--theme);
    }

    .theme-color {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      margin: 0 auto 8px;
    }

    .pink .theme-color {
      background: #ff82b2;
    }

    .purple .theme-color {
      background: #8f7cff;
    }

    .blue .theme-color {
      background: #5c9eff;
    }

    .green .theme-color {
      background: #48c78e;
    }

    .orange .theme-color {
      background: #ff9b52;
    }

    .cyan .theme-color {
      background: #36c9d8;
    }

    .theme-preview {
      border-radius: 18px;
      padding: 16px;
      background: var(--theme-light);
      color: var(--theme-text);
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }

    .reset-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 14px;
      background: #f3f3f3;
      color: #666;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-button:active {
      transform: scale(0.98);
    }

    .saved {
      text-align: center;
      color: #22a447;
      font-size: 13px;
      font-weight: bold;
      min-height: 20px;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="header">

      <a
        href="home.html"
        class="back-button"
        aria-label="ホームへ戻る"
      >
        ←
      </a>

      <div class="header-icon">
        ⚙️
      </div>

      <h1>
        設定
      </h1>

      <p class="subtitle">
        フレンドチャットを自分好みに設定
      </p>

    </section>


    <section class="section">

      <div class="section-title">
        🎨 テーマカラー
      </div>

      <div class="theme-grid">

        <button
          type="button"
          class="theme-button pink"
          data-theme="pink"
        >
          <div class="theme-color"></div>
          ピンク
        </button>

        <button
          type="button"
          class="theme-button purple"
          data-theme="purple"
        >
          <div class="theme-color"></div>
          パープル
        </button>

        <button
          type="button"
          class="theme-button blue"
          data-theme="blue"
        >
          <div class="theme-color"></div>
          ブルー
        </button>

        <button
          type="button"
          class="theme-button green"
          data-theme="green"
        >
          <div class="theme-color"></div>
          グリーン
        </button>

        <button
          type="button"
          class="theme-button orange"
          data-theme="orange"
        >
          <div class="theme-color"></div>
          オレンジ
        </button>

        <button
          type="button"
          class="theme-button cyan"
          data-theme="cyan"
        >
          <div class="theme-color"></div>
          シアン
        </button>

      </div>


      <div
        class="theme-preview"
        id="themePreview"
      >
        この色でフレンドチャットを楽しもう！
      </div>


      <div
        class="saved"
        id="savedMessage"
      ></div>

    </section>


    <section class="section">

      <div class="section-title">
        🔄 設定をリセット
      </div>

      <button
        type="button"
        class="reset-button"
        id="resetButton"
      >
        デフォルトに戻す
      </button>

    </section>


    <div class="footer">
      Friend Chat
    </div>

  </main>


  <script>

    const themes = {

      pink: {
        main: "#ff82b2",
        light: "#fff0f7",
        text: "#e34f85"
      },

      purple: {
        main: "#8f7cff",
        light: "#f0edff",
        text: "#5e50c9"
      },

      blue: {
        main: "#5c9eff",
        light: "#eef5ff",
        text: "#397bd8"
      },

      green: {
        main: "#48c78e",
        light: "#eef9f3",
        text: "#279b68"
      },

      orange: {
        main: "#ff9b52",
        light: "#fff4e8",
        text: "#df7628"
      },

      cyan: {
        main: "#36c9d8",
        light: "#eafcff",
        text: "#1599a8"
      }

    };


    // =========================
    // テーマを適用
    // =========================

    function applyTheme(themeName) {

      const theme =
        themes[themeName] ||
        themes.purple;


      document.documentElement.style
        .setProperty(
          "--theme",
          theme.main
        );

      document.documentElement.style
        .setProperty(
          "--theme-light",
          theme.light
        );

      document.documentElement.style
        .setProperty(
          "--theme-text",
          theme.text
        );


      document
        .querySelectorAll(".theme-button")
        .forEach(
          function(button) {

            button.classList.toggle(
              "selected",
              button.dataset.theme === themeName
            );

          }
        );

    }


    // =========================
    // 保存
    // =========================

    function saveTheme(themeName) {

      localStorage.setItem(
        "friendChatTheme",
        themeName
      );

      applyTheme(themeName);


      const savedMessage =
        document.getElementById(
          "savedMessage"
        );

      savedMessage.textContent =
        "✓ テーマを保存しました";


      setTimeout(
        function() {
          savedMessage.textContent = "";
        },
        1500
      );

    }


    // =========================
    // 色変更ボタン
    // =========================

    document
      .querySelectorAll(".theme-button")
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              saveTheme(
                button.dataset.theme
              );

            }
          );

        }
      );


    // =========================
    // リセット
    // =========================

    document
      .getElementById("resetButton")
      .addEventListener(
        "click",
        function() {

          localStorage.removeItem(
            "friendChatTheme"
          );

          applyTheme("purple");

          document
            .getElementById(
              "savedMessage"
            )
            .textContent =
              "✓ デフォルトに戻しました";


          setTimeout(
            function() {
              document
                .getElementById(
                  "savedMessage"
                )
                .textContent = "";
            },
            1500
          );

        }
      );


    // =========================
    // 保存済みテーマを読み込み
    // =========================

    const savedTheme =
      localStorage.getItem(
        "friendChatTheme"
      ) || "purple";


    applyTheme(savedTheme);

  </script>

</body>
</html>
