<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>グループを作成</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #eee;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8f7cff;
    }

    .create-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #8f7cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back-button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #f1f1f1;
      color: #555;
      font-size: 16px;
    }

    .message {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      color: #888;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="header">
      <div class="icon">👥</div>
      <h1>グループを作成</h1>
    </section>

    <section class="card">

      <label for="groupName">
        グループ名
      </label>

      <input
        id="groupName"
        type="text"
        maxlength="30"
        placeholder="グループ名を入力"
      >

      <button
        id="createButton"
        class="create-button"
        type="button"
      >
        グループを作成
      </button>

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        戻る
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const groupName =
      document.getElementById("groupName");

    const createButton =
      document.getElementById("createButton");

    const backButton =
      document.getElementById("backButton");

    const message =
      document.getElementById("message");


    backButton.addEventListener(
      "click",
      () => {
        window.location.href =
          "groups.html";
      }
    );


    createButton.addEventListener(
      "click",
      async () => {

        const name =
          groupName.value.trim();


        if (!name) {

          message.textContent =
            "グループ名を入力してね。";

          return;
        }


        createButton.disabled = true;

        message.textContent =
          "作成中...";


        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth.getSession();


        if (
          sessionError ||
          !sessionData.session
        ) {

          message.textContent =
            "ログインしてください。";

          createButton.disabled = false;

          return;
        }


        const username =
          sessionData.session.user
            .user_metadata?.username;


        if (!username) {

          message.textContent =
            "ユーザーIDを取得できませんでした。";

          createButton.disabled = false;

          return;
        }


        const {
          data: group,
          error: groupError
        } =
          await supabaseClient
            .from("groups")
            .insert({
              name: name,
              owner_id: username
            })
            .select()
            .single();


        if (groupError) {

          console.error(groupError);

          message.textContent =
            "グループを作成できませんでした。";

          createButton.disabled = false;

          return;
        }


        const {
          error: memberError
        } =
          await supabaseClient
            .from("group_members")
            .insert({
              group_id: group.id,
              user_id: username
            });


        if (memberError) {

          console.error(memberError);

          message.textContent =
            "グループは作成されましたが、メンバー登録に失敗しました。";

          createButton.disabled = false;

          return;
        }


        message.textContent =
          "グループを作成しました！";


        setTimeout(() => {

          window.location.href =
            "groups.html";

        }, 700);

      }
    );

  </script>

</body>
    </html>
