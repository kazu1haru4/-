</div><script>
(()=>{const $=id=>document.getElementById(id);if(!localStorage.getItem('ba_demo_session')){location.href='index.html';return}const c=$('arena'),x=c.getContext('2d');let W=800,H=500,run=true,last=0,hp=4800,move={x:0,y:0},aim={x:1,y:0},superAim={x:1,y:0},pid=null,aimPid=null,superAimPid=null,aimActive=false,superAimActive=false,shots=[],bits=[],portals=[],bots=[],cool=0,kills=0,gameEnded=false,timeLeft=90,regenWait=0;const p={x:130,y:250,r:17};function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);W=r.width;H=r.height;x.setTransform(d,0,0,d,0,0)}function start(){hp=4800;shots=[];bits=[];portals=[];kills=0;cool=0;timeLeft=90;regenWait=0;gameEnded=false;p.x=W*.2;p.y=H*.5;bots=[0,1,2].map((n)=>({x:W*(.57+n*.13),y:H*(.25+n*.23),hp:3200,cd:1+n*.4,alive:true}));$('hint').textContent='BOTをたおそう！';$('reward').textContent='';$('timer').textContent='残り 90秒';last=performance.now();requestAnimationFrame(loop)}function fire(){if(run&&!gameEnded)shots.push({x:p.x+aim.x*20,y:p.y+aim.y*20,vx:aim.x*420,vy:aim.y*420,life:1.3,owner:'p',dmg:1400})}function warp(){if(gameEnded)return;if(portals.length<1){portals=[{x:Math.max(25,Math.min(W-25,p.x+superAim.x*130)),y:Math.max(55,Math.min(H-25,p.y+superAim.y*130)),life:7}];$('hint').textContent='ポータル設置！もう一度押してワープ'}else{p.x=portals[0].x;p.y=portals[0].y;portals=[];for(let i=0;i<18;i++)bits.push({x:p.x,y:p.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,t:.5});$('hint').textContent='ワープ成功！'}}function pull(){if(gameEnded||cool>0)return;cool=8;let b=bots.filter(b=>b.hp>0).map(b=>({b,d:Math.hypot(b.x-p.x,b.y-p.y)})).filter(o=>o.d<300&&((o.b.x-p.x)*aim.x+(o.b.y-p.y)*aim.y)>0).sort((a,b)=>a.d-b.d)[0];if(b){b.b.x=p.x+aim.x*38;b.b.y=p.y+aim.y*38;b.b.hp-=350;$('hint').textContent='グラビティハンド！敵を引っ張った！'}else $('hint').textContent='前方に敵がいない！'}$('hyperBtn').onpointerdown=e=>{e.preventDefault();$('hint').textContent='ハイパーチャージは準備中！'};$('pullBtn').onpointerdown=e=>{e.preventDefault();pull()};$('exitBtn').onclick=()=>location.href='home.html';$('restartBtn').onclick=start;const stick=$('stick'),knob=$('knob');function set(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),m=33;if(d>m){dx=dx/d*m;dy=dy/d*m}move={x:dx/m,y:dy/m};knob.style.transform=`translate(${dx}px,${dy}px)`}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);set(e)};stick.onpointermove=e=>{if(pid===e.pointerId)set(e)};function reset(){pid=null;move={x:0,y:0};knob.style.transform=''}stick.onpointerup=reset;stick.onpointercancel=reset;const aimStick=$('aimStick'),aimKnob=$('aimKnob'),superAimStick=$('superAimStick'),superAimKnob=$('superAimKnob');
function setStickVector(e,el,knob,which){let r=el.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),m=25;if(d>m){dx=dx/d*m;dy=dy/d*m}let z=Math.hypot(dx,dy);if(z>5){if(which==='super'){superAim={x:dx/z,y:dy/z};superAimActive=true}else{aim={x:dx/z,y:dy/z};aimActive=true}}knob.style.transform=`translate(${dx}px,${dy}px)`;}
aimStick.onpointerdown=e=>{e.preventDefault();aimPid=e.pointerId;aimStick.setPointerCapture(aimPid);aimActive=false;setStickVector(e,aimStick,aimKnob,'normal')};

function circ(a,b,r,col,stroke){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=col;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}function update(dt){if(gameEnded)return;timeLeft=Math.max(0,timeLeft-dt);regenWait=Math.max(0,regenWait-dt);if(regenWait===0&&hp<4800){hp=Math.min(4800,hp+90*dt)}p.x=Math.max(18,Math.min(W-18,p.x+move.x*185*dt));p.y=Math.max(55,Math.min(H-18,p.y+move.y*185*dt));cool=Math.max(0,cool-dt);for(let b of bots){if(b.hp<=0)continue;let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;if(d>100){b.x+=dx/d*40*dt;b.y+=dy/d*40*dt}b.cd-=dt;if(b.cd<=0&&d<300){b.cd=1.5;shots.push({x:b.x,y:b.y,vx:dx/d*210,vy:dy/d*210,life:1.8,owner:'b',dmg:180})}}for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.owner==='p'){for(let b of bots)if(b.hp>0&&Math.hypot(b.x-s.x,b.y-s.y)<23){b.hp-=s.dmg;s.life=0;if(b.hp<=0){kills++;$('hint').textContent='BOTを撃破！'}break}}else if(Math.hypot(p.x-s.x,p.y-s.y)<22){hp=Math.max(0,hp-s.dmg);regenWait=3;s.life=0}}shots=shots.filter(s=>s.life>0&&s.x>-10&&s.x<W+10&&s.y>-10&&s.y<H+10);bits.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.t-=dt});bits=bits.filter(a=>a.t>0);portals.forEach(a=>a.life-=dt);portals=portals.filter(a=>a.life>0);$('hpText').textContent=`HP ${hp} / 4800`;$('hpBar').style.width=hp/48+'%';$('pullBtn').style.opacity=cool?'0.45':'1';$('score').textContent=`撃破 ${kills} / 3`;$('timer').textContent=`残り ${Math.ceil(timeLeft)}秒`;if(hp<=0){endMatch(false)}else if(kills>=3){endMatch(true)}else if(timeLeft<=0){endMatch(false)}}function endMatch(won){if(gameEnded)return;gameEnded=true;move={x:0,y:0};const old=JSON.parse(localStorage.getItem('ba_progress')||'{"coins":0,"trophies":0,"wins":0,"matches":0}');old.coins=(old.coins||0)+(won?100:20);old.trophies=Math.max(0,(old.trophies||0)+(won?8:1));old.wins=(old.wins||0)+(won?1:0);old.matches=(old.matches||0)+1;localStorage.setItem('ba_progress',JSON.stringify(old));$('hint').textContent=won?'🏆 勝利！':'💫 試合終了！';$('reward').textContent=`報酬 +${won?100:20} コイン / トロフィー ${won?'+8':'+1'}`;$('restartBtn').textContent='もう一度！';}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#b96f4e';x.fillRect(0,0,W,H);x.strokeStyle='#d88c62';for(let a=0;a<W;a+=36)for(let b=40;b<H;b+=36)x.strokeRect(a,b,36,36);for(let [a,b,w,h] of [[W*.36,H*.16,75,50],[W*.42,H*.72,90,45],[W*.78,H*.13,95,45],[W*.82,H*.75,75,45]]){x.fillStyle='#28734e';x.fillRect(a,b,w,h);for(let i=0;i<16;i++)circ(a+(i*31%w),b+(i*19%h),4,'#3eaa68')}for(let [a,b] of [[W*.48,H*.32],[W*.56,H*.62],[W*.7,H*.43]]){x.fillStyle='#8c4e38';x.fillRect(a,b,30,30);x.fillStyle='#c57c55';x.fillRect(a+3,b+3,24,24)}for(let a of portals){circ(a.x,a.y,23,'#28134d','#b77bff');circ(a.x,a.y,14,'#6739a2','#e6c4ff');circ(a.x,a.y,6,'#17152f')}for(let s of shots)circ(s.x,s.y,5,s.owner==='p'?'#e7c2ff':'#ff8d8d');for(let b of bots)if(b.hp>0){circ(b.x,b.y+4,20,'#9a393d');circ(b.x,b.y,17,'#586f9f','#d5ddff');circ(b.x-5,b.y-3,3,'#17213a');circ(b.x+5,b.y-3,3,'#17213a');x.fillStyle='#271323';x.fillRect(b.x-21,b.y-29,42,5);x.fillStyle='#ff5369';x.fillRect(b.x-21,b.y-29,42*Math.max(0,b.hp/3200),5);x.font='bold 10px system-ui';x.textAlign='center';x.fillStyle='white';x.fillText('BOT',b.x,b.y-35)}circ(p.x,p.y+5,21,'#247c51');circ(p.x,p.y,17,'#eeeaff','#b98aff');circ(p.x-5,p.y-3,3,'#17172d');circ(p.x+5,p.y-3,3,'#17172d');
/* エイム方向のガイドと照準 */
x.save();x.setLineDash([7,6]);x.strokeStyle='#fff4a8';x.lineWidth=2;x.beginPath();x.moveTo(p.x+aim.x*24,p.y+aim.y*24);x.lineTo(p.x+aim.x*Math.min(120,Math.min(W,H)*.28),p.y+aim.y*Math.min(120,Math.min(W,H)*.28));x.stroke();x.restore();
let rx=p.x+aim.x*Math.min(120,Math.min(W,H)*.28),ry=p.y+aim.y*Math.min(120,Math.min(W,H)*.28);x.beginPath();x.arc(rx,ry,10,0,Math.PI*2);x.strokeStyle='#fff4a8';x.lineWidth=2;x.stroke();x.beginPath();x.moveTo(rx-15,ry);x.lineTo(rx+15,ry);x.moveTo(rx,ry-15);x.lineTo(rx,ry+15);x.stroke();x.save();x.setLineDash([4,5]);x.beginPath();x.moveTo(p.x+superAim.x*24,p.y+superAim.y*24);x.lineTo(p.x+superAim.x*Math.min(105,Math.min(W,H)*.24),p.y+superAim.y*Math.min(105,Math.min(W,H)*.24));x.strokeStyle='#e0a7ff';x.lineWidth=2;x.stroke();x.restore();x.strokeStyle='#8b55d7';x.lineWidth=5;x.beginPath();x.ellipse(p.x,p.y-16,11,5,0,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+aim.x*30,p.y+aim.y*30);x.strokeStyle='white';x.lineWidth=3;x.stroke();for(let a of bits)circ(a.x,a.y,3,'#c89aff')}function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;resize();update(dt);draw();requestAnimationFrame(loop)}resize();start()})();
