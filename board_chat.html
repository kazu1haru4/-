<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掲示板チャット</title>
  <style>
    * { box-sizing: border-box; }
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff3fb,#eef5ff);color:#333}
    .header{position:relative;z-index:10;background:white;padding:15px 20px;box-shadow:0 4px 15px rgba(0,0,0,.06);flex:0 0 auto}
    .top{display:flex;align-items:center;gap:10px}.home-button{padding:9px 12px;background:#f3f3f3;color:#555;text-decoration:none;border-radius:12px;font-size:13px;font-weight:bold;white-space:nowrap}.title-area{min-width:0;flex:1}.title{font-size:19px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:3px;color:#999;font-size:12px}
    .messages-wrapper{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}#messages{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;max-width:740px;margin:0 auto}.empty{text-align:center;color:#999;padding:40px 10px}
    .message{margin-bottom:18px;display:flex;flex-direction:column;position:relative}.message.mine{align-items:flex-end}.message.other{align-items:flex-start}.sender{font-size:12px;color:#999;margin-bottom:4px}.bubble{max-width:80%;padding:11px 14px;border-radius:18px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#8f7cff;color:white;border-bottom-right-radius:5px}.other .bubble{background:white;color:#333;border-bottom-left-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
    .message-image{display:block;max-width:260px;max-height:300px;border-radius:15px;object-fit:contain;margin-bottom:5px}.time{margin-top:4px;color:#aaa;font-size:10px}.message-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.action-button{border:none;background:white;border-radius:12px;padding:6px 10px;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer}.gift-button{border:none;background:#fff4d8;color:#a06a00;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer}.gift-button:disabled{opacity:.5;cursor:default}.delete-button{border:none;background:#fff0f0;color:#d55;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.04);cursor:pointer}.deleted-message{color:#999!important;font-style:italic;background:#f3f3f3!important;box-shadow:none!important}
    .reaction-picker{display:none;gap:5px;background:white;padding:7px;border-radius:14px;box-shadow:0 5px 15px rgba(0,0,0,.12);margin-top:6px}.reaction-picker button{border:none;background:#f5f5f5;width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}.reactions{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.reaction{background:white;border-radius:12px;padding:4px 8px;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.07)}
    .latest-button{position:absolute;right:18px;bottom:15px;z-index:15;border:none;border-radius:999px;padding:10px 15px;background:white;color:#555;font-size:13px;font-weight:bold;box-shadow:0 5px 18px rgba(0,0,0,.15);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s;cursor:pointer}.latest-button.show{opacity:1;pointer-events:auto;transform:translateY(0)}
    .reply-preview{display:none;position:fixed;left:0;right:0;bottom:64px;z-index:19;background:white;padding:10px 14px;border-top:1px solid #eee;box-shadow:0 -3px 12px rgba(0,0,0,.06)}.reply-preview-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:10px}.reply-text{flex:1;min-width:0;font-size:12px;color:#777;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cancel-reply{border:none;background:#eee;border-radius:10px;padding:7px 10px;cursor:pointer}
    .input-area{position:fixed;left:0;right:0;bottom:0;z-index:20;background:white;padding:10px;box-shadow:0 -4px 15px rgba(0,0,0,.08)}.input-inner{max-width:700px;margin:0 auto;display:flex;gap:7px;align-items:center}#imageButton{width:44px;height:44px;border:none;border-radius:15px;background:#f0edff;font-size:21px;flex-shrink:0;cursor:pointer}#messageInput{flex:1;min-width:0;border:1px solid #ddd;border-radius:18px;padding:12px 14px;font-size:16px;outline:none}#sendButton{border:none;border-radius:18px;padding:0 15px;height:44px;background:#8f7cff;color:white;font-weight:bold;font-size:14px;flex-shrink:0;cursor:pointer}#sendButton:disabled,#imageButton:disabled{opacity:.5}#imageInput{display:none}
    .gift-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px}.gift-box{width:100%;max-width:380px;background:white;border-radius:24px;padding:24px;box-shadow:0 15px 40px rgba(0,0,0,.2)}.gift-title{text-align:center;font-size:21px;font-weight:bold;margin-bottom:8px}.gift-target{text-align:center;color:#888;font-size:14px;margin-bottom:20px;word-break:break-word}.gift-label{display:block;font-size:13px;font-weight:bold;color:#777;margin-bottom:7px}.gift-amount-input{width:100%;border:1px solid #ddd;border-radius:14px;padding:13px;font-size:17px;outline:none;margin-bottom:12px}.gift-presets{display:flex;gap:7px;margin-bottom:16px}.gift-preset{flex:1;border:none;border-radius:12px;padding:10px 5px;background:#fff4d8;color:#8a6200;font-weight:bold;cursor:pointer}.gift-buttons{display:flex;gap:10px}.gift-cancel,.gift-send{flex:1;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:bold;cursor:pointer}.gift-cancel{background:#eee;color:#555}.gift-send{background:#ffbd45;color:white}.gift-send:disabled{opacity:.5}.gift-message{min-height:20px;margin-bottom:10px;text-align:center;font-size:13px;color:#e25555}
    @media(max-width:500px){#messages{padding:15px}.bubble{max-width:86%}.latest-button{right:12px;bottom:12px}.message-actions{gap:5px}.action-button,.gift-button,.delete-button{padding:6px 8px}}
  </style>
</head>
<body>
<header class="header"><div class="top"><a href="board.html" class="home-button">← 掲示板</a><div class="title-area"><div class="title" id="boardTitle">読み込み中...</div><div class="sub">掲示板チャット</div></div></div></header>
<main class="messages-wrapper"><div id="messages"><div class="empty">メッセージを読み込み中...</div></div><button type="button" id="latestButton" class="latest-button">⬇️ 最新へ</button></main>
<div class="reply-preview" id="replyPreview"><div class="reply-preview-inner"><div class="reply-text" id="replyText"></div><button type="button" class="cancel-reply" id="cancelReply">✕</button></div></div>
<div class="gift-modal" id="giftModal"><div class="gift-box"><div class="gift-title">🎁 コインギフト</div><div class="gift-target" id="giftTarget"></div><label class="gift-label" for="giftAmount">送るコイン</label><input id="giftAmount" class="gift-amount-input" type="number" min="1" step="1" inputmode="numeric" placeholder="コイン数を入力"><div class="gift-presets"><button type="button" class="gift-preset" data-amount="10">10</button><button type="button" class="gift-preset" data-amount="50">50</button><button type="button" class="gift-preset" data-amount="100">100</button></div><div class="gift-message" id="giftMessage"></div><div class="gift-buttons"><button type="button" class="gift-cancel" id="giftCancel">キャンセル</button><button type="button" class="gift-send" id="giftSend">🎁 送る</button></div></div></div>
<div class="input-area"><div class="input-inner"><button type="button" id="imageButton">🖼️</button><input type="file" id="imageInput" accept="image/*"><input id="messageInput" type="text" placeholder="メッセージを入力" maxlength="1000"><button type="button" id="sendButton">送信</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(window.location.search);
const boardId=params.get("id");
let currentUsername="",replyMessage=null,giftTargetUsername="";
const boardTitle=document.getElementById("boardTitle"),messagesElement=document.getElementById("messages"),latestButton=document.getElementById("latestButton"),messageInput=document.getElementById("messageInput"),sendButton=document.getElementById("sendButton"),imageButton=document.getElementById("imageButton"),imageInput=document.getElementById("imageInput"),replyPreview=document.getElementById("replyPreview"),replyText=document.getElementById("replyText"),cancelReply=document.getElementById("cancelReply");
const giftModal=document.getElementById("giftModal"),giftTarget=document.getElementById("giftTarget"),giftAmount=document.getElementById("giftAmount"),giftMessage=document.getElementById("giftMessage"),giftCancel=document.getElementById("giftCancel"),giftSend=document.getElementById("giftSend");

function scrollToBottom(smooth=false){messagesElement.scrollTo({top:messagesElement.scrollHeight,behavior:smooth?"smooth":"auto"})}
function updateLatestButton(){const distance=messagesElement.scrollHeight-messagesElement.scrollTop-messagesElement.clientHeight;if(distance>150)latestButton.classList.add("show");else latestButton.classList.remove("show")}
messagesElement.addEventListener("scroll",updateLatestButton);
latestButton.addEventListener("click",()=>scrollToBottom(true));

async function start(){
 if(!boardId){boardTitle.textContent="掲示板が見つかりません";return}
 const {data,error}=await supabaseClient.auth.getUser();
 if(error||!data.user){boardTitle.textContent="ログインしてください";return}
 currentUsername=data.user.user_metadata?.username||"";
 const {data:post,error:postError}=await supabaseClient.from("board_posts").select("title").eq("id",boardId).maybeSingle();
 if(postError||!post){boardTitle.textContent="掲示板が見つかりません";return}
 boardTitle.textContent=post.title;
 const {data:member}=await supabaseClient.from("board_members").select("id").eq("board_id",boardId).eq("user_id",currentUsername).maybeSingle();
 if(!member){boardTitle.textContent="参加していません";messagesElement.innerHTML='<div class="empty">この掲示板に参加するとチャットできます。</div>';messageInput.disabled=true;sendButton.disabled=true;imageButton.disabled=true;return}
 await loadMessages();startRealtime();
}

async function loadMessages(){
 const {data,error}=await supabaseClient.from("board_messages").select("*").eq("board_id",boardId).order("created_at",{ascending:true});
 if(error){console.error(error);messagesElement.innerHTML='<div class="empty">メッセージを読み込めませんでした。</div>';return}
 messagesElement.innerHTML="";
 if(!data||data.length===0){messagesElement.innerHTML='<div class="empty">まだメッセージがありません。<br>最初のメッセージを送ってみよう！</div>';updateLatestButton();return}
 for(const message of data)await addMessage(message);
 scrollToBottom();updateLatestButton();
}

async function addMessage(message){
 const messageElement=document.createElement("div");messageElement.className="message "+(message.sender_id===currentUsername?"mine":"other");
 const sender=document.createElement("div");sender.className="sender";sender.textContent="@"+message.sender_id;
 const bubble=document.createElement("div");bubble.className="bubble";
 if(message.is_deleted){
  bubble.classList.add("deleted-message");bubble.textContent="このメッセージは取り消されました";
  const time=document.createElement("div");time.className="time";time.textContent=new Date(message.created_at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  messageElement.appendChild(sender);messageElement.appendChild(bubble);messageElement.appendChild(time);messagesElement.appendChild(messageElement);return;
 }
 if(message.image_url){
  const {data}=await supabaseClient.storage.from("chat-images").createSignedUrl(message.image_url,3600);
  if(data?.signedUrl){const image=document.createElement("img");image.className="message-image";image.src=data.signedUrl;image.alt="送信された画像";bubble.appendChild(image)}
 }
 if(message.content){const text=document.createElement("div");text.textContent=message.content;bubble.appendChild(text)}
 const time=document.createElement("div");time.className="time";time.textContent=new Date(message.created_at).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
 const actions=document.createElement("div");actions.className="message-actions";
 const reactionButton=document.createElement("button");reactionButton.type="button";reactionButton.className="action-button";reactionButton.textContent="❤️ リアクション";
 const replyButton=document.createElement("button");replyButton.type="button";replyButton.className="action-button";replyButton.textContent="↩️ 返信";
 const giftButton=document.createElement("button");giftButton.type="button";giftButton.className="gift-button";giftButton.textContent="🎁 ギフト";
 if(message.sender_id===currentUsername){giftButton.disabled=true}
 giftButton.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();if(message.sender_id===currentUsername)return;openGiftModal(message.sender_id)});
 if(message.sender_id===currentUsername){
  const deleteButton=document.createElement("button");deleteButton.type="button";deleteButton.className="delete-button";deleteButton.textContent="🗑️ 送信取り消し";
  deleteButton.addEventListener("click",async event=>{event.preventDefault();event.stopPropagation();if(!confirm("このメッセージを取り消しますか？"))return;deleteButton.disabled=true;await deleteMessage(message.id)});
  actions.appendChild(deleteButton);
 }
 const picker=document.createElement("div");picker.className="reaction-picker";
 ["❤️","😂","👍","😮","😢"].forEach(reaction=>{const button=document.createElement("button");button.type="button";button.textContent=reaction;button.addEventListener("click",async()=>{await toggleReaction(message.id,reaction);picker.style.display="none";await loadMessages()});picker.appendChild(button)});
 reactionButton.addEventListener("click",()=>{picker.style.display=picker.style.display==="flex"?"none":"flex"});
 replyButton.addEventListener("click",()=>{replyMessage=message;replyPreview.style.display="block";replyText.textContent="@"+message.sender_id+" に返信： "+(message.content||"画像");messageInput.focus()});
 actions.insertBefore(reactionButton,actions.firstChild);actions.insertBefore(replyButton,actions.children[1]);actions.insertBefore(giftButton,actions.children[2]);
 const reactions=document.createElement("div");reactions.className="reactions";
 const {data:reactionData}=await supabaseClient.from("board_reactions").select("reaction").eq("board_message_id",message.id);
 if(reactionData){const counts={};reactionData.forEach(item=>{counts[item.reaction]=(counts[item.reaction]||0)+1});Object.entries(counts).forEach(([reaction,count])=>{const item=document.createElement("div");item.className="reaction";item.textContent=reaction+" "+count;reactions.appendChild(item)})}
 messageElement.appendChild(sender);messageElement.appendChild(bubble);messageElement.appendChild(time);messageElement.appendChild(actions);messageElement.appendChild(picker);messageElement.appendChild(reactions);messagesElement.appendChild(messageElement);
 await loadReplies(message.id,messageElement);
}

function openGiftModal(username){if(!username||username===currentUsername)return;giftTargetUsername=username;giftTarget.textContent="@"+username+" さんにコインを送ります";giftAmount.value="";giftMessage.textContent="";giftSend.disabled=false;giftSend.textContent="🎁 送る";giftModal.style.display="flex";setTimeout(()=>giftAmount.focus(),50)}
function closeGiftModal(){giftModal.style.display="none";giftTargetUsername="";giftAmount.value="";giftMessage.textContent="";giftSend.disabled=false;giftSend.textContent="🎁 送る"}
async function sendGift(){
 if(!giftTargetUsername)return;
 const amount=Number(giftAmount.value);
 if(!Number.isInteger(amount)||amount<=0){giftMessage.textContent="1枚以上のコインを入力してね。";return}
 giftSend.disabled=true;giftSend.textContent="送信中...";giftMessage.textContent="";
 const {error}=await supabaseClient.rpc("send_coin_gift",{target_username:giftTargetUsername,gift_amount:amount});
 if(error){console.error("コインギフトエラー:",error);giftSend.disabled=false;giftSend.textContent="🎁 送る";giftMessage.textContent=error.message||"コインを送れませんでした。";return}
 alert("🎁 @"+giftTargetUsername+" さんに "+amount+" コインを送りました！");closeGiftModal();
}
document.querySelectorAll(".gift-preset").forEach(button=>button.addEventListener("click",()=>{giftAmount.value=button.dataset.amount;giftAmount.focus()}));
giftCancel.addEventListener("click",closeGiftModal);giftSend.addEventListener("click",sendGift);giftModal.addEventListener("click",event=>{if(event.target===giftModal)closeGiftModal()});

async function deleteMessage(messageId){
 if(!currentUsername)return;
 const {error}=await supabaseClient.from("board_messages").update({is_deleted:true}).eq("id",messageId).eq("sender_id",currentUsername);
 if(error){console.error("送信取り消しエラー:",error);alert("送信取り消しに失敗しました。\n\n"+error.message);return}
 await loadMessages();scrollToBottom(true);
}
async function loadReplies(messageId,messageElement){
 const {data}=await supabaseClient.from("board_replies").select("*").eq("board_message_id",messageId).order("created_at",{ascending:true});
 if(!data||data.length===0)return;
 data.forEach(reply=>{const replyElement=document.createElement("div");replyElement.style.marginTop="7px";replyElement.style.padding="8px 12px";replyElement.style.background="#f7f7f7";replyElement.style.borderRadius="12px";replyElement.style.fontSize="12px";replyElement.textContent="↩️ @"+reply.sender_id+"： "+reply.content;messageElement.appendChild(replyElement)});
}
async function toggleReaction(messageId,reaction){
 const {data:existing}=await supabaseClient.from("board_reactions").select("id").eq("board_message_id",messageId).eq("user_id",currentUsername).eq("reaction",reaction).maybeSingle();
 if(existing)await supabaseClient.from("board_reactions").delete().eq("id",existing.id);
 else await supabaseClient.from("board_reactions").insert({board_message_id:messageId,user_id:currentUsername,reaction:reaction});
}

/* 通常メッセージ・画像投稿では通知しない。
   通知するのは「自分のメッセージへの返信」と「自分へのメンション」だけ。 */

async function sendBoardReplyNotification(replyMessageId, replyContent){
 if(!currentUsername||!boardId||!replyMessageId)return;

 const {data:target,error:targetError}=await supabaseClient
  .from("board_messages")
  .select("sender_id,content")
  .eq("id",replyMessageId)
  .maybeSingle();

 if(targetError){
  console.error("返信先メッセージ取得エラー:",targetError);
  return;
 }

 if(!target?.sender_id||target.sender_id===currentUsername)return;

 const title="↩️ 掲示板で返信されました";
 const message="@"+currentUsername+" さんがあなたのメッセージに返信しました: "+String(replyContent||"返信").slice(0,100);
 const link="board-chat.html?id="+encodeURIComponent(boardId);

 const {error}=await supabaseClient
  .from("notifications")
  .insert({
   user_id:target.sender_id,
   type:"board_reply",
   title,
   message,
   link,
   is_read:false
  });

 if(error)console.error("返信通知作成エラー:",error);

 try{
  await supabaseClient.functions.invoke("send-push",{
   body:{
    username:target.sender_id,
    title,
    message,
    url:link
   }
  });
 }catch(error){
  console.warn("返信Push通知エラー:",error);
 }
}

async function sendBoardMentionNotifications(text){
 if(!currentUsername||!boardId||!text)return;

 const mentioned=[...String(text).matchAll(/@([A-Za-z0-9_-]+)/g)]
  .map(match=>match[1])
  .filter((userId,index,array)=>
   userId &&
   userId!==currentUsername &&
   array.indexOf(userId)===index
  );

 if(!mentioned.length)return;

 const {data:members,error:memberError}=await supabaseClient
  .from("board_members")
  .select("user_id")
  .eq("board_id",boardId);

 if(memberError){
  console.error("掲示板メンバー取得エラー:",memberError);
  return;
 }

 const memberSet=new Set((members||[]).map(member=>member.user_id));
 const recipients=mentioned.filter(userId=>memberSet.has(userId));

 if(!recipients.length)return;

 const title="🔔 掲示板でメンションされました";
 const message="@"+currentUsername+" さんがあなたをメンションしました: "+String(text).slice(0,100);
 const link="board-chat.html?id="+encodeURIComponent(boardId);

 const {error}=await supabaseClient
  .from("notifications")
  .insert(
   recipients.map(userId=>({
    user_id:userId,
    type:"mention",
    title,
    message,
    link,
    is_read:false
   }))
  );

 if(error)console.error("メンション通知作成エラー:",error);

 await Promise.all(
  recipients.map(async userId=>{
   try{
    await supabaseClient.functions.invoke("send-push",{
     body:{
      username:userId,
      title,
      message,
      url:link
     }
    });
   }catch(error){
    console.warn("メンションPush通知エラー:",error);
   }
  })
 );
}

async function sendMessage(){
 const content=messageInput.value.trim();
 if(!content){if(replyMessage)alert("返信内容を入力してね。");return}
 sendButton.disabled=true;
 if(replyMessage){
  const {error}=await supabaseClient.from("board_replies").insert({board_message_id:replyMessage.id,sender_id:currentUsername,content});
  sendButton.disabled=false;
  if(error){console.error(error);alert("返信を送信できませんでした。");return}
  await sendBoardReplyNotification(replyMessage.id,content);
  messageInput.value="";cancelReplyMode();await loadMessages();scrollToBottom();return;
 }
 const {error}=await supabaseClient.from("board_messages").insert({board_id:Number(boardId),sender_id:currentUsername,content,image_url:"",is_deleted:false});
 sendButton.disabled=false;
 if(error){console.error(error);alert("メッセージを送信できませんでした。");return}
 messageInput.value="";messageInput.focus();
 await sendBoardMentionNotifications(content);
 await loadMessages();scrollToBottom();
}

async function uploadImage(file){
 if(!file)return;
 const extension=file.name.split(".").pop().toLowerCase();
 const filePath="boards/"+boardId+"/"+currentUsername+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+extension;
 imageButton.disabled=true;
 const {error:uploadError}=await supabaseClient.storage.from("chat-images").upload(filePath,file,{contentType:file.type,upsert:false});
 if(uploadError){console.error(uploadError);imageButton.disabled=false;alert("画像をアップロードできませんでした。");return}
 const {error}=await supabaseClient.from("board_messages").insert({board_id:Number(boardId),sender_id:currentUsername,content:"",image_url:filePath,is_deleted:false});
 imageButton.disabled=false;
 if(error){console.error(error);alert("画像メッセージを送信できませんでした。");return}
 imageInput.value="";
 await loadMessages();scrollToBottom();
}
function cancelReplyMode(){replyMessage=null;replyPreview.style.display="none";replyText.textContent="";messageInput.focus()}
function startRealtime(){
 supabaseClient.channel("board-chat-"+boardId)
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"board_messages",filter:"board_id=eq."+boardId},async()=>{await loadMessages();scrollToBottom()})
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"board_messages",filter:"board_id=eq."+boardId},async()=>{await loadMessages()})
 .subscribe();
}
imageButton.addEventListener("click",()=>imageInput.click());
imageInput.addEventListener("change",async()=>{const file=imageInput.files?.[0];await uploadImage(file)});
sendButton.addEventListener("click",sendMessage);
messageInput.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();sendMessage()}});
cancelReply.addEventListener("click",cancelReplyMode);
start();
</script>
</body>
</html>
