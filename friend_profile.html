<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友達プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .home-button {
      display: inline-block;
      margin-bottom: 14px;
      padding: 10px 15px;
      border-radius: 14px;
      background: white;
      color: #6556d8;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .profile-card {
      background: white;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #eee8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 50px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
    }

    .user-id {
      margin-top: 5px;
      color: #999;
      font-size: 14px;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .status.online {
      color: #22a447;
    }

    .status.offline {
      color: #999;
    }

    .last-online {
      margin-top: 4px;
      color: #999;
      font-size: 12px;
    }

    .bio {
      margin-top: 20px;
      padding: 15px;
      border-radius: 16px;
      background: #f8f7ff;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      color: #555;
    }

    .chat-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      color: #999;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
  </style>
</head>

<body>

  <main class="container">

    <a href="friends.html" class="home-button">
      ← フレンド一覧
    </a>

    <div id="profileArea">
      <div class="empty">
        プロフィールを読み込み中...
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const profileArea =
      document.getElementById("profileArea");

    const ONLINE_LIMIT =
      60 * 1000;


    // URLからユーザーID取得
    const params =
      new URLSearchParams(
        window.location.search
      );

    const friendId =
      params.get("user");


    // =========================
    // オンライン判定
    // =========================

    function isOnline(lastSeen) {

      if (!lastSeen) {
        return false;
      }

      const time =
        new Date(lastSeen).getTime();

      if (Number.isNaN(time)) {
        return false;
      }

      return (
        Date.now() - time <= ONLINE_LIMIT
      );
    }


    // =========================
    // 最終オンライン
    // =========================

    function formatLastOnline(lastSeen) {

      if (!lastSeen) {
        return "最終オンライン：不明";
      }

      const time =
        new Date(lastSeen).getTime();

      if (Number.isNaN(time)) {
        return "最終オンライン：不明";
      }

      const diff =
        Date.now() - time;

      if (diff < 60 * 1000) {
        return "最終オンライン：今";
      }

      const minutes =
        Math.floor(
          diff / (60 * 1000)
        );

      if (minutes < 60) {
        return (
          "最終オンライン：" +
          minutes +
          "分前"
        );
      }

      const hours =
        Math.floor(
          minutes / 60
        );

      if (hours < 24) {
        return (
          "最終オンライン：" +
          hours +
          "時間前"
        );
      }

      const days =
        Math.floor(
          hours / 24
        );

      if (days < 30) {
        return (
          "最終オンライン：" +
          days +
          "日前"
        );
      }

      const date =
        new Date(lastSeen);

      return (
        "最終オンライン：" +
        date.getFullYear() +
        "/" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "/" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );
    }


    // =========================
    // プロフィール読み込み
    // =========================

    async function loadProfile() {

      if (!friendId) {

        profileArea.innerHTML =
          '<div class="empty">ユーザーが指定されていません。</div>';

        return;
      }


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "user_id, name, avatar_url, bio"
          )
          .eq(
            "user_id",
            friendId
          )
          .maybeSingle();


      if (profileError) {

        console.error(
          "プロフィール取得エラー:",
          profileError
        );

        profileArea.innerHTML =
          '<div class="empty">プロフィールを取得できませんでした。</div>';

        return;
      }


      if (!profile) {

        profileArea.innerHTML =
          '<div class="empty">プロフィールが見つかりません。</div>';

        return;
      }


      // =========================
      // オンライン情報
      // =========================

      const {
        data: presence
      } =
        await supabaseClient
          .from("user_presence")
          .select(
            "last_seen"
          )
          .eq(
            "user_id",
            friendId
          )
          .maybeSingle();


      const lastSeen =
        presence?.last_seen || null;

      const online =
        isOnline(lastSeen);


      // =========================
      // カード
      // =========================

      const card =
        document.createElement("section");

      card.className =
        "profile-card";


      // アバター
      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar";


      if (profile.avatar_url) {

        const img =
          document.createElement("img");

        img.src =
          profile.avatar_url;

        img.alt =
          "プロフィール画像";

        img.onerror =
          function() {
            avatar.innerHTML = "👤";
          };

        avatar.appendChild(img);

      } else {

        avatar.textContent =
          "👤";

      }


      // 名前
      const name =
        document.createElement("div");

      name.className =
        "name";

      name.textContent =
        profile.name ||
        friendId;


      // ID
      const userId =
        document.createElement("div");

      userId.className =
        "user-id";

      userId.textContent =
        "@" + friendId;


      // オンライン
      const status =
        document.createElement("div");

      status.className =
        "status " +
        (online ? "online" : "offline");

      status.textContent =
        online
          ? "🟢 オンライン"
          : "⚪ オフライン";


      // 最終オンライン
      const lastOnline =
        document.createElement("div");

      lastOnline.className =
        "last-online";

      lastOnline.textContent =
        online
          ? "最終オンライン：今"
          : formatLastOnline(
              lastSeen
            );


      // 自己紹介
      const bio =
        document.createElement("div");

      bio.className =
        "bio";

      bio.textContent =
        profile.bio ||
        "自己紹介はまだありません。";


      // チャットボタン
      const chatButton =
        document.createElement("button");

      chatButton.type =
        "button";

      chatButton.className =
        "chat-button";

      chatButton.textContent =
        "💬 チャットする";


      chatButton.addEventListener(
        "click",
        function() {

          window.location.href =
            "chat.html?user=" +
            encodeURIComponent(
              friendId
            );

        }
      );


      card.appendChild(avatar);
      card.appendChild(name);
      card.appendChild(userId);
      card.appendChild(status);
      card.appendChild(lastOnline);
      card.appendChild(bio);
      card.appendChild(chatButton);


      profileArea.innerHTML = "";

      profileArea.appendChild(card);

    }


    loadProfile();

  </script>

</body>
</html>
