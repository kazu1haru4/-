<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フレンドガチャ管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(ellipse at top,#302052,#100b20 65%);color:#f6f1ff;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto}h1{font-size:clamp(23px,4vw,32px)}h2{font-size:19px}.muted,.small{color:#b9accf}.small{font-size:12px}.panel{background:#1d1533;border:1px solid #40315f;border-radius:16px;padding:16px;margin:14px 0}label{display:block;font-size:13px;color:#c9bde0;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #51416e;background:#110c20;color:white;border-radius:9px;font:inherit}input[type=checkbox]{width:auto}button{border:0;border-radius:10px;padding:10px 13px;background:#9672ff;color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#33264c}.danger{background:#8c3558}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{padding:12px;border-radius:10px;background:#ffffff0c;margin:12px 0;white-space:pre-wrap}.error{color:#ffb6c9;border:1px solid #9b3d5a}.ok{color:#b7ffd2;border:1px solid #337c58}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:minmax(0,1fr) 100px 100px 100px;gap:9px;align-items:center;background:#ffffff08;border:1px solid #ffffff14;padding:10px;border-radius:12px}.item .char{min-width:0}.catalogItem{display:flex;gap:10px;align-items:center;background:#ffffff08;padding:10px;border-radius:10px}.catalogItem span{flex:1}.badge{font-size:12px;color:#c9bde0}@media(max-width:650px){.row{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item .char{grid-column:1/-1}}</style></head><body><main class="wrap"><div class="muted">FRIEND CHAT / ADMIN</div><h1>🎟️ 複数ガチャ管理</h1><div class="muted">ガチャごとに名前・消費コイン・公開状態・景品・確率・チケット報酬を設定できます。</div><div id="status" class="status">初期化中…</div><section class="panel"><h2>ガチャを作成</h2><div class="row"><div><label>ガチャ名</label><input id="newTitle" maxlength="100" placeholder="例：レアキャラガチャ"></div><div><label>1回の消費コイン</label><input id="newCost" type="number" min="1" max="1000000000" value="100"></div></div><div class="actions"><button id="createGacha">＋ ガチャを作成</button><button class="secondary" onclick="location.href='gacha.html'">ガチャ画面へ</button></div></section><section class="panel"><h2>登録済みガチャ</h2><div id="gachaList" class="list">読み込み中…</div></section><section class="panel" id="editPanel" hidden><h2>選択中のガチャ設定</h2><div class="row"><div><label>タイトル</label><input id="title" maxlength="100"></div><div><label>1回の消費コイン</label><input id="cost" type="number" min="1" max="1000000000"></div></div><label>公開状態</label><select id="enabled"><option value="true">有効（公開）</option><option value="false">停止（非公開）</option></select><div class="actions"><button id="saveGacha">ガチャ設定を保存</button></div><hr style="border-color:#40315f;margin:20px 0"><h2>景品を追加</h2><p class="muted">景品はキャラクター本体ではなく、設定した枚数の交換チケットです。有効景品の確率合計は100%にしてください。</p><label>キャラクター検索</label><input id="search" placeholder="名前・レア度で検索"><div class="actions"><button id="addSelected">選択したキャラクターを追加</button><button id="selectAll" class="secondary">表示中をすべて選択</button></div><div id="catalog" class="list" style="margin-top:12px"></div><h2 style="margin-top:24px">このガチャの景品</h2><div id="prizes" class="list"></div><div id="total" class="status">確率合計：0%</div><button id="savePrizes">このガチャの景品を保存</button></section></main><script>
(()=>{const URL='https://yxonmqdyekwenyzekjwj.supabase.co',KEY='sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let gachas=[],activeId=null,catalog=[],prizes=[],originalPrizeIds=new Set(),selected=new Set();function msg(t,c=''){$('status').textContent=t;$('status').className='status '+c}function validInt(v,min,max){const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(`数値は${min}〜${max}の整数にしてください`);return n}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){msg('ログインしていません。同じブラウザでFriend Chatにログインしてから開いてください。','error');return}const a=await db.rpc('is_friendchat_admin');if(a.error)throw a.error;if(a.data!==true){msg('管理者権限が確認できません。管理者アカウントでログインしてください。','error');return}msg('管理者認証OK','ok');await Promise.all([loadGachas(),loadCatalog()])}
async function loadGachas(){const r=await db.from('friend_gachas').select('id,title,spin_cost,enabled,sort_order').order('sort_order').order('id');if(r.error)throw r.error;gachas=r.data||[];renderGachas()}
function renderGachas(){$('gachaList').innerHTML=gachas.map(g=>`<div class="catalogItem"><span><b>${esc(g.title)}</b><div class="small">ID ${g.id} · ${Number(g.spin_cost).toLocaleString()} COIN · ${g.enabled?'公開中':'停止中'}</div></span><button data-edit="${g.id}">設定・景品</button><button class="danger" data-toggle="${g.id}">${g.enabled?'停止':'公開'}</button></div>`).join('')||'<div class="muted">ガチャがありません。</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openGacha(Number(b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const g=gachas.find(x=>x.id===Number(b.dataset.toggle));const r=await db.from('friend_gachas').update({enabled:!g.enabled,updated_at:new Date().toISOString()}).eq('id',g.id);if(r.error){msg('状態変更に失敗：'+r.error.message,'error');return}await loadGachas();msg('公開状態を変更しました','ok')})}
async function loadCatalog(){const r=await db.from('brainrot_catalog').select('id,name,rarity,emoji').order('name');if(r.error)throw r.error;catalog=r.data||[];renderCatalog()}
async function openGacha(id){activeId=id;const g=gachas.find(x=>x.id===id);if(!g)return;$('editPanel').hidden=false;$('title').value=g.title;$('cost').value=g.spin_cost;$('enabled').value=String(g.enabled);await loadPrizes();$('editPanel').scrollIntoView({behavior:'smooth',block:'start'})}
async function loadPrizes(){const r=await db.from('friend_gacha_prizes').select('id,gacha_id,character_id,probability,ticket_reward,exchange_ticket_cost,is_active,sort_order,brainrot_catalog(name,rarity,emoji)').eq('gacha_id',activeId).order('sort_order');if(r.error)throw r.error;prizes=(r.data||[]).map(p=>({...p,name:p.brainrot_catalog?.name||p.character_id,rarity:p.brainrot_catalog?.rarity||'',emoji:p.brainrot_catalog?.emoji||'🎟️'}));originalPrizeIds=new Set(prizes.map(p=>p.id));renderPrizes();renderCatalog()}
function renderCatalog(){const q=$('search').value.toLowerCase();const list=catalog.filter(c=>(c.name+' '+(c.rarity||'')).toLowerCase().includes(q));$('catalog').innerHTML=list.map(c=>`<label class="catalogItem"><input type="checkbox" data-sel="${esc(c.id)}" ${selected.has(c.id)?'checked':''}><span><b>${esc(c.emoji||'🧩')} ${esc(c.name)}</b><div class="small">${esc(c.rarity||'レア度未設定')} · ${esc(c.id)}</div></span><span class="badge">${prizes.some(p=>p.character_id===c.id)?'登録済み':'追加可能'}</span></label>`).join('')||'<div class="muted">該当キャラクターなし</div>';document.querySelectorAll('[data-sel]').forEach(e=>e.onchange=()=>e.checked?selected.add(e.dataset.sel):selected.delete(e.dataset.sel))}
function renderPrizes(){const sum=prizes.filter(p=>p.is_active).reduce((s,p)=>s+Number(p.probability||0),0);$('total').textContent='有効景品の確率合計：'+sum.toFixed(4)+'%（100%必要）';$('total').className='status '+(Math.abs(sum-100)<.0001?'ok':'error');$('prizes').innerHTML=prizes.map((p,i)=>`<div class="item"><div class="char"><b>${esc(p.emoji)} ${esc(p.name)}</b><div class="small">${esc(p.rarity)} · ${esc(p.character_id)}</div></div><div><label>確率%</label><input data-f="probability" data-i="${i}" type="number" min="0.0001" max="100" step="0.0001" value="${p.probability}"></div><div><label>チケット報酬</label><input data-f="ticket_reward" data-i="${i}" type="number" min="1" value="${p.ticket_reward}"></div><div><label>交換必要枚数</label><input data-f="exchange_ticket_cost" data-i="${i}" type="number" min="1" value="${p.exchange_ticket_cost}"></div><label><input data-f="is_active" data-i="${i}" type="checkbox" ${p.is_active?'checked':''}> 抽選対象</label><button class="danger" data-del="${i}">削除</button></div>`).join('')||'<div class="muted">景品がありません。上から追加してください。</div>';document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{const p=prizes[+e.dataset.i];p[e.dataset.f]=e.type==='checkbox'?e.checked:Number(e.value);renderPrizes()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{prizes.splice(+e.dataset.del,1);renderPrizes();renderCatalog()})}
$('createGacha').onclick=async()=>{try{const title=$('newTitle').value.trim();if(!title)throw Error('ガチャ名を入力してください');const spin_cost=validInt($('newCost').value,1,1000000000);const r=await db.from('friend_gachas').insert({title,spin_cost,enabled:true,sort_order:gachas.length+1}).select('id').single();if(r.error)throw r.error;$('newTitle').value='';await loadGachas();await openGacha(r.data.id);msg('ガチャを作成しました','ok')}catch(e){msg('作成失敗：'+e.message,'error')}};
$('saveGacha').onclick=async()=>{try{if(!activeId)throw Error('ガチャを選んでください');const title=$('title').value.trim();if(!title)throw Error('タイトルを入力してください');const spin_cost=validInt($('cost').value,1,1000000000);const r=await db.from('friend_gachas').update({title,spin_cost,enabled:$('enabled').value==='true',updated_at:new Date().toISOString()}).eq('id',activeId);if(r.error)throw r.error;await loadGachas();msg('ガチャ設定を保存しました','ok')}catch(e){msg('保存失敗：'+e.message,'error')}};
$('search').oninput=renderCatalog;$('selectAll').onclick=()=>{const q=$('search').value.toLowerCase();catalog.filter(c=>(c.name+' '+(c.rarity||'')).toLowerCase().includes(q)).forEach(c=>selected.add(c.id));renderCatalog()};$('addSelected').onclick=()=>{selected.forEach(id=>{if(prizes.some(p=>p.character_id===id))return;const c=catalog.find(x=>x.id===id);if(c)prizes.push({character_id:id,name:c.name,rarity:c.rarity||'',emoji:c.emoji||'🎟️',probability:1,ticket_reward:1,exchange_ticket_cost:10,is_active:true,sort_order:prizes.length+1})});selected.clear();renderCatalog();renderPrizes()};
$('savePrizes').onclick=async()=>{try{if(!activeId)throw Error('ガチャを選んでください');const active=prizes.filter(p=>p.is_active),sum=active.reduce((s,p)=>s+Number(p.probability),0);if(!active.length)throw Error('有効な景品を1つ以上設定してください');if(Math.abs(sum-100)>.0001)throw Error('有効景品の確率合計が100%ではありません（'+sum+'%）');for(const p of prizes){if(!(Number(p.probability)>0&&Number(p.probability)<=100))throw Error(p.name+' の確率が不正');validInt(p.ticket_reward,1,2147483647);validInt(p.exchange_ticket_cost,1,2147483647)}const keptIds=new Set(prizes.filter(p=>p.id!=null).map(p=>p.id));for(let i=0;i<prizes.length;i++){const p=prizes[i],row={gacha_id:activeId,character_id:p.character_id,probability:Number(p.probability),ticket_reward:Number(p.ticket_reward),exchange_ticket_cost:Number(p.exchange_ticket_cost),is_active:!!p.is_active,sort_order:i+1};let res=p.id!=null?await db.from('friend_gacha_prizes').update(row).eq('id',p.id).eq('gacha_id',activeId):await db.from('friend_gacha_prizes').insert(row);if(res.error)throw res.error}const removed=[...originalPrizeIds].filter(id=>!keptIds.has(id));if(removed.length){const del=await db.from('friend_gacha_prizes').delete().eq('gacha_id',activeId).in('id',removed);if(del.error)throw del.error}await loadPrizes();msg('このガチャの景品を保存しました','ok')}catch(e){msg('保存失敗：'+e.message,'error')}};
init().catch(e=>msg('読み込みエラー：'+(e.message||e),'error'))})();
</script></body></html>
