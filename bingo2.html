<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>フレンドビンゴ2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff4fb,#eef7ff);color:#333}.wrap{width:min(92%,460px);margin:auto;padding:22px 0 40px}.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer}.head h1{margin:0;font-size:23px;flex:1}.adminBtn{display:none;border:0;border-radius:12px;background:#eee;color:#444;font-weight:800;padding:10px 12px;cursor:pointer}.card{background:rgba(255,255,255,.95);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.07)}.card h2{margin:0 0 7px;font-size:20px}.desc{margin:0 0 15px;color:#777;font-size:13px;line-height:1.6}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px;background:#f6f3ff;border:2px solid #e6e0ff;border-radius:20px}.cell{aspect-ratio:1;border:0;border-radius:17px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.07);font-size:35px;cursor:pointer;transition:transform .12s,opacity .12s}.cell:active{transform:scale(.94)}.cell.open{background:#fff8d9}.cell.line{outline:3px solid #8f7cff}.cell:disabled{cursor:default}.result{min-height:28px;text-align:center;font-weight:800;margin:13px 0 8px}.lines{font-size:14px;color:#6d5cc7;text-align:center;min-height:20px}.play{width:100%;border:0;border-radius:16px;padding:14px;background:#8f7cff;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.play:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;min-height:24px;font-weight:700;font-size:14px;margin-top:10px}.history{display:flex;justify-content:space-between;gap:8px;text-align:center}.stat{flex:1;background:#faf9ff;border:2px solid #e8e3ff;border-radius:15px;padding:12px 6px}.stat strong{display:block;font-size:21px}.stat span{font-size:11px;color:#777}.small{font-size:12px;color:#777;text-align:center;margin-top:8px}.prob{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.prob div{background:#faf9ff;border-radius:10px;padding:8px;text-align:center;font-size:12px;transition:.25s}.prob b{display:block;font-size:15px}.prob span{display:block;font-size:11px;color:#6d5cc7;margin-top:3px;font-weight:700}.prob div.hit{background:#fff2a8;box-shadow:0 0 0 3px #ffd84d,0 0 18px rgba(255,216,77,.8);transform:scale(1.03)}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><button class="back" type="button" onclick="history.back()">‹</button><h1>🎯 フレンドビンゴ2</h1><button id="adminBtn" class="adminBtn" type="button">管理</button></div>
 <div class="card">
  <h2>🎯 9マスチャレンジ</h2>
  <p class="desc">無料で遊べる3×3ミニゲーム！9マスを開けて、そろったラインを探そう。</p>
  <div id="board" class="board" aria-label="3×3ビンゴボード"></div>
  <div id="lineResult" class="lines"></div>
  <div id="result" class="result">「プレイする」を押してスタート！</div>
  <button id="playButton" class="play" type="button">🎮 プレイする</button>
  <div id="status" class="status"></div>
 </div>

 <div class="card">
  <h2>📈 ライン成立率・報酬</h2>
  <div class="prob" id="probList">
   <div data-lines="1">1ライン<b id="p1">30%</b><span data-reward="1">20コイン</span></div>
   <div data-lines="2">2ライン<b id="p2">20%</b><span data-reward="2">20コイン</span></div>
   <div data-lines="3">3ライン<b id="p3">15%</b><span data-reward="3">20コイン</span></div>
   <div data-lines="4">4ライン<b id="p4">10%</b><span data-reward="4">20コイン</span></div>
   <div data-lines="5">5ライン<b id="p5">5%</b><span data-reward="5">20コイン</span></div>
   <div data-lines="6">6ライン<b id="p6">4%</b><span data-reward="6">20コイン</span></div>
   <div data-lines="8">8ライン<b id="p8">1%</b><span data-reward="8">20コイン</span></div>
  </div>
  <div class="small">※ 表示用の設定値。実際の盤面生成では複数ラインが同時成立するため、これらを単純に足して100%にはしません。</div>
 </div>
 <div class="card">
  <h2>📊 プレイ記録</h2>
  <div class="history"><div class="stat"><strong id="plays">0</strong><span>プレイ</span></div><div class="stat"><strong id="bestLines">0</strong><span>最高ライン</span></div><div class="stat"><strong id="totalLines">0</strong><span>成立ライン</span></div></div>
  <div class="small">記録はこの端末に保存されます。</div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentCoins=0;

async function loadCoins(){
  const {data,error}=await db.rpc("get_my_coins");
  if(error){
    console.warn("コイン取得エラー:",error);
    return;
  }
  currentCoins=Number(data||0);
  const el=document.getElementById("coins");
  if(el)el.textContent=currentCoins;
}

async function playWithCoins(){
  const {data,error}=await db.rpc("play_friend_bingo2");
  if(error)throw error;
  currentCoins=Number(data||0);
  const el=document.getElementById("coins");
  if(el)el.textContent=currentCoins;
  return currentCoins;
}

async function rewardCoins(){
  const {data,error}=await db.rpc("reward_friend_bingo2");
  if(error)throw error;
  currentCoins=Number(data||0);
  const el=document.getElementById("coins");
  if(el)el.textContent=currentCoins;
  return currentCoins;
}

const icons=["🌸","⭐","💎","❤️","🌈","🔥"];
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const board=document.getElementById("board");
const playButton=document.getElementById("playButton");
let playing=false,opened=[],symbols=[];
function getCoins(){return currentCoins}
function setCoins(v){currentCoins=Number(v||0);const el=document.getElementById("coins");if(el)el.textContent=currentCoins}
function stats(){document.getElementById("plays").textContent=localStorage.getItem("friendBingo2Plays")||"0";document.getElementById("bestLines").textContent=localStorage.getItem("friendBingo2Best")||"0";document.getElementById("totalLines").textContent=localStorage.getItem("friendBingo2TotalLines")||"0"}
function setStatus(t){document.getElementById("status").textContent=t}
function makeBoard(){board.innerHTML="";for(let i=0;i<9;i++){const b=document.createElement("button");b.type="button";b.className="cell";b.textContent="❓";b.disabled=true;b.dataset.i=i;board.appendChild(b)}}
function randomize(){symbols=Array.from({length:9},()=>icons[Math.floor(Math.random()*icons.length)]);opened=[];document.querySelectorAll(".cell").forEach(b=>{b.textContent="❓";b.classList.remove("open","line");b.disabled=false})}
function openCell(i){if(!playing||opened.includes(i))return;opened.push(i);const b=document.querySelector(`.cell[data-i="${i}"]`);b.textContent=symbols[i];b.classList.add("open");b.disabled=true;if(opened.length===9)finishGame()}
function countLines(){let wins=[];for(const line of lines){if(line.every(i=>symbols[i]===symbols[line[0]]))wins.push(line)}return wins}
function updateRewardDisplay(){
  document.querySelectorAll("#probList [data-reward]").forEach(el=>{
    const n=Number(el.dataset.reward);
    el.textContent=`${BINGO_REWARDS[n]||0}コイン`;
  });
}

function highlightResult(count){
  document.querySelectorAll("#probList [data-lines]").forEach(el=>el.classList.remove("hit"));
  if(count>0){
    document.querySelector(`#probList [data-lines="${count}"]`)?.classList.add("hit");
  }
}
let BINGO_SETTINGS={p_miss:60,p_1:30,p_2:20,p_3:15,p_4:10,p_5:5,p_6:4,p_7:2,p_8:1,reward_1:20,reward_2:20,reward_3:20,reward_4:20,reward_5:20,reward_6:20,reward_7:20,reward_8:20};
const BINGO_REWARDS=new Proxy({}, {get:(_,key)=>Number(BINGO_SETTINGS[`reward_${key}`]||0)});
async function loadBingoSettings(){
 const {data,error}=await db.rpc("get_friend_bingo2_settings");
 if(error){console.warn("ビンゴ設定取得エラー:",error);return;}
 BINGO_SETTINGS={...BINGO_SETTINGS,...data};
 for(let n=1;n<=8;n++){const p=document.getElementById(`p${n}`);if(p)p.textContent=`${BINGO_SETTINGS[`p_${n}`]}%`;}
 updateRewardDisplay();
}
async function checkAdmin(){
 const {data,error}=await db.rpc("is_friend_bingo2_admin");
 if(!error && data){const b=document.getElementById("adminBtn");b.style.display="block";b.addEventListener("click",()=>location.href="admin_bingo2.html");}
}
function chooseTargetLines(){
 const weights=[1,2,3,4,5,6,7,8].map(n=>Math.max(0,Number(BINGO_SETTINGS[`p_${n}`]||0)));
 const miss=Math.max(0,Number(BINGO_SETTINGS.p_miss||0));
 const total=miss+weights.reduce((a,b)=>a+b,0);
 if(total<=0)return 0;
 let r=Math.random()*total;
 if(r<miss)return 0;
 r-=miss;
 for(let i=0;i<weights.length;i++){r-=weights[i];if(r<0)return i+1;}
 return 0;
}

function countBoardLines(boardSymbols){
 return lines.filter(line=>line.every(i=>boardSymbols[i]===boardSymbols[line[0]])).length;
}

function buildBoardForLines(target){
 // target 0 = no line. 1-8 = exact number of lines.
 if(target===0){
   for(let attempt=0;attempt<20000;attempt++){
     const candidate=Array.from({length:9},()=>icons[Math.floor(Math.random()*icons.length)]);
     if(countBoardLines(candidate)===0){symbols=candidate;return;}
   }
   // Deterministic no-line fallback.
   symbols=[icons[0],icons[1],icons[2],icons[1],icons[2],icons[0],icons[2],icons[0],icons[1]];
   return;
 }

 for(let attempt=0;attempt<20000;attempt++){
   const candidate=Array.from({length:9},()=>icons[Math.floor(Math.random()*icons.length)]);
   if(countBoardLines(candidate)===target){symbols=candidate;return;}
 }

 // Guaranteed constructions for common targets.
 if(target===8){symbols=Array(9).fill(icons[0]);return;}

 // Retry using a deterministic construction search if random search failed.
 // Keep searching until an exact board is found; there are only 6^9 possibilities.
 const idx=[0,1,2,3,4,5,6,7,8];
 for(let a=0;a<icons.length;a++){
  for(let b=0;b<icons.length;b++){
   for(let c=0;c<icons.length;c++){
    const candidate=[icons[a],icons[b],icons[c],icons[b],icons[c],icons[a],icons[c],icons[a],icons[b]];
    if(countBoardLines(candidate)===target){symbols=candidate;return;}
   }
  }
 }
 // Should never be reached for 0-8, but leave a safe fallback.
 symbols=Array.from({length:9},(_,i)=>icons[i%icons.length]);
}

async function prepareBoard(){
 let forced=null;
 try{
   const {data,error}=await db.rpc("consume_friend_bingo2_next_lines");
   if(!error && data!==null && data!==undefined){
     const n=Number(data);
     if(Number.isInteger(n) && n>=0 && n<=8) forced=n;
   }else if(error){
     console.warn("次回ライン指定取得エラー:",error);
   }
 }catch(e){
   console.warn("次回ライン指定取得エラー:",e);
 }

 const target=forced===null ? chooseTargetLines() : forced;
 buildBoardForLines(target);
 opened=[];
 document.querySelectorAll(".cell").forEach(b=>{
   b.textContent="❓";
   b.classList.remove("open","line");
   b.disabled=false;
 });
}

async function addBingoReward(linesCount){
 const {data,error}=await db.rpc("reward_friend_bingo2",{p_lines:linesCount});
 if(error)throw error;
 currentCoins=Number(data||0);
 const el=document.getElementById("coins");if(el)el.textContent=currentCoins;
 return data;
}

async function finishGame(){
 const wins=countLines();
 const count=wins.length;
 wins.forEach(line=>line.forEach(i=>document.querySelector(`.cell[data-i="${i}"]`)?.classList.add("line")));
 highlightResult(count);

 const reward=BINGO_REWARDS[count]||0;
 let rewardError=null;
 if(reward){
   try{
     await addBingoReward(count);
   }catch(error){
     rewardError=error;
     console.error("ビンゴ報酬エラー:",error);
   }
 }

 document.getElementById("lineResult").textContent=count
   ? (rewardError ? `✨ ${count}ライン成立！ 報酬処理に失敗しました` : `✨ ${count}ライン成立！ +${reward}コイン`)
   : "💨 今回はラインなし！";
 document.getElementById("result").textContent=count?`🎉 ${count}ラインそろった！`:"もう一度チャレンジしてみよう！";

 const p=Number(localStorage.getItem("friendBingo2Plays")||0)+1;
 const best=Math.max(Number(localStorage.getItem("friendBingo2Best")||0),count);
 const total=Number(localStorage.getItem("friendBingo2TotalLines")||0)+count;
 localStorage.setItem("friendBingo2Plays",p);
 localStorage.setItem("friendBingo2Best",best);
 localStorage.setItem("friendBingo2TotalLines",total);
 stats();

 playing=false;
 playButton.disabled=false;
 document.querySelectorAll(".cell").forEach(b=>b.disabled=true);
 setStatus(
   rewardError
     ? "⚠️ コイン報酬の処理に失敗しました。管理者に確認してください。"
     : (count ? `プレイ完了！${reward}コイン獲得！` : "プレイ完了！もう一度遊べます")
 );
}
async function startGame(){
 if(playing)return;
 playButton.disabled=true;
 setStatus("🪙 コインを確認しています…");
 try{
   await playWithCoins();
 }catch(error){
   console.error("ビンゴプレイ料金エラー:",error);
   playButton.disabled=false;
   setStatus(error?.message?.includes("コインが足りません")
     ?"🪙 コインが足りません（1プレイ1000コイン）"
     :"⚠️ コイン処理に失敗しました。ログイン状態を確認してください。");
   return;
 }
 playing=true;
 setStatus("🪙 1000コイン消費！マスを9個すべて開けよう！");
 document.getElementById("result").textContent="マスを開けています…";
 document.getElementById("lineResult").textContent="";
 document.querySelectorAll("#probList [data-lines]").forEach(el=>el.classList.remove("hit"));
 await prepareBoard()
}
board.addEventListener("click",e=>{const b=e.target.closest(".cell");if(b)openCell(Number(b.dataset.i))});
playButton.addEventListener("click",startGame);
makeBoard();
stats();
loadCoins();
loadBingoSettings();
checkAdmin();
</script>
</body>
</html>
