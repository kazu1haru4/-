<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>副管理者3 - フレンドチャット</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff4fb,#eef7ff);color:#333}
header{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:20}
.title{font-size:18px;font-weight:700}.badge{font-size:11px;background:#eef3ff;color:#3156c9;padding:5px 8px;border-radius:999px;margin-left:5px}
.settings-btn{display:none;border:0;background:#222;color:#fff;padding:9px 12px;border-radius:10px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
h2{font-size:16px;margin:0 0 12px}
.notice{background:#fff8df;border:1px solid #f0d36b;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:14px}
.user{border:1px solid #e5e8ee;border-radius:13px;padding:13px;margin-top:10px}
.user-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.user-name{font-weight:700}.user-id{font-size:12px;color:#777;margin-top:3px}
.ban-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
button{cursor:pointer;border:0;border-radius:9px;padding:9px 6px;font-weight:700}
.ban-buttons button{background:#ffe8e8;color:#c62828}.unban-btn{background:#e8f7ed!important;color:#198754!important;grid-column:1/-1}
.primary{background:#3156c9;color:#fff}.danger{background:#ffe8e8;color:#c62828}
.empty{color:#777;font-size:14px;padding:10px 0}
details{border:1px solid #e5e8ee;border-radius:13px;padding:12px;margin-top:10px}
summary{cursor:pointer;font-weight:700}
.setting-box{margin-top:12px}.small{font-size:12px;color:#777}
.setting-user{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eee}
.setting-user input{width:auto}
.setting-row{display:flex;gap:8px;margin-top:9px}
select{width:100%;border:1px solid #d8dde6;border-radius:9px;padding:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;display:none;z-index:100}
@media(max-width:520px){.ban-buttons{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
</style>
</head>
<body>

<header>
  <div class="title">🛡️ 副管理者3 <span class="badge">BAN・グループ管理</span></div>
  <button id="settingsBtn" class="settings-btn">⚙️ 設定</button>
</header>

<main>
  <div id="notice" class="notice">
    副管理者3に割り当てられたユーザーだけを管理できます。
  </div>

  <section class="card">
    <h2>👥 管理できるユーザー</h2>
    <div id="assignedUsers"><div class="empty">読み込み中...</div></div>
  </section>

  <section class="card">
    <h2>🏘️ 担当グループ管理</h2>
    <p class="small">管理者がこの副管理者に割り当てたグループだけ操作できます。</p>
    <div id="managedGroups"><div class="empty">グループを読み込み中...</div></div>
    <div id="groupDetails" style="margin-top:12px"></div>
  </section>

  <!-- 管理者のみ -->
  <section id="adminSettings" class="card" style="display:none">
    <h2>⚙️ 管理者設定</h2>

    <details>
      <summary>管理できるユーザー</summary>
      <div class="setting-box">
        <p class="small">副管理者3が管理できるユーザーを選択してください。</p>
        <div id="allUsersForAdmin"><div class="empty">読み込み中...</div></div>
        <button id="saveAssignments" class="primary" style="width:100%;margin-top:12px">保存</button>
      </div>
    </details>

    <details>
      <summary>副管理者3を任命・解任</summary>
      <div class="setting-box">
        <div id="currentSubAdmin" class="small">確認中...</div>
        <div class="setting-row">
          <select id="appointUser" multiple size="7" style="min-height:170px">
          </select>
          <button id="appointBtn" class="primary">任命</button>
        </div>
        <button id="dismissBtn" class="danger" style="width:100%;margin-top:10px">解任</button>
      </div>
    </details>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY = "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const SLOT = "sub_admin3";
const ADMIN_IDS = ["kazu1haru100", "kazu1haru4sub"];

let currentProfile = null;
let allProfiles = [];
let assignedIds = new Set();

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(msg){
  const e=document.getElementById("toast");
  e.textContent=msg;
  e.style.display="block";
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>e.style.display="none",2200);
}

async function getMyProfile(){
  const {data:{user},error:authError}=await supabaseClient.auth.getUser();
  if(authError) throw authError;
  if(!user) return null;

  /*
    profiles.id は bigint のため、Supabase Auth の UUID(user.id)を
    profiles.id に入れて検索しません。
    Friend Chat のログイン時に保存している username を
    profiles.user_id として検索します。
  */
  const username = user.user_metadata?.username || "";
  if(!username) return null;

  const {data,error}=await supabaseClient
    .from("profiles")
    .select("id,user_id,name,avatar_url")
    .eq("user_id",username)
    .maybeSingle();

  if(error) throw error;
  return data;
}

function isSiteAdmin(){
  return currentProfile &&
         ADMIN_IDS.includes(currentProfile.user_id);
}

async function checkSubAdmin1(){
  const {data,error}=await supabaseClient
    .from("sub_admins")
    .select("user_id")
    .eq("slot",SLOT);

  if(error) throw error;
  return (data || []).map(x => x.user_id);
}

async function loadAssignedUsers(){
  const box=document.getElementById("assignedUsers");

  try{
    const {data,error}=await supabaseClient
      .from("sub_admin_assignments")
      .select("user_id")
      .eq("slot",SLOT)
      .order("user_id",{ascending:true});

    if(error) throw error;

    assignedIds=new Set((data||[]).map(x=>x.user_id).filter(Boolean));

    if(!assignedIds.size){
      box.innerHTML=
        '<div class="empty">現在、担当ユーザーはいません。</div>';
      return;
    }

    /*
      profiles の全体SELECTがRLSで制限されている環境でも
      副管理者パネルを表示できるよう、まず担当IDだけで表示します。
      profiles の取得はできる場合だけ名前を補足します。
    */
    let profileMap=new Map();

    const {data:users,error:userError}=await supabaseClient
      .from("profiles")
      .select("id,user_id,name")
      .in("user_id",[...assignedIds]);

    if(!userError){
      (users||[]).forEach(user=>{
        if(user.user_id) profileMap.set(user.user_id,user);
      });
    }else{
      console.warn("担当ユーザーのプロフィール取得をスキップ:",userError.message);
    }

    const usersForRender=[...assignedIds].map(userId=>
      profileMap.get(userId) || {user_id:userId,name:""}
    );

    await renderAssignedUsers(usersForRender);
  }catch(e){
    console.error("loadAssignedUsers:",e);
    box.innerHTML=
      '<div class="empty">❌ 担当ユーザーの読み込みに失敗しました。<br><br>エラー：'+esc(e.message||e)+'</div>';
    throw e;
  }
}

async function getActiveBan(userId){
  const {data,error}=await supabaseClient
    .from("user_bans")
    .select("user_id,reason,banned_at,expires_at,banned_by")
    .eq("user_id",userId)
    .or(`expires_at.is.null,expires_at.gt.${new Date().toISOString()}`)
    .order("banned_at",{ascending:false})
    .limit(1)
    .maybeSingle();

  if(error) return null;
  return data;
}

async function renderAssignedUsers(users){
  const box=document.getElementById("assignedUsers");
  box.innerHTML="";

  if(!users.length){
    box.innerHTML='<div class="empty">担当ユーザーが見つかりません。</div>';
    return;
  }

  for(const u of users){
    const ban=await getActiveBan(u.user_id);
    const div=document.createElement("div");
    div.className="user";

    div.innerHTML=`
      <div class="user-top">
        <div>
          <div class="user-name">${esc(u.name || u.user_id)}</div>
          <div class="user-id">ID: ${esc(u.user_id)}</div>
        </div>
      </div>
      <div class="ban-buttons">
        <button data-id="${esc(u.user_id)}" data-min="5">5分BAN</button>
        <button data-id="${esc(u.user_id)}" data-min="10">10分BAN</button>
        <button data-id="${esc(u.user_id)}" data-min="30">30分BAN</button>
        <button data-id="${esc(u.user_id)}" data-min="60">1時間BAN</button>
      </div>
      <div class="small" style="margin-top:9px">
        ${ban ? "現在BAN中："+new Date(ban.expires_at).toLocaleString("ja-JP") : "現在BANされていません"}
      </div>
      <button class="unban-btn" data-unban-id="${esc(u.user_id)}" style="width:100%;margin-top:10px">🔓 BAN解除</button>
    `;

    box.appendChild(div);
  }

  box.querySelectorAll(".ban-buttons button").forEach(btn=>{
    btn.addEventListener("click",()=>banUser(btn.dataset.id,Number(btn.dataset.min)));
  });
  box.querySelectorAll(".unban-btn").forEach(btn=>{
    btn.addEventListener("click",()=>unbanUser(btn.dataset.unbanId));
  });
}

async function unbanUser(userId){
  if(!assignedIds.has(userId)){
    toast("このユーザーは管理対象ではありません");
    return;
  }
  if(!confirm("このユーザーの現在のBANを解除しますか？")) return;

  try{
    const {data,error}=await supabaseClient.rpc("sub_admin_unban_user",{
      target_user_id:userId
    });

    if(error) throw error;

    if(Number(data||0)>0){
      toast("BANを解除しました");
    }else{
      toast("有効なBANはありませんでした");
    }
    await loadAssignedUsers();
  }catch(e){
    console.error(e);
    toast(e.message || "BAN解除に失敗しました");
  }
}

async function banUser(userId,minutes){
  if(!assignedIds.has(userId)){
    toast("このユーザーは管理対象ではありません");
    return;
  }

  try{
    const {error}=await supabaseClient.rpc("sub_admin_ban_user",{
      target_user_id:userId,
      ban_minutes:minutes,
      ban_reason:`副管理者BAN（${minutes}分）`
    });

    if(error) throw error;

    toast(minutes+"分BANしました");
    await loadAssignedUsers();
  }catch(e){
    console.error(e);
    toast(e.message || "BANに失敗しました");
  }
}

async function loadAdminUsers(){
  const {data,error}=await supabaseClient
    .from("profiles")
    .select("id,user_id,name")
    .order("user_id");

  if(error) throw error;

  allProfiles=data||[];
  renderAdminUsers();
  await renderAppointSelect();
}

function renderAdminUsers(){
  const box=document.getElementById("allUsersForAdmin");
  box.innerHTML="";

  if(!allProfiles.length){
    box.innerHTML='<div class="empty">ユーザーがいません。</div>';
    return;
  }

  allProfiles.forEach(u=>{
    const label=document.createElement("label");
    label.className="setting-user";

    label.innerHTML=`
      <input type="checkbox" value="${esc(u.user_id)}" ${assignedIds.has(u.user_id)?"checked":""}>
      <span>
        <b>${esc(u.name || u.user_id)}</b><br>
        <small class="small">${esc(u.user_id)}</small>
      </span>
    `;

    box.appendChild(label);
  });
}

async function renderAppointSelect(){
  const select=document.getElementById("appointUser");
  select.innerHTML="";

  const appointedIds=new Set(await checkSubAdmin1());

  allProfiles.forEach(u=>{
    const o=document.createElement("option");
    o.value=u.user_id;
    o.textContent=(u.name ? u.name+" ("+u.user_id+")" : u.user_id);
    o.selected=appointedIds.has(u.user_id);
    select.appendChild(o);
  });
}

async function saveAssignments(){
  try{
    const selected=[...document.querySelectorAll(
      '#allUsersForAdmin input[type="checkbox"]:checked'
    )].map(x=>x.value);

    const {error:delError}=await supabaseClient
      .from("sub_admin_assignments")
      .delete()
      .eq("slot",SLOT);

    if(delError) throw delError;

    if(selected.length){
      const rows=selected.map(userId=>({
        slot:SLOT,
        user_id:userId,
        created_at:new Date().toISOString()
      }));

      const {error:insError}=await supabaseClient
        .from("sub_admin_assignments")
        .insert(rows);

      if(insError) throw insError;
    }

    toast("担当ユーザーを保存しました");
    await loadAssignedUsers();
  }catch(e){
    console.error(e);
    toast("保存に失敗しました");
  }
}

async function loadSubAdmin(){
  const userIds=await checkSubAdmin1();
  const box=document.getElementById("currentSubAdmin");

  if(!userIds.length){
    box.textContent="現在：未任命";
  }else{
    box.innerHTML="現在：<br>" + userIds.map(esc).join("<br>");
  }

  await renderAppointSelect();
}

async function appointSubAdmin(){
  const select=document.getElementById("appointUser");
  const userIds=[...select.selectedOptions].map(o=>o.value).filter(Boolean);

  try{
    const {error:delError}=await supabaseClient
      .from("sub_admins")
      .delete()
      .eq("slot",SLOT);

    if(delError) throw delError;

    if(userIds.length){
      const rows=userIds.map(userId=>({
        slot:SLOT,
        user_id:userId,
        created_at:new Date().toISOString()
      }));

      const {error:insError}=await supabaseClient
        .from("sub_admins")
        .insert(rows);

      if(insError) throw insError;
    }

    toast("副管理者" + SLOT.replace("sub_admin", "") + "を保存しました");
    await loadSubAdmin();
  }catch(e){
    console.error(e);
    toast("任命に失敗しました");
  }
}
async function dismissSubAdmin(){
  if(!confirm("副管理者3を解任しますか？")) return;

  try{
    const {error}=await supabaseClient
      .from("sub_admins")
      .delete()
      .eq("slot",SLOT);

    if(error) throw error;

    toast("副管理者3を解任しました");
    await loadSubAdmin();
  }catch(e){
    console.error(e);
    toast("解任に失敗しました");
  }
}

let managedGroups=[];
async function loadManagedGroups(){
 const box=document.getElementById("managedGroups"),details=document.getElementById("groupDetails");
 const {data,error}=await supabaseClient.rpc("sub_admin_list_managed_groups",{p_slot:SLOT});
 if(error)throw error;managedGroups=data||[];details.innerHTML="";
 if(!managedGroups.length){box.innerHTML='<div class="empty">担当グループはありません。管理者に割り当てを依頼してください。</div>';return;}
 box.innerHTML=managedGroups.map(g=>`<div class="user"><div class="user-name">🏘️ ${esc(g.name||"名前なし")}</div><div class="user-id">グループID: ${g.id} / メンバー: ${g.member_count}人 / メッセージ: ${g.message_count}件</div><div class="setting-row"><button class="primary" data-group-open="${g.id}">管理する</button></div></div>`).join("");
 box.querySelectorAll("[data-group-open]").forEach(b=>b.onclick=()=>openManagedGroup(Number(b.dataset.groupOpen)));
}
async function openManagedGroup(groupId){
 const g=managedGroups.find(x=>Number(x.id)===groupId);if(!g)return;
 const box=document.getElementById("groupDetails");box.innerHTML='<div class="empty">グループ情報を読み込み中...</div>';
 try{
  const {data:members,error}=await supabaseClient.rpc("sub_admin_group_members",{target_group_id:groupId});if(error)throw error;
  const {data:messages,error:me}=await supabaseClient.from("group_messages").select("id,sender_id,content,created_at,is_deleted").eq("group_id",groupId).order("created_at",{ascending:false}).limit(30);if(me)throw me;
  box.innerHTML=`<div class="card"><h2>⚙️ ${esc(g.name||"グループ")}</h2>
   <label class="small">グループ名</label><input id="groupNameInput" maxlength="80" value="${esc(g.name||"")}" style="width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:9px">
   <button class="primary" id="renameGroupBtn">名前を変更</button>
   <h2 style="margin-top:18px">👥 メンバー管理（${(members||[]).length}人）</h2>
   <div class="setting-row"><input id="newGroupMemberId" placeholder="追加するユーザーID" style="min-width:0;flex:1;padding:10px;border:1px solid #ddd;border-radius:9px"><button class="primary" id="addGroupMemberBtn">追加</button></div>
   <div>${(members||[]).map(m=>`<div class="user"><div class="user-name">${esc(m.user_id)}</div><div class="user-id">権限: ${esc(m.role)}</div><button class="danger" data-member-remove="${esc(m.user_id)}" style="margin-top:8px">メンバー削除</button></div>`).join("")||'<div class="empty">メンバーがいません。</div>'}</div>
   <h2 style="margin-top:18px">💬 最近のメッセージ（最大30件）</h2>
   <div>${(messages||[]).map(m=>`<div class="user"><div class="user-id">${esc(m.sender_id||"不明")} · ${esc(new Date(m.created_at).toLocaleString("ja-JP"))}</div><div style="white-space:pre-wrap;margin:8px 0">${esc(m.is_deleted?"（削除済み）":m.content||"（画像メッセージ）")}</div>${m.is_deleted?"":`<button class="danger" data-message-delete="${m.id}">メッセージ削除</button>`}</div>`).join("")||'<div class="empty">メッセージがありません。</div>'}</div>
   <button class="danger" id="deleteGroupBtn" style="width:100%;margin-top:18px">🗑️ グループ自体を削除</button></div>`;
  document.getElementById("renameGroupBtn").onclick=async()=>{const name=document.getElementById("groupNameInput").value.trim();if(!name)return toast("グループ名を入力してください");try{const {error}=await supabaseClient.rpc("sub_admin_rename_group",{target_group_id:groupId,new_group_name:name});if(error)throw error;toast("グループ名を変更しました");await loadManagedGroups();}catch(e){toast(e.message||"変更に失敗しました")}};
  document.getElementById("addGroupMemberBtn").onclick=async()=>{const userId=document.getElementById("newGroupMemberId").value.trim();if(!userId)return toast("ユーザーIDを入力してください");try{const {error}=await supabaseClient.rpc("sub_admin_add_group_member",{target_group_id:groupId,target_user_id:userId});if(error)throw error;toast("メンバーを追加しました");await openManagedGroup(groupId);await loadManagedGroups()}catch(e){toast(e.message||"追加に失敗しました")}};
  box.querySelectorAll("[data-member-remove]").forEach(b=>b.onclick=async()=>{if(!confirm(`${b.dataset.memberRemove} をグループから削除しますか？`))return;try{const {error}=await supabaseClient.rpc("sub_admin_remove_group_member",{target_group_id:groupId,target_user_id:b.dataset.memberRemove});if(error)throw error;toast("メンバーを削除しました");await openManagedGroup(groupId);await loadManagedGroups()}catch(e){toast(e.message||"削除に失敗しました")}});
  box.querySelectorAll("[data-message-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("このメッセージを削除済みにしますか？"))return;try{const {error}=await supabaseClient.rpc("sub_admin_delete_group_message",{target_group_id:groupId,target_message_id:Number(b.dataset.messageDelete)});if(error)throw error;toast("メッセージを削除しました");await openManagedGroup(groupId);await loadManagedGroups()}catch(e){toast(e.message||"削除に失敗しました")}});
  document.getElementById("deleteGroupBtn").onclick=async()=>{if(!confirm(`「${g.name}」を完全に削除します。この操作は取り消せません。続けますか？`))return;try{const {error}=await supabaseClient.rpc("sub_admin_delete_group",{target_group_id:groupId});if(error)throw error;toast("グループを削除しました");box.innerHTML="";await loadManagedGroups()}catch(e){toast(e.message||"グループ削除に失敗しました")}};
 }catch(e){box.innerHTML='<div class="empty">グループ情報の取得に失敗しました：'+esc(e.message||e)+'</div>'}
}

async function init(){
  try{
    currentProfile=await getMyProfile();

    if(!currentProfile){
      alert("ログインしてください。");
      location.href="index.html";
      return;
    }

    const admin=isSiteAdmin();

    /*
      管理者は設定画面を表示。
      副管理者3は担当ユーザーを表示。
      それ以外はアクセス拒否。
    */
    const appointedUserIds=await checkSubAdmin1();
    const isSubAdmin=appointedUserIds.includes(currentProfile.user_id);

    if(!admin && !isSubAdmin){
      document.body.innerHTML=`
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif">
          <div>
            <div style="font-size:48px">🔒</div>
            <h2>アクセスできません</h2>
            <p style="color:#777">このページは副管理者3専用です。</p>
          </div>
        </div>
      `;
      return;
    }

    if(admin){
      document.getElementById("settingsBtn").style.display="block";
      document.getElementById("adminSettings").style.display="block";
      await loadAdminUsers();
      await loadSubAdmin();
    }

    await loadAssignedUsers();
    await loadManagedGroups();

  }catch(e){
    console.error("副管理者パネル読み込みエラー:",e);
    document.getElementById("assignedUsers").innerHTML=
      '<div class="empty">❌ 読み込みに失敗しました。<br><br>エラー：' + esc(e.message || e) + '</div>';
  }
}

document.getElementById("settingsBtn").addEventListener("click",()=>{
  document.getElementById("adminSettings").scrollIntoView({behavior:"smooth"});
});

document.getElementById("saveAssignments").addEventListener("click",saveAssignments);
document.getElementById("appointBtn").addEventListener("click",appointSubAdmin);
document.getElementById("dismissBtn").addEventListener("click",dismissSubAdmin);

init();
</script>
</body>
</html>
