<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フレンドガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#100b2b,#27124b 50%,#101b39);color:#f8f6ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(960px,94%);margin:auto;padding:20px 0 60px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:clamp(23px,5vw,34px);margin:10px 0;flex:1}.btn{border:0;border-radius:12px;background:#9b7cff;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}#selectedPanel:not([hidden]){position:fixed;inset:0;z-index:9999;overflow-y:auto;width:100%;height:100dvh;margin:0;border:0;border-radius:0;padding:18px max(14px,env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(140deg,#100b2b,#27124b 50%,#101b39)}.gradeHead{grid-column:1/-1;text-align:center;padding:10px;border-radius:999px;background:linear-gradient(90deg,#8755e8,#be73ff);font-weight:900;font-size:20px}.charImg{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;background:#ffffff0c}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:18px;margin:16px 0}.muted{color:#c7bddf}.balance{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:1px solid #ffffff25;background:#ffffff0d;border-radius:16px;padding:14px;min-width:0}.item h3{margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:10px;border-radius:10px;background:#ffffff10;white-space:pre-wrap}a{color:#d5c6ff}.small{font-size:12px}@media(max-width:480px){.panel{padding:14px}.btn{padding:11px 12px}}
/* ガチャ演出 */
#summonOverlay{position:fixed;inset:0;z-index:100000;background:radial-gradient(circle at center,#3b176b 0%,#10071f 68%,#05030b 100%);display:none;align-items:center;justify-content:center;overflow:hidden;padding:24px;text-align:center}
#summonOverlay.show{display:flex;animation:overlayIn .25s ease-out}
.summon-content{position:relative;z-index:2;width:min(520px,100%)}
.summon-title{font-size:clamp(28px,8vw,54px);font-weight:1000;letter-spacing:.06em;text-shadow:0 0 14px #c7a2ff,0 0 35px #a855f7;animation:titlePulse .8s ease-in-out infinite alternate}
.summon-sub{margin-top:18px;font-size:16px;color:#eee1ff;font-weight:800}
.summon-orb{width:min(48vw,220px);aspect-ratio:1;margin:24px auto;border-radius:50%;background:radial-gradient(circle,#fff 0%,#e7d5ff 7%,#b46bff 23%,#5c25db 48%,transparent 70%);box-shadow:0 0 35px #a855f7,0 0 85px #7c3aed;animation:orbPulse .7s ease-in-out infinite alternate;position:relative}
.summon-orb:before,.summon-orb:after{content:"";position:absolute;inset:-12%;border:4px solid #d9b8ff;border-radius:50%;border-left-color:transparent;border-right-color:#fff;animation:spinRing 1.5s linear infinite}
.summon-orb:after{inset:-27%;border-width:2px;border-color:#8c5cff transparent #e9d5ff transparent;animation:spinRing 2s linear infinite reverse}
#summonOverlay.hot{background:radial-gradient(circle,#713b00 0%,#241000 54%,#07030a 100%)}
#summonOverlay.hot .summon-title{color:#ffe6a1;text-shadow:0 0 12px #ffba08,0 0 40px #ff6a00}
#summonOverlay.hot .summon-orb{background:radial-gradient(circle,#fff 0%,#fff0a6 8%,#ffbd2e 28%,#f97316 48%,transparent 70%);box-shadow:0 0 40px #ffb000,0 0 100px #ff6a00}
#summonOverlay.rainbow{background:radial-gradient(circle,#3e1767 0%,#140720 60%,#020106 100%)}
#summonOverlay.rainbow .summon-title{background:linear-gradient(90deg,#ff6262,#ffd166,#8cff9b,#71d5ff,#d6a2ff,#ff83c8);background-size:300% 100%;color:transparent;background-clip:text;-webkit-background-clip:text;animation:rainbowText .9s linear infinite}
#summonOverlay.rainbow .summon-orb{background:conic-gradient(#ff5252,#ffd452,#7cff8a,#5be0ff,#a78bfa,#ff5cb8,#ff5252);box-shadow:0 0 50px #fff,0 0 120px #bc7aff;animation:orbPulse .4s ease-in-out infinite alternate}
.summon-skip{margin-top:20px;background:#ffffff18;border:1px solid #ffffff70;color:white;border-radius:999px;padding:12px 22px;font-weight:900}
.summon-flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:1;animation:flashBurst 1s ease-out .2s}
#summonOverlay.rainbow .summon-flash{animation:flashBurst .8s ease-out .1s}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}@keyframes titlePulse{from{transform:scale(.97)}to{transform:scale(1.04)}}@keyframes orbPulse{from{transform:scale(.9) rotate(0)}to{transform:scale(1.08) rotate(12deg)}}@keyframes spinRing{to{transform:rotate(360deg)}}@keyframes rainbowText{to{background-position:300% 0}}@keyframes flashBurst{0%{opacity:0}12%{opacity:.8}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.summon-title,.summon-orb,.summon-orb:before,.summon-orb:after,.summon-flash{animation-duration:2s!important}}
</style></head><body><main class="wrap"><div class="top"><button class="btn" onclick="history.back()">← 戻る</button><h1>🎟️ フレンドガチャ</h1><button id="adminLink" class="btn" hidden onclick="location.href='admin-gacha.html'">⚙️ 管理</button><button class="btn" onclick="location.href='gacha-exchange.html'">🎫 チケット交換</button></div><section class="panel"><div class="muted">現在のフレンドコイン</div><div id="coins" class="balance">読み込み中…</div><div class="muted" style="margin-top:12px">交換チケット（共通）</div><div id="tickets" class="balance">読み込み中…</div><div id="status" class="status" style="margin-top:12px">ガチャを読み込み中…</div></section><section class="panel"><h2>ガチャ一覧</h2><p class="muted">ガチャごとの料金・合計ガチャ可能回数・景品内容を確認してね。</p><div id="gachas" class="grid">読み込み中…</div></section><section id="selectedPanel" class="panel" hidden><div class="row" style="justify-content:space-between"><button id="backList" class="btn secondary">← ガチャ一覧に戻る</button><h2 id="selectedTitle">選択したガチャ</h2></div><div id="selectedCost" class="muted"></div><div id="selectedPrizes" class="grid" style="margin-top:12px"></div><div class="row" style="margin-top:16px"><button id="spin" class="btn">🎰 ガチャを回す</button><span id="spinStatus" class="muted"></span></div><div id="result" class="status" style="margin-top:14px">抽選結果がここに表示されます。</div></section><p class="muted small">抽選・コイン消費・チケット付与はSupabase側で処理されます。</p></main><div id="summonOverlay" role="dialog" aria-modal="true" aria-label="ガチャ演出"><div class="summon-flash"></div><div class="summon-content"><div id="summonTitle" class="summon-title">召喚中…</div><div class="summon-orb"></div><div id="summonSub" class="summon-sub">運命の結果は…？</div><button id="summonSkip" class="summon-skip" type="button">演出をスキップ ›</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://yxonmqdyekwenyzekjwj.supabase.co',SUPABASE_KEY='sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,gachas=[],selected=null,busy=false;
async function init(){const u=await db.auth.getUser();user=u.data?.user;if(!user){$('status').textContent='ログインが必要です。Friend Chatにログインしてから開いてね。';return}const a=await db.rpc('is_friendchat_admin');$('adminLink').hidden=!(a.data===true);await refreshBalance();const g=await db.from('friend_gachas').select('id,title,spin_cost,enabled,sort_order,total_spin_limit').eq('enabled',true).order('sort_order').order('id');if(g.error){$('status').textContent='ガチャ一覧の読み込みに失敗：'+g.error.message;return}gachas=g.data||[];renderGachas();$('status').textContent=gachas.length?'詳細を押すと、景品一覧とガチャ操作が全画面で表示されます。':'現在公開中のガチャはありません。'}
async function refreshBalance(){const [c,t]=await Promise.all([db.from('user_coins').select('coins').eq('user_id',user.user_metadata?.username||'').maybeSingle(),db.rpc('friend_gacha_my_tickets')]);$('coins').textContent=c.error?'取得エラー':Number(c.data?.coins||0).toLocaleString()+' COIN';$('tickets').textContent=t.error?'取得エラー':Number(t.data||0).toLocaleString()+' 枚'}
function renderGachas(){$('gachas').innerHTML=gachas.map(g=>`<article class="item"><h3>${esc(g.title)}</h3><div class="muted">1回 ${Number(g.spin_cost).toLocaleString()} COIN</div><div class="muted small" data-usage-card="${g.id}">合計回数を確認中…</div><button class="btn" data-gacha="${g.id}" style="margin-top:12px">詳細</button></article>`).join('')||'公開中のガチャがありません。';document.querySelectorAll('[data-gacha]').forEach(b=>b.onclick=()=>selectGacha(Number(b.dataset.gacha)))}
async function selectGacha(id){selected=gachas.find(g=>g.id===id);if(!selected)return;$('selectedPanel').hidden=false;$('selectedTitle').textContent='🎟️ '+selected.title;$('selectedCost').textContent='1回 '+Number(selected.spin_cost).toLocaleString()+' COIN';const usage=await db.rpc('friend_gacha_my_usage',{p_gacha_id:id});if(!usage.error){const u=usage.data||{};$('selectedCost').textContent+=' ／ 合計 '+Number(u.total_spin_limit||selected.total_spin_limit||20)+'回 ／ 残り '+Number(u.spins_remaining??(u.total_spin_limit||20))+'回';const card=document.querySelector('[data-usage-card=\"'+id+'\"]');if(card)card.textContent='残り '+Number(u.spins_remaining??(u.total_spin_limit||20))+' / '+Number(u.total_spin_limit||selected.total_spin_limit||20)+' 回';}$('selectedPrizes').textContent='景品を読み込み中…';$('result').textContent='抽選結果がここに表示されます。';const r=await db.from('friend_gacha_prizes').select('id,character_id,probability,ticket_reward,exchange_ticket_cost,is_active,sort_order,display_grade,draw_count,brainrot_catalog(name,emoji,rarity,image_url)').eq('gacha_id',id).eq('is_active',true).order('display_grade').order('sort_order');if(r.error){$('selectedPrizes').textContent='景品の読み込みに失敗：'+r.error.message;$('spin').disabled=true;return}const ps=r.data||[];const stockRes=await db.from('friend_gacha_prize_stock').select('prize_id,remaining_count').in('prize_id',ps.map(p=>p.id));const stocks=new Map((stockRes.data||[]).map(x=>[x.prize_id,Number(x.remaining_count)]));let lastGrade=null;let html='';for(const p of ps){const grade=Number(p.display_grade||1);if(grade!==lastGrade){html+=`<div class="gradeHead">${grade}等</div>`;lastGrade=grade}const c=p.brainrot_catalog||{};const left=stocks.has(p.id)?stocks.get(p.id):Number(p.draw_count||1);html+=`<article class="item"><div class="small">${grade}等</div>${c.image_url?`<img class="charImg" src="${esc(c.image_url)}" alt="" loading="lazy">`:`<div style="font-size:44px;text-align:center;padding:12px">${esc(c.emoji||'🎟️')}</div>`}<h3>${esc(c.name||p.character_id)}</h3><div class="muted">${esc(c.rarity||'')}</div><div>残り出現回数：${left}回</div><div>出現設定：${Number(p.draw_count||0)}回</div><div>獲得チケット：${Number(p.ticket_reward)}枚</div><div class="muted small">交換必要枚数：1枚</div></article>`}$('selectedPrizes').innerHTML=html||'景品が未登録です。';$('spin').disabled=!ps.length;document.querySelectorAll('[data-gacha]').forEach(b=>b.classList.toggle('secondary',Number(b.dataset.gacha)===id))}
let summonResolve=null;function playSummon(result){return new Promise(resolve=>{const o=$('summonOverlay');const type=String(result.prize_type||'character').toLowerCase();const rarity=String(result.rarity||'').toLowerCase();const isMiss=type==='miss'||/ハズレ|はずれ|miss/.test(String(result.name||''));const isCoin=type==='coins'||type==='coin';const isRainbow=!isMiss&&!isCoin&&(/og|goat|secret|シークレット|goat|伝説|虹|legendary|mythic/.test(rarity)||Number(result.display_grade)===1);const isHot=!isMiss&&!isCoin&&!isRainbow&&(/secret|シークレット|god|legendary|神話|エピック|epic|レジェンド/.test(rarity)||Number(result.display_grade)<=3);o.className='show'+(isRainbow?' rainbow':isHot?' hot':'');$('summonTitle').textContent=isMiss?'まさかの…！？':isCoin?'COIN GET！':isRainbow?'🌈 大当たり確定 🌈':isHot?'激アツ演出！':'召喚中…';$('summonSub').textContent=isMiss?'結果を確認しよう':isCoin?'コインが集まっていく…':isRainbow?'これは…来た！！':isHot?'期待していいかも…？':'運命の結果は…？';let done=false;const finish=()=>{if(done)return;done=true;o.className='';o.removeEventListener('click',onOverlayClick);$('summonSkip').removeEventListener('click',finish);summonResolve=null;resolve()};const onOverlayClick=e=>{if(e.target===o)finish()};summonResolve=finish;$('summonSkip').addEventListener('click',finish);o.addEventListener('click',onOverlayClick);const duration=isRainbow?2600:isHot?1900:1250;setTimeout(finish,duration)})}
$('backList').onclick=()=>{$('selectedPanel').hidden=true;selected=null};$('spin').onclick=async()=>{if(!selected||busy)return;const cost=Number(selected.spin_cost);if(!confirm(`「${selected.title}」を1回回します。${cost.toLocaleString()} COINを消費しますか？`))return;busy=true;$('spin').disabled=true;$('spinStatus').textContent='抽選中…';const {data,error}=await db.rpc('friend_gacha_spin',{p_gacha_id:selected.id});if(error){$('result').textContent='❌ '+error.message}else{await playSummon(data);const prizeType=String(data.prize_type||'character').toLowerCase();let rewardLine=prizeType==='miss'?'💨 ハズレ（チケット報酬なし）':(prizeType==='coins'||prizeType==='coin')?`🪙 コイン報酬 +${Number(data.coin_reward||0).toLocaleString()} COIN`:`🎟️ 交換チケット +${Number(data.ticket_reward||0).toLocaleString()}枚`;$('result').innerHTML=`🎉 <b>${esc(data.emoji||((prizeType==='miss')?'💨':(prizeType==='coins'||prizeType==='coin')?'🪙':'🎁'))} ${esc(data.name||data.character_id||((prizeType==='miss')?'ハズレ':(prizeType==='coins'||prizeType==='coin')?'コイン当選':'景品'))}</b><br>ガチャ：${esc(data.gacha_title||selected.title)}<br>レア度：${esc(data.rarity||'未設定')}<br>${rewardLine}<br>残りガチャ可能回数：${Number(data.spins_remaining??0)} / ${Number(data.total_spin_limit??0)}回<br>🪙 抽選後コイン残高：${Number(data.coins_remaining??0).toLocaleString()} COIN`}$('spinStatus').textContent='';busy=false;await refreshBalance();await selectGacha(selected.id)};init().catch(e=>$('status').textContent='エラー：'+e.message);
</script></body></html>
