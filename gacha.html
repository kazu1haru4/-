let summonResolve=null;
function playSummon(result){
 return new Promise(resolve=>{
  const o=$('summonOverlay');
  const type=String(result.prize_type||'character').toLowerCase();
  const rarity=String(result.rarity||'').toLowerCase();
  const name=String(result.name||result.character_id||'');
  const grade=Number(result.display_grade||0);
  const isMiss=type==='miss'||/ハズレ|はずれ|miss/i.test(name);
  const isCoin=type==='coins'||type==='coin';
  // OGは等級に関係なくOG専用の虹色演出。1等の通常景品は金色演出にする。
  const isOG=!isMiss&&!isCoin&&(/(^|\\b)og(\\b|$)/i.test(rarity)||/(^|\\b)og(\\b|$)/i.test(name));
  const isRainbow=isOG;
  const isFirst=!isMiss&&!isCoin&&!isOG&&grade===1;
  const isSecond=!isMiss&&!isCoin&&!isOG&&grade===2;
  const isThird=!isMiss&&!isCoin&&!isOG&&grade===3;
  const isHot=!isMiss&&!isCoin&&!isOG&&!isFirst&&!isSecond&&!isThird&&(/god|神話|エピック|epic|レジェンド|legendary|secret|シークレット/i.test(rarity));
  o.className='show'+(isOG?' rainbow':isFirst?' hot':isSecond?' second':isThird?' third':isHot?' hot':'');
  $('summonTitle').textContent=isMiss?'まさかの…！？':isCoin?'COIN GET！':isOG?'🌈✨ OG 降臨 ✨🌈':isFirst?'👑 1等 JACKPOT！':isSecond?'💎 2等 SUPER RARE！':isThird?'🌿 3等 RARE HIT！':isHot?'⚡ 激アツ演出！':'召喚中…';
  $('summonSub').textContent=isMiss?'結果を確認しよう':isCoin?'コインが集まっていく…':isOG?'選ばれし究極のレア！':isFirst?'金色の大当たり！':isSecond?'青白いエネルギーが集結！':isThird?'緑の光が弾ける！':isHot?'期待していいかも…？':'運命の結果は…？';
  let done=false;
  const finish=()=>{if(done)return;done=true;o.className='';o.removeEventListener('click',onOverlayClick);$('summonSkip').removeEventListener('click',finish);summonResolve=null;resolve()};
  const onOverlayClick=e=>{if(e.target===o)finish()};
  summonResolve=finish;
  $('summonSkip').addEventListener('click',finish);
  o.addEventListener('click',onOverlayClick);
  setTimeout(finish,isRainbow?2600:isFirst?2300:isSecond?1900:isThird?1650:isHot?1750:1250);
 });
}

}
async function spinTen(){
 if(!selected||busy)return;
 const cost=Number(selected.spin_cost||0),total=cost*10;
 const remainingText=$('summaryRemaining').textContent;
 const remainingMatch=remainingText.match(/[\d,]+/);
 const remaining=remainingMatch?Number(remainingMatch[0].replace(/,/g,'')):null;
 if(remaining!==null&&remaining<10){alert(`残り回数が足りません（残り ${remaining} 回）`);return}
 if(Number($('coins').textContent.replace(/[^\d]/g,''))<total){alert(`コインが足りません。10連には ${total.toLocaleString()} COIN 必要です。`);return}
 if(!confirm(`「${selected.title}」を10連します。合計 ${total.toLocaleString()} COIN（1回 ${cost.toLocaleString()} COIN）を消費します。よろしいですか？`))return;
 const gachaId=selected.id;
 busy=true;$('spin').disabled=true;$('spinTen').disabled=true;
 $('spinStatus').textContent='10連ガチャ抽選中…';
 startSpinAnimation();
 const results=[];let errorMessage='';
 try{
  for(let i=0;i<10;i++){
   const {data,error}=await db.rpc('friend_gacha_spin',{p_gacha_id:gachaId});
   if(error){errorMessage=error.message;break}
   if(!data){errorMessage='抽選結果を受け取れませんでした';break}
   results.push(data);
  }
 }catch(e){errorMessage=e?.message||String(e)}
 stopSpinAnimation();
 if(results.length){
  // 10件の中で最も上位の結果（OG優先、次に等級の小さい景品）を演出に使う
  const best=[...results].sort((a,b)=>{
   const og=d=>/(^|\b)og(\b|$)/i.test(String(d.rarity||''))||/(^|\b)og(\b|$)/i.test(String(d.name||''));
   if(og(a)!==og(b))return og(a)?-1:1;
   const ga=Number(a.display_grade||99),gb=Number(b.display_grade||99);
   return ga-gb;
  })[0];
  await playSummon(best);
  showFullscreenMultiResult(results,errorMessage);
  $('result').innerHTML=`🎉 <b>10連結果：${results.length}/10回</b><br>`+results.map((d,i)=>`${i+1}. ${esc(d.emoji||'🎁')} ${esc(d.name||d.character_id)}（${Number(d.ticket_reward||0)}枚）`).join('<br>')+(errorMessage?`<br>❌ ${esc(errorMessage)}`:'');
 }else{
  showFullscreenResult({},errorMessage||'抽選できませんでした');
  $('result').textContent='❌ '+(errorMessage||'抽選できませんでした');
 }
 $('spinStatus').textContent='';
 busy=false;
 await refreshBalance();
 await selectGacha(gachaId);
}

function closeFullscreenResult(){$('resultOverlay').hidden=true}
$('resultClose').onclick=closeFullscreenResult;$('resultOverlay').addEventListener('click',e=>{if(e.target===$('resultOverlay'))closeFullscreenResult()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('resultOverlay').hidden)closeFullscreenResult()});
$('backList').onclick=()=>{$('selectedPanel').hidden=true;selected=null};
$('spin').onclick=async()=>{if(!selected||busy)return;const cost=Number(selected.spin_cost);if(!confirm(`「${selected.title}」を1回回します。${cost.toLocaleString()} COINを消費しますか？`))return;const gachaId=selected.id;busy=true;$('spin').disabled=true;$('spinTen').disabled=true;$('spinStatus').textContent='抽選中…';startSpinAnimation();const startedAt=Date.now();const {data,error}=await db.rpc('friend_gacha_spin',{p_gacha_id:gachaId});await new Promise(resolve=>setTimeout(resolve,Math.max(0,1300-(Date.now()-startedAt))));if(error){stopSpinAnimation();$('result').textContent='❌ '+error.message;showFullscreenResult({},error.message)}else{stopSpinAnimation();await playSummon(data);$('result').innerHTML=`🎉 <b>${esc(data.emoji||'🎁')} ${esc(data.name||data.character_id)}</b><br>ガチャ：${esc(data.gacha_title||selected.title)}<br>レア度：${esc(data.rarity||'未設定')}<br>🎟️ ${esc(data.prize_type==='character'?(data.name||data.character_id)+'交換チケット':'交換チケット')} +${Number(data.ticket_reward)}枚<br>残りガチャ可能回数：${Number(data.spins_remaining??0)} / ${Number(data.total_spin_limit??0)}回<br>🪙 抽選後コイン残高：${Number(data.coins_remaining).toLocaleString()} COIN`;showFullscreenResult(data)}$('spinStatus').textContent='';busy=false;await refreshBalance();await selectGacha(gachaId)};
$('spinTen').onclick=spinTen;
init().catch(e=>$('status').textContent='エラー：'+e.message);
</script></body></html>
