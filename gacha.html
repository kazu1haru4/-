<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フレンドガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#100b2b,#27124b 50%,#101b39);color:#f8f6ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(960px,94%);margin:auto;padding:20px 0 60px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:clamp(23px,5vw,34px);margin:10px 0;flex:1}.btn{border:0;border-radius:12px;background:#9b7cff;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:18px;margin:16px 0}.muted{color:#c7bddf}.balance{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:1px solid #ffffff25;background:#ffffff0d;border-radius:16px;padding:14px;min-width:0}.item h3{margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:10px;border-radius:10px;background:#ffffff10;white-space:pre-wrap}a{color:#d5c6ff}.small{font-size:12px}@media(max-width:480px){.panel{padding:14px}.btn{padding:11px 12px}}</style></head><body><main class="wrap"><div class="top"><button class="btn" onclick="history.back()">← 戻る</button><h1>🎟️ フレンドガチャ</h1><button id="adminLink" class="btn" hidden onclick="location.href='admin-gacha.html'">⚙️ 管理</button><button class="btn" onclick="location.href='gacha-exchange.html'">🎫 チケット交換</button></div><section class="panel"><div class="muted">現在のフレンドコイン</div><div id="coins" class="balance">読み込み中…</div><div class="muted" style="margin-top:12px">交換チケット（共通）</div><div id="tickets" class="balance">読み込み中…</div><div id="status" class="status" style="margin-top:12px">ガチャを読み込み中…</div></section><section class="panel"><h2>ガチャ一覧</h2><p class="muted">ガチャごとに名前と消費コインが違います。選んだガチャの景品と確率を確認して回してね。</p><div id="gachas" class="grid">読み込み中…</div></section><section id="selectedPanel" class="panel" hidden><h2 id="selectedTitle">選択したガチャ</h2><div id="selectedCost" class="muted"></div><div id="selectedPrizes" class="grid" style="margin-top:12px"></div><div class="row" style="margin-top:16px"><button id="spin" class="btn">🎰 ガチャを回す</button><span id="spinStatus" class="muted"></span></div><div id="result" class="status" style="margin-top:14px">抽選結果がここに表示されます。</div></section><p class="muted small">抽選・コイン消費・チケット付与はSupabase側で処理されます。</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://yxonmqdyekwenyzekjwj.supabase.co',SUPABASE_KEY='sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,gachas=[],selected=null,busy=false;
async function init(){const u=await db.auth.getUser();user=u.data?.user;if(!user){$('status').textContent='ログインが必要です。Friend Chatにログインしてから開いてね。';return}const a=await db.rpc('is_friendchat_admin');$('adminLink').hidden=!(a.data===true);await refreshBalance();const g=await db.from('friend_gachas').select('id,title,spin_cost,enabled,sort_order').eq('enabled',true).order('sort_order').order('id');if(g.error){$('status').textContent='ガチャ一覧の読み込みに失敗：'+g.error.message;return}gachas=g.data||[];renderGachas();$('status').textContent=gachas.length?'回したいガチャを選んでね。':'現在公開中のガチャはありません。'}
async function refreshBalance(){const [c,t]=await Promise.all([db.from('user_coins').select('coins').eq('user_id',user.user_metadata?.username||'').maybeSingle(),db.rpc('friend_gacha_my_tickets')]);$('coins').textContent=c.error?'取得エラー':Number(c.data?.coins||0).toLocaleString()+' COIN';$('tickets').textContent=t.error?'取得エラー':Number(t.data||0).toLocaleString()+' 枚'}
function renderGachas(){$('gachas').innerHTML=gachas.map(g=>`<article class="item"><h3>${esc(g.title)}</h3><div class="muted">1回 ${Number(g.spin_cost).toLocaleString()} COIN</div><button class="btn" data-gacha="${g.id}" style="margin-top:12px">このガチャを選ぶ</button></article>`).join('')||'公開中のガチャがありません。';document.querySelectorAll('[data-gacha]').forEach(b=>b.onclick=()=>selectGacha(Number(b.dataset.gacha)))}
async function selectGacha(id){selected=gachas.find(g=>g.id===id);if(!selected)return;$('selectedPanel').hidden=false;$('selectedTitle').textContent='🎟️ '+selected.title;$('selectedCost').textContent='1回 '+Number(selected.spin_cost).toLocaleString()+' COIN';$('selectedPrizes').textContent='景品を読み込み中…';$('result').textContent='抽選結果がここに表示されます。';const r=await db.from('friend_gacha_prizes').select('character_id,probability,ticket_reward,exchange_ticket_cost,is_active,sort_order,brainrot_catalog(name,emoji,rarity)').eq('gacha_id',id).eq('is_active',true).order('sort_order');if(r.error){$('selectedPrizes').textContent='景品の読み込みに失敗：'+r.error.message;$('spin').disabled=true;return}const ps=r.data||[];$('selectedPrizes').innerHTML=ps.map(p=>{const c=p.brainrot_catalog||{};return `<article class="item"><h3>${esc(c.emoji||'🎟️')} ${esc(c.name||p.character_id)}</h3><div class="muted">${esc(c.rarity||'')}</div><div>確率：${Number(p.probability)}%</div><div>獲得チケット：${Number(p.ticket_reward)}枚</div><div class="muted small">交換必要枚数：${Number(p.exchange_ticket_cost).toLocaleString()}枚</div></article>`}).join('')||'景品が未登録です。';$('spin').disabled=!ps.length;document.querySelectorAll('[data-gacha]').forEach(b=>b.classList.toggle('secondary',Number(b.dataset.gacha)===id))}
$('spin').onclick=async()=>{if(!selected||busy)return;const cost=Number(selected.spin_cost);if(!confirm(`「${selected.title}」を1回回します。${cost.toLocaleString()} COINを消費しますか？`))return;busy=true;$('spin').disabled=true;$('spinStatus').textContent='抽選中…';const {data,error}=await db.rpc('friend_gacha_spin',{p_gacha_id:selected.id});if(error){$('result').textContent='❌ '+error.message}else{$('result').innerHTML=`🎉 <b>${esc(data.emoji||'🎁')} ${esc(data.name||data.character_id)}</b><br>ガチャ：${esc(data.gacha_title||selected.title)}<br>レア度：${esc(data.rarity||'未設定')}<br>🎟️ 交換チケット +${Number(data.ticket_reward)}枚<br>🪙 抽選後コイン残高：${Number(data.coins_remaining).toLocaleString()} COIN`}$('spinStatus').textContent='';busy=false;await refreshBalance();await selectGacha(selected.id)};init().catch(e=>$('status').textContent='エラー：'+e.message);
</script></body></html>
