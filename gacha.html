<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フレンドガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#100b2b,#27124b 50%,#101b39);color:#f8f6ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(960px,94%);margin:auto;padding:20px 0 60px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:clamp(23px,5vw,34px);margin:10px 0;flex:1}.btn{border:0;border-radius:12px;background:#9b7cff;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:20px;padding:18px;margin:16px 0;backdrop-filter:blur(8px)}.muted{color:#c7bddf}.balance{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:1px solid #ffffff25;background:#ffffff0d;border-radius:16px;padding:14px;min-width:0}.item img{width:100%;height:125px;object-fit:contain}.item .emoji{font-size:48px;text-align:center;display:block;height:125px}.item h3{margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #6b5b8d;background:#19132d;color:white}.field label{font-size:13px;color:#d7ccef}.status{padding:10px;border-radius:10px;background:#ffffff10;white-space:pre-wrap}.danger{background:#b93e68}.small{font-size:12px}.bar{height:8px;background:#ffffff20;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#b49aff}a{color:#d5c6ff}button{font:inherit}.charline{display:flex;align-items:center;gap:10px}.charline img{width:46px;height:46px;object-fit:contain}.charline .grow{flex:1;min-width:0}@media(max-width:480px){.panel{padding:14px}.btn{padding:11px 12px}} </style></head><body><main class="wrap"><div class="top"><button class="btn" onclick="history.back()">← 戻る</button><h1>🎟️ フレンドガチャ</h1><button id="adminLink" class="btn" style="display:none" onclick="location.href='admin-gacha.html'">⚙️ 管理</button><button class="btn" onclick="location.href='gacha-exchange.html'">🎫 チケット交換</button></div><section class="panel"><div class="muted">現在のフレンドコイン</div><div id="coins" class="balance">読み込み中…</div><div class="muted" style="margin-top:12px">交換チケット</div><div id="tickets" class="balance">読み込み中…</div><div class="row" style="margin-top:16px"><button id="spin" class="btn" disabled>🎰 ガチャを回す</button><span id="cost" class="muted"></span></div><div id="result" class="status" style="margin-top:14px">ガチャ結果がここに表示されます。</div></section><section class="panel"><h2>景品一覧</h2><p class="muted">キャラクターが当たると、設定された枚数の交換チケットを獲得できます。キャラクター自体は直接付与されません。</p><div id="prizes" class="grid">読み込み中…</div></section><p class="muted small">抽選・コイン消費・チケット付与はSupabase側で処理されます。</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function requireLogin(){const {data,error}=await db.auth.getUser();if(error||!data.user){alert('フレンドチャットにログインしてください');location.href='index.html';return null}return data.user}async function isAdmin(){const {data,error}=await db.rpc('is_friendchat_admin');return !error&&data===true}</script><script>let currentUser=null,settings=null,busy=false;async function load(){currentUser=await requireLogin();if(!currentUser)return;const admin=await isAdmin();$('adminLink').style.display=admin?'inline-block':'none';const [cfg,pr,coin,ticket]=await Promise.all([db.from('friend_gacha_settings').select('*').eq('id',1).single(),db.from('friend_gacha_prizes').select('character_id,probability,ticket_reward,exchange_ticket_cost,is_active,sort_order,brainrot_catalog(name,emoji,image_url,rarity)').eq('is_active',true).order('sort_order'),db.from('user_coins').select('coins').eq('user_id',currentUser.user_metadata?.username||'').maybeSingle(),db.rpc('friend_gacha_my_tickets')]);if(cfg.error){$('result').textContent='設定を読み込めません: '+cfg.error.message;return}settings=cfg.data;$('cost').textContent=`1回 ${Number(settings.spin_cost).toLocaleString()} COIN`;$('spin').disabled=!settings.enabled;$('coins').textContent=coin.error?'残高取得エラー':`${Number(coin.data?.coins||0).toLocaleString()} COIN`;$('tickets').textContent=ticket.error?'取得エラー':`${Number(ticket.data||0).toLocaleString()} 枚`;$('prizes').innerHTML=pr.error?'景品を読み込めませんでした':(pr.data||[]).map(p=>{const c=p.brainrot_catalog||{};return `<article class="item">${c.image_url?`<img src="${esc(c.image_url)}" alt="">`:`<span class="emoji">${esc(c.emoji||'🎁')}</span>`}<h3>${esc(c.name||p.character_id)}</h3><div class="muted">${esc(c.rarity||'')}</div><div>抽選重み：${Number(p.probability)}%</div><div>獲得：🎟️ ${p.ticket_reward}枚</div><div class="muted small">交換：${Number(p.exchange_ticket_cost).toLocaleString()}枚</div></article>`}).join('')||'景品がまだ登録されていません。';$('spin').disabled=!settings.enabled||!pr.data?.length} $('spin').onclick=async()=>{if(busy)return;if(!confirm(`ガチャを1回回します。${Number(settings.spin_cost).toLocaleString()} COINを消費しますか？`))return;busy=true;$('spin').disabled=true;$('result').textContent='抽選中…';const {data,error}=await db.rpc('friend_gacha_spin');if(error){$('result').textContent='❌ '+error.message}else{$('result').innerHTML=`🎉 <b>${esc(data.emoji||'🎁')} ${esc(data.name)}</b><br>レア度：${esc(data.rarity||'未設定')}<br>🎟️ 交換チケット +${Number(data.ticket_reward)}枚<br>🪙 残り ${Number(data.remaining_coins).toLocaleString()} COIN`;}busy=false;await load()};load();</script></body></html>
