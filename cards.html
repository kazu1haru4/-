<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カード一覧 - フレンドチャット</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f4ff,#fff);color:#333}.wrap{width:min(100%,520px);margin:auto;padding:16px}.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#eee;font-size:28px;cursor:pointer}.head h1{margin:0;font-size:22px}.intro{background:#fff;border-radius:18px;padding:15px;box-shadow:0 5px 20px rgba(0,0,0,.06);margin-bottom:12px;color:#666;font-size:13px;line-height:1.6}.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 7px 24px rgba(0,0,0,.07);border:2px solid #eee}.visual{height:150px;border-radius:18px;background:linear-gradient(135deg,#8f7cff,#c5baff);display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden}.playing-card{width:72px;height:102px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 7px 16px rgba(0,0,0,.16);transform:rotate(-7deg)}.playing-card:nth-child(2){transform:translateY(-8px)}.playing-card:nth-child(3){transform:rotate(7deg)}.title{font-size:18px;font-weight:800;margin-top:14px}.desc{font-size:13px;color:#777;margin-top:5px;line-height:1.5}.button{margin-top:13px;display:block;text-align:center;background:#8f7cff;color:#fff;border-radius:14px;padding:12px;font-weight:800}.soon{background:#eee;color:#888}.note{text-align:center;color:#999;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><button class="back" type="button" onclick="location.href='coin.html'">‹</button><h1>🃏 カード一覧</h1></div>
 <div class="intro">遊びたいカードゲームを選んでね！</div>
 <a class="card" href="card.html">
  <div class="visual"><div class="playing-card">🃏</div><div class="playing-card">🎁</div><div class="playing-card">🃏</div></div>
  <div class="title">カードめくり</div>
  <div class="desc">3枚のカードから1枚を選んで、コインをゲット！</div>
  <div class="button">▶ カードめくりをする</div>
 </a>
 <div class="card">
  <div class="visual"><div class="playing-card">❓</div><div class="playing-card">❓</div><div class="playing-card">❓</div></div>
  <div class="title">カード2</div>
  <div class="desc">新しいカードゲームを準備中！</div>
  <div class="button soon">これから追加</div>
 </div>
 <div class="note">カードゲームはこれからどんどん追加予定！</div>
</div>
</body>
</html>
