<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>フレンドコイン</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: linear-gradient(135deg, #fff4fb, #eef7ff);
  color: #333;
}

.container {
  width: min(92%, 460px);
  margin: 0 auto;
  padding: 24px 0 40px;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.back {
  border: none;
  background: white;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.balance-card {
  background: linear-gradient(135deg, #8f7cff, #b49cff);
  color: white;
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 10px 25px rgba(143,124,255,.25);
  margin-bottom: 18px;
}

.balance-label {
  font-size: 14px;
  opacity: .9;
}

.balance {
  font-size: 42px;
  font-weight: bold;
  margin-top: 5px;
}

.coin {
  font-size: 18px;
  margin-left: 4px;
}

.card {
  background: rgba(255,255,255,.94);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.07);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.description {
  margin: 0 0 16px;
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}

/* 運試し */

.slot {
  background: #faf9ff;
  border: 2px solid #e8e3ff;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
}

.slot-machine {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0 18px;
}

.reel {
  width: 72px;
  height: 72px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  border-radius: 16px;
  font-size: 40px;
  box-shadow: inset 0 0 0 2px #eee;
}

.result {
  min-height: 26px;
  margin: 10px 0;
  font-weight: bold;
}

.main-button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #8f7cff;
  color: white;
}

.main-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* コインを集める */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action {
  border: none;
  background: #f7f5ff;
  border-radius: 18px;
  padding: 18px 10px;
  cursor: pointer;
  text-align: center;
}

.action .icon {
  font-size: 30px;
  margin-bottom: 7px;
}

.action strong {
  display: block;
  font-size: 15px;
}

.action span {
  display: block;
  color: #777;
  font-size: 12px;
  margin-top: 4px;
}

/* 交換ショップ */

.shop {
  display: grid;
  gap: 12px;
}

.shop-item {
  background: #faf9ff;
  border: 2px solid #e8e3ff;
  border-radius: 18px;
  padding: 15px;

  display: flex;
  align-items: center;
  gap: 12px;
}

.shop-icon {
  width: 58px;
  height: 58px;
  background: white;
  border-radius: 16px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 34px;
  flex-shrink: 0;
}

.shop-info {
  flex: 1;
  min-width: 0;
}

.shop-name {
  font-size: 15px;
  font-weight: bold;
}

.shop-price {
  margin-top: 4px;
  color: #777;
  font-size: 13px;
}

.buy-button {
  border: none;
  background: #8f7cff;
  color: white;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.buy-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.buy-button.owned {
  background: #e8e5ff;
  color: #6255c7;
  cursor: default;
}

/* 説明 */

.notice {
  background: #fff8df;
  border-radius: 16px;
  padding: 13px;
  font-size: 13px;
  color: #735f19;
  line-height: 1.6;
}

.message {
  text-align: center;
  margin-top: 12px;
  min-height: 22px;
  font-size: 14px;
  font-weight: bold;
}

@media (max-width: 380px) {

  .shop-item {
    padding: 12px;
  }

  .shop-icon {
    width: 50px;
    height: 50px;
    font-size: 29px;
  }

  .buy-button {
    padding: 9px 10px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ヘッダー -->

  <div class="header">

    <button
      class="back"
      onclick="history.back()"
    >
      ‹
    </button>

    <h1>🪙 フレンドコイン</h1>

  </div>


  <!-- 残高 -->

  <div class="balance-card">

    <div class="balance-label">
      現在のコイン
    </div>

    <div class="balance">

      <span id="balance">
        ---
      </span>

      <span class="coin">
        COIN
      </span>

    </div>

  </div>


  <!-- 運試し -->

  <div class="card">

    <h2>
      🎰 今日の運試し
    </h2>

    <p class="description">
      1日1回、無料で運試しできます！
    </p>

    <div class="slot">

      <div class="slot-machine">

        <div
          class="reel"
          id="reel1"
        >
          ❓
        </div>

        <div
          class="reel"
          id="reel2"
        >
          ❓
        </div>

        <div
          class="reel"
          id="reel3"
        >
          ❓
        </div>

      </div>

      <div
        class="result"
        id="slotResult"
      >
        今日の運試しをしてみよう！
      </div>

      <button
        class="main-button"
        id="slotButton"
        onclick="playSlot()"
        disabled
      >
        🎰 運試しする
      </button>

    </div>

  </div>


  <!-- コインを集める -->

  <div class="card">

    <h2>
      🎮 コインを集める
    </h2>

    <p class="description">
      フレンドチャットのいろいろな機能でコインを集めよう！
    </p>

    <div class="actions">

      <button
        class="action"
        onclick="showComingSoon()"
      >

        <div class="icon">
          🎮
        </div>

        <strong>
          ゲーム
        </strong>

        <span>
          ゲームで獲得
        </span>

      </button>


      <button
        class="action"
        onclick="showComingSoon()"
      >

        <div class="icon">
          🎯
        </div>

        <strong>
          チャレンジ
        </strong>

        <span>
          達成して獲得
        </span>

      </button>


      <button
        class="action"
        onclick="claimLoginBonus()"
      >

        <div class="icon">
          📅
        </div>

        <strong>
          ログイン
        </strong>

        <span>
          +10 COIN
        </span>

      </button>


      <button
        class="action"
        onclick="scrollToShop()"
      >

        <div class="icon">
          🎁
        </div>

        <strong>
          交換
        </strong>

        <span>
          アイテムと交換
        </span>

      </button>

    </div>

  </div>


  <!-- 交換ショップ -->

  <div
    class="card"
    id="shopCard"
  >

    <h2>
      🎁 交換ショップ
    </h2>

    <p class="description">
      集めたコインでプロフィールアイテムを交換できます！
    </p>

    <div
      class="shop"
      id="shop"
    >
      読み込み中……
    </div>

  </div>


  <!-- 説明 -->

  <div class="card">

    <h2>
      ℹ️ コインについて
    </h2>

    <div class="notice">

      フレンドコインは
      フレンドチャット内で使える
      ゲーム内ポイントです。<br>

      ゲームやチャレンジなどで集めて、
      プロフィールアイテムなどと
      交換できます。

    </div>

  </div>


  <div
    class="message"
    id="message"
  ></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://yxonmqdyekwenyzekjwj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   状態
========================= */

let currentUsername = "";

let balance = 0;

let shopItems = [];

let ownedItems = new Set();


/* =========================
   今日の日付
========================= */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}


/* =========================
   残高表示
========================= */

function updateBalance() {

  document
    .getElementById("balance")
    .textContent =
    balance;

}


/* =========================
   メッセージ
========================= */

function showMessage(text) {

  document
    .getElementById("message")
    .textContent =
    text;

}


/* =========================
   ログインユーザー取得
========================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();

  if (
    error ||
    !data.user
  ) {

    return false;
  }

  currentUsername =
    data.user
      .user_metadata
      ?.username || "";

  return !!currentUsername;
}


/* =========================
   コイン読み込み
========================= */

async function loadCoins() {

  const loggedIn =
    await getCurrentUser();


  if (!loggedIn) {

    document
      .getElementById("balance")
      .textContent =
      "ログインしてください";

    return false;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_coins")
      .select(
        "coins,last_login_bonus_date"
      )
      .eq(
        "user_id",
        currentUsername
      )
      .maybeSingle();


  if (error) {

    console.error(
      "コイン取得エラー:",
      error
    );

    document
      .getElementById("balance")
      .textContent =
      "エラー";

    return false;
  }


  if (!data) {

    const {
      data: created,
      error: createError
    } =
      await supabaseClient
        .from("user_coins")
        .insert({
          user_id:
            currentUsername,

          coins: 0
        })
        .select(
          "coins,last_login_bonus_date"
        )
        .single();


    if (createError) {

      console.error(
        "コイン作成エラー:",
        createError
      );

      document
        .getElementById("balance")
        .textContent =
        "エラー";

      return false;
    }


    balance =
      Number(
        created.coins || 0
      );

  } else {

    balance =
      Number(
        data.coins || 0
      );

  }


  updateBalance();


  document
    .getElementById("slotButton")
    .disabled = false;


  return true;
}


/* =========================
   コイン保存
========================= */

async function saveCoins() {

  const {
    error
  } =
    await supabaseClient
      .from("user_coins")
      .update({

        coins: balance,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "user_id",
        currentUsername
      );


  if (error) {

    console.error(
      "コイン保存エラー:",
      error
    );

    return false;
  }


  return true;
}


/* =========================
   ログインボーナス
========================= */

async function claimLoginBonus() {

  if (!currentUsername) {

    const loggedIn =
      await getCurrentUser();

    if (!loggedIn) {

      showMessage(
        "❌ ログインしてください"
      );

      return;
    }
  }


  const today =
    getToday();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_coins")
      .select(
        "coins,last_login_bonus_date"
      )
      .eq(
        "user_id",
        currentUsername
      )
      .maybeSingle();


  if (
    error ||
    !data
  ) {

    console.error(
      "ログインボーナス取得エラー:",
      error
    );

    showMessage(
      "❌ コイン情報を取得できませんでした"
    );

    return;
  }


  if (
    data.last_login_bonus_date ===
    today
  ) {

    showMessage(
      "📅 今日のログインボーナスは受け取り済みだよ！"
    );

    return;
  }


  const newCoins =
    Number(data.coins || 0) + 10;


  const {
    error: updateError
  } =
    await supabaseClient
      .from("user_coins")
      .update({

        coins: newCoins,

        last_login_bonus_date:
          today,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "user_id",
        currentUsername
      );


  if (updateError) {

    console.error(
      "ログインボーナス保存エラー:",
      updateError
    );

    showMessage(
      "❌ ボーナスの受け取りに失敗しました"
    );

    return;
  }


  balance =
    newCoins;


  updateBalance();


  showMessage(
    "🎉 ログインボーナス +10 COIN！"
  );
}


/* =========================
   運試し
========================= */

async function playSlot() {

  const button =
    document.getElementById(
      "slotButton"
    );

  const result =
    document.getElementById(
      "slotResult"
    );


  const today =
    getToday();


  const lastPlay =
    localStorage.getItem(
      "friendCoinSlotDate"
    );


  if (
    lastPlay === today
  ) {

    result.textContent =
      "今日はもう運試し済みだよ！😊";

    return;
  }


  button.disabled = true;

  result.textContent =
    "運試し中……";


  const symbols = [
    "🍒",
    "⭐",
    "🍋",
    "💎",
    "🍀",
    "🎁"
  ];


  let count = 0;


  const animation =
    setInterval(
      async function() {

        document
          .getElementById("reel1")
          .textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        document
          .getElementById("reel2")
          .textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        document
          .getElementById("reel3")
          .textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        count++;


        if (count >= 12) {

          clearInterval(
            animation
          );


          const a =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];

          const b =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];

          const c =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          document
            .getElementById("reel1")
            .textContent =
            a;

          document
            .getElementById("reel2")
            .textContent =
            b;

          document
            .getElementById("reel3")
            .textContent =
            c;


          let reward;


          if (
            a === b &&
            b === c
          ) {

            reward = 100;

            result.textContent =
              "🎉 大当たり！ +100 COIN";

          } else if (
            a === b ||
            b === c ||
            a === c
          ) {

            reward = 50;

            result.textContent =
              "✨ 当たり！ +50 COIN";

          } else {

            reward = 10;

            result.textContent =
              "🍀 参加賞！ +10 COIN";
          }


          balance += reward;

          updateBalance();


          const saved =
            await saveCoins();


          if (!saved) {

            balance -= reward;

            updateBalance();

            result.textContent =
              "❌ コインの保存に失敗しました";

            button.disabled = false;

            return;
          }


          localStorage.setItem(
            "friendCoinSlotDate",
            today
          );


          button.disabled = false;

        }

      },
      100
    );
}


/* =========================
   ショップ読み込み
========================= */

async function loadShop() {

  const shop =
    document.getElementById(
      "shop"
    );


  const {
    data: items,
    error: itemError
  } =
    await supabaseClient
      .from("coin_items")
      .select(
        "item_key,name,icon,price"
      )
      .order(
        "price",
        {
          ascending: true
        }
      );


  if (itemError) {

    console.error(
      "ショップ取得エラー:",
      itemError
    );

    shop.innerHTML =
      "❌ ショップを読み込めませんでした";

    return;
  }


  shopItems =
    items || [];


  const {
    data: owned,
    error: ownedError
  } =
    await supabaseClient
      .from("user_coin_items")
      .select(
        "item_key"
      )
      .eq(
        "user_id",
        currentUsername
      );


  if (ownedError) {

    console.error(
      "購入済みアイテム取得エラー:",
      ownedError
    );

    ownedItems =
      new Set();

  } else {

    ownedItems =
      new Set(
        (owned || [])
          .map(
            item =>
              item.item_key
          )
      );
  }


  renderShop();
}


/* =========================
   ショップ表示
========================= */

function renderShop() {

  const shop =
    document.getElementById(
      "shop"
    );


  if (
    shopItems.length === 0
  ) {

    shop.innerHTML =
      "現在交換できるアイテムはありません。";

    return;
  }


  shop.innerHTML =
    shopItems
      .map(
        item => {

          const owned =
            ownedItems.has(
              item.item_key
            );


          return `
            <div class="shop-item">

              <div class="shop-icon">
                ${item.icon}
              </div>

              <div class="shop-info">

                <div class="shop-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="shop-price">
                  🪙 ${Number(item.price).toLocaleString()} COIN
                </div>

              </div>

              ${
                owned
                  ? `
                    <button
                      class="buy-button owned"
                      disabled
                    >
                      交換済み
                    </button>
                  `
                  : `
                    <button
                      class="buy-button"
                      onclick="buyItem('${item.item_key}')"
                    >
                      交換
                    </button>
                  `
              }

            </div>
          `;

        }
      )
      .join("");
}


/* =========================
   HTML安全化
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================
   アイテム交換
========================= */

async function buyItem(itemKey) {

  const item =
    shopItems.find(
      x =>
        x.item_key ===
        itemKey
    );


  if (!item) {

    showMessage(
      "❌ アイテムが見つかりません"
    );

    return;
  }


  if (
    ownedItems.has(itemKey)
  ) {

    showMessage(
      "このアイテムはすでに交換済みだよ！"
    );

    return;
  }


  const price =
    Number(item.price);


  if (
    balance < price
  ) {

    showMessage(
      "🪙 コインが足りません！"
    );

    return;
  }


  const ok =
    confirm(
      `${item.icon} ${item.name}を\n${price.toLocaleString()} COINで交換しますか？`
    );


  if (!ok) {
    return;
  }


  /* ボタンを一時的に止める */

  renderShopButtonsDisabled();


  const oldBalance =
    balance;


  const newBalance =
    balance - price;


  /* コインを減らす */

  const {
    error: coinError
  } =
    await supabaseClient
      .from("user_coins")
      .update({

        coins: newBalance,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "user_id",
        currentUsername
      );


  if (coinError) {

    console.error(
      "コイン更新エラー:",
      coinError
    );

    renderShop();

    showMessage(
      "❌ コインの更新に失敗しました"
    );

    return;
  }


  /* 購入済みとして保存 */

  const {
    error: itemError
  } =
    await supabaseClient
      .from("user_coin_items")
      .insert({

        user_id:
          currentUsername,

        item_key:
          itemKey

      });


  if (itemError) {

    console.error(
      "アイテム保存エラー:",
      itemError
    );


    /* アイテム保存に失敗したらコインを戻す */

    await supabaseClient
      .from("user_coins")
      .update({

        coins: oldBalance,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "user_id",
        currentUsername
      );


    renderShop();

    showMessage(
      "❌ 交換に失敗しました。コインは戻しました。"
    );

    return;
  }


  /* 成功 */

  balance =
    newBalance;


  ownedItems.add(
    itemKey
  );


  updateBalance();

  renderShop();


  showMessage(
    `🎉 ${item.icon} ${item.name}を交換しました！`
  );
}


/* =========================
   ショップボタン停止
========================= */

function renderShopButtonsDisabled() {

  document
    .querySelectorAll(
      ".buy-button:not(.owned)"
    )
    .forEach(
      button => {
        button.disabled = true;
      }
    );
}


/* =========================
   交換ショップへ移動
========================= */

function scrollToShop() {

  document
    .getElementById("shopCard")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
}


/* =========================
   準備中
========================= */

function showComingSoon() {

  showMessage(
    "🚧 この機能はこれから追加するよ！"
  );
}


/* =========================
   開始
========================= */

async function start() {

  const loaded =
    await loadCoins();


  if (!loaded) {
    return;
  }


  await loadShop();
}


start();

</script>

</body>
</html>
