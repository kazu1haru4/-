<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>フレンドコイン</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: linear-gradient(135deg, #fff4fb, #eef7ff);
  color: #333;
}

.container {
  width: min(92%, 460px);
  margin: 0 auto;
  padding: 24px 0 40px;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.back {
  border: none;
  background: white;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.balance-card {
  background: linear-gradient(135deg, #8f7cff, #b49cff);
  color: white;
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 10px 25px rgba(143,124,255,.25);
  margin-bottom: 18px;
}

.balance-label {
  font-size: 14px;
  opacity: .9;
}

.balance {
  font-size: 42px;
  font-weight: bold;
  margin-top: 5px;
}

.coin {
  font-size: 18px;
  margin-left: 4px;
}

.card {
  background: rgba(255,255,255,.94);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.07);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.description {
  margin: 0 0 16px;
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}

.slot {
  background: #faf9ff;
  border: 2px solid #e8e3ff;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
}

.slot-machine {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 10px 0 18px;
}

.reel {
  width: 72px;
  height: 72px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  border-radius: 16px;
  font-size: 40px;
  box-shadow: inset 0 0 0 2px #eee;
}

button.main-button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #8f7cff;
  color: white;
}

button.main-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.result {
  min-height: 26px;
  margin: 10px 0;
  font-weight: bold;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action {
  border: none;
  background: #f7f5ff;
  border-radius: 18px;
  padding: 18px 10px;
  cursor: pointer;
  text-align: center;
}

.action .icon {
  font-size: 30px;
  margin-bottom: 7px;
}

.action strong {
  display: block;
  font-size: 15px;
}

.action span {
  display: block;
  color: #777;
  font-size: 12px;
  margin-top: 4px;
}

.notice {
  background: #fff8df;
  border-radius: 16px;
  padding: 13px;
  font-size: 13px;
  color: #735f19;
  line-height: 1.6;
}

.message {
  text-align: center;
  margin-top: 12px;
  min-height: 22px;
  font-size: 14px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <button class="back" onclick="history.back()">‹</button>
    <h1>🪙 フレンドコイン</h1>
  </div>

  <!-- コイン残高 -->

  <div class="balance-card">

    <div class="balance-label">
      現在のコイン
    </div>

    <div class="balance">
      <span id="balance">---</span>
      <span class="coin">COIN</span>
    </div>

  </div>


  <!-- 今日の運試し -->

  <div class="card">

    <h2>🎰 今日の運試し</h2>

    <p class="description">
      1日1回、無料で運試しできます！
    </p>

    <div class="slot">

      <div class="slot-machine">

        <div class="reel" id="reel1">
          ❓
        </div>

        <div class="reel" id="reel2">
          ❓
        </div>

        <div class="reel" id="reel3">
          ❓
        </div>

      </div>

      <div
        class="result"
        id="slotResult"
      >
        今日の運試しをしてみよう！
      </div>

      <button
        class="main-button"
        id="slotButton"
        onclick="playSlot()"
        disabled
      >
        🎰 運試しする
      </button>

    </div>

  </div>


  <!-- コインを集める -->

  <div class="card">

    <h2>🎮 コインを集める</h2>

    <p class="description">
      フレンドチャットのいろいろな機能でコインを集めよう！
    </p>

    <div class="actions">

      <button
        class="action"
        onclick="showComingSoon()"
      >
        <div class="icon">🎮</div>
        <strong>ゲーム</strong>
        <span>ゲームで獲得</span>
      </button>


      <button
        class="action"
        onclick="showComingSoon()"
      >
        <div class="icon">🎯</div>
        <strong>チャレンジ</strong>
        <span>達成して獲得</span>
      </button>


      <button
        class="action"
        onclick="claimLoginBonus()"
      >
        <div class="icon">📅</div>
        <strong>ログイン</strong>
        <span>+10 COIN</span>
      </button>


      <button
        class="action"
        onclick="showComingSoon()"
      >
        <div class="icon">🎁</div>
        <strong>交換</strong>
        <span>アイテムと交換</span>
      </button>

    </div>

  </div>


  <!-- 説明 -->

  <div class="card">

    <h2>ℹ️ コインについて</h2>

    <div class="notice">
      フレンドコインはフレンドチャット内で使えるゲーム内ポイントです。<br>
      ゲームやチャレンジなどで集めて、プロフィールアイテムなどと交換できるようにする予定です。
    </div>

  </div>


  <div
    class="message"
    id="message"
  ></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://yxonmqdyekwenyzekjwj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   状態
========================= */

let currentUsername = "";
let balance = 0;


/* =========================
   残高表示
========================= */

function updateBalance() {

  document
    .getElementById("balance")
    .textContent = balance;

}


/* =========================
   今日の日付
========================= */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}


/* =========================
   コイン読み込み
========================= */

async function loadCoins() {

  const {
    data: userData,
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (
    userError ||
    !userData.user
  ) {

    document
      .getElementById("balance")
      .textContent =
      "ログインしてください";

    return false;
  }


  currentUsername =
    userData.user
      .user_metadata
      ?.username || "";


  if (!currentUsername) {

    document
      .getElementById("balance")
      .textContent =
      "エラー";

    return false;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_coins")
      .select(
        "coins,last_login_bonus_date"
      )
      .eq(
        "user_id",
        currentUsername
      )
      .maybeSingle();


  if (error) {

    console.error(
      "コイン取得エラー:",
      error
    );

    document
      .getElementById("balance")
      .textContent =
      "エラー";

    return false;
  }


  if (!data) {

    const {
      data: created,
      error: createError
    } =
      await supabaseClient
        .from("user_coins")
        .insert({
          user_id:
            currentUsername,

          coins: 0
        })
        .select(
          "coins,last_login_bonus_date"
        )
        .single();


    if (createError) {

      console.error(
        "コイン作成エラー:",
        createError
      );

      document
        .getElementById("balance")
        .textContent =
        "エラー";

      return false;
    }


    balance =
      Number(
        created.coins || 0
      );

  } else {

    balance =
      Number(
        data.coins || 0
      );
  }


  updateBalance();


  document
    .getElementById("slotButton")
    .disabled = false;


  return true;
}


/* =========================
   コイン保存
========================= */

async function saveCoins() {

  const {
    error
  } =
    await supabaseClient
      .from("user_coins")
      .update({
        coins: balance,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "user_id",
        currentUsername
      );


  if (error) {

    console.error(
      "コイン保存エラー:",
      error
    );

    return false;
  }


  return true;
}


/* =========================
   ログインボーナス
========================= */

async function claimLoginBonus() {

  const message =
    document.getElementById(
      "message"
    );


  if (!currentUsername) {

    message.textContent =
      "❌ ログインしてください";

    return;
  }


  const today =
    getToday();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_coins")
      .select(
        "coins,last_login_bonus_date"
      )
      .eq(
        "user_id",
        currentUsername
      )
      .maybeSingle();


  if (error || !data) {

    console.error(
      "ログインボーナス取得エラー:",
      error
    );

    message.textContent =
      "❌ コイン情報を取得できませんでした";

    return;
  }


  /* 今日すでに受け取っている */

  if (
    data.last_login_bonus_date ===
    today
  ) {

    message.textContent =
      "📅 今日のログインボーナスは受け取り済みだよ！";

    return;
  }


  const newCoins =
    Number(data.coins || 0) + 10;


  const {
    error: updateError
  } =
    await supabaseClient
      .from("user_coins")
      .update({

        coins: newCoins,

        last_login_bonus_date:
          today,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "user_id",
        currentUsername
      );


  if (updateError) {

    console.error(
      "ログインボーナス保存エラー:",
      updateError
    );

    message.textContent =
      "❌ ボーナスの受け取りに失敗しました";

    return;
  }


  balance =
    newCoins;


  updateBalance();


  message.textContent =
    "🎉 ログインボーナス +10 COIN！";
}


/* =========================
   運試し
========================= */

async function playSlot() {

  const button =
    document.getElementById(
      "slotButton"
    );

  const result =
    document.getElementById(
      "slotResult"
    );


  const today =
    getToday();


  const lastPlay =
    localStorage.getItem(
      "friendCoinSlotDate"
    );


  if (
    lastPlay === today
  ) {

    result.textContent =
      "今日はもう運試し済みだよ！😊";

    return;
  }


  button.disabled = true;

  result.textContent =
    "運試し中……";


  const symbols = [
    "🍒",
    "⭐",
    "🍋",
    "💎",
    "🍀",
    "🎁"
  ];


  let count = 0;


  const animation =
    setInterval(
      async function() {

        document
          .getElementById("reel1")
          .textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        document
          .getElementById("reel2")
          .textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        document
          .getElementById("reel3")
          .textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        count++;


        if (count >= 12) {

          clearInterval(
            animation
          );


          const a =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          const b =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          const c =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          document
            .getElementById("reel1")
            .textContent = a;


          document
            .getElementById("reel2")
            .textContent = b;


          document
            .getElementById("reel3")
            .textContent = c;


          let reward;


          if (
            a === b &&
            b === c
          ) {

            reward = 100;

            result.textContent =
              "🎉 大当たり！ +100 COIN";

          } else if (
            a === b ||
            b === c ||
            a === c
          ) {

            reward = 50;

            result.textContent =
              "✨ 当たり！ +50 COIN";

          } else {

            reward = 10;

            result.textContent =
              "🍀 参加賞！ +10 COIN";
          }


          balance += reward;


          updateBalance();


          const saved =
            await saveCoins();


          if (!saved) {

            balance -= reward;

            updateBalance();

            result.textContent =
              "❌ コインの保存に失敗しました";

            button.disabled = false;

            return;
          }


          localStorage.setItem(
            "friendCoinSlotDate",
            today
          );


          button.disabled = false;

        }

      },
      100
    );
}


/* =========================
   準備中
========================= */

function showComingSoon() {

  document
    .getElementById("message")
    .textContent =
    "🚧 この機能はこれから追加するよ！";
}


/* =========================
   開始
========================= */

loadCoins();

</script>

</body>
</html>
