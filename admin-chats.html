<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>全個別チャット</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff3fb,#eef5ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:#333}.header{position:sticky;top:0;background:#fff;padding:15px 16px;box-shadow:0 3px 10px rgba(0,0,0,.08);z-index:5}.title{font-size:21px;font-weight:bold}.sub{font-size:12px;color:#888;margin-top:4px}.list{padding:14px 16px 80px;max-width:760px;margin:auto}.card{display:block;background:#fff;border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.06);cursor:pointer}.users{font-weight:bold;font-size:16px}.last{margin-top:7px;color:#777;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:6px;color:#aaa;font-size:11px}.empty{text-align:center;color:#999;padding:45px 10px}.back{position:fixed;bottom:12px;left:12px;background:#fff;color:#555;text-decoration:none;border-radius:12px;padding:10px 14px;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.08)}
#viewer{display:none;position:fixed;inset:0;background:#f5f5fa;z-index:20;flex-direction:column;overflow:hidden}.vhead{height:62px;min-height:62px;background:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;z-index:2}.vtitle{font-weight:bold;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{border:0;background:#eee;border-radius:10px;padding:9px 12px;font-weight:bold;flex-shrink:0}.msgs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:15px 12px 30px}.msg{max-width:82%;margin:7px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.05)}.sender{font-size:11px;color:#777;font-weight:bold;margin-bottom:3px}.time{font-size:10px;color:#aaa;margin-top:4px}.img{max-width:240px;max-height:240px;border-radius:10px;margin-top:5px}.deleted{color:#aaa;font-style:italic}.edited{font-size:10px;color:#999;margin-left:4px}.content{white-space:pre-wrap;word-break:break-word}.media{max-width:280px;margin-top:6px}.media img{display:block;max-width:100%;max-height:360px;border-radius:10px;object-fit:contain;background:#eee}.media video{display:block;width:100%;max-height:420px;border-radius:10px;background:#000}.media audio{width:100%}.media-note{font-size:11px;color:#999;margin-top:4px}.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.action{border:0;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:bold;background:#f0eefb;color:#5b50bd;cursor:pointer}.action.delete{background:#fff0f0;color:#c44}.action:active{transform:scale(.97)}
</style>
</head>
<body>
<header class="header"><div class="title">🛡️ 全個別チャット</div><div class="sub">管理者専用・すべての個別チャットを閲覧</div></header>
<main id="list" class="list"><div class="empty">読み込み中...</div></main>
<a class="back" href="admin-management.html">← 管理者管理</a>
<section id="viewer"><div class="vhead"><div id="vtitle" class="vtitle"></div><button id="close" class="close">閉じる</button></div><div id="msgs" class="msgs"></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMINS=new Set(["kazu1haru100","kazu1haru4sub"]);
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function fmt(v){try{return new Date(v).toLocaleString("ja-JP")}catch{return ""}}
async function auth(){const {data,error}=await db.auth.getSession();const u=data?.session?.user?.user_metadata?.username||"";if(error||!data.session||!ADMINS.has(u)){alert("管理者のみ利用できます。");location.href="home.html";return false}return true}
async function load(){const {data,error}=await db.rpc("admin_list_all_direct_chats");if(error){$("list").innerHTML='<div class="empty">個別チャットを読み込めませんでした<br><br>'+esc(error.message)+'</div>';return}const rows=data||[];if(!rows.length){$("list").innerHTML='<div class="empty">個別チャットはありません。</div>';return}$("list").innerHTML="";rows.forEach(r=>{const el=document.createElement("div");el.className="card";el.innerHTML='<div class="users">💬 '+esc(r.user1)+' ↔ '+esc(r.user2)+'</div><div class="last">'+esc(r.last_content||"（画像・メディア）")+'</div><div class="meta">'+Number(r.message_count||0)+'件 ・ '+esc(fmt(r.last_created_at))+'</div>';el.onclick=()=>openChat(r.user1,r.user2);$("list").appendChild(el)})}
async function getMediaInfo(raw){
  const value=String(raw||"");
  if(value.startsWith("video:"))return {kind:"video",path:value.slice(6)};
  if(value.startsWith("audio:"))return {kind:"audio",path:value.slice(6)};
  if(value)return {kind:"image",path:value};
  return null;
}

async function signedMediaUrl(raw){
  const info=await getMediaInfo(raw);
  if(!info)return null;
  const {data,error}=await db.storage.from("chat-images").createSignedUrl(info.path,3600);
  if(error||!data?.signedUrl){console.warn("メディアURL取得エラー:",error);return {...info,url:""};}
  return {...info,url:data.signedUrl};
}

function appendMedia(parent,info){
  const wrap=document.createElement("div");
  wrap.className="media";
  if(!info?.url){
    const note=document.createElement("div");
    note.className="media-note";
    note.textContent=info?.kind==="video"?"🎥 動画を読み込めませんでした":info?.kind==="audio"?"🎙️ 音声を読み込めませんでした":"🖼️ 画像を読み込めませんでした";
    wrap.appendChild(note);
    parent.appendChild(wrap);
    return;
  }
  if(info.kind==="video"){
    const video=document.createElement("video");
    video.controls=true;video.playsInline=true;video.preload="metadata";video.src=info.url;
    wrap.appendChild(video);
  }else if(info.kind==="audio"){
    const audio=document.createElement("audio");
    audio.controls=true;audio.preload="metadata";audio.src=info.url;
    wrap.appendChild(audio);
  }else{
    const img=document.createElement("img");
    img.src=info.url;img.alt="送信された画像";img.loading="lazy";
    wrap.appendChild(img);
  }
  parent.appendChild(wrap);
}

async function openChat(a,b){
  currentPair={a,b};
  $("viewer").style.display="flex";
  $("vtitle").textContent=a+" ↔ "+b;
  $("msgs").innerHTML='<div class="empty">読み込み中...</div>';

  const {data,error}=await db.rpc("admin_get_direct_messages",{target_user1:a,target_user2:b});
  if(error){
    $("msgs").innerHTML='<div class="empty">読み込みに失敗しました<br><br>'+esc(error.message)+'</div>';
    return;
  }
  const rows=data||[];
  if(!rows.length){$("msgs").innerHTML='<div class="empty">メッセージはありません。</div>';return;}

  $("msgs").innerHTML="";
  for(const m of rows){
    const el=document.createElement("div");
    el.className="msg";
    el.dataset.messageId=m.id;

    const sender=document.createElement("div");
    sender.className="sender";
    sender.textContent=m.sender_id;
    el.appendChild(sender);

    if(m.is_deleted){
      const deleted=document.createElement("div");
      deleted.className="deleted";
      deleted.textContent="（削除されたメッセージ）";
      el.appendChild(deleted);
    }else{
      if(m.image_url){
        const media=await signedMediaUrl(m.image_url);
        appendMedia(el,media);
      }
      if(m.content){
        const content=document.createElement("div");
        content.className="content";
        content.textContent=m.content;
        el.appendChild(content);
      }
    }

    const time=document.createElement("div");
    time.className="time";
    time.textContent=fmt(m.created_at)+(m.is_edited?" ・ 編集済み":"");
    el.appendChild(time);

    if(!m.is_deleted){
      const actions=document.createElement("div");
      actions.className="actions";

      const edit=document.createElement("button");
      edit.type="button";edit.className="action";edit.textContent="✏️ 編集";
      edit.onclick=e=>{e.stopPropagation();editMessage(m.id,m.content||"");};

      const del=document.createElement("button");
      del.type="button";del.className="action delete";del.textContent="🗑️ 削除";
      del.onclick=e=>{e.stopPropagation();deleteMessage(m.id);};

      actions.append(edit,del);
      el.appendChild(actions);
    }
    $("msgs").appendChild(el);
  }
  $("msgs").scrollTop=$("msgs").scrollHeight;
}

async function editMessage(id,currentContent){
  const value=prompt("メッセージを編集してください",currentContent);
  if(value===null)return;
  if(!value.trim()){alert("空のメッセージにはできません。");return;}
  const {data,error}=await db.rpc("admin_edit_direct_message",{
    target_message_id:Number(id),new_content:value.trim()
  });
  if(error){alert("メッセージの編集に失敗しました。\\n\\n"+error.message);return;}
  if(data?.ok===false){alert(data.message||"編集できませんでした。");return;}
  await openChat(currentPair.a,currentPair.b);
}

async function deleteMessage(id){
  if(!confirm("このメッセージを削除しますか？\\n管理者による削除です。"))return;
  const {data,error}=await db.rpc("admin_delete_direct_message",{
    target_message_id:Number(id)
  });
  if(error){alert("メッセージの削除に失敗しました。\\n\\n"+error.message);return;}
  if(data?.ok===false){alert(data.message||"削除できませんでした。");return;}
  await openChat(currentPair.a,currentPair.b);
}

$("close").onclick=()=>$("viewer").style.display="none";
(async()=>{if(await auth())await load()})();
</script>
</body>
</html>
