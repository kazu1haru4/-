<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フレンド一覧</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ban-check.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;background:linear-gradient(135deg,#fff4fb,#eef7ff);color:#333}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.home-link,.admin-link{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:999px;font-weight:bold;box-shadow:0 4px 12px rgba(100,80,150,.12);white-space:nowrap}
.home-link{color:#7658d9;background:rgba(255,255,255,.95)}
.admin-link{color:#fff;background:#111}
.container{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:24px;padding:25px 20px;box-shadow:0 12px 35px rgba(100,80,150,.15)}
h1{text-align:center;margin:0 0 22px;color:#7158cf;font-size:27px}
.add-box{background:#f8f5ff;border-radius:18px;padding:15px;margin-bottom:18px}
.add-title{font-weight:bold;color:#7158cf;margin-bottom:9px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;padding:13px;border:2px solid #e4ddff;border-radius:12px;font-size:15px;outline:none}
.add-row input:focus{border-color:#9a85ed}
.add-row button{border:0;border-radius:12px;padding:0 16px;background:#7158cf;color:#fff;font-weight:bold;font-size:14px}
.add-row button:disabled{opacity:.6}
.add-help{font-size:12px;color:#888;margin-top:8px}

.requests-open-button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px;padding:14px;border:1px solid #e5dcff;border-radius:15px;background:#fff;color:#7158cf;font-size:15px;font-weight:800;box-shadow:0 4px 12px rgba(100,80,150,.08)}
.request-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#f04464;color:white;font-size:12px;font-weight:900}
.request-badge[hidden]{display:none}
.requests-modal{position:fixed;inset:0;z-index:100000;display:flex;align-items:flex-end;justify-content:center}
.requests-modal[hidden]{display:none}
.requests-backdrop{position:absolute;inset:0;background:rgba(25,18,48,.48);backdrop-filter:blur(3px)}
.requests-panel{position:relative;width:min(100%,560px);max-height:min(82vh,720px);overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(30,20,70,.2);animation:requestSlideUp .2s ease-out}
@keyframes requestSlideUp{from{transform:translateY(25px);opacity:.7}to{transform:translateY(0);opacity:1}}
.requests-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.requests-panel-head h2{margin:0;color:#7158cf;font-size:20px}
.requests-close{width:36px;height:36px;border:0;border-radius:50%;background:#f2effa;color:#66558e;font-size:25px;line-height:1}
.requests-tabs{display:flex;gap:8px;margin:16px 0 12px;padding:4px;border-radius:13px;background:#f5f2fb}
.requests-tab{flex:1;border:0;border-radius:10px;padding:11px 8px;background:transparent;color:#807894;font-size:13px;font-weight:800}
.requests-tab.active{background:#fff;color:#7158cf;box-shadow:0 2px 8px rgba(60,40,100,.1)}
.requests-tab span{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-left:3px;border-radius:99px;background:#f04464;color:#fff;font-size:11px}
.request-list{display:flex;flex-direction:column;gap:9px;min-height:65px}
.request-list[hidden]{display:none}
.request-card{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #eeeaf6;border-radius:14px;background:#fff}
.request-user{flex:1;min-width:0;font-size:14px;font-weight:800;overflow-wrap:anywhere}
.request-id{display:block;margin-top:3px;color:#999;font-size:11px;font-weight:500}
.request-actions{display:flex;gap:6px;flex-shrink:0}
.request-actions button{border:0;border-radius:9px;padding:9px 10px;font-size:12px;font-weight:800}
.request-accept{background:#7158cf;color:#fff}.request-reject,.request-cancel{background:#f0eef5;color:#665f78}
.request-empty{padding:22px 8px;text-align:center;color:#999;font-size:13px}
.requests-refresh{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:#f0eaff;color:#7158cf;font-weight:800}
@media(min-width:600px){.requests-modal{align-items:center;padding:20px}.requests-panel{border-radius:24px;max-height:80vh}}

.status{text-align:center;color:#888;font-size:14px;margin-bottom:15px}
.friends{display:flex;flex-direction:column;gap:12px}
.friend-card{display:flex;align-items:center;gap:13px;padding:12px;background:#fff;border:2px solid #eee;border-radius:20px;cursor:pointer;box-shadow:0 4px 12px rgba(100,80,150,.06);transition:transform .1s}
.friend-card:active{transform:scale(.98)}
.friend-info{min-width:0;flex:1}
.friend-name{font-size:17px;font-weight:bold;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name-decoration-sakura{color:#ff4f9b;text-shadow:0 2px 8px rgba(255,80,160,.3)}
.name-decoration-star{color:#d79a00;text-shadow:0 2px 8px rgba(244,191,63,.45)}
.name-decoration-diamond{color:#159ed6;text-shadow:0 2px 8px rgba(66,185,238,.45)}
.name-decoration-heart{color:#ff3d7e;text-shadow:0 2px 8px rgba(255,79,129,.4)}
.name-decoration-rainbow{background:linear-gradient(90deg,#ff4d4d,#ffb84d,#5cff8d,#4ddcff,#7b6cff,#ff4dd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.name-decoration-flame{color:#ff5b00;text-shadow:0 2px 10px rgba(255,90,0,.5)}
.name-decoration-sea{color:#0077ff;text-shadow:0 2px 8px rgba(0,150,255,.4)}
.name-decoration-space{color:#8c63ff;text-shadow:0 0 10px rgba(110,60,255,.65)}
.name-decoration-neon{color:#00cfcf;text-shadow:0 0 7px #00ff88,0 0 14px #00e5ff,0 0 20px #ff00d4}
.name-decoration-admin{color:#d49b00;text-shadow:0 0 8px rgba(255,215,0,.8),0 0 18px rgba(255,215,0,.45)}
.admin-name-badge{font-size:12px;margin-left:4px}
.friend-id{margin-top:3px;font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-status{margin-top:5px;font-size:12px;font-weight:bold}.online{color:#22b573}.offline{color:#999}
.arrow{font-size:22px;color:#aaa}
.avatar-frame{position:relative;flex-shrink:0;width:68px;height:68px;padding:4px;border-radius:50%;background:#ffd9ec;box-shadow:0 0 0 2px white,0 4px 12px rgba(0,0,0,.12)}
.frame-sakura{background:linear-gradient(135deg,#ffb7d8,#ff65ae,#ffd3e8,#ff8bc0);box-shadow:0 0 0 2px white,0 0 14px rgba(255,100,180,.45)}
.frame-star{background:linear-gradient(135deg,#fff0a6,#f4bf3f,#fff8c9,#e9a900);box-shadow:0 0 0 2px white,0 0 15px rgba(244,191,63,.45)}
.frame-diamond{background:linear-gradient(135deg,#a8edff,#42b9ee,#e2faff,#48caff);box-shadow:0 0 0 2px white,0 0 15px rgba(50,190,255,.45)}
.frame-heart{background:linear-gradient(135deg,#ffb1d4,#ff4f9a,#ff8fc2,#ff2f86);box-shadow:0 0 0 2px white,0 0 16px rgba(255,60,150,.45)}
.frame-rainbow{background:conic-gradient(#f00,#ff7a00,#ffe600,#00d639,#00d9ff,#06f,#7a00ff,#ff00d4,#f00);box-shadow:0 0 0 2px white,0 0 14px rgba(80,150,255,.45)}
.frame-flame{background:linear-gradient(135deg,#f20,#f60,#ffd000,#f30,#ff9500);box-shadow:0 0 0 2px white,0 0 16px rgba(255,80,0,.5)}
.frame-sea{background:linear-gradient(135deg,#00c6ff,#0072ff,#00e5ff,#06c);box-shadow:0 0 0 2px white,0 0 16px rgba(0,170,255,.45)}
.frame-space{background:radial-gradient(circle at 20% 20%,white 0 1px,transparent 3px),radial-gradient(circle at 70% 30%,white 0 1px,transparent 3px),radial-gradient(circle at 40% 75%,#8de7ff 0 1px,transparent 3px),linear-gradient(135deg,#050014,#26105f,#6d28d9,#09001c);box-shadow:0 0 0 2px white,0 0 16px rgba(100,70,255,.6)}
.frame-neon{background:linear-gradient(135deg,#0f0,#0ff,#f0f,#7a00ff,#0f0);background-size:300% 300%;box-shadow:0 0 0 2px white,0 0 8px #0f0,0 0 16px #0ff,0 0 25px #f0f;animation:neonMove 2s ease infinite}
@keyframes neonMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.admin-frame{background:linear-gradient(135deg,#fff4a8,#ffd700,#fff7bd,#e8ad00,#fff4a8);box-shadow:0 0 0 2px white,0 0 18px rgba(255,215,0,.55)}
.avatar-image{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;border:2px solid white}
.avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff3f9;border:2px solid white;font-size:30px}
.equipped-badge{position:absolute;right:-7px;top:-7px;width:27px;height:27px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:5;box-shadow:0 2px 7px rgba(0,0,0,.18),0 0 0 2px white}
.empty{text-align:center;padding:30px 10px;color:#999;font-size:15px}
.reload-button{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:14px;background:#f0eaff;color:#7158cf;font-size:15px;font-weight:bold}
@media(max-width:380px){body{padding:12px}.topbar{gap:5px}.home-link,.admin-link{padding:9px 11px;font-size:13px}.container{padding:22px 14px}}

/* Friend Chat 共通下部ナビゲーション */
#fc-bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 99999;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 2px;
  padding: 7px 5px calc(7px + env(safe-area-inset-bottom));

}

  min-width: 0;

  display: flex;

body { padding-bottom: calc(82px + env(safe-area-inset-bottom)) !important; }

  #fc-bottom-nav { left: 50%; right: auto; width: min(100%, 620px); transform: translateX(-50%); border-left: 1px solid rgba(133,111,198,.15); border-right: 1px solid rgba(133,111,198,.15); border-radius: 16px 16px 0 0; }
  #fc-bottom-nav a { font-size: 11px; }

</style>
</head>
<body>
<div class="topbar">
<a class="home-link" href="home.html">🏠 ホーム</a>
<a id="adminLink" class="admin-link" href="admin_all-users.html" style="display:none">🛡️ 管理</a>
</div>
<div class="container">
<h1>👥 フレンド一覧</h1>
<div class="add-box">
  <div class="add-title">➕ フレンドを追加</div>
  <div class="add-row">
    <input id="friendIdInput" type="text" maxlength="20" placeholder="フレンドのIDを入力" autocomplete="off">
    <button id="addFriendButton" type="button">追加</button>
  </div>
  <div class="add-help">相手のユーザーIDにフレンド申請を送ります。承認されるとフレンドになります。</div>
</div>
<button id="openRequestsButton" class="requests-open-button" type="button" aria-haspopup="dialog" aria-controls="requestsModal">
  <span>📨 フレンド申請一覧</span><span id="requestBadge" class="request-badge" hidden>0</span>
</button>
<div id="requestsModal" class="requests-modal" role="dialog" aria-modal="true" aria-labelledby="requestsTitle" hidden>
  <div class="requests-backdrop" data-close-requests></div>
  <section class="requests-panel">
    <div class="requests-panel-head"><h2 id="requestsTitle">📨 フレンド申請</h2><button id="closeRequestsButton" class="requests-close" type="button" aria-label="閉じる">×</button></div>
    <div class="requests-tabs" role="tablist" aria-label="申請の種類">
      <button class="requests-tab active" id="incomingTab" type="button" role="tab" aria-selected="true">届いた申請 <span id="incomingCount">0</span></button>
      <button class="requests-tab" id="outgoingTab" type="button" role="tab" aria-selected="false">送った申請</button>
    </div>
    <div id="incomingRequests" class="request-list" role="tabpanel"><div class="request-empty">読み込み中...</div></div>
    <div id="outgoingRequests" class="request-list" role="tabpanel" hidden><div class="request-empty">読み込み中...</div></div>
    <button id="refreshRequestsButton" class="requests-refresh" type="button">🔄 申請一覧を更新</button>
  </section>
</div>
<div id="status" class="status">読み込み中...</div>
<div id="friends" class="friends"></div>
<button id="reloadButton" class="reload-button" type="button">🔄 フレンド一覧を更新</button>
</div>
<script>
const SUPABASE_URL="https://yxonmqdyekwenyzekjwj.supabase.co";
const SUPABASE_KEY="sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function isFriendChatAdmin(){
  const {data,error}=await supabaseClient.rpc("is_friendchat_admin");
  if(error){console.error("管理者確認エラー:",error);return false}
  return data===true;
}
const ADMIN_ITEM_KEY="admin";
// 管理者用の装飾表示で参照するユーザーID一覧
const ADMIN_USERNAMES=new Set(["kazu1haru100","kazu1haru4sub"]);
let currentUsername="",presenceTimer=null;

async function getCurrentUser(){
  if(await checkFriendChatBan())return null;
  const {data,error}=await supabaseClient.auth.getUser();
  if(error||!data.user){location.href="index.html";return null}
  currentUsername=data.user.user_metadata?.username||"";
  if(!currentUsername){location.href="index.html";return null}
  const adminLink=document.getElementById("adminLink");
  if(await isFriendChatAdmin())adminLink.style.display="inline-block";
  return data.user;
}
async function updateMyPresence(){
  if(!currentUsername)return;
  const {error}=await supabaseClient.from("user_presence").upsert({user_id:currentUsername,last_seen:new Date().toISOString()},{onConflict:"user_id"});
  if(error)console.error("Presence error:",error);
}
function getFrameClass(itemKey){return{ sakura:"frame-sakura",star:"frame-star",diamond:"frame-diamond",space:"frame-space",neon:"frame-neon",rainbow:"frame-rainbow",flame:"frame-flame",sea:"frame-sea",heart:"frame-heart"}[itemKey]||((itemKey&&/^[A-Za-z0-9_-]+$/.test(itemKey))?"frame-"+itemKey:"")}
function getNameClass(itemKey){return{nd_sakura:"name-decoration-sakura",nd_star:"name-decoration-star",nd_diamond:"name-decoration-diamond",nd_heart:"name-decoration-heart",nd_rainbow:"name-decoration-rainbow",nd_flame:"name-decoration-flame",nd_sea:"name-decoration-sea",nd_space:"name-decoration-space",nd_neon:"name-decoration-neon",admin_name:"name-decoration-admin"}[itemKey]||((itemKey&&/^[A-Za-z0-9_-]+$/.test(itemKey))?"name-decoration-"+itemKey:"")}
function createAvatar(profile,item){
  const frame=document.createElement("div");frame.className="avatar-frame";
  const username=profile.user_id||"";
  if(item?.item_key===ADMIN_ITEM_KEY&&ADMIN_USERNAMES.has(username))frame.classList.add("admin-frame");
  else{const cls=getFrameClass(item?.item_key);if(cls)frame.classList.add(cls);else if(item?.frame_color){frame.style.background=item.frame_color;frame.style.boxShadow=`0 0 0 2px white,0 0 14px ${item.frame_color}`}}
  if(profile.avatar_url){const img=document.createElement("img");img.className="avatar-image";img.src=profile.avatar_url;img.alt="プロフィール画像";frame.appendChild(img)}
  else{const placeholder=document.createElement("div");placeholder.className="avatar-placeholder";placeholder.textContent="😊";frame.appendChild(placeholder)}
  if(item?.icon){const badge=document.createElement("div");badge.className="equipped-badge";badge.textContent=item.icon;badge.style.border=`2px solid ${item.item_key===ADMIN_ITEM_KEY?"#ffd700":(item.frame_color||"white")}`;frame.appendChild(badge)}
  return frame;
}
async function loadFriends(){
  const friendsContainer=document.getElementById("friends"),status=document.getElementById("status");
  if(await checkFriendChatBan())return;
  status.textContent="読み込み中...";friendsContainer.innerHTML="";
  const {data:friends,error:friendsError}=await supabaseClient.from("friends").select("friend_id").eq("user_id",currentUsername);
  if(friendsError){console.error(friendsError);status.textContent="フレンドの読み込みに失敗しました。";return}
  if(!friends?.length){status.textContent="フレンドはまだいません。";friendsContainer.innerHTML='<div class="empty">👥 フレンドを追加すると<br>ここに表示されます。</div>';return}
  const usernames=friends.map(x=>x.friend_id).filter(Boolean);
  const {data:profiles,error:profilesError}=await supabaseClient.from("profiles").select("user_id,name,avatar_url,equipped_item_key,equipped_name_decoration_key").in("user_id",usernames);
  if(profilesError){console.error(profilesError);status.textContent="プロフィールの読み込みに失敗しました。";return}
  const profileMap=new Map((profiles||[]).map(p=>[p.user_id,p]));
  const itemKeys=[...(new Set((profiles||[]).flatMap(p=>[p.equipped_item_key,p.equipped_name_decoration_key]).filter(Boolean)))];
  let items=[];if(itemKeys.length){const {data,error}=await supabaseClient.from("coin_items").select("item_key,name,icon,frame_color,item_type").in("item_key",itemKeys);if(!error)items=data||[]}
  const itemMap=new Map(items.map(i=>[i.item_key,i]));
  const {data:presenceRows,error:presenceError}=await supabaseClient.from("user_presence").select("user_id,last_seen").in("user_id",usernames);
  if(presenceError)console.error(presenceError);
  const presenceMap=new Map((presenceRows||[]).map(p=>[p.user_id,p]));
  friends.forEach(row=>{
    const username=row.friend_id,profile=profileMap.get(username)||{user_id:username,name:username,avatar_url:null,equipped_item_key:null};
    const item=profile.equipped_item_key?itemMap.get(profile.equipped_item_key):null,presence=presenceMap.get(username);
    const isOnline=!!presence?.last_seen&&(Date.now()-new Date(presence.last_seen).getTime()<90000);
    const card=document.createElement("div");card.className="friend-card";card.addEventListener("click",()=>{window.location.assign("./friend_profile.html?user="+encodeURIComponent(username))});
    card.appendChild(createAvatar(profile,item));
    const info=document.createElement("div");info.className="friend-info";
    const name=document.createElement("div"),nameKey=profile.equipped_name_decoration_key||"",nameClass=getNameClass(nameKey);name.className="friend-name"+(nameClass?" "+nameClass:"");name.textContent=profile.name||username;
    if(nameKey==="admin_name"&&ADMIN_USERNAMES.has(username)){const badge=document.createElement("span");badge.className="admin-name-badge";badge.textContent="👑";name.appendChild(badge)}
    const id=document.createElement("div");id.className="friend-id";id.textContent="@"+username;
    const statusEl=document.createElement("div");statusEl.className="friend-status "+(isOnline?"online":"offline");statusEl.textContent=isOnline?"● オンライン":"○ オフライン";
    info.append(name,id,statusEl);card.appendChild(info);
    const arrow=document.createElement("div");arrow.className="arrow";arrow.textContent="›";card.appendChild(arrow);friendsContainer.appendChild(card);
  });
  status.textContent=`${usernames.length}人のフレンド`;
}
async function addFriend(){
  const input=document.getElementById("friendIdInput");
  const button=document.getElementById("addFriendButton");
  const target=input.value.trim().toLowerCase();
  if(!target){alert("フレンドのIDを入力してください。");input.focus();return}
  if(target===currentUsername.toLowerCase()){alert("自分自身には申請できません。");return}
  if(!/^[A-Za-z0-9_]{3,20}$/.test(target)){alert("ユーザーIDは3〜20文字の英数字と「_」で入力してください。");return}
  button.disabled=true;button.textContent="申請中...";
  try{
    if(await checkFriendChatBan())return;
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError)throw sessionError;
    if(!sessionData?.session)throw new Error("ログイン状態を確認できませんでした。もう一度ログインしてください。");
    const {error}=await supabaseClient.rpc("request_friend_by_id",{target_username:target});
    if(error)throw error;
    input.value="";
    alert("📨 @"+target+" さんにフレンド申請を送りました！");
    await loadRequests();
  }catch(error){
    console.error("フレンド申請エラー:",error);
    const msg=String(error?.message||error);
    alert(msg.includes("既に申請")?"そのユーザーには既に申請しています。":msg.includes("既にフレンド")?"そのユーザーとは既にフレンドです。":msg.includes("相手からフレンド申請")?"相手から申請が届いています。申請一覧を確認してください。":msg.includes("そのIDのユーザー")?"そのIDのユーザーは見つかりません。":"フレンド申請に失敗しました。\n\n"+msg);
  }finally{button.disabled=false;button.textContent="申請"}
}
let incomingRequestRows=[],outgoingRequestRows=[];
function openRequests(){
  document.getElementById("requestsModal").hidden=false;
  document.body.style.overflow="hidden";
  loadRequests();
}
function closeRequests(){
  document.getElementById("requestsModal").hidden=true;
  document.body.style.overflow="";
}
function setRequestsTab(which){
  const incoming=which==="incoming";
  document.getElementById("incomingRequests").hidden=!incoming;
  document.getElementById("outgoingRequests").hidden=incoming;
  document.getElementById("incomingTab").classList.toggle("active",incoming);
  document.getElementById("outgoingTab").classList.toggle("active",!incoming);
  document.getElementById("incomingTab").setAttribute("aria-selected",String(incoming));
  document.getElementById("outgoingTab").setAttribute("aria-selected",String(!incoming));
}
async function loadRequests(){
  const incomingEl=document.getElementById("incomingRequests"),outgoingEl=document.getElementById("outgoingRequests");
  if(!incomingEl||!outgoingEl||!currentUsername)return;
  const [incomingResult,outgoingResult]=await Promise.all([
    supabaseClient.from("friend_requests").select("id,requester_id,target_id,created_at").eq("target_id",currentUsername).eq("status","pending").order("created_at",{ascending:false}),
    supabaseClient.from("friend_requests").select("id,requester_id,target_id,created_at").eq("requester_id",currentUsername).eq("status","pending").order("created_at",{ascending:false})
  ]);
  if(incomingResult.error||outgoingResult.error){
    console.error("申請一覧エラー:",incomingResult.error||outgoingResult.error);
    incomingEl.innerHTML='<div class="request-empty">申請一覧を読み込めませんでした。再読み込みしてください。</div>';
    outgoingEl.innerHTML='<div class="request-empty">申請一覧を読み込めませんでした。再読み込みしてください。</div>';
    return;
  }
  incomingRequestRows=incomingResult.data||[];outgoingRequestRows=outgoingResult.data||[];
  const count=incomingRequestRows.length;
  const badge=document.getElementById("requestBadge");badge.textContent=count>99?"99+":String(count);badge.hidden=count===0;
  document.getElementById("incomingCount").textContent=String(count);
  const ids=[...new Set([...incomingRequestRows.map(x=>x.requester_id),...outgoingRequestRows.map(x=>x.target_id)])];
  let profileMap=new Map();
  if(ids.length){
    const {data,error}=await supabaseClient.from("profiles").select("user_id,name,avatar_url").in("user_id",ids);
    if(error)console.warn("申請者プロフィール取得:",error);
    profileMap=new Map((data||[]).map(p=>[p.user_id,p]));
  }
  const render=(container,rows,type)=>{
    container.innerHTML="";
    if(!rows.length){container.innerHTML='<div class="request-empty">'+(type==="incoming"?"📭 届いたフレンド申請はありません。":"送ったフレンド申請はありません。")+'</div>';return}
    rows.forEach(row=>{
      const username=type==="incoming"?row.requester_id:row.target_id,profile=profileMap.get(username);
      const card=document.createElement("div");card.className="request-card";
      if(type==="incoming"&&profile?.avatar_url){const img=document.createElement("img");img.src=profile.avatar_url;img.alt="";img.style.cssText="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0";card.appendChild(img)}
      const user=document.createElement("div");user.className="request-user";user.textContent=profile?.name||username;
      const id=document.createElement("span");id.className="request-id";id.textContent="@"+username;user.appendChild(id);
      const actions=document.createElement("div");actions.className="request-actions";
      if(type==="incoming"){
        const accept=document.createElement("button");accept.className="request-accept";accept.textContent="承認";accept.onclick=()=>respondRequest(row.id,true);
        const reject=document.createElement("button");reject.className="request-reject";reject.textContent="拒否";reject.onclick=()=>respondRequest(row.id,false);
        actions.append(accept,reject);
      }else{
        const cancel=document.createElement("button");cancel.className="request-cancel";cancel.textContent="取り消す";cancel.onclick=()=>cancelRequest(row.id);actions.appendChild(cancel);
      }
      card.append(user,actions);container.appendChild(card);
    });
  };
  render(incomingEl,incomingRequestRows,"incoming");render(outgoingEl,outgoingRequestRows,"outgoing");
}
async function respondRequest(id,accept){
  const action=accept?"承認":"拒否";
  if(!confirm("このフレンド申請を"+action+"しますか？"))return;
  const {error}=await supabaseClient.rpc("respond_friend_request",{request_id:id,accept_request:accept});
  if(error){alert(action+"に失敗しました。\n"+error.message);return}
  alert(accept?"🎉 フレンドになりました！":"申請を拒否しました。");
  await Promise.all([loadRequests(),loadFriends()]);
}
async function cancelRequest(id){
  if(!confirm("送ったフレンド申請を取り消しますか？"))return;
  const {error}=await supabaseClient.rpc("cancel_friend_request",{request_id:id});
  if(error){alert("申請の取り消しに失敗しました。\n"+error.message);return}
  await loadRequests();
}
document.getElementById("addFriendButton").onclick=addFriend;
document.getElementById("friendIdInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addFriend()}};
document.getElementById("reloadButton").onclick=()=>Promise.all([loadFriends(),loadRequests()]);
document.getElementById("openRequestsButton").onclick=openRequests;
document.getElementById("closeRequestsButton").onclick=closeRequests;
document.querySelector("[data-close-requests]").onclick=closeRequests;
document.getElementById("incomingTab").onclick=()=>setRequestsTab("incoming");
document.getElementById("outgoingTab").onclick=()=>setRequestsTab("outgoing");
document.getElementById("refreshRequestsButton").onclick=loadRequests;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("requestsModal").hidden)closeRequests()});
async function init(){const user=await getCurrentUser();if(!user)return;await updateMyPresence();await Promise.all([loadFriends(),loadRequests()]);presenceTimer=setInterval(()=>{updateMyPresence();loadRequests()},30000)}
init();
</script>

<script>
/* Friend Chat: 装飾スタイルをSupabaseのcoin_itemsから読み込む */
(async()=>{
  try{
    const client=supabaseClient;
    if(!client)return;
    const {data,error}=await client.from("coin_items").select("item_key,item_type,frame_color,style_data");
    if(error){console.warn("coin_items style load:",error);return;}
    const safeKey=k=>String(k||"").replace(/[^a-zA-Z0-9_-]/g,"");
    const styleMap={frame:k=>k==="admin"?"admin-frame":"frame-"+k,name_decoration:k=>k==="admin_name"?"name-decoration-admin":"name-decoration-"+k,background:k=>k==="admin_bg"?"background-admin":"background-"+k,chat_frame:k=>k==="admin_chat"?"chat-frame-admin":"chat-frame-"+k};
    const rules=[];
    for(const item of (data||[])){
      const key=safeKey(item.item_key);
      const type=String(item.item_type||"");
      const fn=styleMap[type];
      if(!key||!fn)continue;
      const cls=safeKey(fn(key));
      const style=(item.style_data&&typeof item.style_data==="object")?item.style_data:{};
      const declarations=[];
      for(const [prop,value] of Object.entries(style)){
        if(value==null||value==="")continue;
        const cssProp=String(prop).replace(/[A-Z]/g,m=>"-"+m.toLowerCase());
        declarations.push(`${cssProp}:${String(value)} !important`);
      }
      if(!declarations.length && item.frame_color){
        if(type==="frame")declarations.push(`background:${item.frame_color} !important`);
        else if(type==="name_decoration")declarations.push(`color:${item.frame_color} !important`);
        else if(type==="background")declarations.push(`background:${item.frame_color} !important`);
        else if(type==="chat_frame")declarations.push(`border-color:${item.frame_color} !important`);
      }
      if(declarations.length)rules.push(`.${cls}{${declarations.join(";")}}`);
    }
    if(rules.length){
      const style=document.createElement("style");
      style.id="fc-supabase-item-styles";
      style.textContent=rules.join("\n");
      document.head.appendChild(style);
    }
  }catch(e){console.warn("Supabase item style init:",e)}
})();
</script>
