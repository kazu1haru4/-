<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フレンド</title>

  <style>
    :root {
      --theme: #8f7cff;
      --theme-light: rgba(143,124,255,0.12);
      --theme-bg: rgba(143,124,255,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(
        135deg,
        var(--theme-bg),
        #eef5ff
      );
      color: #333;
      padding: 20px;
      transition: background 0.25s;
    }

    .home-button {
      display: inline-block;
      margin-bottom: 14px;
      padding: 10px 15px;
      border-radius: 14px;
      background: white;
      color: var(--theme);
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header,
    .add-box,
    .friends {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .add-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }

    .add-box input:focus {
      border-color: var(--theme);
    }

    .add-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: var(--theme);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.98);
    }

    .friend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .friend:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--theme-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-weight: bold;
      word-break: break-word;
    }

    .user-id {
      color: #999;
      font-size: 12px;
      margin-top: 3px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.online {
      color: #22a447;
    }

    .status.offline {
      color: #999;
    }

    .last-online {
      margin-top: 2px;
      color: #999;
      font-size: 11px;
      word-break: break-word;
    }

    .arrow {
      color: var(--theme);
      font-size: 22px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: var(--theme);
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">

    <a href="home.html" class="home-button">
      🏠 ホーム
    </a>

    <section class="header">
      <h1>👥 フレンド</h1>
    </section>

    <section class="add-box">

      <input
        id="userIdInput"
        type="text"
        placeholder="追加したいユーザーID"
        maxlength="20"
      >

      <button
        class="add-button"
        id="addButton"
        type="button"
      >
        フレンド追加
      </button>

      <div id="message"></div>

    </section>

    <section class="friends">

      <div id="friendList">
        <div class="empty">
          フレンドを読み込み中...
        </div>
      </div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const userIdInput =
      document.getElementById("userIdInput");

    const addButton =
      document.getElementById("addButton");

    const friendList =
      document.getElementById("friendList");

    const message =
      document.getElementById("message");


    let currentUsername = "";

    const ONLINE_LIMIT =
      60 * 1000;

    let presenceTimer = null;


    // =========================
    // テーマカラー
    // =========================

    function hexToRgba(hex, alpha) {

      const clean =
        hex.replace("#", "");

      if (clean.length !== 6) {
        return `rgba(143,124,255,${alpha})`;
      }

      const r =
        parseInt(clean.substring(0, 2), 16);

      const g =
        parseInt(clean.substring(2, 4), 16);

      const b =
        parseInt(clean.substring(4, 6), 16);

      return `rgba(${r},${g},${b},${alpha})`;

    }


    function applyTheme(color) {

      const theme =
        color || "#8f7cff";

      document.documentElement.style
        .setProperty(
          "--theme",
          theme
        );

      document.documentElement.style
        .setProperty(
          "--theme-light",
          hexToRgba(theme, 0.12)
        );

      document.documentElement.style
        .setProperty(
          "--theme-bg",
          hexToRgba(theme, 0.08)
        );

    }


    // =========================
    // 自分のテーマ取得
    // =========================

    async function loadTheme() {

      if (!currentUsername) {
        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("theme_color")
          .eq(
            "user_id",
            currentUsername
          )
          .maybeSingle();


      if (error) {

        console.error(
          "テーマカラー取得エラー:",
          error
        );

        applyTheme("#8f7cff");

        return;
      }


      applyTheme(
        data?.theme_color ||
        "#8f7cff"
      );

    }


    // =========================
    // 開始
    // =========================

    async function start() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error || !data.session) {

        alert("ログインしてください。");

        return;
      }


      currentUsername =
        data.session.user
          .user_metadata?.username || "";


      if (!currentUsername) {

        alert(
          "ユーザーIDを取得できませんでした。"
        );

        return;
      }


      // テーマカラー読み込み
      await loadTheme();


      await updatePresence();

      await loadFriends();


      presenceTimer =
        setInterval(
          async function() {

            await updatePresence();

            await loadFriends();

          },
          30000
        );

    }


    // =========================
    // 自分のオンライン状態
    // =========================

    async function updatePresence() {

      if (!currentUsername) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("user_presence")
          .upsert(
            {
              user_id:
                currentUsername,

              last_seen:
                new Date().toISOString()
            },
            {
              onConflict:
                "user_id"
            }
          );


      if (error) {

        console.error(
          "オンライン状態更新エラー:",
          error
        );

      }

    }


    // =========================
    // オンライン判定
    // =========================

    function isOnline(lastSeen) {

      if (!lastSeen) {
        return false;
      }


      const lastTime =
        new Date(lastSeen).getTime();


      if (Number.isNaN(lastTime)) {
        return false;
      }


      return (
        Date.now() -
        lastTime <=
        ONLINE_LIMIT
      );

    }


    // =========================
    // 最終オンライン
    // =========================

    function formatLastOnline(lastSeen) {

      if (!lastSeen) {
        return "最終オンライン：不明";
      }


      const lastTime =
        new Date(lastSeen).getTime();


      if (Number.isNaN(lastTime)) {
        return "最終オンライン：不明";
      }


      const difference =
        Date.now() -
        lastTime;


      if (difference < 0) {
        return "最終オンライン：たった今";
      }


      const seconds =
        Math.floor(
          difference / 1000
        );


      if (seconds < 60) {
        return "最終オンライン：たった今";
      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      if (minutes < 60) {

        return (
          "最終オンライン：" +
          minutes +
          "分前"
        );

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      if (hours < 24) {

        return (
          "最終オンライン：" +
          hours +
          "時間前"
        );

      }


      const days =
        Math.floor(
          hours / 24
        );


      if (days < 30) {

        return (
          "最終オンライン：" +
          days +
          "日前"
        );

      }


      const date =
        new Date(lastSeen);


      return (
        "最終オンライン：" +
        date.getFullYear() +
        "/" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "/" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );

    }


    // =========================
    // フレンド一覧
    // =========================

    async function loadFriends() {

      if (!currentUsername) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("friends")
          .select("*")
          .eq(
            "user_id",
            currentUsername
          );


      if (error) {

        console.error(error);

        friendList.innerHTML =
          '<div class="empty">フレンドを読み込めませんでした</div>';

        return;
      }


      if (!data || data.length === 0) {

        friendList.innerHTML =
          '<div class="empty">まだフレンドがいません</div>';

        return;
      }


      const friendIds =
        data.map(
          friend =>
            friend.friend_id
        );


      // =========================
      // オンライン情報
      // =========================

      const {
        data: presenceData,
        error: presenceError
      } =
        await supabaseClient
          .from("user_presence")
          .select(
            "user_id, last_seen"
          )
          .in(
            "user_id",
            friendIds
          );


      if (presenceError) {

        console.error(
          "オンライン情報取得エラー:",
          presenceError
        );

      }


      const presenceMap =
        new Map();


      for (
        const presence of
        presenceData || []
      ) {

        presenceMap.set(
          presence.user_id,
          presence.last_seen
        );

      }


      friendList.innerHTML = "";


      // =========================
      // フレンド表示
      // =========================

      for (const friend of data) {

        const {
          data: profile
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "name, avatar_url"
            )
            .eq(
              "user_id",
              friend.friend_id
            )
            .maybeSingle();


        const div =
          document.createElement("div");

        div.className =
          "friend";


        // アバター
        const avatar =
          document.createElement("div");

        avatar.className =
          "avatar";


        if (profile?.avatar_url) {

          const img =
            document.createElement("img");

          img.src =
            profile.avatar_url;

          img.alt =
            "プロフィール画像";


          img.onerror =
            function() {

              avatar.innerHTML =
                "👤";

            };


          avatar.appendChild(img);

        } else {

          avatar.textContent =
            "👤";

        }


        // 情報
        const info =
          document.createElement("div");

        info.className =
          "info";


        const name =
          document.createElement("div");

        name.className =
          "name";

        name.textContent =
          profile?.name ||
          friend.friend_id;


        const userId =
          document.createElement("div");

        userId.className =
          "user-id";

        userId.textContent =
          "@" +
          friend.friend_id;


        // オンライン
        const status =
          document.createElement("div");

        status.className =
          "status";


        const lastSeen =
          presenceMap.get(
            friend.friend_id
          );


        const online =
          isOnline(lastSeen);


        if (online) {

          status.classList.add(
            "online"
          );

          status.textContent =
            "🟢 オンライン";

        } else {

          status.classList.add(
            "offline"
          );

          status.textContent =
            "⚪ オフライン";

        }


        // 最終オンライン
        const lastOnline =
          document.createElement("div");

        lastOnline.className =
          "last-online";


        if (online) {

          lastOnline.textContent =
            "最終オンライン：今";

        } else {

          lastOnline.textContent =
            formatLastOnline(
              lastSeen
            );

        }


        info.appendChild(name);
        info.appendChild(userId);
        info.appendChild(status);
        info.appendChild(lastOnline);


        // 矢印
        const arrow =
          document.createElement("div");

        arrow.className =
          "arrow";

        arrow.textContent =
          "›";


        div.appendChild(avatar);
        div.appendChild(info);
        div.appendChild(arrow);


        // プロフィールへ
        div.addEventListener(
          "click",
          function() {

            window.location.href =
              "friend_profile.html?user=" +
              encodeURIComponent(
                friend.friend_id
              );

          }
        );


        friendList.appendChild(div);

      }

    }


    // =========================
    // ページを離れる
    // =========================

    window.addEventListener(
      "pagehide",
      function() {

        if (presenceTimer) {

          clearInterval(
            presenceTimer
          );

          presenceTimer = null;

        }

      }
    );


    // =========================
    // フレンド追加
    // =========================

    addButton.addEventListener(
      "click",
      addFriend
    );


    async function addFriend() {

      const friendId =
        userIdInput.value.trim();


      message.textContent = "";


      if (!friendId) {

        message.textContent =
          "ユーザーIDを入力してね。";

        return;
      }


      if (friendId === currentUsername) {

        message.textContent =
          "自分は追加できません。";

        return;
      }


      // プロフィール確認
      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "user_id, name"
          )
          .eq(
            "user_id",
            friendId
          )
          .maybeSingle();


      if (profileError || !profile) {

        console.error(profileError);

        message.textContent =
          "そのユーザーは見つかりません。";

        return;
      }


      // 重複チェック
      const {
        data: existing
      } =
        await supabaseClient
          .from("friends")
          .select("id")
          .eq(
            "user_id",
            currentUsername
          )
          .eq(
            "friend_id",
            friendId
          )
          .maybeSingle();


      if (existing) {

        message.textContent =
          "すでにフレンドです。";

        return;
      }


      // 追加
      const {
        error
      } =
        await supabaseClient
          .from("friends")
          .insert({

            user_id:
              currentUsername,

            friend_id:
              friendId

          });


      if (error) {

        console.error(error);

        message.textContent =
          "追加できませんでした。";

        return;
      }


      message.textContent =
        profile.name +
        " さんをフレンドに追加しました！";


      userIdInput.value = "";


      await loadFriends();

    }


    // =========================
    // 起動
    // =========================

    start();

  </script>

</body>
</html>
