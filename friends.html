<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フレンド</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header,
    .add-box,
    .friends {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .add-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .add-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .friend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .friend:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #eee8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
    }

    .name {
      font-weight: bold;
    }

    .user-id {
      color: #999;
      font-size: 12px;
      margin-top: 3px;
    }

    .arrow {
      color: #aaa;
      font-size: 22px;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="header">
      <h1>👥 フレンド</h1>
    </section>

    <section class="add-box">

      <input
        id="userIdInput"
        type="text"
        placeholder="追加したいユーザーID"
        maxlength="20"
      >

      <button
        class="add-button"
        id="addButton"
      >
        フレンド追加
      </button>

      <div id="message"></div>

    </section>

    <section class="friends">

      <div id="friendList">
        <div class="empty">
          フレンドを読み込み中...
        </div>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const userIdInput =
      document.getElementById("userIdInput");

    const addButton =
      document.getElementById("addButton");

    const friendList =
      document.getElementById("friendList");

    const message =
      document.getElementById("message");

    let currentUsername = "";


    async function start() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {

        alert("ログインしてください。");

        return;
      }

      currentUsername =
        data.session.user.user_metadata?.username || "";

      if (!currentUsername) {

        alert("ユーザーIDを取得できませんでした。");

        return;
      }

      await loadFriends();

    }


    async function loadFriends() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("friends")
          .select("*")
          .eq("user_id", currentUsername);

      if (error) {

        console.error(error);

        friendList.innerHTML =
          '<div class="empty">フレンドを読み込めませんでした</div>';

        return;
      }

      if (!data || data.length === 0) {

        friendList.innerHTML =
          '<div class="empty">まだフレンドがいません</div>';

        return;
      }

      friendList.innerHTML = "";

      for (const friend of data) {

        const {
          data: profile
        } =
          await supabaseClient
            .from("profiles")
            .select("name, avatar_url")
            .eq("user_id", friend.friend_id)
            .maybeSingle();

        const div =
          document.createElement("div");

        div.className = "friend";

        const avatar =
          document.createElement("div");

        avatar.className = "avatar";
        avatar.textContent = "👤";

        const info =
          document.createElement("div");

        info.className = "info";

        const name =
          document.createElement("div");

        name.className = "name";

        name.textContent =
          profile?.name || friend.friend_id;

        const userId =
          document.createElement("div");

        userId.className = "user-id";

        userId.textContent =
          "@" + friend.friend_id;

        const arrow =
          document.createElement("div");

        arrow.className = "arrow";
        arrow.textContent = "›";

        info.appendChild(name);
        info.appendChild(userId);

        div.appendChild(avatar);
        div.appendChild(info);
        div.appendChild(arrow);


        // フレンドをタップするとチャットへ
        div.addEventListener("click", () => {

          window.location.href =
            "chat.html?user=" +
            encodeURIComponent(friend.friend_id);

        });

        friendList.appendChild(div);

      }

    }


    addButton.addEventListener(
      "click",
      addFriend
    );


    async function addFriend() {

      const friendId =
        userIdInput.value.trim();

      message.textContent = "";


      if (!friendId) {

        message.textContent =
          "ユーザーIDを入力してね。";

        return;
      }


      if (friendId === currentUsername) {

        message.textContent =
          "自分は追加できません。";

        return;
      }


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select("user_id, name")
          .eq("user_id", friendId)
          .maybeSingle();


      if (profileError || !profile) {

        console.error(profileError);

        message.textContent =
          "そのユーザーは見つかりません。";

        return;
      }


      const {
        data: existing
      } =
        await supabaseClient
          .from("friends")
          .select("id")
          .eq("user_id", currentUsername)
          .eq("friend_id", friendId)
          .maybeSingle();


      if (existing) {

        message.textContent =
          "すでにフレンドです。";

        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("friends")
          .insert({

            user_id:
              currentUsername,

            friend_id:
              friendId

          });


      if (error) {

        console.error(error);

        message.textContent =
          "追加できませんでした。";

        return;
      }


      message.textContent =
        profile.name +
        " さんをフレンドに追加しました！";

      userIdInput.value = "";

      await loadFriends();

    }


    start();

  </script>

</body>
</html>
