<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>プロフィール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff4fb, #eef7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffe2f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 55px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #eeeaff;
      color: #6556d8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #avatarFile {
      display: none;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9b8cff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #8f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>👤 プロフィール</h1>

    <div class="avatar" id="avatarPreview">
      😊
    </div>

    <label for="avatarFile" class="image-button">
      📷 アイコン画像を選ぶ
    </label>

    <input
      id="avatarFile"
      type="file"
      accept="image/*"
    >

    <label for="name">名前</label>

    <input
      id="name"
      type="text"
      placeholder="表示する名前"
      maxlength="30"
    >

    <label for="bio">自己紹介</label>

    <textarea
      id="bio"
      placeholder="自己紹介を書こう！"
      maxlength="200"
    ></textarea>

    <button
      id="saveButton"
      type="button"
      onclick="saveProfile()"
    >
      プロフィールを保存
    </button>

    <div id="message"></div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let selectedFile = null;


    // =========================
    // ログイン状態を確認
    // =========================

    async function checkLogin() {

      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();


      console.log("LOGIN USER:", user);
      console.log("GET USER ERROR:", error);


      if (!user) {

        document.getElementById("message").textContent =
          "ログインしてください。";

        return null;
      }


      return user;
    }


    // =========================
    // 画像を選択
    // =========================

    document
      .getElementById("avatarFile")
      .addEventListener("change", function(event) {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        // 画像か確認
        if (!file.type.startsWith("image/")) {

          document.getElementById("message").textContent =
            "画像ファイルを選んでね！";

          return;
        }


        // 5MB制限
        if (file.size > 5 * 1024 * 1024) {

          document.getElementById("message").textContent =
            "画像は5MB以下にしてね！";

          return;
        }


        selectedFile = file;


        const imageUrl =
          URL.createObjectURL(file);


        document
          .getElementById("avatarPreview")
          .innerHTML =
            `<img src="${imageUrl}" alt="アイコン">`;


        document.getElementById("message").textContent =
          "画像を選択したよ！";


        console.log("SELECTED FILE:", file);

      });


    // =========================
    // プロフィール保存
    // =========================

    async function saveProfile() {

      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const bio =
        document
          .getElementById("bio")
          .value
          .trim();


      const message =
        document.getElementById("message");


      const saveButton =
        document.getElementById("saveButton");


      if (!name) {

        message.textContent =
          "名前を入力してね！";

        return;
      }


      // -------------------------
      // ログイン確認
      // -------------------------

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();


      console.log("LOGIN USER:", user);
      console.log("USER ERROR:", userError);


      // セッションも確認
      const {
        data: sessionData,
        error: sessionError
      } = await supabaseClient.auth.getSession();


      console.log(
        "SESSION EXISTS:",
        !!sessionData.session
      );

      console.log(
        "SESSION ERROR:",
        sessionError
      );


      if (!user) {

        message.textContent =
          "ログインしてください。";

        return;
      }


      saveButton.disabled = true;

      message.textContent =
        "保存中…";


      let avatarUrl = "";


      // =========================
      // アイコン画像アップロード
      // =========================

      if (selectedFile) {

        console.log(
          "画像アップロード開始"
        );


        const fileExt =
          selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          `${user.id}/${Date.now()}.${fileExt}`;


        console.log(
          "UPLOAD FILE:",
          fileName
        );


        const {
          data: uploadData,
          error: uploadError
        } =
          await supabaseClient.storage
            .from("avatars")
            .upload(
              fileName,
              selectedFile,
              {
                upsert: true,
                contentType: selectedFile.type
              }
            );


        console.log(
          "UPLOAD DATA:",
          uploadData
        );

        console.log(
          "UPLOAD ERROR:",
          uploadError
        );


        if (uploadError) {

          console.error(
            "UPLOAD ERROR:",
            uploadError
          );


          message.textContent =
            "画像エラー: " +
            uploadError.message;


          saveButton.disabled = false;

          return;
        }


        // =========================
        // 公開URL取得
        // =========================

        const {
          data: publicData
        } =
          supabaseClient.storage
            .from("avatars")
            .getPublicUrl(fileName);


        avatarUrl =
          publicData.publicUrl;


        console.log(
          "AVATAR URL:",
          avatarUrl
        );

      }


      // =========================
      // profilesを更新
      // =========================

      const updateData = {

        name: name,

        bio: bio

      };


      if (avatarUrl) {

        updateData.avatar_url =
          avatarUrl;

      }


      console.log(
        "PROFILE UPDATE:",
        updateData
      );


      const {
        data: profileData,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .update(updateData)
          .eq(
            "user_id",
            user.user_metadata.username
          );


      console.log(
        "PROFILE DATA:",
        profileData
      );

      console.log(
        "PROFILE ERROR:",
        profileError
      );


      if (profileError) {

        console.error(
          "PROFILE ERROR:",
          profileError
        );


        message.textContent =
          "プロフィールを保存できませんでした: " +
          profileError.message;


        saveButton.disabled = false;

        return;
      }


      message.textContent =
        "プロフィールを保存したよ！🎉";


      saveButton.disabled = false;

    }


    // =========================
    // ページを開いたとき
    // =========================

    checkLogin();

  </script>

</body>
</html>
