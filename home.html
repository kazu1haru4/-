<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>フレンドチャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --theme: #8f7cff;
      --theme-light: #f0edff;
      --theme-text: #5e50c9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
      padding: 20px;
    }

    .home {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      position: relative;
      background: white;
      border-radius: 24px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }

    .notification-button,
    .settings-button {
      position: absolute;
      top: 15px;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .notification-button {
      right: 15px;
      background: #f3f0ff;
    }

    .settings-button {
      left: 15px;
      background: var(--theme-light);
    }

    .notification-button:active,
    .settings-button:active {
      transform: scale(0.94);
    }

    .notification-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 20px;
      background: #ff4d67;
      color: white;
      font-size: 11px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(255, 77, 103, 0.3);
    }

    .logo {
      font-size: 42px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .welcome {
      margin: 10px 0 0;
      color: var(--theme-text);
      font-size: 15px;
      font-weight: bold;
    }

    .subtitle {
      margin: 6px 0 0;
      color: #888;
      font-size: 14px;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .menu-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      background: white;
      border-radius: 22px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s;
    }

    .menu-button:active {
      transform: scale(0.96);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 17px;
      font-weight: bold;
    }

    .description {
      margin-top: 5px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }

    .direct-chat {
      background: var(--theme-light);
    }

    .profile {
      background: #fff0f7;
    }

    .groups {
      background: #f0f7ff;
    }

    .friends {
      background: #eef9f3;
    }

    .board {
      background: #fff7e8;
    }

    .schedule {
      background: #eefcff;
    }

    .games {
      background: #fff0f2;
    }

    .coin {
      background: #fff8df;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .menu {
        grid-template-columns: 1fr;
      }

      .menu-button {
        min-height: 125px;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <section class="header">

      <a
        href="settings.html"
        class="settings-button"
        aria-label="設定"
      >
        ⚙️
      </a>

      <a
        href="notifications.html"
        class="notification-button"
        aria-label="通知"
      >
        🔔

        <span
          class="notification-badge"
          id="notificationBadge"
        >
          0
        </span>
      </a>

      <div class="logo">
        💬
      </div>

      <h1>
        フレンドチャット
      </h1>

      <div
        class="welcome"
        id="welcome"
      >
        読み込み中...
      </div>

      <p class="subtitle">
        みんなと楽しくチャットしよう！
      </p>

    </section>


    <section class="menu">

      <a
        href="chats.html"
        class="menu-button direct-chat"
      >
        <div class="icon">💬</div>

        <div class="title">
          個別チャット
        </div>

        <div class="description">
          友達とのチャット
        </div>
      </a>


      <a
        href="groups.html"
        class="menu-button groups"
      >
        <div class="icon">👥</div>

        <div class="title">
          グループ
        </div>

        <div class="description">
          グループチャット
        </div>
      </a>


      <a
        href="profile.html"
        class="menu-button profile"
      >
        <div class="icon">👤</div>

        <div class="title">
          プロフィール
        </div>

        <div class="description">
          自分のプロフィール
        </div>
      </a>


      <a
        href="friends.html"
        class="menu-button friends"
      >
        <div class="icon">👥</div>

        <div class="title">
          フレンド
        </div>

        <div class="description">
          友達を探す
        </div>
      </a>


      <a
        href="board-number.html"
        class="menu-button board"
      >
        <div class="icon">📢</div>

        <div class="title">
          掲示板
        </div>

        <div class="description">
          みんなの投稿を見る
        </div>
      </a>


      <a
        href="schedule.html"
        class="menu-button schedule"
      >
        <div class="icon">📅</div>

        <div class="title">
          予定
        </div>

        <div class="description">
          予定を管理する
        </div>
      </a>


      <a
        href="minigame.html"
        class="menu-button games"
      >
        <div class="icon">🎮</div>

        <div class="title">
          ミニゲーム
        </div>

        <div class="description">
          友達と遊ぼう！
        </div>
      </a>


      <a
        href="coin.html"
        class="menu-button coin"
      >
        <div class="icon">🪙</div>

        <div class="title">
          フレンドコイン
        </div>

        <div class="description">
          コインを集めよう！
        </div>
      </a>

    </section>


    <div class="footer">
      Friend Chat
    </div>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- BANチェック -->

  <script src="ban-check.js"></script>


  <script>

    // =========================
    // テーマカラー
    // =========================

    const themes = {

      pink: {
        main: "#ff82b2",
        light: "#fff0f7",
        text: "#e34f85"
      },

      purple: {
        main: "#8f7cff",
        light: "#f0edff",
        text: "#5e50c9"
      },

      blue: {
        main: "#5c9eff",
        light: "#eef5ff",
        text: "#397bd8"
      },

      green: {
        main: "#48c78e",
        light: "#eef9f3",
        text: "#279b68"
      },

      orange: {
        main: "#ff9b52",
        light: "#fff4e8",
        text: "#df7628"
      },

      cyan: {
        main: "#36c9d8",
        light: "#eafcff",
        text: "#1599a8"
      }

    };


    function applyTheme(themeName) {

      const theme =
        themes[themeName] ||
        themes.purple;

      document.documentElement.style.setProperty(
        "--theme",
        theme.main
      );

      document.documentElement.style.setProperty(
        "--theme-light",
        theme.light
      );

      document.documentElement.style.setProperty(
        "--theme-text",
        theme.text
      );
    }


    const savedTheme =
      localStorage.getItem(
        "friendChatTheme"
      ) || "purple";


    applyTheme(savedTheme);


    // =========================
    // Supabase
    // =========================

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUsername = "";
    let notificationChannel = null;


    // =========================
    // ホーム開始
    // =========================

    async function start() {

      /*
       * まずBAN確認
       *
       * BANされたユーザーなら
       * ban-check.js がログアウトして
       * index.htmlへ移動する。
       */

      const wasBanned =
        await checkFriendChatBan();


      if (wasBanned) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if (
        error ||
        !data.user
      ) {

        document
          .getElementById("welcome")
          .textContent =
            "ログイン情報を確認できません";

        return;
      }


      currentUsername =
        data.user
          .user_metadata
          ?.username || "";


      // =====================
      // プロフィール
      // =====================

      if (currentUsername) {

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("name")
            .eq(
              "user_id",
              currentUsername
            )
            .maybeSingle();


        if (
          !profileError &&
          profile &&
          profile.name
        ) {

          document
            .getElementById("welcome")
            .textContent =
              profile.name +
              " さん、こんにちは！";

        } else {

          document
            .getElementById("welcome")
            .textContent =
              "ログイン中です！";
        }

      } else {

        document
          .getElementById("welcome")
          .textContent =
            "ログイン中です！";
      }


      // 通知件数
      await loadNotificationCount(
        currentUsername
      );


      // 通知リアルタイム
      setupNotificationRealtime(
        currentUsername
      );
    }


    // =========================
    // 未読通知件数
    // =========================

    async function loadNotificationCount(
      username
    ) {

      const badge =
        document.getElementById(
          "notificationBadge"
        );


      if (!username) {

        badge.style.display =
          "none";

        return;
      }


      const {
        count,
        error
      } =
        await supabaseClient
          .from("notifications")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "user_id",
            username
          )
          .eq(
            "is_read",
            false
          );


      if (error) {

        console.error(
          "通知件数取得エラー:",
          error
        );

        badge.style.display =
          "none";

        return;
      }


      if (!count || count <= 0) {

        badge.style.display =
          "none";

        return;
      }


      badge.textContent =
        count > 99
          ? "99+"
          : String(count);

      badge.style.display =
        "flex";
    }


    // =========================
    // 通知リアルタイム
    // =========================

    function setupNotificationRealtime(
      username
    ) {

      if (!username) {
        return;
      }


      if (notificationChannel) {

        supabaseClient
          .removeChannel(
            notificationChannel
          );

        notificationChannel = null;
      }


      notificationChannel =
        supabaseClient
          .channel(
            "home-notifications-" +
            username
          )
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "notifications",
              filter:
                "user_id=eq." +
                username
            },
            function() {

              loadNotificationCount(
                username
              );

            }
          )
          .subscribe();
    }


    // =========================
    // ページを離れるとき
    // =========================

    window.addEventListener(
      "pagehide",
      function() {

        if (notificationChannel) {

          supabaseClient
            .removeChannel(
              notificationChannel
            );

          notificationChannel = null;
        }

      }
    );


    // =========================
    // 開始
    // =========================

    start();

  </script>

</body>
</html>
