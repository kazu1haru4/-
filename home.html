<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>フレンドチャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff3fb, #eef5ff);
      color: #333;
      padding: 20px;
    }

    .home {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 24px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .welcome {
      margin: 10px 0 0;
      color: #8f7cff;
      font-size: 15px;
      font-weight: bold;
    }

    .subtitle {
      margin: 6px 0 0;
      color: #888;
      font-size: 14px;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .menu-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      background: white;
      border-radius: 22px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s;
    }

    .menu-button:active {
      transform: scale(0.96);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 17px;
      font-weight: bold;
    }

    .description {
      margin-top: 5px;
      color: #999;
      font-size: 12px;
    }

    .chat {
      background: #f0edff;
    }

    .profile {
      background: #fff0f7;
    }

    .friends {
      background: #eef9f3;
    }

    .settings {
      background: #f3f3f3;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="home">

    <section class="header">

      <div class="logo">💬</div>

      <h1>フレンドチャット</h1>

      <div
        class="welcome"
        id="welcome"
      >
        読み込み中...
      </div>

      <p class="subtitle">
        みんなと楽しくチャットしよう！
      </p>

    </section>


    <section class="menu">

      <a href="board.html" class="menu-button chat">
  📢 掲示板
      </a>
        <div class="description">掲示板を見る</div>
      </a>


      <a href="profile.html" class="menu-button profile">
        <div class="icon">👤</div>
        <div class="title">プロフィール</div>
        <div class="description">自分のプロフィール</div>
      </a>


      <a href="friends.html" class="menu-button friends">
        <div class="icon">👥</div>
        <div class="title">フレンド</div>
        <div class="description">友達を探す</div>
      </a>


      <a href="#" class="menu-button settings">
        <div class="icon">⚙️</div>
        <div class="title">設定</div>
        <div class="description">アプリの設定</div>
      </a>

    </section>


    <div class="footer">
      Friend Chat
    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://yxonmqdyekwenyzekjwj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IuQ6r_4vbGC9PP7cWJ9YRQ_Ai7tAfTJ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function start() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if (error || !data.user) {

        document.getElementById("welcome").textContent =
          "ログイン情報を確認できません";

        return;
      }


      const userId =
        data.user.id;


      const {
        data: profile
      } =
        await supabaseClient
          .from("profiles")
          .select("name")
          .eq("user_id", data.user.user_metadata?.username || "")
          .maybeSingle();


      if (profile && profile.name) {

        document.getElementById("welcome").textContent =
          profile.name + " さん、こんにちは！";

      } else {

        document.getElementById("welcome").textContent =
          "ログイン中です！";

      }

    }


    start();

  </script>

</body>
</html>
