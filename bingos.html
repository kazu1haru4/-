<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビンゴ一覧 - フレンドチャット</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#eef5ff,#f8f4ff);
  color:#222;
  padding:24px 16px;
}
.container{
  width:100%;
  max-width:520px;
  margin:0 auto;
}
.header{
  text-align:center;
  margin-bottom:24px;
}
.header h1{
  margin:0 0 8px;
  font-size:28px;
}
.header p{
  margin:0;
  color:#666;
}
.bingo-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.card h2{
  margin:0 0 8px;
  font-size:21px;
}
.card p{
  margin:0 0 16px;
  color:#666;
  line-height:1.5;
}
.button{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:#4f7cff;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
}
.button:active{
  transform:scale(.98);
}
.back{
  display:block;
  margin:22px auto 0;
  text-align:center;
  color:#666;
  text-decoration:none;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎯 ビンゴ一覧</h1>
    <p>遊びたいビンゴを選んでね！</p>
  </div>

  <div class="bingo-list">
    <div class="card">
      <h2>🎯 フレンドビンゴ</h2>
      <p>3×3のマスを開けて、そろったラインを探そう！</p>
      <a class="button" href="bingo.html">ビンゴ1を開く</a>
    </div>

    <div class="card">
      <h2>🎯 フレンドビンゴ2</h2>
      <p>もうひとつのビンゴに挑戦しよう！</p>
      <a class="button" href="bingo2.html">ビンゴ2を開く</a>
    </div>
  </div>

  <a class="back" href="home.html">← ホームに戻る</a>
</div>
</body>
</html>
